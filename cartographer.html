.start-btn{padding:.85rem 2rem;background:transparent;border:1px solid rgba(255,215,0,.3);color:var(--gold);font-family:var(--font-sans);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}

<body>

<header>
  <a href="oracle.html" class="logo">🔮 The Oracle's Chamber</a>

<main>
  <span class="canary-icon">🐦</span>
  <h1>The Canary's <em>Song</em></h1>
  <p class="sub">The mine speaks in four notes. Listen. Repeat. The silence is heavier than the stone.</p>
  <div class="status-line" id="statusLine">Press Start to hear the mine.</div>
  <div class="score-line" id="scoreLine">Round: 0 — Best: 0</div>
  <div class="notes-grid">
    <div class="note-btn" id="btn0" onclick="playerNote(0)"><span>⛏️</span><span class="note-label">Strike</span></div>
    <div class="note-btn" id="btn1" onclick="playerNote(1)"><span>💧</span><span class="note-label">Drip</span></div>
    <div class="note-btn" id="btn2" onclick="playerNote(2)"><span>💨</span><span class="note-label">Wind</span></div>
    <div class="note-btn" id="btn3" onclick="playerNote(3)"><span>✨</span><span class="note-label">Shimmer</span></div>
  </div>
  <button class="start-btn" id="startBtn" onclick="startGame()">⬡ Listen to the Mine</button>
</main>
<div class="depth-gauge">
  <a href="oracle.html" class="dg-link">🔮 Chamber</a>
  <span style="color:var(--faint);font-size:.4rem">⬡</span>
  <a href="index.html" class="dg-link">⛏ Mine</a>
</div>
<script>
const FREQS = [180,280,380,520]; // Strike, Drip, Wind, Shimmer
const TYPES = ['square','sine','triangle','sawtooth'];
const MESSAGES = [
  ["Listen to the air...","The stone remembers...","Four notes. Four truths."],
  ["The mine is testing you.","Repeat what you heard.","The canary is watching."],
  ["Your memory runs deep.","The gold approves.","Lord Oro nods from the doorway."],
  ["Few miners reach this depth.","The silence trusts you.","The Canary sings for you now."]
];
let ctx=null,seq=[],playerSeq=[],round=0,best=0,listening=false,playing=false;
function getCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx;}
function playNote(idx,duration=0.3){
  const c=getCtx();
  const osc=c.createOscillator(),g=c.createGain();
  osc.type=TYPES[idx];osc.frequency.value=FREQS[idx];
  g.gain.setValueAtTime(0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+duration);
  osc.connect(g).connect(c.destination);
  osc.start();osc.stop(c.currentTime+duration);
  const btn=document.getElementById('btn'+idx);
  if(btn){btn.classList.add('lit');setTimeout(()=>btn.classList.remove('lit'),duration*900);}
}
async function playSequence(){
  playing=true;
  document.querySelectorAll('.note-btn').forEach(b=>b.style.pointerEvents='none');
  document.getElementById('statusLine').textContent='Listen to the mine...';
  await sleep(600);
  for(let i=0;i<seq.length;i++){playNote(seq[i]);await sleep(700);}
  document.querySelectorAll('.note-btn').forEach(b=>b.style.pointerEvents='auto');
  const msgs=MESSAGES[Math.min(Math.floor(round/3),MESSAGES.length-1)];
  document.getElementById('statusLine').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  playing=false;listening=true;playerSeq=[];
}
function startGame(){
  seq=[];round=0;
  document.getElementById('startBtn').style.display='none';
  nextRound();
}
async function nextRound(){
  round++;
  seq.push(Math.floor(Math.random()*4));
  document.getElementById('scoreLine').textContent='Round: '+round+' — Best: '+best;
  await sleep(400);
  playSequence();
}
function playerNote(idx){
  if(playing||!listening)return;
  playNote(idx,0.25);
  playerSeq.push(idx);
  const pos=playerSeq.length-1;
  if(playerSeq[pos]!==seq[pos]){
    wrong();return;
  }
  if(playerSeq.length===seq.length){
    listening=false;
    if(round>best)best=round;
    document.getElementById('scoreLine').textContent='Round: '+round+' — Best: '+best;
    document.getElementById('statusLine').textContent='The mine approves. Descending deeper...';
    setTimeout(nextRound,1200);
  }
}
function wrong(){
  listening=false;
  document.querySelectorAll('.note-btn').forEach(b=>{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),600);});
  document.getElementById('statusLine').textContent='The song breaks. The air grows thin. '+round+' round'+(round!==1?'s':'')+' survived.';
  if(round>best)best=round;
  document.getElementById('scoreLine').textContent='Round: '+round+' — Best: '+best;
  setTimeout(()=>{
    seq=[];round=0;
    document.getElementById('startBtn').style.display='inline-block';
    document.getElementById('statusLine').textContent='The mine is quiet again. Try once more.';
  },2000);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
