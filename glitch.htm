<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO NOT PRESS — NMN</title>
<link rel="icon" href="lord_oro_emblem.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nmn-theme.css">

<style>
:root {
  --void: #030104; --glitch-red: #FF0040; --glitch-green: #00FF41;
  --cream: #E8E0D0; --muted: #8a7654;
  --pixel: 'Press Start 2P', monospace; --vt: 'VT323', monospace;
}
*{margin:0;padding:0;box-sizing:border-box;cursor:none!important;}
html,body{background:var(--void);color:var(--glitch-red);font-family:var(--pixel);min-height:100vh;overflow-x:hidden;transition:all 0.5s ease;}

/* CRT overlay */
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:9999;}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.8) 100%);pointer-events:none;z-index:9998;}

header{padding:.8rem 1.5rem;background:rgba(3,1,4,.95);border-bottom:2px solid var(--glitch-red);display:flex;justify-content:space-between;align-items:center;}
.sector-label{font-size:.45rem;color:var(--glitch-red);letter-spacing:.2em;animation:pulse-red 2s infinite;}
.back-btn{font-size:.35rem;color:var(--muted);text-decoration:none;letter-spacing:.1em;transition:color .2s;}
.back-btn:hover{color:var(--glitch-red);}

main{max-width:800px;margin:6rem auto;padding:2rem;}
.glitch-stage{text-align:center;padding:4rem 2rem;border:2px dashed var(--glitch-red);background:rgba(255,0,64,.02);transition:all 0.3s;}

.glitch-sign{font-size:.5rem;color:rgba(255,255,255,.6);margin-bottom:2rem;letter-spacing:.2em;}
.do-not-press{display:inline-block;background:#8B0000;border:4px solid var(--glitch-red);padding:2rem 4rem;font-family:var(--pixel);font-size:.8rem;color:#fff;cursor:none;animation:pulse-red 1s infinite;letter-spacing:.1em;transition:transform 0.1s;box-shadow:0 0 30px rgba(255,0,64,.4);}
.do-not-press:active{transform:scale(0.95);}

#glitch-log{font-family:var(--vt);font-size:1.4rem;color:var(--glitch-red);margin-top:3rem;min-height:100px;text-align:left;line-height:1.6;}
.restore-btn{display:none;margin-top:2rem;padding:.8rem 1.5rem;background:transparent;border:2px solid var(--glitch-green);color:var(--glitch-green);font-family:var(--pixel);font-size:.4rem;cursor:none;transition:all 0.2s;}
.restore-btn:hover{background:var(--glitch-green);color:#000;box-shadow:0 0 20px var(--glitch-green);}

@keyframes pulse-red{0%,100%{box-shadow:0 0 5px var(--glitch-red);}50%{box-shadow:0 0 30px var(--glitch-red),0 0 60px rgba(255,0,64,.3);}}

#cursor-glow{position:fixed;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,64,.15) 0%,transparent 70%);pointer-events:none;z-index:9996;transform:translate(-50%,-50%);mix-blend-mode:screen;}
</style>
</head>
<body id="main-body">
<div id="cursor-glow"></div>

<header>
  <span class="sector-label">NODE 10 // CONTAINMENT BREACH</span>
  <a href="quarantine.html" class="back-btn" id="escape-route">← FLEE</a>
</header>

<main>
  <div class="glitch-stage" id="glitch-stage">
    <div class="glitch-sign">⚠ DO NOT PRESS THE BUTTON ⚠</div>
    <button class="do-not-press" id="the-button" onclick="pressGlitch()">DO NOT PRESS</button>
    <div id="glitch-log"></div>
    <button class="restore-btn" id="restore-btn" onclick="resetGlitch()">RESTORE SECTOR STABILITY</button>
  </div>
</main>

<script>
document.addEventListener('mousemove', e => {
  const g = document.getElementById('cursor-glow');
  if(g){ g.style.left = e.clientX+'px'; g.style.top = e.clientY+'px'; }
});

let glitchLevel = 0;
const glitchMsgs = [
  "WARNING. SECTOR STABILITY COMPROMISED.",
  "THE ARCHITECTURE IS BENDING.",
  "KARRA SEES YOU.",
  "THE GLITCH ELEPHANTS HAVE NOTICED.",
  "⚠ REALITY DESYNC DETECTED ⚠",
  "YOU WERE TOLD NOT TO PRESS IT.",
  "THE MINE IS DESTABILIZING.",
  "THIS IS YOUR FAULT.",
  "FINAL WARNING. RESTORE OR DESCEND FOREVER."
];

function pressGlitch(){
  glitchLevel++;
  const stage = document.getElementById('glitch-stage');
  const body = document.getElementById('main-body');
  const log = document.getElementById('glitch-log');
  const restore = document.getElementById('restore-btn');

  // Add log message
  log.innerHTML += `<div>> ${glitchMsgs[Math.min(glitchLevel-1, glitchMsgs.length-1)] || "∞"}</div>`;
  
  // Show restore button early on
  if(glitchLevel >= 3) restore.style.display = 'inline-block';
  
  // Progressive CSS destruction
  if(glitchLevel >= 2) { stage.style.transform = `rotate(${(Math.random()-0.5) * glitchLevel * 2}deg)`; }
  if(glitchLevel >= 4) { body.style.filter = `hue-rotate(${glitchLevel * 30}deg)`; }
  if(glitchLevel >= 6) { stage.style.transform += ` scaleX(-1)`; }
  if(glitchLevel >= 8) { 
      body.style.backgroundColor = '#FF0040'; 
      body.style.filter = 'invert(1)';
      document.getElementById('escape-route').textContent = "THERE IS NO ESCAPE";
  }
}

function resetGlitch(){
  glitchLevel = 0;
  const stage = document.getElementById('glitch-stage');
  const body = document.getElementById('main-body');
  
  stage.style.cssText = '';
  body.style.cssText = '';
  document.getElementById('escape-route').textContent = "← FLEE";
  document.getElementById('glitch-log').innerHTML = '';
  document.getElementById('restore-btn').style.display = 'none';
}
</script>
</body>
</html>
