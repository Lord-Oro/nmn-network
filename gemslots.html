<style>
/* ── CORE NMN VARIABLES & AESTHETIC ── */
:root {
  --gold: #FFD700; --gb: #e8b84b; --gd: #8B6914;
  --coal: #050308; --shaft: #08060A; --rock: #0A080C;
  --cream: #E8E0D0; --neon-green: #00FF88;
  --font-pixel: 'Press Start 2P', cursive;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; background: var(--coal); }

/* ─── PURE CURSOR OVERRIDE (INVISIBLE) ─── */
body, body *, a, button, canvas, .bet-btn, .spin-btn { 
  cursor: none !important; 
}

/* ─── FLASHLIGHT BEAM (JACKPOT GREEN & GOLD TUNE) ─── */
#pickaxe-glow {
    position: fixed; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(85,255,85,0.3) 0%, rgba(255,215,0,0.15) 40%, transparent 70%);
    pointer-events: none; z-index: 999999; transform: translate(-50%, -50%);
    mix-blend-mode: screen; transition: width 0.1s, height 0.1s, background 0.1s;
    will-change: left, top;
}

body {
  font-family: var(--font-pixel);
  color: var(--cream);
  display: flex; flex-direction: column;
  background-image: 
    linear-gradient(rgba(20, 15, 25, 0.8) 2px, transparent 2px),
    linear-gradient(90deg, rgba(20, 15, 25, 0.8) 2px, transparent 2px);
  background-size: 32px 32px;
}

/* OVERRIDE ALL OLD FONTS */
h1, h2, h3, h4, p, a, div, span, button { font-family: var(--font-pixel) !important; }

/* CRT SCANLINES & VIGNETTE */
body::after {
  content:""; position:fixed; top:0; left:0; width:100vw; height:100vh;
  background: linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,0.08) 50%),
              linear-gradient(90deg,rgba(232,184,75,0.015),rgba(197,146,0,0.008),rgba(255,215,0,0.015));
  background-size:100% 3px,3px 100%; pointer-events:none; z-index:10000; opacity:0.18;
}
body::before {
  content:""; position:fixed; top:0; left:0; width:100vw; height:100vh;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.65) 100%);
  pointer-events:none; z-index:9999;
}

/* HEADER */
header {
  padding: 1rem 2rem; border-bottom: 2px solid var(--gd);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(5,3,14,.95); z-index: 1000; flex-shrink: 0;
}
.logo { color: var(--gold); font-size: .65rem; text-decoration: none; text-shadow: 0 0 10px rgba(255,215,0,.4); }
.back-btn { font-size: .45rem; color: var(--gd); text-decoration: none; text-transform: uppercase; transition: color 0.3s; }
.back-btn:hover { color: var(--gold); }

/* ARCADE HUD */
.hud {
  display: flex; justify-content: center; align-items: center;
  padding: 0.5rem 2rem; background: rgba(5,3,8,0.9);
  border-bottom: 1px solid rgba(255,215,0,0.15); flex-shrink: 0; z-index: 50; flex-wrap: wrap; gap: 30px;
}
.hud-stat { font-size: 0.5rem; color: var(--gd); display: flex; flex-direction: column; align-items: center; gap: 5px; }
.hud-val { color: var(--gold); font-size: 1.2rem; text-shadow: 0 0 15px rgba(255,215,0,0.4); }

/* GAME CANVAS */
.game-area { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; padding-bottom: 100px;}
.canvas-wrap {
  position: relative; width: 100%; max-width: 600px; height: 300px;
  background: #050306; border: 4px solid var(--gd); border-radius: 8px;
  box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 0 30px rgba(255,215,0,0.1);
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

/* CONTROLS */
.controls-bar {
  display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 15px;
  padding: 1.5rem 2rem; background: rgba(5,3,8,0.9); border-top: 1px solid var(--gd); z-index: 50; width: 100%; max-width: 600px; margin-top: 2rem;
}
.bet-options { display: flex; gap: 10px; width: 100%; }
.bet-btn {
  background: rgba(255,215,0,0.05); border: 2px solid var(--gd); color: var(--muted);
  padding: 0.8rem; font-size: 0.6rem; flex: 1; text-align: center; transition: all 0.2s;
}
.bet-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.15); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
.bet-btn:hover { border-color: var(--gold); color: var(--gold); }

.spin-btn {
  width: 100%; padding: 1rem; background: var(--gold); color: #000;
  font-size: 1rem; border: none; transition: all 0.2s; text-shadow: none;
}
.spin-btn:hover:not(:disabled) { background: #fff; box-shadow: 0 0 20px rgba(255,215,0,0.6); transform: scale(1.02); }
.spin-btn:disabled { background: #333; color: #666; transform: none; box-shadow: none; }

.payout-table {
  display: flex; justify-content: space-between; width: 100%; max-width: 600px;
  font-size: 0.35rem; color: var(--gd); margin-bottom: 10px;
}

@media (max-width: 768px) {
  header { padding: 0.8rem 1rem; }
  .logo { font-size: 0.5rem; }
  .canvas-wrap { height: 200px; }
  .hud-val { font-size: 0.9rem; }
}

/* LORE TOAST */
.lore-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: #000; border: 4px solid var(--gd); padding: 1.5rem; max-width: 400px; width: 90%; z-index: 500; opacity: 0; transition: opacity 0.2s steps(2), transform 0.2s steps(2); pointer-events: none; box-shadow: 6px 6px 0 #000;}
.lore-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.lore-toast-label { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--gold); margin-bottom: 0.8rem; }
.lore-toast-text { font-size: 1.1rem; color: var(--cream); line-height: 1.4; font-family: var(--font-text); }
.lore-toast-text strong { font-family: var(--font-pixel); font-size: 0.7rem; color: var(--gold); }

/* FLOATING GAUGE */
.depth-gauge {
  position:fixed!important; bottom:12px!important; left:50%!important; transform:translateX(-50%)!important;
  width:auto!important; max-width:92%!important; height:42px!important; background:rgba(12,10,7,.88)!important;
  border:1px solid rgba(255,215,0,.4)!important; border-radius:22px!important; padding:0 18px!important;
  z-index:9999!important; backdrop-filter:blur(4px)!important; display:flex!important; align-items:center!important;
  justify-content:center!important; gap:1.2rem!important; box-shadow:0 0 20px rgba(255,215,0,.08)!important;
}
.dg-stat { font-size: 0.4rem; color: var(--gd); display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; }
.dg-val { color: var(--gold); font-size: 0.6rem; font-family: var(--font-text); }
.dg-link { font-size: 0.4rem; color: var(--gd); text-decoration: none; text-transform: uppercase; transition: color 0.3s; pointer-events: auto!important;}
.dg-link:hover { color: var(--gold); }
</style>

<script>
// ─── UNIFIED FLASHLIGHT TRACKING ───
function moveGlow(e) {
    const r = document.getElementById('pickaxe-glow');
    if(!r) return;
    let x, y;
    if(e.type.includes('touch')) {
        if(e.touches && e.touches.length > 0) {
            x = e.touches[0].clientX;
            y = e.touches[0].clientY;
        }
    } else {
        x = e.clientX;
        y = e.clientY;
    }
    if(x !== undefined && y !== undefined) {
        r.style.left = x + 'px';
        r.style.top = y + 'px';
    }
}
document.addEventListener('mousemove', moveGlow);
document.addEventListener('touchmove', moveGlow, {passive: true});
document.addEventListener('touchstart', moveGlow, {passive: true});

document.addEventListener('mousedown', function(){
  const r = document.getElementById('pickaxe-glow');
  if(r) { r.style.width = '190px'; r.style.height = '190px'; r.style.background = 'radial-gradient(circle,rgba(85,255,85,.5) 0%,transparent 70%)'; }
});
document.addEventListener('mouseup', function(){
  const r = document.getElementById('pickaxe-glow');
  if(r) { r.style.width = '160px'; r.style.height = '160px'; r.style.background = 'radial-gradient(circle,rgba(85,255,85,.3) 0%,rgba(255,215,0,0.15) 40%,transparent 70%)'; }
});
document.addEventListener('touchend', function(){
  const r = document.getElementById('pickaxe-glow');
  if(r) { r.style.width = '160px'; r.style.height = '160px'; r.style.background = 'radial-gradient(circle,rgba(85,255,85,.3) 0%,rgba(255,215,0,0.15) 40%,transparent 70%)'; }
}, {passive: true});

// BFCache Fix
window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
        const overlay = document.getElementById('descent-overlay');
        if(overlay) overlay.classList.remove('descent-active');
    }
});

// ─── AUDIO ───
window.NMN_CONTEXT = "mine";
const NMN_Audio = {
  ctx: null, running: false, masterGain: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
    this.masterGain.connect(this.ctx.destination);
  },
  playHum() {
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(55, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
    osc.connect(gain); gain.connect(this.masterGain); osc.start();
  },
  startAll() {
    if (this.running) return;
    this.init(); this.running = true; this.playHum();
  }
};
document.addEventListener('click', () => { if (!NMN_Audio.running) NMN_Audio.startAll(); }, { once: true });
document.addEventListener('touchstart', () => { if (!NMN_Audio.running) NMN_Audio.startAll(); }, { once: true, passive: true });

const SFX = {
  play(freq, type, dur, vol = 0.1) {
    if (!NMN_Audio.ctx) return;
    const osc = NMN_Audio.ctx.createOscillator(); const gain = NMN_Audio.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, NMN_Audio.ctx.currentTime);
    gain.gain.setValueAtTime(0, NMN_Audio.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, NMN_Audio.ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, NMN_Audio.ctx.currentTime + dur);
    osc.connect(gain); gain.connect(NMN_Audio.masterGain);
    osc.start(); osc.stop(NMN_Audio.ctx.currentTime + dur);
  },
  tick() { this.play(800, 'square', 0.05, 0.02); },
  clack() { this.play(150, 'sawtooth', 0.1, 0.2); setTimeout(()=>this.play(100, 'square', 0.1, 0.2), 20); },
  win() { this.play(400, 'triangle', 0.1, 0.1); setTimeout(()=>this.play(600, 'triangle', 0.1, 0.1), 100); setTimeout(()=>this.play(800, 'triangle', 0.4, 0.2), 200); },
  jackpot() { this.win(); setTimeout(()=>this.win(), 400); },
  lose() { this.play(100, 'sawtooth', 0.4, 0.2); }
};
</script>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

// PARALLAX BACKGROUNDS
const bgMine = new Image(); bgMine.src = 'goldmine_stable.jpg';
const bgGlitch = new Image(); bgGlitch.src = 'obsidian_glitched.jpg';

function resize() {
  const wrap = cv.parentElement;
  W = cv.width = wrap.clientWidth;
  H = cv.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ── GAME STATE ──
const SYMBOLS = [
  { char: '🪙', color: '#C0C0C0', mult: 2, weight: 40 },
  { char: '⛏️', color: '#8B6914', mult: 3, weight: 30 },
  { char: '🏅', color: '#ffaa00', mult: 5, weight: 20 },
  { char: '💎', color: '#88ccff', mult: 10, weight: 8 },
  { char: '👁', color: '#00FF88', mult: 50, weight: 2 } // Jackpot
];

// Create weighted pool for random selection
const pool = [];
SYMBOLS.forEach((sym, idx) => {
  for(let i=0; i<sym.weight; i++) pool.push(idx);
});

let currentBet = 10;
let gold = 0; 
let isSpinning = false;

// 3 Reels
let reels = [
  { x: 0, yOffset: 0, speed: 0, current: 0, target: 0, spinning: false },
  { x: 0, yOffset: 0, speed: 0, current: 0, target: 0, spinning: false },
  { x: 0, yOffset: 0, speed: 0, current: 0, target: 0, spinning: false }
];

let particles = [];
let texts = [];
let screenShake = 0;

function syncGauge() {
    try {
        if(typeof NMNWallet !== 'undefined') {
            gold = NMNWallet.get().gold;
            document.getElementById('dgGold').textContent = gold;
            document.getElementById('h-gold').textContent = gold;
        }
        document.getElementById('dgLore').textContent = JSON.parse(localStorage.getItem('nmn_lore_vault')||'[]').length;
    } catch(e) {}
}

function updateHUD() {
  syncGauge();
  const btn = document.getElementById('spinBtn');
  if (gold < currentBet && !isSpinning) {
    btn.disabled = true;
    btn.textContent = "INSUFFICIENT GOLD";
  } else if (!isSpinning) {
    btn.disabled = false;
    btn.textContent = "PULL LEVER";
  }
}

function setBet(amount, btnElement) {
  if (isSpinning) return;
  currentBet = amount;
  document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  updateHUD();
}

function spawnParticles(x, y, color, count, burst = 5) {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*burst, vy: (Math.random()-1)*burst,
      life: 1, decay: 0.02 + Math.random()*0.03, color, r: Math.random()*4+2
    });
  }
}

function spawnText(x, y, text, color, scale=1) {
  texts.push({ x, y, text, color, life: 1, vy: -1.5, scale });
}

function getRandomSymbol() {
  return pool[Math.floor(Math.random() * pool.length)];
}

function spin() {
  if (isSpinning || gold < currentBet) return;
  
  if (typeof NMNWallet !== 'undefined') NMNWallet.addGold(-currentBet);
  updateHUD();
  
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  
  // Set up reels
  reels.forEach((r, i) => {
    r.spinning = true;
    r.speed = 30 + (i * 10); // Staggered speeds
    r.target = getRandomSymbol();
    
    // Stop reels progressively
    setTimeout(() => {
      r.spinning = false;
      r.current = r.target;
      r.yOffset = 0;
      SFX.clack();
      screenShake = 5;
      
      // If last reel stopped, check win
      if (i === 2) setTimeout(checkWin, 300);
    }, 1500 + (i * 800)); // 1.5s, 2.3s, 3.1s
  });
}

function checkWin() {
  isSpinning = false;
  
  if (reels[0].current === reels[1].current && reels[1].current === reels[2].current) {
    // Win!
    const sym = SYMBOLS[reels[0].current];
    const winnings = currentBet * sym.mult;
    
    if (typeof NMNWallet !== 'undefined') {
        NMNWallet.addGold(winnings);
        NMNWallet.addXP(sym.mult * 5);
    }
    
    if (sym.char === '👁') {
      SFX.jackpot();
      screenShake = 30;
      spawnText(W/2, H/2, `JACKPOT! +${winnings}G`, sym.color, 2);
      spawnParticles(W/2, H/2, sym.color, 100, 15);
      triggerLoreToast();
    } else {
      SFX.win();
      screenShake = 10;
      spawnText(W/2, H/2, `WIN! +${winnings}G`, sym.color, 1.5);
      spawnParticles(W/2, H/2, sym.color, 40, 8);
    }
  } else {
    // Lose
    SFX.lose();
  }
  
  updateHUD();
}

function triggerLoreToast() {
    const t = document.getElementById('loreToast');
    const tx = document.getElementById('loreToastText');
    if(!t || !tx) return;
    
    try {
        const vault = JSON.parse(localStorage.getItem('nmn_lore_vault') || '[]');
        const factText = `I aligned the machine in Sector 1. The Eye sees all.`;
        
        // Only save if it hasn't been saved yet
        if (!vault.some(v => v.text === factText)) {
            vault.push({ text: factText, source: "The Name Shaft", date: new Date().toLocaleDateString() });
            localStorage.setItem('nmn_lore_vault', JSON.stringify(vault));
            syncGauge();
            
            tx.innerHTML = `<strong>JACKPOT EVENT</strong><br><span style="font-size:0.9rem;">"The Eye sees all." Fragment stored.</span>`;
            t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'), 4500);
        }
    } catch(e) {}
}

// ── UPDATE & DRAW LOOP ──
function draw() {
  ctx.fillStyle = '#050306'; ctx.fillRect(0, 0, W, H);
  
  // PARALLAX BACKGROUND
  let timeStr = Date.now() * 0.0005;
  let bgScroll = (timeStr * 50) % H;
  // Background glitches heavily while spinning
  let glitchFactor = isSpinning ? 0.3 + Math.sin(timeStr*10)*0.2 : 0.05;

  ctx.save();
  ctx.globalAlpha = (1 - glitchFactor) * 0.5;
  if(bgMine.complete && bgMine.naturalWidth) {
     ctx.drawImage(bgMine, 0, -bgScroll, W, H);
     ctx.drawImage(bgMine, 0, H - bgScroll, W, H);
  }
  ctx.globalAlpha = glitchFactor * 0.6;
  if(bgGlitch.complete && bgGlitch.naturalWidth) {
     ctx.drawImage(bgGlitch, 0, -bgScroll, W, H);
     ctx.drawImage(bgGlitch, 0, H - bgScroll, W, H);
  }
  ctx.restore();

  // Darken play area slightly for contrast
  ctx.fillStyle = 'rgba(5, 3, 6, 0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if(screenShake > 0) {
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
  }

  const slotW = 120;
  const slotH = 150;
  const gap = 20;
  const totalW = (slotW * 3) + (gap * 2);
  const startX = (W - totalW) / 2;
  const startY = (H - slotH) / 2;

  // Draw Machine Housing
  ctx.fillStyle = 'rgba(10, 8, 6, 0.9)'; ctx.fillRect(startX - 20, startY - 20, totalW + 40, slotH + 40);
  ctx.strokeStyle = '#332233'; ctx.lineWidth = 4; ctx.strokeRect(startX - 20, startY - 20, totalW + 40, slotH + 40);

  // Draw Reels
  reels.forEach((r, i) => {
    r.x = startX + i * (slotW + gap);
    
    // Reel background
    ctx.fillStyle = '#050505';
    ctx.fillRect(r.x, startY, slotW, slotH);
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 2;
    ctx.strokeRect(r.x, startY, slotW, slotH);

    // Clipping path for reel
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, startY, slotW, slotH); ctx.clip();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (r.spinning) {
      r.yOffset += r.speed;
      if (r.yOffset > slotH) {
        r.yOffset = 0;
        r.current = Math.floor(Math.random() * SYMBOLS.length); // Visual blur character
        if (Math.random() < 0.3) SFX.tick();
      }
      
      // Draw motion blurred symbols
      ctx.font = '60px sans-serif';
      ctx.globalAlpha = 0.5;
      ctx.fillText(SYMBOLS[r.current].char, r.x + slotW/2, startY + r.yOffset);
      ctx.fillText(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)].char, r.x + slotW/2, startY + r.yOffset - slotH);
      ctx.fillText(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)].char, r.x + slotW/2, startY + r.yOffset + slotH);
      ctx.globalAlpha = 1;
    } else {
      // Stopped
      ctx.font = '70px sans-serif';
      
      // Add glow if they match (post-spin)
      if (!isSpinning && reels[0].current === reels[1].current && reels[1].current === reels[2].current) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = SYMBOLS[r.current].color;
      }
      
      ctx.fillText(SYMBOLS[r.current].char, r.x + slotW/2, startY + slotH/2);
      ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Reel overlays (shadows for depth)
    const grad = ctx.createLinearGradient(0, startY, 0, startY + slotH);
    grad.addColorStop(0, 'rgba(0,0,0,0.9)');
    grad.addColorStop(0.2, 'rgba(0,0,0,0)');
    grad.addColorStop(0.8, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = grad;
    ctx.fillRect(r.x, startY, slotW, slotH);
  });

  // Center Target Line
  ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(startX - 30, startY + slotH/2); ctx.lineTo(startX + totalW + 30, startY + slotH/2); ctx.stroke();

  // FX
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.r, p.r);
  });
  particles = particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;

  texts.forEach(t => {
    t.y += t.vy; t.life -= 0.015;
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.fillStyle = t.color; 
    ctx.font = `${14 * t.scale}px "Press Start 2P"`; 
    ctx.textAlign = 'center';
    
    // Outline for readability
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  ctx.restore();
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}

// Init
syncGauge();
loop();
</script>
