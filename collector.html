<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grimoire Collector — NMN Retro</title>

<link rel="icon" href="favicon.png" type="image/png">
<link rel="shortcut icon" href="favicon.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nmn-theme.css">

<style>
:root {
  --gold: #FFD700;
  --gb: #e8b84b;
  --gd: #AA7700;
  --bg-color: #000000;
  --panel-bg: #111111;
  --cream: #f0e6cc;
  --muted: #aaaaaa;
  --lg: #55FF55; 
  --red: #FF5555;
  --purple: #AA55FF;
  --font-pixel: 'Press Start 2P', monospace;
  --font-text: 'VT323', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-text);
  background: var(--bg-color);
  color: var(--cream);
  min-height: 100vh;
  background-image: repeating-linear-gradient(0deg, #000 0px, #000 2px, #0a0a0a 2px, #0a0a0a 4px);
  padding-bottom: 50px;
  font-size: 1.2rem;
}

.retro-box {
  background: var(--panel-bg);
  border: 4px solid #FFF;
  box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), 4px 4px 0px 0px #000;
}

header { padding: 1rem 2rem; background: #000; border-bottom: 4px solid var(--lg); display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: var(--font-pixel); color: var(--lg); font-size: 0.8rem; text-decoration: none; text-shadow: 2px 2px 0 #000; }
.back { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--gold); }

#gameScreen { max-width: 800px; margin: 1rem auto; padding: 0 1rem; }

.tabs { display: flex; gap: 1rem; margin-bottom: 1rem; }
.tab-btn { flex: 1; padding: 1rem; background: #000; border: 4px solid #444; color: var(--muted); font-family: var(--font-pixel); font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
.tab-btn.active { border-color: #FFF; color: var(--gold); box-shadow: 4px 4px 0 #000; background: #111; }

.view-section { display: none; }
.view-section.active { display: block; animation: flashIn 0.2s steps(2); }
@keyframes flashIn { 0% { opacity: 0; } 100% { opacity: 1; } }

.hud { display: flex; justify-content: space-between; padding: 1rem; margin-bottom: 1rem; }
.hud-stat { font-family: var(--font-pixel); font-size: 0.7rem; color: var(--cream); }
.hud-stat span { color: var(--gold); }

.explore-grid { display: grid; grid-template-columns: 200px 1fr; gap: 1rem; margin-bottom: 1rem; }
@media(max-width: 600px) { .explore-grid { grid-template-columns: 1fr; } }

.radar-container { padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.radar-title { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--muted); margin-bottom: 1rem; text-align: center; }
.radar { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 5px; }

.node { background: #222; border: 4px solid #111; display: flex; align-items: center; justify-content: center; }
.node.empty { background: transparent; border: none; }
.node.player { background: #000; border-color: #FFF; box-shadow: inset 0 0 10px #FFF; }
.node.player::after { content: ''; width: 16px; height: 16px; background: var(--gold); }
.node.gold { background: #332200; border-color: var(--gold); box-shadow: 0 0 10px var(--gd); }
.node.enemy { background: #330000; border-color: var(--red); box-shadow: 0 0 10px #880000; }
.node.safe { background: #003300; border-color: var(--lg); }
.node.stairs { background: #220033; border-color: var(--purple); }

.dialog-box { padding: 1.5rem; font-size: 1.5rem; line-height: 1.5; min-height: 150px; }

.dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; max-width: 200px; margin: 0 auto; }
.dpad-btn { padding: 1rem; background: #000; border: 4px solid var(--muted); color: var(--cream); font-family: var(--font-pixel); cursor: pointer; transition: transform 0.1s; }
.dpad-btn.active, .dpad-btn:active { border-color: var(--gold); background: #222; transform: scale(0.95); }
.dpad-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.dpad-btn.up { grid-column: 2; grid-row: 1; }
.dpad-btn.left { grid-column: 1; grid-row: 2; }
.dpad-btn.right { grid-column: 3; grid-row: 2; }
.dpad-btn.down { grid-column: 2; grid-row: 3; }
.dpad-hint { grid-column: 1 / -1; text-align: center; font-family: var(--font-pixel); font-size: 0.5rem; color: var(--muted); margin-top: 0.5rem; }

.battle-arena { height: 300px; background: #111; border: 6px solid #FFF; position: relative; margin-bottom: 1rem; overflow: hidden; }
.b-sprite { position: absolute; width: 120px; height: 120px; image-rendering: pixelated; filter: drop-shadow(4px 4px 0 #000); }
.b-sprite.enemy { top: 40px; right: 50px; }
.b-sprite.player { bottom: 40px; left: 50px; transform: scaleX(-1); }

@keyframes blink { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }
@keyframes capture { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.1) translateY(100px); opacity: 0; } }
.anim-blink { animation: blink 0.6s step-end; }
.anim-capture { animation: capture 1s forwards; }

.battle-hud { position: absolute; background: #000; border: 4px solid #FFF; padding: 0.5rem; width: 200px; z-index: 10; }
.bh-enemy { top: 10px; left: 10px; }
.bh-player { bottom: 10px; right: 10px; }
.b-name { font-family: var(--font-pixel); font-size: 0.6rem; margin-bottom: 0.5rem; text-transform: uppercase;}
.hp-bar-bg { width: 100%; height: 10px; background: #333; border: 2px solid #555; }
.hp-bar-fill { height: 100%; background: var(--lg); transition: width 0.3s; }

.action-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.action-btn { background: #000; border: 4px solid #FFF; color: var(--cream); font-family: var(--font-pixel); font-size: 0.7rem; padding: 1rem; cursor: pointer; text-align: left;}
.action-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); padding-left: 1.5rem; }
.action-btn:disabled { border-color: #444; color: #444; cursor: not-allowed;}

.grimoire-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; }
.g-card { background: #000; border: 4px solid #444; padding: 1rem; text-align: center; display: flex; flex-direction: column; align-items: center;}
.g-card.caught { border-color: var(--gold); background: #1a1500; }
.g-canvas { width: 64px; height: 64px; image-rendering: pixelated; margin-bottom: 0.5rem; opacity: 0.1; }
.g-card.caught .g-canvas { opacity: 1; filter: drop-shadow(4px 4px 0 #000); }
.g-name { font-family: var(--font-pixel); font-size: 0.5rem; color: var(--muted); }
.g-card.caught .g-name { color: var(--cream); }

</style>
</head>
<body>
<header>
  <a href="#" class="logo">THE MASTER GRIMOIRE</a>
  <a href="#" class="back">RETURN</a>
</header>

<div id="gameScreen">
  <div class="tabs">
    <button class="tab-btn active" id="tab-explore" onclick="switchTab('explore')">EXPLORE</button>
    <button class="tab-btn" id="tab-grimoire" onclick="switchTab('grimoire')">GRIMOIRE (<span id="g-count">0</span>/50)</button>
  </div>

  <div class="hud retro-box">
    <div class="hud-stat">DEPTH: <span id="hud-depth">1</span></div>
    <div class="hud-stat">HP: <span id="hud-hp">100</span>/100</div>
    <div class="hud-stat">GOLD: <span id="hud-gold">0</span></div>
  </div>

  <div id="view-explore" class="view-section active">
    <div class="explore-grid">
      <div class="radar-container retro-box">
        <div class="radar-title">RADAR COMPASS</div>
        <div class="radar">
          <div class="node empty"></div><div class="node" id="node-n"></div><div class="node empty"></div>
          <div class="node" id="node-w"></div><div class="node player"></div><div class="node" id="node-e"></div>
          <div class="node empty"></div><div class="node" id="node-s"></div><div class="node empty"></div>
        </div>
      </div>
      <div class="dialog-box retro-box" id="explore-dialog">
        The stone is shifting... check the radar. Use W, A, S, D or Arrows to move.
      </div>
    </div>
    
    <div class="dpad" id="dpad-container">
      <button class="dpad-btn up" id="btn-n" onclick="move('n')">W</button>
      <button class="dpad-btn left" id="btn-w" onclick="move('w')">A</button>
      <button class="dpad-btn right" id="btn-e" onclick="move('e')">D</button>
      <button class="dpad-btn down" id="btn-s" onclick="move('s')">S</button>
      <div class="dpad-hint">KEYBOARD ENABLED</div>

  </div>

  <div id="view-battle" class="view-section">
    <div class="battle-arena">
      <div class="battle-hud bh-enemy">
        <div class="b-name" id="b-enemy-name">Ore Rat</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="b-enemy-hp" style="width:100%"></div></div>
      </div>
      <canvas id="b-enemy-sprite" class="b-sprite enemy" width="12" height="12"></canvas>

      <div class="battle-hud bh-player">
        <div class="b-name">Miner</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="b-player-hp" style="width:100%"></div></div>
      </div>
      <canvas id="b-player-sprite" class="b-sprite player" width="12" height="12"></canvas>
    </div>

    <div class="dialog-box retro-box" id="battle-dialog" style="margin-bottom:1rem; min-height: 80px;">
      A wild beast attacks!
    </div>

    <div class="action-menu" id="battle-menu">
      <button class="action-btn" onclick="battleAttack()">FIGHT</button>
      <button class="action-btn" onclick="battleCatch()">CATCH</button>
      <button class="action-btn" onclick="battleFlee()">RUN</button>
    </div>
  </div>

  <div id="view-grimoire" class="view-section">
    <div class="dialog-box retro-box" style="margin-bottom:1rem; min-height:auto;">
      Master Grimoire: 50 Entities bound to the mountain.
    </div>
    <div class="grimoire-grid" id="grimoire-grid"></div>
  </div>
</div>

<script>
// ── PROCEDURAL SPRITE GENERATOR ──
function drawSprite(canvasId, seedStr, colorHex) {
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 12, 12);
  
  let seed = 0;
  for(let i=0; i<seedStr.length; i++) { seed = seed * 31 + seedStr.charCodeAt(i); }
  
  const random = () => {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  };

  ctx.fillStyle = colorHex || `hsl(${Math.floor(random() * 360)}, 70%, 60%)`;
  
  // Draw 6x12 left side, then mirror to right side
  for(let x=0; x<6; x++) {
    for(let y=0; y<12; y++) {
      if(random() > 0.5) {
        ctx.fillRect(x + 3, y, 1, 1); 
        ctx.fillRect(12 - (x + 3) - 1, y, 1, 1); 
      }
    }
  }
}

// ── THE 50 BEASTS OF NMN ──

  { id: 'b10', name: 'Crown of Shadows', maxHp: 80, catchRate: 0.1, color: '#FFD700' },

  { id: 'b17', name: 'Rogue Demon', maxHp: 50, catchRate: 0.25, color: '#8B0000' },
  { id: 'b18', name: 'Bound Demon', maxHp: 55, catchRate: 0.2, color: '#4B0082' },
  { id: 'b19', name: 'Anubis Illusion', maxHp: 65, catchRate: 0.15, color: '#FFD700' },
  { id: 'b20', name: 'Tydett Cardinal', maxHp: 25, catchRate: 0.5, color: '#FF0000' },
  { id: 'b21', name: 'Mecha-Bird', maxHp: 30, catchRate: 0.45, color: '#708090' },
  { id: 'b22', name: 'Thalia Wisp', maxHp: 40, catchRate: 0.35, color: '#9370DB' },
  { id: 'b23', name: 'Artimedias Shade', maxHp: 60, catchRate: 0.2, color: '#2F4F4F' },
  { id: 'b24', name: 'Legless Poison Frog', maxHp: 20, catchRate: 0.6, color: '#32CD32' },

  { id: 'b36', name: 'Rogue Asteroid Golem', maxHp: 80, catchRate: 0.05, color: '#696969' },
  { id: 'b37', name: 'Cartoon Manifest', maxHp: 30, catchRate: 0.45, color: '#FF69B4' },

  { id: 'b41', name: 'Foreign Samurai', maxHp: 60, catchRate: 0.2, color: '#B22222' },
  { id: 'b42', name: 'Ila the Werewolf', maxHp: 55, catchRate: 0.25, color: '#A9A9A9' },

  { id: 'b45', name: 'Sprock the Hound', maxHp: 40, catchRate: 0.35, color: '#D2B48C' },
  { id: 'b46', name: 'Sage the Feline', maxHp: 35, catchRate: 0.4, color: '#FFE4B5' },
  { id: 'b47', name: 'Storm Elemental', maxHp: 70, catchRate: 0.15, color: '#4682B4' },
  { id: 'b48', name: 'Calypso Siren', maxHp: 65, catchRate: 0.2, color: '#20B2AA' },
  { id: 'b49', name: 'Hideous Bear Toy', maxHp: 25, catchRate: 0.5, color: '#8B0000' },
  { id: 'b50', name: 'X-42 Jet Drone', maxHp: 60, catchRate: 0.2, color: '#778899' }
];

const NODE_TYPES = [
  { type: 'safe', class: 'safe', text: "An empty tunnel. Quiet." },
  { type: 'gold', class: 'gold', text: "A vein of raw ore! +Gold." },
  { type: 'enemy', class: 'enemy', text: "Danger! A creature blocks the path." },
  { type: 'stairs', class: 'stairs', text: "A shaft leading deeper." }
];

// ── STATE ──
let STATE = {
  depth: 1, hp: 100, maxHp: 100, gold: 0,
  grimoire: JSON.parse(localStorage.getItem('nmn_grimoire_px')) || [],
  radar: { n: null, s: null, e: null, w: null },
  currentEnemy: null, isAnimating: false
};

// ── KEYBOARD CONTROLS ──
window.addEventListener('keydown', (e) => {
  if(STATE.isAnimating || document.getElementById('view-explore').style.display === 'none') return;
  const keyMap = { 'ArrowUp': 'n', 'w': 'n', 'W': 'n', 'ArrowDown': 's', 's': 's', 'S': 's', 'ArrowLeft': 'w', 'a': 'w', 'A': 'w', 'ArrowRight': 'e', 'd': 'e', 'D': 'e' };
  if(keyMap[e.key]) {
    document.getElementById('btn-' + keyMap[e.key]).classList.add('active');
    move(keyMap[e.key]);
  }
});
window.addEventListener('keyup', (e) => {
  document.querySelectorAll('.dpad-btn').forEach(btn => btn.classList.remove('active'));
});

// ── SYSTEM ──
function init() {
  updateHUD();
  generateRadar();
  renderGrimoire();
  drawSprite('b-player-sprite', 'miner_character', '#FFD700');
}

function switchTab(tabId) {
  if (STATE.isAnimating) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  document.getElementById('view-' + tabId).classList.add('active');
}

function updateHUD() {
  document.getElementById('hud-depth').textContent = STATE.depth;
  document.getElementById('hud-hp').textContent = STATE.hp;
  document.getElementById('hud-gold').textContent = STATE.gold;
  document.getElementById('g-count').textContent = STATE.grimoire.length;
}

function typeText(elId, text, callback) {
  STATE.isAnimating = true;
  const el = document.getElementById(elId);
  el.textContent = "";
  let i = 0;
  const timer = setInterval(() => {
    el.textContent += text.charAt(i++);
    if (i >= text.length) { clearInterval(timer); setTimeout(() => { STATE.isAnimating = false; if(callback) callback(); }, 300); }
  }, 20);
}

// ── RADAR ──
function generateRadar() {
  ['n','s','e','w'].forEach(dir => {
    const roll = Math.random();
    let type = NODE_TYPES[0]; // safe
    if(roll < 0.15) type = NODE_TYPES[3]; // stairs
    else if(roll < 0.35) type = NODE_TYPES[1]; // gold
    else if(roll < 0.70) type = NODE_TYPES[2]; // enemy
    STATE.radar[dir] = type;
    document.getElementById('node-' + dir).className = 'node ' + type.class;
  });
}

function move(dir) {
  if (STATE.isAnimating) return;
  const tNode = STATE.radar[dir];
  typeText('explore-dialog', tNode.text, () => {
    if (tNode.type === 'gold') {
      STATE.gold += Math.floor(Math.random() * 20) + (STATE.depth * 5);
      updateHUD(); generateRadar();
    } else if (tNode.type === 'stairs') {
      STATE.depth++; updateHUD(); generateRadar();
    } else if (tNode.type === 'enemy') {
      startBattle();
    } else {
      generateRadar();
    }
  });
}

// ── BATTLE ──
function startBattle() {
  let pool = BEASTS.filter(b => b.maxHp <= STATE.depth * 15 + 15);
  if (!pool.length) pool = [BEASTS[0]];
  STATE.currentEnemy = { ...pool[Math.floor(Math.random() * pool.length)] };
  STATE.currentEnemy.currentHp = STATE.currentEnemy.maxHp;
  
  document.getElementById('b-enemy-name').textContent = STATE.currentEnemy.name;
  document.getElementById('b-enemy-sprite').className = 'b-sprite enemy'; 
  drawSprite('b-enemy-sprite', STATE.currentEnemy.name, STATE.currentEnemy.color);
  updateBattleHUD();
  
  switchTab('battle'); // FORCED UI SWITCH
  typeText('battle-dialog', `Wild ${STATE.currentEnemy.name} emerges!`);
}

function updateBattleHUD() {
  let pp = (STATE.hp / STATE.maxHp) * 100;
  document.getElementById('b-player-hp').style.width = pp + '%';
  document.getElementById('b-player-hp').style.background = pp < 30 ? 'var(--red)' : 'var(--lg)';
  let ep = (STATE.currentEnemy.currentHp / STATE.currentEnemy.maxHp) * 100;
  document.getElementById('b-enemy-hp').style.width = ep + '%';
  document.getElementById('b-enemy-hp').style.background = ep < 30 ? 'var(--red)' : 'var(--lg)';
}

function tBM(show) { document.querySelectorAll('#battle-menu .action-btn').forEach(b => b.disabled = !show); }

function battleAttack() {
  if(STATE.isAnimating) return; tBM(false);
  typeText('battle-dialog', `Miner swings!`, () => {
    STATE.currentEnemy.currentHp = Math.max(0, STATE.currentEnemy.currentHp - (Math.floor(Math.random()*10)+5));
    updateBattleHUD();
    document.getElementById('b-enemy-sprite').classList.add('anim-blink');
    setTimeout(() => { document.getElementById('b-enemy-sprite').classList.remove('anim-blink'); checkWin(); }, 600);
  });
}

function battleCatch() {
  if(STATE.isAnimating) return; tBM(false);
  typeText('battle-dialog', `Threw a binding sigil!`, () => {
    let chance = STATE.currentEnemy.catchRate + ((1 - (STATE.currentEnemy.currentHp / STATE.currentEnemy.maxHp)) * 0.4);
    document.getElementById('b-enemy-sprite').classList.add('anim-blink');
    setTimeout(() => {
      if(Math.random() < chance) {
        document.getElementById('b-enemy-sprite').className = 'b-sprite enemy anim-capture';
        typeText('battle-dialog', `Gotcha! ${STATE.currentEnemy.name} bound!`, () => {
          if (!STATE.grimoire.includes(STATE.currentEnemy.id)) {
            STATE.grimoire.push(STATE.currentEnemy.id);
            localStorage.setItem('nmn_grimoire_px', JSON.stringify(STATE.grimoire));
            renderGrimoire(); updateHUD();
          }
          setTimeout(() => endBattle(), 1000);
        });
      } else {
        document.getElementById('b-enemy-sprite').classList.remove('anim-blink');
        typeText('battle-dialog', `It broke free!`, () => enemyTurn());
      }
    }, 1000);
  });
}

function battleFlee() {
  if(STATE.isAnimating) return; tBM(false);
  typeText('battle-dialog', `Escaped into the dark.`, () => setTimeout(() => endBattle(), 1000));
}

function enemyTurn() {
  typeText('battle-dialog', `${STATE.currentEnemy.name} strikes!`, () => {
    STATE.hp = Math.max(0, STATE.hp - (Math.floor(Math.random()*5) + (STATE.depth*2)));
    updateHUD(); updateBattleHUD();
    if (STATE.hp <= 0) typeText('battle-dialog', `Miner blacked out...`, () => setTimeout(() => location.reload(), 2000));
    else typeText('battle-dialog', `What will you do?`, () => tBM(true));
  });
}

function checkWin() {
  if (STATE.currentEnemy.currentHp <= 0) {
    STATE.gold += 15; updateHUD();
    typeText('battle-dialog', `${STATE.currentEnemy.name} fell! +15 Gold.`, () => setTimeout(() => endBattle(), 1000));
  } else enemyTurn();
}

function endBattle() {
  generateRadar(); switchTab('explore'); tBM(true);
  typeText('explore-dialog', "Path clear. Check radar.");
}

// ── GRIMOIRE ──
function renderGrimoire() {
  const grid = document.getElementById('grimoire-grid');
  grid.innerHTML = BEASTS.map(b => {
    const c = STATE.grimoire.includes(b.id);
    return `<div class="g-card ${c ? 'caught' : ''}">
              <canvas id="gc-${b.id}" class="g-canvas" width="12" height="12"></canvas>
              <div class="g-name">${c ? b.name : '???'}</div>
            </div>`;
  }).join('');
  BEASTS.forEach(b => drawSprite(`gc-${b.id}`, b.name, b.color));
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
