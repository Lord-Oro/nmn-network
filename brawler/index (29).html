// Gold spark — no screen flash
function goldSpark(scene,x,y){
  const g=scene.add.graphics().setDepth(600);
  [0xFFD700,0xFF8800,0xFFFF88,0xFF5500].forEach(col=>{
    for(let i=0;i<4;i++){
      const ang=Math.random()*Math.PI*2,len=4+Math.random()*16;
      g.fillStyle(col,1);
      g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,3+Math.random()*3,3);
    }
  });
  scene.tweens.add({targets:g,alpha:0,duration:220,onComplete:()=>g.destroy()});
}

// Arc slash visual
function arcSlash(scene,x,y,dir,isJuni){
  const g=scene.add.graphics().setDepth(580);
  const col =isJuni?0x00FF88:0xFF4400;
  const col2=isJuni?0xAAFFCC:0xFFAA00;
  g.lineStyle(5,col,0.9);
  g.beginPath();
  g.arc(x+dir*36,y-8,28,Phaser.Math.DegToRad(-70),Phaser.Math.DegToRad(70),false);
  g.strokePath();
  g.lineStyle(2,col2,0.6);
  g.beginPath();
  g.arc(x+dir*36,y-8,19,Phaser.Math.DegToRad(-50),Phaser.Math.DegToRad(50),false);
  g.strokePath();
  for(let i=0;i<7;i++){
    const ang=Phaser.Math.DegToRad(Phaser.Math.Between(-70,70));
    const r=Phaser.Math.Between(18,32);
    const px=x+dir*36+Math.cos(ang)*r,py=y-8+Math.sin(ang)*r;
    const dot=scene.add.rectangle(px,py,isJuni?5:4,isJuni?4:6,isJuni?0x00FF88:0xFF6600,0.9).setDepth(581);
    scene.tweens.add({targets:dot,x:px+dir*(Math.random()*18),y:py-Math.random()*12,alpha:0,duration:isJuni?180:120,onComplete:()=>dot.destroy()});
  }
  scene.tweens.add({targets:g,alpha:0,duration:110,onComplete:()=>g.destroy()});
}

      {name:"Pyro",     img:"p_sheet",     frame:0,  active:true, color:"#FF6600",url:BOOK_LINKS.pyro_en},
      {name:"Wanderer", img:"wanderer_beta",frame:null,active:false,color:"#336699",url:LINKTREE},
      {name:"Olydia",   img:"olydia_beta", frame:null,active:false,color:"#9933CC",url:BOOK_LINKS.outbreak_en},
      {name:"Orid",     img:"orid_beta",   frame:null,active:false,color:"#884422",url:BOOK_LINKS.juni_en},
      {name:"Helios",   img:"helios_beta", frame:null,active:false,color:"#FFD700",url:BOOK_LINKS.juni_en},
    ];

    roster.forEach((c,i)=>{
      const col=i%3,row=Math.floor(i/3);
      const x=150+col*250,y=170+row*130;
      const bc=c.active?0xFFD700:0x444444;
      const panel=this.add.rectangle(x,y,120,110,0x111111).setStrokeStyle(2,bc).setInteractive({useHandCursor:true});
      const icon=c.frame!==null
        ?this.add.image(x,y-10,c.img,c.frame).setDisplaySize(80,80)
        :this.add.image(x,y-10,c.img).setDisplaySize(80,80);
      if(!c.active)icon.setTint(0x444444);
      this.add.text(x,y+48,c.name.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"6px",color:c.active?c.color:"#555"}).setOrigin(0.5);
      if(!c.active)this.add.text(x,y+62,"LOCKED",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#FF4444"}).setOrigin(0.5);
      panel.on("pointerover",()=>panel.setStrokeStyle(2,0xFFFFFF));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,bc));
      panel.on("pointerdown",()=>{
        if(!c.active){
          if(this.scoutIdx===i)window.open(c.url,"_blank");
          else{this.scoutIdx=i;this.intelTxt.setText("🔒 "+c.name+": LOCKED — click again to unlock.").setColor("#FF8888");}
          return;
        }
        if(this.scoutIdx!==i){this.scoutIdx=i;this.intelTxt.setText("★ "+c.name.toUpperCase()+" — "+this.getLore(c.name)).setColor(c.color);return;}
        Match.p1=c.name;
        Match.p2=c.name==="Juni"?"Pyro":"Juni";
        this.scene.start("StageSelectScene");
      });
    });

    // Bottom nav
    this.add.text(GW/2-130,GH-20,"📖 ORIGIN HUB",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#050308",backgroundColor:"#FFD700",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("OriginHub"));
    this.add.text(GW/2+130,GH-20,"⚙ DIFFICULTY",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FFD700",backgroundColor:"#111",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("DifficultyScene"));
  }
  getLore(name){
    const lore={
      "Juni":"Enter if you dare; face Anubis in the endless expanse of the sands of time.",
      "Pyro":"Born from the forge. His tusks run hotter than the mine walls."
    };
    return lore[name]||"A warrior from the mine.";
  }
}

    this.physics.world.gravity.y=1400;

    // ── PLATFORMS ──
    this.platforms=this.physics.add.staticGroup();
    const mkP=(px,py,pw,ph=18,col=0x3a2a0a)=>{
      const p=this.add.rectangle(px,py,pw,ph,col);
      this.add.rectangle(px,py-ph/2-1,pw,3,0xFFD700,0.35);
      this.physics.add.existing(p,true);
      this.platforms.add(p);
      return p;
    };
    mkP(GW/2,  MAIN_PLAT_Y,  520,20);  // main — y=GH-55
    mkP(150,   GH-180, 200);            // left shelf
    mkP(650,   GH-180, 200);            // right shelf

    // ── ANIMATIONS (Juni and Pyro have SEPARATE anim keys) ──
    // Juni
    const jAnims=[
      {key:"j_idle",   start:0,  end:3,  rate:6,  loop:true},
      {key:"j_jump",   start:4,  end:6,  rate:8,  loop:false},
      {key:"j_melee",  frames:[12,14,13],rate:14, loop:false},
      {key:"j_range",  start:7,  end:9,  rate:12, loop:false},
      {key:"j_burst",  start:15, end:17, rate:10, loop:false},
      {key:"j_shield", frames:[18],      rate:1,  loop:false},
      {key:"j_dmg",    start:19, end:21, rate:12, loop:false},
      {key:"j_launch", start:15, end:17, rate:10, loop:false},
    ];
    // Pyro
    const pAnims=[
      {key:"p_idle",   start:0,  end:3,  rate:8,  loop:true},
      {key:"p_jump",   frames:[4,4,5],   rate:8,  loop:false},
      {key:"p_melee",  frames:[10,11,12],rate:14, loop:false},
      {key:"p_range",  start:7,  end:9,  rate:12, loop:false},
      {key:"p_burst",  frames:[6],       rate:1,  loop:false},
      {key:"p_shield", frames:[20],      rate:1,  loop:false},
      {key:"p_dmg",    start:21, end:22, rate:12, loop:false},
      {key:"p_launch", start:23, end:24, rate:10, loop:false},
    ];

    const makeAnim=(sheet,def)=>{
      if(this.anims.exists(def.key)) return;
      if(def.frames){
        this.anims.create({key:def.key,frames:def.frames.map(f=>({key:sheet,frame:f})),frameRate:def.rate,repeat:def.loop?-1:0});
      } else {
        this.anims.create({key:def.key,frames:this.anims.generateFrameNumbers(sheet,{start:def.start,end:def.end}),frameRate:def.rate,repeat:def.loop?-1:0});
      }
    };
    jAnims.forEach(d=>makeAnim("j_sheet",d));
    pAnims.forEach(d=>makeAnim("p_sheet",d));

    // ── PLAYERS — spawn ON the platform ──
    const p1Sheet=Match.p1==="Juni"?"j_sheet":"p_sheet";
    const p2Sheet=Match.p1==="Juni"?"p_sheet":"j_sheet";
    this.p1Pre=Match.p1==="Juni"?"j":"p";
    this.p2Pre=Match.p1==="Juni"?"p":"j";

    this.p1=this.physics.add.sprite(SPAWN.p1.x,SPAWN.p1.y,p1Sheet);
    this.p2=this.physics.add.sprite(SPAWN.p2.x,SPAWN.p2.y,p2Sheet).setFlipX(true);

    [this.p1,this.p2].forEach(sp=>{
      sp.setDisplaySize(80,80);
      sp.setCollideWorldBounds(false);
      // Body anchored to feet
      sp.body.setSize(36,50).setOffset((sp.width-36)/2, sp.height-50);
      sp.setBounce(0);
      sp.setDragX(700);
      sp.body.setMaxVelocity(600,1000);
    });

    this.physics.add.collider([this.p1,this.p2],this.platforms);

    // Start idle animations immediately
    this.p1.play(this.p1Pre+"_idle");
    this.p2.play(this.p2Pre+"_idle");

    // ── STATE ──
    this.S={
      p1Stun:false,p2Stun:false,
      p1AtkCD:false,p2AtkCD:false,
      p1Jumps:0,p2Jumps:0,
      gameOver:false
    };
    this.cpuAtkTimer=0;this.cpuFireTimer=0;this.cpuJumps=0;this.cpuAtkCD=false;

    // CPU speed multipliers by difficulty
    this.cpuSpeed    = Match.difficulty==="EASY"?120:Match.difficulty==="HARD"?220:170;
    this.cpuAtkFreq  = Match.difficulty==="EASY"?0.04:Match.difficulty==="HARD"?0.18:0.10;
    this.cpuFireFreq = Match.difficulty==="EASY"?0.01:Match.difficulty==="HARD"?0.06:0.03;

    // ── HITBOX GROUPS (rectangle+physics — stable arg order) ──
    this.meleeGrp=this.physics.add.group();
    this.projGrp =this.physics.add.group();

    this.physics.add.overlap(this.meleeGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,false);
    });
    this.physics.add.overlap(this.meleeGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,false);
    });
    this.physics.add.overlap(this.projGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,true);
    });
    this.physics.add.overlap(this.projGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,true);
    });

    // ── HUD ──
    this.buildHUD();
    this.refreshHUD();

    // ── KEYS ──
    this.keys=this.input.keyboard.addKeys({
      W:"W",A:"A",D:"D",J:"J",K:"K",L:"L",
      SEMI:"SEMICOLON",P:"P"
    });

    // ── PAUSE MENU ──
    this.buildPauseMenu();

    // ── CAMERA ──
    this.camX=GW/2;this.targetZoom=1.0;
    this.cameras.main.centerOn(GW/2,GH/2);
  }

  refreshHUD(){
    // Health bar shrinks as % rises, maxes at 500%
    const p1pct=Math.min(Match.p1Pct,500)/500;
    const p2pct=Math.min(Match.p2Pct,500)/500;
    this.p1Bar.scaleX=Math.max(0,1-p1pct);
    this.p2Bar.scaleX=Math.max(0,1-p2pct);
    const clr=p=>p>200?"#FF4444":p>100?"#FFAA00":"#FFFFFF";
    this.p1DT.setText(Match.p1Pct+"%").setColor(clr(Match.p1Pct));
    this.p2DT.setText(Match.p2Pct+"%").setColor(clr(Match.p2Pct));
    const h=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,3-n));
    this.p1HT.setText(h(Match.p1Lives));
    this.p2HT.setText(h(Match.p2Lives));
  }

  // ── RESPAWN CONTRACT ─────────────────────────────────
  respawnOrEnd(id){
    const S=this.S;
    if(S.gameOver)return;
    const isP1=id==="p1";
    const sp=isP1?this.p1:this.p2;
    const spX=isP1?SPAWN.p1.x:SPAWN.p2.x;
    const spY=isP1?SPAWN.p1.y:SPAWN.p2.y;
    const pre=isP1?this.p1Pre:this.p2Pre;

    if(isP1)Match.p1Lives--;else Match.p2Lives--;
    const lives=isP1?Match.p1Lives:Match.p2Lives;
    this.cameras.main.shake(240,0.014);
    this.refreshHUD();

    if(lives<=0){
      S.gameOver=true;
      Match.winner=isP1?"P2":"P1";
      this.showSignalLost();
      return;
    }

    // Reset — both players identical path
    if(isP1){Match.p1Pct=0;S.p1Stun=false;S.p1AtkCD=false;S.p1Jumps=0;}
    else    {Match.p2Pct=0;S.p2Stun=false;S.p2AtkCD=false;S.p2Jumps=0;}

    // SOUL ANCHOR
    this.tweens.killTweensOf(sp);
    sp.setActive(true).setVisible(true).setAlpha(1).clearTint();
    if(sp.body){
      sp.body.setEnable(true);
      sp.body.setVelocity(0,0);
      sp.body.setAcceleration(0,0);
    }
    sp.setPosition(spX,spY);
    sp.play(pre+"_idle");

    this.tweens.add({targets:sp,alpha:0.3,duration:100,yoyo:true,repeat:7,
      onComplete:()=>{sp.setActive(true).setVisible(true).setAlpha(1);}
    });
    const lbl=this.add.text(spX,spY-44,(isP1?"P1":"CPU")+" BACK",
      {fontFamily:"Press Start 2P",fontSize:"7px",color:isP1?"#00FF88":"#FF5555"}).setOrigin(0.5).setDepth(500);
    this.tweens.add({targets:lbl,y:spY-84,alpha:0,duration:800,onComplete:()=>lbl.destroy()});
    this.refreshHUD();
  }

  showSignalLost(){
    document.getElementById("mc").classList.remove("on");
    const sl=this.textures.exists("signal_lost")
      ?this.add.image(GW/2,GH/2,"signal_lost").setDisplaySize(GW,GH).setAlpha(0).setDepth(8000).setScrollFactor(0)
      :this.add.rectangle(GW/2,GH/2,GW,GH,0x050308,0).setDepth(8000).setScrollFactor(0);
    this.tweens.add({targets:sl,alpha:0.9,duration:400});
    const winner=Match.winner==="P1"?Match.p1:Match.p2;
    const wc=winner==="Juni"?"#00FF88":"#FF6600";
    this.add.text(GW/2,GH/2-30,"SIGNAL LOST",{fontFamily:"Press Start 2P",fontSize:"22px",color:"#FF2222",stroke:"#000",strokeThickness:4}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
    this.add.text(GW/2,GH/2+10,Match.winner+" WINS — "+winner.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"10px",color:wc}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
    const url=winner==="Juni"?BOOK_LINKS.juni_en:BOOK_LINKS.pyro_en;
    const cta=this.add.text(GW/2,GH/2+50,"📖 READ THE LEGEND",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#55AAFF",backgroundColor:"#111",padding:{x:10,y:5}}).setDepth(8001).setOrigin(0.5).setScrollFactor(0).setInteractive({useHandCursor:true});
    cta.on("pointerdown",()=>window.open(url,"_blank"));
    this.tweens.add({targets:cta,alpha:0.5,duration:800,yoyo:true,repeat:-1});
    const cta2=this.add.text(GW/2,GH/2+78,winner==="Juni"?"📡 Also: Outbreak →":"📗 Also: Juni the Immortal →",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#9933CC"}).setDepth(8001).setOrigin(0.5).setScrollFactor(0).setInteractive({useHandCursor:true});
    cta2.on("pointerdown",()=>window.open(winner==="Juni"?BOOK_LINKS.outbreak_en:BOOK_LINKS.juni_en,"_blank"));
    this.time.delayedCall(2600,()=>this.scene.start("ResultsScene"));
  }

  // ── HIT RESOLUTION ───────────────────────────────────
  resolveHit(atkId,tgtId,hit,isProjectile){
    const S=this.S;
    if(S.gameOver||!hit||!hit.active)return;
    hit.destroy();
    const tgt=tgtId==="p2"?this.p2:this.p1;
    const atk=atkId==="p1"?this.p1:this.p2;
    if(!tgt.active||!tgt.body)return;

    const power=isProjectile?8:6;
    if(tgtId==="p2")Match.p2Pct+=power;else Match.p1Pct+=power;
    const pct=tgtId==="p2"?Match.p2Pct:Match.p1Pct;

    const kbScale=Math.min(4,1+(pct*0.015));
    const dir=tgt.x>=atk.x?1:-1;
    tgt.body.setVelocity(dir*180*kbScale,-160*kbScale);

    // FRAME SELECTION via FRAMES registry — exact frame before anim plays
    const tPre=tgtId==="p2"?this.p2Pre:this.p1Pre;
    const fHit=FRAMES[tPre==="j"?"juni":"pyro"];
    if(pct>50){
      // Launch — set knock frame instantly, then play launch anim
      tgt.setFrame(fHit.knock);
      if(this.anims.exists(tPre+"_launch")) this.time.delayedCall(40,()=>{ if(tgt.active) tgt.play(tPre+"_launch",true); });
    } else {
      // Damage — set first dmg frame instantly, then play dmg anim
      tgt.setFrame(fHit.dmg[0]);
      if(this.anims.exists(tPre+"_dmg")) this.time.delayedCall(30,()=>{ if(tgt.active) tgt.play(tPre+"_dmg",true); });
    }

    this.cameras.main.shake(isProjectile?40:65,0.007);
    if(tgtId==="p2")S.p2Stun=true;else S.p1Stun=true;
    this.time.delayedCall(150,()=>{
      if(!S.gameOver){if(tgtId==="p2")S.p2Stun=false;else S.p1Stun=false;}
    });
    this.tweens.add({targets:tgt,alpha:{from:0.5,to:1},duration:140});
    this.refreshHUD();
  }

  // ── SPAWN MELEE ──────────────────────────────────────
  spawnMelee(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1;
    const isJuni=pre==="j";
    arcSlash(this,sp.x,sp.y,dir,isJuni);
    const mReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(mReg.melee);
    if(this.anims.exists(pre+"_melee")) this.time.delayedCall(30,()=>sp.play(pre+"_melee",true));
    const hit=this.add.rectangle(sp.x+dir*40,sp.y-6,34,28,0xFFD700,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false).setImmovable(true);
    hit.setData("owner",id);hit.life=0;
    this.meleeGrp.add(hit);
  }

  // ── SPAWN PROJECTILE ────────────────────────────────
  spawnProjectile(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1;
    const isJuni=pre==="j";
    // Play range anim on shooter, then show project frame
    const rReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(rReg.range);
    if(this.anims.exists(pre+"_range")) this.time.delayedCall(30,()=>sp.play(pre+"_range",true));
    const col =isJuni?0x00CC66:0xFF4400;
    const col2=isJuni?0xAAFFCC:0xFFAA00;
    const vis=this.add.rectangle(sp.x+dir*40,sp.y-8,isJuni?20:18,isJuni?10:12,col,0.95).setDepth(50);
    this.tweens.add({targets:vis,fillColor:{from:col,to:col2},duration:isJuni?55:40,yoyo:true,repeat:-1});
    const hit=this.add.rectangle(sp.x+dir*40,sp.y-8,18,18,0xFFFFFF,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false);
    hit.body.setVelocityX(dir*(isJuni?560:580));
    hit.setData("owner",id);hit.setData("vis",vis);hit.life=0;
    this.projGrp.add(hit);
    // Trail
    let tc=0;
    this.time.addEvent({delay:22,repeat:18,callback:()=>{
      if(!hit.active){if(vis.active)vis.destroy();return;}
      vis.setPosition(hit.x,hit.y);
      const dot=this.add.rectangle(hit.x-dir*(5+tc*1.2),hit.y+(Math.random()*6-3),isJuni?6:5,isJuni?4:6,isJuni?0x00FF88:0xFF6600,0.8).setDepth(49);
      tc++;
      this.tweens.add({targets:dot,alpha:0,scaleX:0,scaleY:0,duration:isJuni?190:150,onComplete:()=>dot.destroy()});
    }});
    this.time.delayedCall(1400,()=>{if(hit.active)hit.destroy();if(vis.active)vis.destroy();});
  }

  // ── BURST / AOE ──────────────────────────────────────
  spawnBurst(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    // Play transcendence/burst frame
    // Force exact burst/transcendence frame from FRAMES registry
    const fReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(fReg.burst);
    if(this.anims.exists(pre+"_burst")) this.time.delayedCall(60,()=>sp.play(pre+"_burst",true));
    const isJuni=pre==="j";
    const col=isJuni?0x00FF88:0xFF2200;
    // Glow ring
    const ring=this.add.circle(sp.x,sp.y,90,col,0.2).setDepth(49);
    const ring2=this.add.circle(sp.x,sp.y,55,col,0.35).setDepth(50);
    this.tweens.add({targets:[ring,ring2],scaleX:1.6,scaleY:1.6,alpha:0,duration:420,onComplete:()=>{ring.destroy();ring2.destroy();}});
    // Emit particles
    for(let i=0;i<14;i++){
      const ang=Math.random()*Math.PI*2,len=20+Math.random()*70;
      const dot=this.add.rectangle(sp.x+Math.cos(ang)*len,sp.y+Math.sin(ang)*len,8,8,col,0.9).setDepth(51);
      this.tweens.add({targets:dot,x:sp.x+Math.cos(ang)*(len+40),y:sp.y+Math.sin(ang)*(len+40),alpha:0,duration:380,onComplete:()=>dot.destroy()});
    }
    // AOE hit check
    const tgt=id==="p1"?this.p2:this.p1;
    if(tgt.active&&Phaser.Math.Distance.Between(sp.x,sp.y,tgt.x,tgt.y)<95){
      goldSpark(this,tgt.x,tgt.y-20);
      // Direct damage — bypass hitbox for AOE
      const power=15;
      const tgtId=id==="p1"?"p2":"p1";
      if(tgtId==="p2")Match.p2Pct+=power;else Match.p1Pct+=power;
      const pct=tgtId==="p2"?Match.p2Pct:Match.p1Pct;
      const tPre=tgtId==="p2"?this.p2Pre:this.p1Pre;
      const kbScale=Math.min(4,1+(pct*0.015));
      const dir=tgt.x>=sp.x?1:-1;
      tgt.body.setVelocity(dir*160*kbScale,-140*kbScale);
      const bfReg=FRAMES[tPre==="j"?"juni":"pyro"];
      tgt.setFrame(pct>50?bfReg.knock:bfReg.dmg[0]);
      if(this.anims.exists(tPre+(pct>50?"_launch":"_dmg"))) this.time.delayedCall(35,()=>{ if(tgt.active) tgt.play(tPre+(pct>50?"_launch":"_dmg"),true); });
      this.cameras.main.shake(120,0.01);
      const tgtSp=tgtId==="p2"?"p2":"p1";
      if(tgtSp==="p2")this.S.p2Stun=true;else this.S.p1Stun=true;
      this.time.delayedCall(180,()=>{if(tgtSp==="p2")this.S.p2Stun=false;else this.S.p1Stun=false;});
      this.refreshHUD();
    }
  }

  // ── CPU AI ───────────────────────────────────────────
  runCPU(dt){
    const S=this.S,sp=this.p2;
    if(!sp.active||S.p2Stun||!sp.body)return;
    if(sp.body.blocked.down)S.p2Jumps=0;
    const dx=this.p1.x-sp.x,absX=Math.abs(dx);
    if(absX>40){sp.body.setVelocityX(dx>0?this.cpuSpeed:-this.cpuSpeed);sp.setFlipX(dx<0);}
    else sp.body.setVelocityX(sp.body.velocity.x*0.6);
    this.cpuAtkTimer+=dt;
    if(absX>60&&S.p2Jumps<2&&Math.random()<0.022){sp.body.setVelocityY(-600);S.p2Jumps++;this.cpuAtkTimer=0;}
    if(absX<75&&Math.random()<this.cpuAtkFreq&&!this.cpuAtkCD){
      this.cpuAtkCD=true;this.spawnMelee("p2");this.time.delayedCall(Match.difficulty==="HARD"?350:480,()=>this.cpuAtkCD=false);
    }
    this.cpuFireTimer+=dt;
    if(absX>90&&absX<300&&Math.random()<this.cpuFireFreq&&!this.cpuAtkCD){
      this.cpuAtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(360,()=>this.cpuAtkCD=false);
    }
    // CPU burst occasionally
    if(Match.p2Pct>80&&Math.random()<0.005) this.spawnBurst("p2");
    // Play idle or move anim
    if(!sp.anims.isPlaying||sp.anims.currentAnim?.key===this.p2Pre+"_idle"||sp.anims.currentAnim?.key===this.p2Pre+"_dmg"){
      if(!["_melee","_range","_burst","_launch","_dmg","_jump"].some(s=>sp.anims.currentAnim?.key.includes(s)))
        sp.play(this.p2Pre+"_idle",true);
    }
  }

  // ── P1 INPUT ─────────────────────────────────────────
  moveP1(){
    const S=this.S,sp=this.p1,pre=this.p1Pre,k=this.keys;
    if(!sp.active||!sp.body)return;
    if(sp.body.blocked.down)S.p1Jumps=0;

    // Shield — use FRAMES registry for exact frame
    if(k.L.isDown||MP.f){
      sp.body.setVelocityX(0);
      const fReg=FRAMES[pre==="j"?"juni":"pyro"];
      sp.setFrame(fReg.shield);
      return;
    }

    if(!S.p1Stun){
      const gL=k.A.isDown||MP.l,gR=k.D.isDown||MP.r;
      if(gL){sp.body.setVelocityX(-260);sp.setFlipX(true);}
      else if(gR){sp.body.setVelocityX(260);sp.setFlipX(false);}
      else sp.body.setVelocityX(sp.body.velocity.x*0.7);

      // Only play idle if no combat anim is running
      const combatAnims=["_melee","_range","_burst","_launch","_dmg","_jump"];
      const inCombat=sp.anims.currentAnim&&combatAnims.some(s=>sp.anims.currentAnim.key.includes(s));
      if(!inCombat) sp.play(pre+"_idle",true);

      if((Phaser.Input.Keyboard.JustDown(k.W)||MP.j)&&S.p1Jumps<2){
        sp.body.setVelocityY(-600);S.p1Jumps++;
        sp.play(pre+"_jump",true);MP.j=false;
      }
      if((Phaser.Input.Keyboard.JustDown(k.J)||MP.a)&&!S.p1AtkCD){
        S.p1AtkCD=true;this.spawnMelee("p1");
        this.time.delayedCall(210,()=>S.p1AtkCD=false);MP.a=false;
      }
      if((Phaser.Input.Keyboard.JustDown(k.K)||MP.s)&&!S.p1AtkCD){
        S.p1AtkCD=true;this.spawnProjectile("p1");
        this.time.delayedCall(290,()=>S.p1AtkCD=false);MP.s=false;
      }
      if((Phaser.Input.Keyboard.JustDown(k.SEMI)||MP.b)){
        this.spawnBurst("p1");MP.b=false;
      }
    }
  }

  // ── CAMERA ───────────────────────────────────────────
  updateCamera(){
    const p1x=this.p1.active?this.p1.x:GW/2;
    const p2x=this.p2.active?this.p2.x:GW/2;
    const mx=(p1x+p2x)/2;
    this.camX+=(mx-this.camX)*0.08;
    const dist=Math.abs(p1x-p2x);
    const raw=dist<180?1.18:dist>420?0.86:1.0;
    this.targetZoom=Phaser.Math.Clamp(raw,0.82,1.22);
    this.cameras.main.zoom+=(this.targetZoom-this.cameras.main.zoom)*0.04;
    this.cameras.main.centerOn(this.camX,GH/2);
  }

  // ── UPDATE ───────────────────────────────────────────
  update(time,dt){
    const S=this.S;

    if(Phaser.Input.Keyboard.JustDown(this.keys.P)){
      Match.paused=!Match.paused;
      this.pauseContainer.setVisible(Match.paused);
      this.physics.world.isPaused=Match.paused;
    }
    if(Match.paused||S.gameOver)return;

    this.meleeGrp.children.iterate(h=>{
      if(!h)return;h.life+=dt;if(h.life>200)h.destroy();
    });
    this.projGrp.children.iterate(h=>{
      if(!h)return;h.life+=dt;
      const vis=h.getData("vis");
      if(h.life>1500||h.x<BLAST.minX||h.x>BLAST.maxX){
        if(vis&&vis.active)vis.destroy();h.destroy();
      }
    });

    this.moveP1();
    this.runCPU(dt);

    [["p1",this.p1],["p2",this.p2]].forEach(([id,sp])=>{
      if(!sp.active)return;
      if(sp.x<BLAST.minX||sp.x>BLAST.maxX||sp.y<BLAST.minY||sp.y>BLAST.maxY)
        this.respawnOrEnd(id);
    });

    this.updateCamera();
  }
}

class ResultsScene extends Phaser.Scene{
  constructor(){super("ResultsScene");}
  create(){
    this.add.image(GW/2,GH/2,"bg_eyes").setDisplaySize(GW,GH).setAlpha(0.35);
    const winner=Match.winner==="P1"?Match.p1:Match.p2;
    const wc=winner==="Juni"?"#00FF88":"#FF6600";
    const wSheet=winner==="Juni"?"j_sheet":"p_sheet";
    const wPre=winner==="Juni"?"j":"p";
    const portrait=this.add.sprite(GW/2,GH/2-65,wSheet).setDisplaySize(120,120);
    if(this.anims.exists(wPre+"_idle"))portrait.play(wPre+"_idle");
    this.tweens.add({targets:portrait,scaleX:1.08,scaleY:1.08,yoyo:true,repeat:-1,duration:800});
    this.add.text(GW/2,GH/2+14,"SECTOR CLEARED",{fontFamily:"Press Start 2P",fontSize:"17px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+44,Match.winner+" WINS — "+winner.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"10px",color:wc}).setOrigin(0.5);
    const url1=winner==="Juni"?BOOK_LINKS.juni_en:BOOK_LINKS.pyro_en;
    const lore1=winner==="Juni"?"Enter if you dare; face Anubis in the sands of time.":"Born from the forge. His tusks run hotter than the mine walls.";
    const cta1=this.add.text(GW/2,GH/2+68,"★ "+lore1,{fontFamily:"Press Start 2P",fontSize:"6px",color:wc,align:"center",wordWrap:{width:GW-40}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta1.on("pointerdown",()=>window.open(url1,"_blank"));
    this.tweens.add({targets:cta1,alpha:0.5,duration:900,yoyo:true,repeat:-1});
    const cta2=this.add.text(GW/2,GH/2+96,winner==="Juni"?"📡 Also: Outbreak from the Stars →":"📗 Also: Juni the Immortal →",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#555"}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta2.on("pointerover",()=>cta2.setColor("#AAA"));cta2.on("pointerout",()=>cta2.setColor("#555"));
    cta2.on("pointerdown",()=>window.open(winner==="Juni"?BOOK_LINKS.outbreak_en:BOOK_LINKS.juni_en,"_blank"));
    this.add.text(GW/2,GH-26,"Do you want to test your luck again?",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#888"}).setOrigin(0.5);
    this.add.text(GW/2,GH-13,"ANY KEY / TAP = REMATCH    ESC = MENU",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#444"}).setOrigin(0.5);
    this.input.keyboard.on("keydown",e=>{
      if(e.key==="Escape")this.scene.start("BrawlerScene");
      else this.scene.start("BattleScene");
    });
    this.input.on("pointerdown",()=>this.scene.start("BattleScene"));
  }
}
