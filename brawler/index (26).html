<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NMN: MINE WARFARE — v1.4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:#050308;width:100%;height:100%;overflow:hidden;}
    #gc{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
    #mc{display:none;position:fixed;bottom:0;left:0;right:0;height:170px;pointer-events:none;z-index:999;}
    #mc.on{display:block;}
    .mb{
      position:absolute;width:58px;height:58px;border-radius:50%;
      border:3px solid #FFD700;background:rgba(5,3,8,0.88);
      color:#FFD700;font-size:11px;font-weight:bold;
      display:flex;align-items:center;justify-content:center;
      pointer-events:all;user-select:none;-webkit-user-select:none;
      font-family:"Press Start 2P",monospace;
      box-shadow:0 0 12px rgba(255,215,0,0.45);
    }
    #ml{left:18px;bottom:58px;} #mr{left:90px;bottom:58px;}
    #mj{left:54px;bottom:116px;} #ma{right:18px;bottom:110px;} #mf{right:84px;bottom:78px;}
  </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
  <div class="mb" id="ml">◀</div>
  <div class="mb" id="mr">▶</div>
  <div class="mb" id="mj">▲</div>
  <div class="mb" id="ma">🥊</div>
  <div class="mb" id="mf">⚡</div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════
//  NMN: MINE WARFARE v1.4
//  ARCHITECT NOTES FOR FUTURE CLAUDE/GEMINI/COPILOT INSTANCES:
//
//  PHYSICS ENGINE (from Copilot v1.4 — proven stable):
//  - mkSp() factory: unified sprite creation, setCollideWorldBounds(false)
//  - Melee/proj use physics.add.group().create(x,y,null) — invisible hitboxes
//  - Hitbox lifetime tracked via h.life += dt, destroyed after threshold
//  - NO world.pause() — removed entirely. Hit-stop proved unreliable.
//    Instead: 260ms stun flag locks input, velocity applies immediately.
//
//  RESPAWN CONTRACT (triple-check from Copilot — do not simplify):
//  - sp.setActive(true).setVisible(true)
//  - sp.body.setEnable(true)           ← wakes physics body
//  - sp.setPosition(spawnX, spawnY)    ← teleport AFTER body enabled
//  - sp.body.setVelocity(0,0)          ← kill momentum AFTER position set
//  - tweens.killTweensOf(sp)           ← kill any stuck alpha tween
//  This exact order prevents "Player Ghosting" (invisible active sprite).
//
//  KNOCKBACK FORMULA:
//  - kbScale = 1 + (dmg * 0.02)  (gentler ramp, less instant KO)
//  - vx = dir * 220 * kbScale
//  - vy = -220 * kbScale
//  At 0%: scale 1.0, At 100%: scale 3.0, At 150%: scale 4.0
//
//  CONVERSION LINKS (hard-coded, do not change):
//  - Juni/default: https://books2read.com/u/4EOxZ0
//  - Olydia/Outbreak: https://books2read.com/u/31NrLw
//  Both shown on ResultsScene regardless of winner (cross-pollination)
//
//  ASSET LOADING:
//  - All .jpg assets in same folder as index.html (/brawler/)
//  - ensureTex() generates canvas fallbacks — game never crashes
//  - Portrait keys: [name]_beta.jpg (lowercase, underscores)
// ═══════════════════════════════════════════════════════════════════

const GW=800, GH=450;
const BLAST={minX:-260,maxX:1060,minY:-280,maxY:820};
const SPAWN={p1:{x:220,y:GH-160},p2:{x:580,y:GH-160}};
const MP={l:false,r:false,j:false,a:false,f:false};

// Mobile wiring — runs immediately, before Phaser boots
(function(){
  const isTouch="ontouchstart" in window||navigator.maxTouchPoints>0;
  if(isTouch) document.getElementById("mc").classList.add("on");
  const bind=(id,key)=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener("touchstart",e=>{e.preventDefault();MP[key]=true;},{passive:false});
    el.addEventListener("touchend",  e=>{e.preventDefault();MP[key]=false;},{passive:false});
  };
  bind("ml","l");bind("mr","r");bind("mj","j");bind("ma","a");bind("mf","f");
})();

const ROSTER=[
  {name:"Juni",           free:true, frame:0,color:"#00FF88",lore:"Enter if you dare; face Anubis in the endless expanse of the sands of time.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Pyro",           free:true, frame:1,color:"#FF6600",lore:"Born from the forge. His tusks run hotter than the mine walls.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Glitch Elephant",free:true, frame:2,color:"#AA55FF",lore:"A signal corrupted mid-transmission. Exists in two places at once.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Static Lion",    free:true, frame:3,color:"#55AAFF",lore:"The roar that breaks frequencies. His mane is pure interference.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Olydia",         free:false,frame:4,color:"#9933CC",lore:"Transmission incoming; signal from the stars above: Respond Now.",url:"https://books2read.com/u/31NrLw"},
  {name:"Helios",         free:false,frame:5,color:"#FFD700",lore:"UNLOCK: Read the Legend.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Wanderer",       free:false,frame:6,color:"#336699",lore:"UNLOCK: Become a Patron.",url:"https://patreon.com/Lordminadeoro"},
  {name:"Orid",           free:false,frame:7,color:"#884422",lore:"UNLOCK: Read the Legend.",url:"https://books2read.com/u/4EOxZ0"},
  {name:"Notty",          free:false,frame:8,color:"#FF55AA",lore:"UNLOCK: Become a Patron.",url:"https://patreon.com/Lordminadeoro"},
  {name:"???",            free:false,frame:9,color:"#444444",lore:"UNLOCK: Enter the Mine.",url:"https://nonsensemedianetwork.com"}
];
const FREE_FOUR=ROSTER.filter(r=>r.free);
const STAGES=[
  {key:"mana_forest", label:"MANA FOREST", bgKey:"bg_deep_forest"},
  {key:"glitch_mines",label:"GLITCH MINES",bgKey:"forest_bg"}
];
const Match={p1:null,p2:null,stage:null,winner:null,mode:"solo"};

// ── SAFE TEXTURE FACTORY (never crash on missing asset) ──
function ensureTex(scene){
  // Backgrounds
  const mkBG=(key,c1,c2)=>{
    if(scene.textures.exists(key)) return;
    const c=scene.textures.createCanvas(key,GW,GH);
    const ctx=c.getContext();
    const g=ctx.createLinearGradient(0,0,0,GH);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fillRect(0,0,GW,GH);c.refresh();
  };
  mkBG("bg_deep_forest","#0a1a0a","#050308");
  mkBG("forest_bg","#0d0a1a","#050308");

  // Brawler spritesheet — 10 colored squares, 48px each
  if(!scene.textures.exists("brawlers")){
    const size=48;
    const cols=[0x00ff88,0xff6600,0xaa55ff,0x55aaff,0x9933cc,0xffd700,0x336699,0x884422,0xff55aa,0x444444];
    const g=scene.make.graphics({x:0,y:0,add:false});
    g.fillStyle(0x111111,1);g.fillRect(0,0,size*10,size);
    cols.forEach((c,i)=>{
      g.fillStyle(c,1);g.fillRect(i*size+2,2,size-4,size-4);
      g.lineStyle(2,0xFFD700,0.6);g.strokeRect(i*size+2,2,size-4,size-4);
    });
    g.generateTexture("brawlers",size*10,size);
    g.destroy();
  }

  // Signal lost fallback
  if(!scene.textures.exists("signal_lost")){
    const c=scene.textures.createCanvas("signal_lost",GW,GH);
    const ctx=c.getContext();
    ctx.fillStyle="#050308";ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle="#FF2222";ctx.font="bold 48px monospace";
    ctx.textAlign="center";ctx.fillText("SIGNAL LOST",GW/2,GH/2);c.refresh();
  }
}

// CRT flicker overlay
function addCRT(scene){
  const rt=scene.add.rectangle(GW/2,GH/2,GW,GH,0x000000,0.1).setScrollFactor(0).setDepth(9000);
  scene.tweens.add({targets:rt,alpha:{from:0.06,to:0.16},duration:280,yoyo:true,repeat:-1});
}

// Gold spark at hit point — no screen flash
function goldSpark(scene,x,y){
  const g=scene.add.graphics().setDepth(600);
  [0xFFD700,0xFF8800,0xFFFF88,0xFF5500].forEach((col,i)=>{
    const ang=Math.random()*Math.PI*2,len=5+Math.random()*16;
    g.fillStyle(col,1);
    g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,3+Math.random()*3,3);
  });
  for(let i=0;i<8;i++){
    const ang=Math.random()*Math.PI*2,len=4+Math.random()*14;
    g.fillStyle(0xFFD700,0.8);
    g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,2,2);
  }
  scene.tweens.add({targets:g,alpha:0,duration:200,onComplete:()=>g.destroy()});
}

// Arc slash visual — P1=fire, P2=lightning
function arcSlash(scene,x,y,dir,isP1){
  const g=scene.add.graphics().setDepth(580);
  const col=isP1?0xFF8800:0x00CCFF;
  const col2=isP1?0xFFFF00:0xAAFFFF;
  g.lineStyle(5,col,0.9);
  g.beginPath();
  g.arc(x+dir*36,y-8,26,Phaser.Math.DegToRad(-70),Phaser.Math.DegToRad(70),false);
  g.strokePath();
  g.lineStyle(2,col2,0.6);
  g.beginPath();
  g.arc(x+dir*36,y-8,18,Phaser.Math.DegToRad(-50),Phaser.Math.DegToRad(50),false);
  g.strokePath();
  // Scatter particles
  for(let i=0;i<7;i++){
    const ang=Phaser.Math.DegToRad(Phaser.Math.Between(-70,70));
    const r=Phaser.Math.Between(18,30);
    const px=x+dir*36+Math.cos(ang)*r, py=y-8+Math.sin(ang)*r;
    const dot=scene.add.rectangle(px,py,isP1?5:4,isP1?4:6,isP1?0xFF6600:0x00FFFF,0.9).setDepth(581);
    scene.tweens.add({targets:dot,x:px+dir*(Math.random()*18),y:py-(Math.random()*12),alpha:0,duration:isP1?170:110,onComplete:()=>dot.destroy()});
  }
  scene.tweens.add({targets:g,alpha:0,duration:100,onComplete:()=>g.destroy()});
}

// Portrait helper — use real asset or brawlers spritesheet frame
function getPortraitKey(scene,entry){
  const pk=entry.name.toLowerCase().replace(/ /g,"_")+"_beta";
  return scene.textures.exists(pk)?pk:null;
}

// ── UNIFIED SPRITE FACTORY (Copilot v1.4 pattern) ──
function mkSp(scene,x,y,entry){
  const pk=getPortraitKey(scene,entry);
  let sp;
  if(pk){
    sp=scene.physics.add.sprite(x,y,pk);
    sp.setDisplaySize(52,52);
  } else {
    sp=scene.physics.add.sprite(x,y,"brawlers");
    sp.setFrame(entry.frame||0);
    sp.setDisplaySize(48,48);
  }
  sp.setCollideWorldBounds(false);
  sp.body.setSize(30,40).setOffset((sp.width-30)/2, sp.height-40);
  sp.setBounce(0);
  sp.setDragX(500);
  sp.setDepth(10);
  return sp;
}

// ── START SCREEN ──────────────────────────────────────
class StartScreen extends Phaser.Scene{
  constructor(){super("StartScreen");}
  preload(){
    this.load.image("title_img","logo.jpg");
    this.load.image("bg_deep_forest","bg_deep_forest.jpg");
    this.load.image("forest_bg","forest_bg.jpg");
    this.load.image("signal_lost","signal_lost.jpg");
    this.load.spritesheet("brawlers_sheet","brawlers_master.jpg",{frameWidth:128,frameHeight:128});
    ["juni","pyro","olydia","helios","wanderer","orid"].forEach(n=>this.load.image(n+"_beta",n+"_beta.jpg"));
    this.load.on("loaderror",f=>console.warn("Fallback:",f.key));
  }
  create(){
    ensureTex(this);addCRT(this);
    const bgKey=this.textures.exists("bg_deep_forest")?"bg_deep_forest":"bg_deep_forest";
    this.add.image(GW/2,GH/2,bgKey).setDisplaySize(GW,GH).setAlpha(0.35);
    const scan=this.add.rectangle(GW/2,0,GW,2,0xFFD700,0.2).setDepth(1).setScrollFactor(0);
    this.tweens.add({targets:scan,y:GH,duration:2800,repeat:-1});
    if(this.textures.exists("title_img")&&this.textures.get("title_img").source[0].width>1)
      this.add.image(GW/2,GH/2-90,"title_img").setScale(0.42).setDepth(2);
    this.add.text(GW/2,GH/2-18,"NMN: MINE WARFARE",{fontFamily:"Press Start 2P",fontSize:"18px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5).setDepth(2);
    this.add.text(GW/2,GH/2+16,"v1.4",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#555"}).setOrigin(0.5).setDepth(2);
    const b=this.add.text(GW/2,GH/2+68,"PRESS ANY KEY / TAP TO START",{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700"}).setOrigin(0.5).setDepth(2);
    this.tweens.add({targets:b,alpha:0,duration:700,yoyo:true,repeat:-1});
    this.add.text(GW/2,GH-14,"nonsensemedianetwork.com  |  @LordOroNMN",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#333"}).setOrigin(0.5).setDepth(2);
    const go=()=>this.scene.start("BrawlerScene");
    this.input.keyboard.once("keydown",go);
    this.input.once("pointerdown",go);
  }
}

// ── ROSTER SCENE ──────────────────────────────────────
class BrawlerScene extends Phaser.Scene{
  constructor(){super("BrawlerScene");}
  create(){
    ensureTex(this);addCRT(this);
    Match.p1=null;Match.p2=null;Match.stage=null;Match.winner=null;Match.mode="solo";
    this.scoutIdx=-1;this.p1Done=false;this.p2Done=false;

    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    this.add.rectangle(0,0,GW,38,0x0a0a0a,0.92).setOrigin(0);
    this.add.text(GW/2,10,"SELECT BRAWLERS",{fontFamily:"Press Start 2P",fontSize:"11px",color:"#FFD700"}).setOrigin(0.5,0);

    // Mode toggle
    const soloBtn=this.add.text(GW/2-80,GH-56,"SOLO MISSION",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#050308",backgroundColor:"#FFD700",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    const coopBtn=this.add.text(GW/2+80,GH-56,"LOCAL CO-OP",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FFD700",backgroundColor:"#111",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    const setMode=m=>{
      Match.mode=m;
      soloBtn.setStyle({color:m==="solo"?"#050308":"#FFD700",backgroundColor:m==="solo"?"#FFD700":"#111"});
      coopBtn.setStyle({color:m==="coop"?"#050308":"#FFD700",backgroundColor:m==="coop"?"#FFD700":"#111"});
      this.intelTxt.setText(m==="solo"?"SOLO: Pick P1 — CPU will fight you.":"CO-OP: Scout once, select P1 then P2.").setColor("#FFD700");
    };
    soloBtn.on("pointerdown",()=>setMode("solo"));
    coopBtn.on("pointerdown",()=>setMode("coop"));

    this.add.rectangle(GW/2,56,GW-16,26,0x111).setOrigin(0.5);
    this.intelTxt=this.add.text(GW/2,56,"SOLO: Pick P1 — CPU will fight you.",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#FFD700",align:"center",wordWrap:{width:GW-28}}).setOrigin(0.5);
    this.p1Lbl=this.add.text(16,GH-36,"P1: ---",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#00FF88"});
    this.p2Lbl=this.add.text(GW-16,GH-36,"P2: ---",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FF5555"}).setOrigin(1,0);

    this.startBtn=this.add.text(GW/2,GH-18,"▶ START FORGE ◀",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#050308",backgroundColor:"#FFD700",padding:{x:10,y:4}}).setOrigin(0.5).setVisible(false).setInteractive({useHandCursor:true});
    this.startBtn.on("pointerdown",()=>this.scene.start("StageSelectScene"));

    const cols=5,cellW=150,cellH=82,sx=GW/2-(cols*cellW)/2+cellW/2,sy=80;
    ROSTER.forEach((entry,i)=>{
      const col=i%cols,row=Math.floor(i/cols),x=sx+col*cellW,y=sy+row*cellH+cellH/2;
      const bc=entry.free?0x00ff88:0x444444;
      const panel=this.add.rectangle(x,y,cellW-10,cellH-8,0x0d0d0d).setStrokeStyle(2,bc).setInteractive({useHandCursor:true});

      // Portrait or colored square
      const pk=getPortraitKey(this,entry);
      if(pk) this.add.image(x,y-14,pk).setDisplaySize(36,36);
      else {
        const sq=this.add.rectangle(x,y-14,34,34,parseInt(entry.color.replace("#","0x")),0.9);
        this.add.text(x,y-14,entry.frame+"",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#000"}).setOrigin(0.5);
      }
      this.add.text(x,y+18,entry.name,{fontFamily:"Press Start 2P",fontSize:"5px",color:entry.free?entry.color:"#555",align:"center",wordWrap:{width:cellW-14}}).setOrigin(0.5);
      if(!entry.free) this.add.text(x,y+30,"LOCKED",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#FF4444"}).setOrigin(0.5);

      panel.on("pointerover",()=>panel.setStrokeStyle(2,0xFFD700));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,bc));
      panel.on("pointerdown",()=>{
        if(!entry.free){
          if(this.scoutIdx===i){if(entry.url)window.open(entry.url,"_blank");}
          else{this.scoutIdx=i;this.intelTxt.setText("🔒 "+entry.name+": "+entry.lore).setColor("#FF8888");}
          return;
        }
        if(this.scoutIdx!==i){this.scoutIdx=i;this.intelTxt.setText("★ "+entry.name+"  "+entry.lore).setColor(entry.color);return;}
        if(!this.p1Done){
          Match.p1=entry;this.p1Done=true;
          this.p1Lbl.setText("P1: "+entry.name).setColor(entry.color);
          panel.setStrokeStyle(3,0x00ff88);this.scoutIdx=-1;
          if(Match.mode==="solo"){
            const cpu=Phaser.Utils.Array.GetRandom(FREE_FOUR.filter(r=>r!==entry));
            Match.p2=cpu;this.p2Done=true;
            this.p2Lbl.setText("CPU: "+cpu.name).setColor(cpu.color);
            this.intelTxt.setText("CPU: "+cpu.name+" — HIT START FORGE").setColor("#FF5555");
            this.startBtn.setVisible(true);
          } else {
            this.intelTxt.setText("P1 LOCKED — SCOUT P2 NOW").setColor("#00FF88");
          }
        } else if(!this.p2Done&&entry!==Match.p1){
          Match.p2=entry;this.p2Done=true;
          this.p2Lbl.setText("P2: "+entry.name).setColor(entry.color);
          panel.setStrokeStyle(3,0xFF5555);this.scoutIdx=-1;
          this.intelTxt.setText("BOTH READY — HIT START FORGE").setColor("#FFD700");
          this.startBtn.setVisible(true);
        }
      });
    });
  }
}

// ── STAGE SELECT ──────────────────────────────────────
class StageSelectScene extends Phaser.Scene{
  constructor(){super("StageSelectScene");}
  create(){
    ensureTex(this);addCRT(this);
    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    this.add.text(GW/2,20,"SELECT STAGE",{fontFamily:"Press Start 2P",fontSize:"12px",color:"#FFD700"}).setOrigin(0.5);
    STAGES.forEach((stage,i)=>{
      const x=GW/2+(i===0?-190:190),y=GH/2;
      const bgKey=this.textures.exists(stage.bgKey)?stage.bgKey:"bg_deep_forest";
      this.add.image(x,y,bgKey).setDisplaySize(320,160).setAlpha(0.55);
      const panel=this.add.rectangle(x,y,320,160,0x000000,0).setStrokeStyle(2,0xFFD700).setInteractive({useHandCursor:true});
      this.add.text(x,y-14,stage.label,{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700",stroke:"#000",strokeThickness:3}).setOrigin(0.5);
      this.add.text(x,y+12,i===0?"STABLE / VERDANT":"UNSTABLE / CORRUPTED",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#AAA"}).setOrigin(0.5);
      panel.on("pointerover",()=>panel.setStrokeStyle(3,0xFFFFFF));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,0xFFD700));
      panel.on("pointerdown",()=>{Match.stage=stage.key;this.scene.start("BattleScene");});
    });
  }
}

// ── BATTLE SCENE ──────────────────────────────────────
class BattleScene extends Phaser.Scene{
  constructor(){super("BattleScene");}

  create(){
    ensureTex(this);
    const stage=STAGES.find(s=>s.key===Match.stage)||STAGES[0];
    const bgKey=this.textures.exists(stage.bgKey)?stage.bgKey:"bg_deep_forest";

    // Gravity
    this.physics.world.gravity.y=700;

    // BG (fixed to camera)
    this.add.image(GW/2,GH/2,bgKey).setDisplaySize(GW*1.4,GH*1.4).setAlpha(0.55).setScrollFactor(0);
    this.add.image(GW/2,GH/2,bgKey).setDisplaySize(GW*1.05,GH*1.05).setAlpha(0.18).setScrollFactor(0).setTint(0x8899ff);
    addCRT(this);

    // Platforms
    this.platforms=this.physics.add.staticGroup();
    const mkP=(px,py,pw,ph=18,col=0x3a2a0a)=>{
      const p=this.add.rectangle(px,py,pw,ph,col);
      this.add.rectangle(px,py-ph/2-1,pw,3,0xFFD700,0.3);
      this.physics.add.existing(p,true);
      this.platforms.add(p);
      return p;
    };
    mkP(GW/2,GH-55,520,20);         // main stage
    mkP(170,GH-155,160);             // left shelf
    mkP(630,GH-155,160);             // right shelf
    mkP(GW/2,GH-240,180);            // top center

    // Players — using unified mkSp from Copilot pattern
    this.p1=mkSp(this,SPAWN.p1.x,SPAWN.p1.y,Match.p1||ROSTER[0]);
    this.p2=mkSp(this,SPAWN.p2.x,SPAWN.p2.y,Match.p2||ROSTER[1]);
    this.p2.setFlipX(true);

    this.physics.add.collider([this.p1,this.p2],this.platforms);

    // State
    this.S={
      p1Dmg:0,p2Dmg:0,
      p1Lives:3,p2Lives:3,
      p1Stun:false,p2Stun:false,
      p1Jumps:0,p2Jumps:0,
      p1AtkCD:false,p2AtkCD:false,
      hitStop:false,gameOver:false
    };

    // Hitbox groups (invisible — Copilot pattern)
    this.meleeGrp=this.physics.add.group();
    this.projGrp=this.physics.add.group();

    // Melee overlaps — attacker derived from hitbox owner tag
    this.physics.add.overlap(this.meleeGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2") return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,false);
    });
    this.physics.add.overlap(this.meleeGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1") return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,false);
    });
    this.physics.add.overlap(this.projGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2") return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,true);
    });
    this.physics.add.overlap(this.projGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1") return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,true);
    });

    // HUD
    this.buildHUD();
    this.refreshHUD();

    // Keys
    this.k1=this.input.keyboard.addKeys({
      left:Phaser.Input.Keyboard.KeyCodes.A,
      right:Phaser.Input.Keyboard.KeyCodes.D,
      up:Phaser.Input.Keyboard.KeyCodes.W,
      atk:Phaser.Input.Keyboard.KeyCodes.J,
      fire:Phaser.Input.Keyboard.KeyCodes.L
    });
    this.k2=this.input.keyboard.addKeys({
      left:Phaser.Input.Keyboard.KeyCodes.LEFT,
      right:Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:Phaser.Input.Keyboard.KeyCodes.UP,
      atk:Phaser.Input.Keyboard.KeyCodes.NUMPAD_ONE,
      fire:Phaser.Input.Keyboard.KeyCodes.NUMPAD_THREE
    });

    // Quick rematch
    this.input.keyboard.on("keydown-R",()=>{ if(!this.S.gameOver) this.scene.restart(); });
    this.add.text(GW/2,16,"R = QUICK REMATCH",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#444"}).setOrigin(0.5).setScrollFactor(0).setDepth(9999);

    // Camera
    this.camX=GW/2;
    this.targetZoom=1.0;
    this.cameras.main.centerOn(GW/2,GH/2);

    // Gamepad
    this.pad=null;
    this.input.gamepad.once("connected",p=>{this.pad=p;});
  }

  buildHUD(){
    const D=9999;
    const p1c=(Match.p1||ROSTER[0]).color||"#00FF88";
    const p2c=(Match.p2||ROSTER[1]).color||"#FF5555";
    this.add.rectangle(0,0,215,46,0x050308,0.9).setOrigin(0).setDepth(D).setScrollFactor(0);
    this.add.rectangle(GW,0,215,46,0x050308,0.9).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.add.text(10,5,(Match.p1||ROSTER[0]).name,{fontFamily:"Press Start 2P",fontSize:"7px",color:p1c}).setDepth(D).setScrollFactor(0);
    this.p1DT=this.add.text(10,17,"0%",{fontFamily:"Press Start 2P",fontSize:"14px",color:"#FFF"}).setDepth(D).setScrollFactor(0);
    this.p1HT=this.add.text(10,35,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FF4444"}).setDepth(D).setScrollFactor(0);
    const p2label=Match.mode==="solo"?"CPU: "+(Match.p2||ROSTER[1]).name:(Match.p2||ROSTER[1]).name;
    this.add.text(GW-10,5,p2label,{fontFamily:"Press Start 2P",fontSize:"7px",color:p2c}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.p2DT=this.add.text(GW-10,17,"0%",{fontFamily:"Press Start 2P",fontSize:"14px",color:"#FFF"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.p2HT=this.add.text(GW-10,35,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FF4444"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.add.text(GW/2,6,(Match.stage||"STAGE").toUpperCase().replace("_"," "),{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FFD700"}).setOrigin(0.5,0).setDepth(D).setScrollFactor(0);
  }

  refreshHUD(){
    const S=this.S;
    this.p1DT.setText(S.p1Dmg+"%");
    this.p2DT.setText(S.p2Dmg+"%");
    const clr=p=>p>80?"#FF4444":p>40?"#FFAA00":"#FFFFFF";
    this.p1DT.setColor(clr(S.p1Dmg));
    this.p2DT.setColor(clr(S.p2Dmg));
    const h=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,3-n));
    this.p1HT.setText(h(S.p1Lives));
    this.p2HT.setText(h(S.p2Lives));
  }

  // ── RESPAWN CONTRACT (Copilot triple-check + tween kill) ──
  respawnOrEnd(id){
    const S=this.S;
    if(S.gameOver) return;
    const isP1=id==="p1";
    const sp=isP1?this.p1:this.p2;
    const spX=isP1?SPAWN.p1.x:SPAWN.p2.x;
    const spY=isP1?SPAWN.p1.y:SPAWN.p2.y;

    if(isP1) S.p1Lives--; else S.p2Lives--;
    const lives=isP1?S.p1Lives:S.p2Lives;

    this.cameras.main.shake(260,0.015);
    this.refreshHUD();

    if(lives<=0){
      S.gameOver=true;
      Match.winner=isP1?"P2":"P1";
      // Signal lost overlay
      const sl=this.textures.exists("signal_lost")
        ?this.add.image(GW/2,GH/2,"signal_lost").setDisplaySize(GW,GH).setAlpha(0).setDepth(8000).setScrollFactor(0)
        :this.add.rectangle(GW/2,GH/2,GW,GH,0x050308,0).setDepth(8000).setScrollFactor(0);
      this.tweens.add({targets:sl,alpha:0.88,duration:400});
      this.add.text(GW/2,GH/2-24,"SIGNAL LOST",{fontFamily:"Press Start 2P",fontSize:"22px",color:"#FF2222",stroke:"#000",strokeThickness:4}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
      this.add.text(GW/2,GH/2+14,Match.winner+" WINS",{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700"}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
      this.time.delayedCall(1800,()=>this.scene.start("ResultsScene"));
      return;
    }

    // RESPAWN — Copilot triple-check, P1 and P2 identical path
    if(isP1){S.p1Dmg=0;S.p1Stun=false;S.p1AtkCD=false;S.p1Jumps=0;}
    else    {S.p2Dmg=0;S.p2Stun=false;S.p2AtkCD=false;S.p2Jumps=0;}

    this.tweens.killTweensOf(sp);        // kill any stuck alpha/tint tween
    sp.setActive(true).setVisible(true); // 1. activate
    sp.body.setEnable(true);             // 2. wake physics body
    sp.setPosition(spX,spY);            // 3. teleport (body awake first)
    sp.body.setVelocity(0,0);           // 4. kill momentum
    sp.body.setAcceleration(0,0);
    sp.setAlpha(1);
    sp.clearTint();

    // Invincibility flash
    this.tweens.add({targets:sp,alpha:0.3,duration:110,yoyo:true,repeat:7,
      onComplete:()=>{sp.setActive(true);sp.setVisible(true);sp.setAlpha(1);}
    });

    // Float-up label
    const lbl=this.add.text(spX,spY-46,(isP1?"P1":"P2")+" BACK",
      {fontFamily:"Press Start 2P",fontSize:"8px",color:isP1?"#00FF88":"#FF5555"}).setOrigin(0.5).setDepth(500);
    this.tweens.add({targets:lbl,y:spY-86,alpha:0,duration:860,onComplete:()=>lbl.destroy()});

    this.refreshHUD();
  }

  // HIT RESOLUTION — no world.pause, immediate velocity
  resolveHit(atkId,tgtId,hit,isProjectile){
    const S=this.S;
    if(S.gameOver||S.hitStop||!hit||!hit.active) return;
    hit.destroy();
    const tgt=tgtId==="p2"?this.p2:this.p1;
    const atk=atkId==="p1"?this.p1:this.p2;
    if(!tgt.active||!tgt.body) return;
    const power=isProjectile?10:8;
    if(tgtId==="p2") S.p2Dmg+=power; else S.p1Dmg+=power;
    const dmg=tgtId==="p2"?S.p2Dmg:S.p1Dmg;
    const kbScale=Math.min(5,1+(dmg*0.025));
    const dir=tgt.x>=atk.x?1:-1;
    tgt.body.setVelocity(dir*240*kbScale,-210*kbScale);
    this.cameras.main.shake(isProjectile?40:65,0.008);
    if(tgtId==="p2") S.p2Stun=true; else S.p1Stun=true;
    this.time.delayedCall(280,()=>{
      if(!S.gameOver){ if(tgtId==="p2") S.p2Stun=false; else S.p1Stun=false; }
    });
    this.tweens.add({targets:tgt,alpha:{from:0.5,to:1},duration:150});
    goldSpark(this,tgt.x,tgt.y-20);
    this.refreshHUD();
  }

  // Melee — arc visual + invisible physics hitbox
  spawnMelee(id){
    const sp=id==="p1"?this.p1:this.p2;
    if(!sp.active||!sp.body) return;
    const dir=sp.flipX?-1:1;
    arcSlash(this,sp.x,sp.y,dir,id==="p1");
    // Use rectangle+physics instead of group.create(null) for stable overlap arg order
    const hit=this.add.rectangle(sp.x+dir*32,sp.y-6,30,28,0xFFD700,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false).setImmovable(true);
    hit.setData("owner",id);
    hit.life=0;
    this.meleeGrp.add(hit);
  }

  // Projectile — fire (P1) or lightning (P2)
  spawnProjectile(id){
    const sp=id==="p1"?this.p1:this.p2;
    if(!sp.active||!sp.body) return;
    const dir=sp.flipX?-1:1;
    const isP1=id==="p1";
    const col=isP1?0xFF5500:0x00CCFF;
    const col2=isP1?0xFFAA00:0xFFFFFF;

    // Visual projectile rect
    const vis=this.add.rectangle(sp.x+dir*36,sp.y-5,isP1?20:16,isP1?9:11,col,0.95).setDepth(50);
    this.tweens.add({targets:vis,fillColor:{from:col,to:col2},duration:isP1?55:28,yoyo:true,repeat:-1});

    // Use rectangle+physics for stable overlap arg order
    const hit=this.add.rectangle(sp.x+dir*36,sp.y-5,18,18,0xFFFFFF,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false).setImmovable(false);
    hit.body.setVelocityX(dir*(isP1?560:580));
    hit.setData("owner",id);
    hit.setData("vis",vis);
    hit.life=0;
    this.projGrp.add(hit);

    // Dense vapor trail
    let tc=0;
    const trail=this.time.addEvent({delay:22,repeat:20,callback:()=>{
      if(!hit.active){if(vis.active)vis.destroy();return;}
      vis.setPosition(hit.x,hit.y);
      const dot=this.add.rectangle(hit.x-dir*(6+tc*1.2),hit.y+(Math.random()*6-3),
        isP1?7:5,isP1?5:7,isP1?0xFF6600:0x00AAFF,0.8).setDepth(49);
      tc++;
      this.tweens.add({targets:dot,alpha:0,scaleX:0,scaleY:0,duration:isP1?200:150,onComplete:()=>dot.destroy()});
    }});
  }

  // ── CPU AI ──
  runCPU(dt){
    const S=this.S,sp=this.p2;
    if(!sp.active||S.p2Stun||!sp.body) return;
    if(sp.body.blocked.down) S.p2Jumps=0;
    const dx=this.p1.x-sp.x,absX=Math.abs(dx);
    if(absX>40){sp.body.setVelocityX(dx>0?190:-190);sp.setFlipX(dx<0);}
    else sp.body.setVelocityX(sp.body.velocity.x*0.6);
    if(absX>60&&S.p2Jumps<2&&Math.random()<0.022){sp.body.setVelocityY(-380);S.p2Jumps++;}
    if(absX<70&&Math.random()<0.10&&!S.p2AtkCD){S.p2AtkCD=true;this.spawnMelee("p2");this.time.delayedCall(450,()=>S.p2AtkCD=false);}
    if(absX>90&&absX<280&&Math.random()<0.035&&!S.p2AtkCD){S.p2AtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(350,()=>S.p2AtkCD=false);}
  }

  // ── P1 INPUT ──
  moveP1(){
    const S=this.S,sp=this.p1;
    if(!sp.active||!sp.body||S.hitStop) return;
    if(sp.body.blocked.down) S.p1Jumps=0;
    if(!S.p1Stun){
      const gL=this.k1.left.isDown||MP.l,gR=this.k1.right.isDown||MP.r;
      if(gL){sp.body.setVelocityX(-210);sp.setFlipX(true);}
      else if(gR){sp.body.setVelocityX(210);sp.setFlipX(false);}
      else sp.body.setVelocityX(sp.body.velocity.x*0.70);
      if((Phaser.Input.Keyboard.JustDown(this.k1.up)||MP.j)&&S.p1Jumps<2){sp.body.setVelocityY(-390);S.p1Jumps++;MP.j=false;}
      if((Phaser.Input.Keyboard.JustDown(this.k1.atk)||MP.a)&&!S.p1AtkCD){S.p1AtkCD=true;this.spawnMelee("p1");this.time.delayedCall(210,()=>S.p1AtkCD=false);MP.a=false;}
      if((Phaser.Input.Keyboard.JustDown(this.k1.fire)||MP.f)&&!S.p1AtkCD){S.p1AtkCD=true;this.spawnProjectile("p1");this.time.delayedCall(290,()=>S.p1AtkCD=false);MP.f=false;}
    }
  }

  // ── P2 INPUT (local co-op) ──
  moveP2(){
    const S=this.S,sp=this.p2;
    if(!sp.active||!sp.body||S.hitStop) return;
    if(sp.body.blocked.down) S.p2Jumps=0;
    if(!S.p2Stun){
      if(this.k2.left.isDown){sp.body.setVelocityX(-210);sp.setFlipX(true);}
      else if(this.k2.right.isDown){sp.body.setVelocityX(210);sp.setFlipX(false);}
      else sp.body.setVelocityX(sp.body.velocity.x*0.70);
      if(Phaser.Input.Keyboard.JustDown(this.k2.up)&&S.p2Jumps<2){sp.body.setVelocityY(-390);S.p2Jumps++;}
      if(Phaser.Input.Keyboard.JustDown(this.k2.atk)&&!S.p2AtkCD){S.p2AtkCD=true;this.spawnMelee("p2");this.time.delayedCall(210,()=>S.p2AtkCD=false);}
      if(Phaser.Input.Keyboard.JustDown(this.k2.fire)&&!S.p2AtkCD){S.p2AtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(290,()=>S.p2AtkCD=false);}
      if(this.pad){
        const ax=this.pad.axes.length>0?this.pad.axes[0].getValue():0;
        if(Math.abs(ax)>0.2) sp.body.setVelocityX(ax*252);
        if(this.pad.buttons[0]?.pressed&&S.p2Jumps<2){sp.body.setVelocityY(-390);S.p2Jumps++;}
      }
    }
  }

  // ── CAMERA ──
  updateCamera(){
    const p1x=this.p1.active?this.p1.x:GW/2;
    const p2x=this.p2.active?this.p2.x:GW/2;
    const mx=(p1x+p2x)/2;
    this.camX+=(mx-this.camX)*0.08;
    const dist=Math.abs(p1x-p2x);
    const raw=dist<180?1.18:dist>420?0.86:1.0;
    this.targetZoom=Phaser.Math.Clamp(raw,0.82,1.22);
    this.cameras.main.zoom+=(this.targetZoom-this.cameras.main.zoom)*0.04;
    this.cameras.main.centerOn(this.camX,GH/2);
  }

  update(time,dt){
    const S=this.S;
    if(S.gameOver) return;

    // Decay hitbox lifetimes (Copilot pattern — clean and reliable)
    this.meleeGrp.children.iterate(h=>{
      if(!h) return;
      h.life+=dt;
      if(h.life>200) h.destroy();
    });
    this.projGrp.children.iterate(h=>{
      if(!h) return;
      h.life+=dt;
      // Destroy visual twin when hitbox dies
      if(h.life>1500){
        const vis=h.getData("vis");
        if(vis&&vis.active) vis.destroy();
        h.destroy();
      }
      // Destroy when off screen
      if(h.x<BLAST.minX||h.x>BLAST.maxX){
        const vis=h.getData("vis");
        if(vis&&vis.active) vis.destroy();
        h.destroy();
      }
    });

    this.moveP1();
    if(Match.mode==="solo") this.runCPU(dt); else this.moveP2();

    // Blast zone — identical check for both players
    [["p1",this.p1],["p2",this.p2]].forEach(([id,sp])=>{
      if(!sp.active) return;
      if(sp.x<BLAST.minX||sp.x>BLAST.maxX||sp.y<BLAST.minY||sp.y>BLAST.maxY){
        this.respawnOrEnd(id);
      }
    });

    this.updateCamera();
  }
}

// ── RESULTS SCENE ──────────────────────────────────────
class ResultsScene extends Phaser.Scene{
  constructor(){super("ResultsScene");}
  create(){
    ensureTex(this);addCRT(this);
    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    const winner=Match.winner||"P1";
    const wcfg=winner==="P1"?Match.p1:Match.p2;

    // Winner portrait
    if(wcfg){
      const pk=getPortraitKey(this,wcfg);
      if(pk){
        const img=this.add.image(GW/2,GH/2-68,pk).setDisplaySize(110,110).setAlpha(0.9);
        this.tweens.add({targets:img,scaleX:1.07,scaleY:1.07,yoyo:true,repeat:-1,duration:900});
      } else {
        const sq=this.add.rectangle(GW/2,GH/2-68,90,90,parseInt(wcfg.color.replace("#","0x")),0.9);
        this.tweens.add({targets:sq,scaleX:1.08,scaleY:1.08,yoyo:true,repeat:-1,duration:900});
      }
    }

    this.add.text(GW/2,GH/2+8,"SECTOR CLEARED",{fontFamily:"Press Start 2P",fontSize:"18px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+40,winner+" WINS",{fontFamily:"Press Start 2P",fontSize:"12px",color:wcfg?.color||"#FFF"}).setOrigin(0.5);

    // PRIMARY CTA — based on winner
    const isOlydia=wcfg?.name==="Olydia";
    const lore1=isOlydia?"Transmission incoming; signal from the stars above: Respond Now.":"Enter if you dare; face Anubis in the endless expanse of the sands of time.";
    const url1=isOlydia?"https://books2read.com/u/31NrLw":"https://books2read.com/u/4EOxZ0";
    const cta1=this.add.text(GW/2,GH/2+64,"★ "+lore1,{fontFamily:"Press Start 2P",fontSize:"6px",color:isOlydia?"#AA66FF":"#00FF88",align:"center",wordWrap:{width:GW-40}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta1.on("pointerdown",()=>window.open(url1,"_blank"));
    this.tweens.add({targets:cta1,alpha:0.5,duration:1000,yoyo:true,repeat:-1});

    // SECONDARY CTA — always the other book (cross-pollination)
    const url2=isOlydia?"https://books2read.com/u/4EOxZ0":"https://books2read.com/u/31NrLw";
    const lbl2=isOlydia?"📖 Also: Juni the Immortal →":"📡 Also: Outbreak from the Stars →";
    const cta2=this.add.text(GW/2,GH/2+90,lbl2,{fontFamily:"Press Start 2P",fontSize:"6px",color:"#555"}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta2.on("pointerover",()=>cta2.setColor("#AAA"));cta2.on("pointerout",()=>cta2.setColor("#555"));
    cta2.on("pointerdown",()=>window.open(url2,"_blank"));

    this.add.text(GW/2,GH-28,"Do you want to test your luck again?",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#888"}).setOrigin(0.5);
    const again=this.add.text(GW/2,GH-14,"ANY KEY / TAP = REMATCH    ESC = TITLE",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#444"}).setOrigin(0.5);

    this.input.keyboard.on("keydown",e=>{
      if(e.key==="Escape"){Match.p1=null;Match.p2=null;Match.stage=null;Match.winner=null;this.scene.start("StartScreen");}
      else this.scene.start("BattleScene");
    });
    this.input.on("pointerdown",()=>this.scene.start("BattleScene"));
  }
}

// ── BOOT ──────────────────────────────────────────────
new Phaser.Game({
  type:Phaser.AUTO,
  width:GW,height:GH,
  parent:"gc",
  backgroundColor:"#050308",
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},
  scene:[StartScreen,BrawlerScene,StageSelectScene,BattleScene,ResultsScene],
  input:{gamepad:true}
});
