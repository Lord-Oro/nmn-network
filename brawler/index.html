<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS V11.3 - ZERO FRICTION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb { position: absolute; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #FFD700; background: rgba(0,0,0,0.8); color: #FFD700; display: flex; align-items: center; justify-content: center; pointer-events: all; font-weight: bold; font-size: 20px; }
        #ml{left:20px;bottom:10px;} #mr{left:90px;bottom:10px;} #mj{left:55px;bottom:80px;}
        #ma{right:20px;bottom:80px;} #ms{right:20px;bottom:10px;} #mf{right:90px;bottom:10px;}
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div>
    <div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const Match = { p1: "Juni", p2: "Pyro", p1Pct: 0, p2Pct: 0, p1Lives: 3, p2Lives: 3, map: "bg_eyes" };
const MP = { l:false, r:false, j:false, a:false, s:false, f:false };

(function(){
    const bind = (id, k) => { 
        const el = document.getElementById(id); 
        if(el){ 
            el.onpointerdown = (e) => { e.preventDefault(); MP[k]=true; }; 
            el.onpointerup = (e) => { e.preventDefault(); MP[k]=false; }; 
        } 
    };
    bind("ml","l"); bind("mr","r"); bind("mj","j"); bind("ma","a"); bind("ms","s"); bind("mf","f");
})();

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("promo", "brawler_promo.jpg");
        this.load.image("bg_eyes", "oros_game_eyes.jpg");
        this.load.image("hub_bg", "logo.jpg");
        this.load.image("link_tree", "link_tree.jpg");
        this.load.spritesheet("j_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("p_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
        ["juni_en","outbreak_en","tabbies_en","pyro_en"].forEach(b => this.load.image(b, b+".jpeg"));
        ["wanderer","olydia","orid","helios"].forEach(n => this.load.image(n+"_beta", n+"_beta.jpg"));
    }
    create() {
        this.add.image(GW/2, GH/2, "promo").setDisplaySize(GW, GH);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg_eyes").setDisplaySize(GW, GH).setAlpha(0.5);
        this.add.text(GW/2, 40, "SELECT CHARACTER", { fontSize:'28px', fill:'#FFD700' }).setOrigin(0.5);
        
        const roster = [
            { name: "Juni", img: "j_sheet", active: true },
            { name: "Pyro", img: "p_sheet", active: true },
            { name: "Wanderer", img: "wanderer_beta", active: false },
            { name: "Olydia", img: "olydia_beta", active: false },
            { name: "Orid", img: "orid_beta", active: false },
            { name: "Helios", img: "helios_beta", active: false }
        ];

        roster.forEach((c, i) => {
            let x = 150 + (i%3)*250, y = 160 + Math.floor(i/3)*150;
            let btn = this.add.image(x, y, c.active ? c.img : c.img, 0).setDisplaySize(110, 110).setInteractive();
            if(!c.active) btn.setTint(0x444444);
            else btn.on("pointerdown", () => { 
                Match.p1 = c.name; 
                Match.p2 = (c.name === "Juni" ? "Pyro" : "Juni");
                this.scene.start("BattleScene"); 
            });
            this.add.text(x, y+65, c.name.toUpperCase(), { fontSize:'14px', fill: c.active ? '#FFD700' : '#F00' }).setOrigin(0.5);
        });

        this.add.text(GW/2, GH-30, "HERO'S ORIGIN HUB", { backgroundColor:'#000', padding:5 }).setOrigin(0.5).setInteractive().on("pointerdown", () => this.scene.start("OriginHub"));
    }
}

class OriginHub extends Phaser.Scene {
    constructor() { super("OriginHub"); }
    create() {
        this.add.image(GW/2, GH/2, "hub_bg").setDisplaySize(GW, GH).setAlpha(0.2);
        this.add.text(GW/2, 40, "HERO'S ORIGIN HUB", { fontSize: '28px', fill: '#FFD700' }).setOrigin(0.5);
        const bks = ["juni_en", "outbreak_en", "tabbies_en", "pyro_en"];
        bks.forEach((b, i) => { this.add.image(120 + (i*180), 200, b).setDisplaySize(140, 220).setInteractive().on("pointerdown", () => window.open("https://linktr.ee/NMN_LordOro", "_blank")); });
        this.add.image(GW-80, GH-50, "link_tree").setDisplaySize(100, 60).setInteractive().on("pointerdown", () => window.open("https://linktr.ee/NMN_LordOro", "_blank"));
        this.add.text(40, 40, "◀ BACK").setInteractive().on("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg_eyes").setDisplaySize(GW, GH).setAlpha(0.3);
        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-50, 400, 20, 0x3a2a0a));
        this.platforms.add(this.add.rectangle(150, GH-180, 200, 20, 0x3a2a0a));
        this.platforms.add(this.add.rectangle(650, GH-180, 200, 20, 0x3a2a0a));

        this.anims.create({ key: 'j_idle', frames: this.anims.generateFrameNumbers('j_sheet', { start: 0, end: 3 }), frameRate: 6, repeat: -1 });
        this.anims.create({ key: 'p_idle', frames: this.anims.generateFrameNumbers('p_sheet', { start: 0, end: 3 }), frameRate: 8, repeat: -1 });

        // INSTANT SPAWN & CONTROLLABLE
        this.p1 = this.physics.add.sprite(200, 100, Match.p1 === "Juni" ? "j_sheet" : "p_sheet").setFlipX(false);
        this.p2 = this.physics.add.sprite(600, 100, Match.p1 === "Juni" ? "p_sheet" : "j_sheet").setFlipX(true);
        this.p1.body.setAllowGravity(true); this.p2.body.setAllowGravity(true);

        this.bullets = this.physics.add.group();
        this.h1 = this.add.text(20, 20, `${Match.p1.toUpperCase()}: 0%`, { fontSize:'20px', fill:'#0F0' });
        this.h2 = this.add.text(GW-200, 20, `${Match.p2.toUpperCase()}: 0%`, { fontSize:'20px', fill:'#F00' });
        
        this.keys = this.input.keyboard.addKeys({ W:'W', A:'A', D:'D', J:'J', K:'K', L:'L', SEMI:'SEMICOLON' });
        this.physics.add.collider([this.p1, this.p2], this.platforms);
    }

    handleHit(num, dmg) {
        Match[num === 2 ? 'p2Pct' : 'p1Pct'] += dmg;
        const v = (num === 2) ? this.p2 : this.p1;
        v.setVelocityX((this.p1.x < this.p2.x ? 1 : -1) * (150 + Match[num === 2 ? 'p2Pct' : 'p1Pct']));
        v.setTint(0xff0000); this.time.delayedCall(200, () => v.clearTint());
        this.h1.setText(`${Match.p1.toUpperCase()}: ${Match.p1Pct}%`);
        this.h2.setText(`${Match.p2.toUpperCase()}: ${Match.p2Pct}%`);
    }

    update() {
        if (this.p1.y > GH + 100) { this.p1.setPosition(200, 0); Match.p1Pct = 0; }
        
        const p = this.p1, ks = this.keys, pre = Match.p1 === "Juni" ? 'j' : 'p';

        // COMBAT
        if (ks.L.isDown || MP.s) { p.setVelocityX(0).setFrame(18); return; }
        if (Phaser.Input.Keyboard.JustDown(ks.J) || MP.a) { 
            p.setFrame(12); 
            if (Phaser.Math.Distance.Between(p.x, p.y, this.p2.x, this.p2.y) < 80) this.handleHit(2, 5); 
        }
        if (Phaser.Input.Keyboard.JustDown(ks.K) || MP.f) {
            let b = this.bullets.create(p.x, p.y, pre + "_sheet", 10);
            b.body.setAllowGravity(false); b.setVelocityX(p.flipX ? -750 : 750);
        }

        // MOVEMENT
        if (ks.A.isDown || MP.l) { p.setVelocityX(-260).setFlipX(true).play(pre + '_idle', true); }
        else if (ks.D.isDown || MP.r) { p.setVelocityX(260).setFlipX(false).play(pre + '_idle', true); }
        else { p.setVelocityX(0).play(pre + '_idle', true); }
        if ((Phaser.Input.Keyboard.JustDown(ks.W) || MP.j) && p.body.blocked.down) p.setVelocityY(-600);
        
        this.p2.play(Match.p1 === "Juni" ? 'p_idle' : 'j_idle', true);
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    physics: { default: "arcade", arcade: { gravity: { y: 1400 } } },
    scene: [StartScreen, BrawlerScene, OriginHub, BattleScene]
});
</script>
</body>
</html>
