<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NMN: THE FORGE BETA V1.0</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-P5WL9XNDY8');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
    #game-wrapper { position: relative; width: 800px; height: 400px; }
    canvas { border: 2px solid #FFD700; image-rendering: pixelated; max-width: 100%; height: auto; }
    #victory-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    #victory-overlay.active { display: flex; }
    .btn { font-family: 'Press Start 2P', cursive; padding: 15px; border: none; cursor: pointer; margin-top: 10px; width: 280px; font-size: 10px; }
  </style>
</head>
<body>
<div id="game-wrapper">
  <div id="phaser-game">
    <div id="victory-overlay">
      <h2 style="font-family:'Press Start 2P'; color:#FFD700; font-size: 16px; text-align:center;">SECTOR CLEARED</h2>
      <button class="btn" style="background:#FFD700;" onclick="window.open('https://books2read.com/u/4EOxZ0', '_blank')">📖 READ THE LEGEND</button>
      <button class="btn" style="background:#333; color:#FFD700;" onclick="location.reload()">↺ RESTART</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
class BrawlerScene extends Phaser.Scene {
  constructor() { super('BrawlerScene'); }

  preload() {
    console.log("Preloading Assets...");
    this.load.image('bg', 'forest_bg.jpg');
    this.load.image('logo', 'logo.jpg');
    
    // THE PLUG: Using 'juni_beta.jpg' as a 128x128 placeholder sheet.
    // We will slice it as 1 frame per image for now.
    this.load.spritesheet('brawlers_master', 'juni_beta.jpg', { 
        frameWidth: 128, 
        frameHeight: 128 
    });
  }

  create() {
    // Background and initial state
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400).setAlpha(0.3);
    this.state = 'ROSTER';
    this.pHealth = 100; this.eHealth = 100;

    // Roster UI (Simplest Free Four Setup)
    const freeFour = ['JUNI', 'PYRO', 'GLITCH', 'STATIC'];
    this.add.rectangle(400, 200, 750, 150, 0x1a1510).setStrokeStyle(2, 0xFFD700);
    this.add.text(400, 150, 'SELECT YOUR BRAWLER', { font: '14px "Press Start 2P"', fill: '#FFD700' }).setOrigin(0.5);

    this.rosterGroup = this.add.group();
    freeFour.forEach((name, i) => {
      let x = 150 + (i * 170);
      let box = this.add.rectangle(x, 230, 140, 60, 0x0a0a0a).setStrokeStyle(1, 0xFFD700).setInteractive();
      let nameTxt = this.add.text(x, 230, name, { font: '12px Courier', fill: '#FFF' }).setOrigin(0.5);
      
      box.on('pointerdown', () => this.startBattle(i));
      this.rosterGroup.addMultiple([box, nameTxt]);
    });

    // Control setup
    this.cursors = this.input.keyboard.createCursorKeys();
    this.space = this.input.keyboard.addKey('SPACE');
  }

  startBattle(idx) {
    this.state = 'BATTLE';
    this.rosterGroup.clear(true, true);

    // Blast Zone Definition: Rect( -100, -100, 1000, 600)
    // Center Command: Phaser.Geom.Rectangle is ready to use.
    this.blastZoneBounds = new Phaser.Geom.Rectangle(-100, -100, 1000, 600);

    // Spawn player and enemy on two legs from the juni_beta.jpg sheet
    this.player = this.physics.add.sprite(200, 300, 'brawlers_master', 0);
    this.player.setOrigin(0.5, 1).setDisplaySize(96, 96).setCollideWorldBounds(true);
    // Setting bipedal movement with no animation loop for Beta
    this.player.body.setAllowGravity(true);

    this.enemy = this.physics.add.sprite(600, 300, 'brawlers_master', 0);
    this.enemy.setOrigin(0.5, 1).setDisplaySize(96, 96).setCollideWorldBounds(true).setTint(0xffaaaa);
    this.enemy.body.setAllowGravity(true);

    // Setting up the arena
    this.add.rectangle(400, 395, 800, 10, 0x000).setAlpha(0); // Ground (invisible)
    const platform = this.add.rectangle(400, 390, 600, 20, 0xFFD700);
    this.physics.add.existing(platform, true);
    this.physics.add.collider([this.player, this.enemy], platform);

    this.input.keyboard.on('keydown-SPACE', () => this.executeAttack());
  }

  executeAttack() {
    if (this.state !== 'BATTLE') return;
    // Basic melee logic: when P1 hits P2, apply knockback multiplier based on health
    let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.enemy.x, this.enemy.y);
    if (dist < 100) {
        // Multiplier grows as enemy "health" (eHealth) decreases (e.g., starts at 1x, grows to 3x)
        const knockbackMultiplier = 1 + (100 - this.eHealth) / 20; 
        const velocityX = dist > 0 ? 500 * knockbackMultiplier : -500 * knockbackMultiplier;
        
        this.enemy.setVelocity(velocityX, -300 * knockbackMultiplier);
        this.cameras.main.shake(200, 0.01);
        this.eHealth -= 10;
        console.log(`P2 % Damage: ${100 - this.eHealth}%`);
    }
  }

  update() {
    if (this.state !== 'BATTLE') return;

    // Center Command: Input handling for independent movement is ready.
    this.player.setVelocityX(0);
    if (this.cursors.left.isDown) this.player.setVelocityX(-250);
    if (this.cursors.right.isDown) this.player.setVelocityX(250);
    if (Phaser.Input.Keyboard.JustDown(this.cursors.up) && this.player.body.blocked.down) this.player.setVelocityY(-650);

    // AI Aggro logic (keep enemy moving toward player)
    const aiSpeed = 150;
    if (this.enemy.x < this.player.x) this.enemy.setVelocityX(aiSpeed);
    else this.enemy.setVelocityX(-aiSpeed);

    // The Blast Zone Check (Data Log v1.0 standard)
    if (!this.blastZoneBounds.contains(this.player.x, this.player.y)) this.triggerKO('PLAYER 1');
    if (!this.blastZoneBounds.contains(this.enemy.x, this.enemy.y)) this.triggerKO('PLAYER 2 (ENEMY)');
  }

  triggerKO(label) {
    this.state = 'KO';
    console.log(`KO! ${label} has been blasted.`);
    this.cameras.main.fade(500, 0, 0, 0);
    this.time.delayedCall(1000, () => this.scene.restart());
  }
}

const config = { type: Phaser.AUTO, width: 800, height: 400, parent: 'phaser-game', scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, physics: { default: 'arcade', arcade: { gravity: { y: 1500 } } }, scene: BrawlerScene };
new Phaser.Game(config);
</script>
</body>
</html>
