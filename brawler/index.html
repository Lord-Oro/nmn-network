<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NMN Brawler | Elephant Beta</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #070605; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
    </style>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 400,
    physics: { default: 'arcade', arcade: { gravity: { y: 1200 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, enemy, cursors, spaceKey;
let p1Health = 100, e1Health = 100;
let p1HealthBar, e1HealthBar;

function preload() {
    this.load.spritesheet('elephant', 'hero-sheet.png', { 
        frameWidth: 28, 
        frameHeight: 52, 
        margin: 1, 
        spacing: 2 
    });
}

function create() {
    // 1. The World
    this.add.rectangle(400, 200, 800, 400, 0x070605); // Simple Background
    const ground = this.add.rectangle(400, 390, 800, 20, 0x1a1510);
    this.physics.add.existing(ground, true);

    // 2. Groups
    this.projectiles = this.physics.add.group();
    this.enemyProjectiles = this.physics.add.group();

    // 3. Characters
    player = this.physics.add.sprite(100, 300, 'elephant', 0).setScale(2.5);
    player.setCollideWorldBounds(true);
    this.physics.add.collider(player, ground);

    enemy = this.physics.add.sprite(700, 300, 'elephant', 20).setScale(2.5);
    enemy.setCollideWorldBounds(true);
    this.physics.add.collider(enemy, ground);
    enemy.flipX = true;

    // 4. HUD
    this.add.text(10, 10, 'PYRO (P1)', { font: '14px Courier', fill: '#FFD700' });
    p1HealthBar = this.add.rectangle(10, 30, 150, 10, 0x00FF00).setOrigin(0);
    
    this.add.text(640, 10, 'JUNI (AI)', { font: '14px Courier', fill: '#c084fc' });
    e1HealthBar = this.add.rectangle(640, 30, 150, 10, 0x00FF00).setOrigin(0);

    // 5. Animations
    this.anims.create({
        key: 'p1_walk',
        frames: this.anims.generateFrameNumbers('elephant', { start: 1, end: 4 }),
        frameRate: 8,
        repeat: -1
    });

    this.anims.create({
        key: 'e1_walk',
        frames: this.anims.generateFrameNumbers('elephant', { start: 21, end: 24 }),
        frameRate: 8,
        repeat: -1
    });

    // 6. Hit Detection
    this.physics.add.overlap(this.projectiles, enemy, (en, flare) => {
        flare.destroy();
        e1Health -= 10;
        en.setTint(0xff0000);
        this.time.delayedCall(100, () => en.clearTint());
    });

    this.physics.add.overlap(this.enemyProjectiles, player, (pl, bolt) => {
        bolt.destroy();
        p1Health -= 5;
        pl.setTint(0xff0000);
        this.time.delayedCall(100, () => pl.clearTint());
    });

    cursors = this.input.keyboard.createCursorKeys();
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
}

function update() {
    // Player Move
    if (cursors.left.isDown) {
        player.setVelocityX(-180);
        player.flipX = true;
        player.anims.play('p1_walk', true);
    } else if (cursors.right.isDown) {
        player.setVelocityX(180);
        player.flipX = false;
        player.anims.play('p1_walk', true);
    } else {
        player.setVelocityX(0);
        player.anims.stop();
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.setVelocityY(-550);
    }

    // Player Attack
    if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
        shootFlare(this);
    }

    // Enemy AI Simple
    if (enemy.active) {
        if (enemy.x > player.x + 50) {
            enemy.setVelocityX(-80);
            enemy.flipX = true;
            enemy.anims.play('e1_walk', true);
        } else if (enemy.x < player.x - 50) {
            enemy.setVelocityX(80);
            enemy.flipX = false;
            enemy.anims.play('e1_walk', true);
        } else {
            enemy.setVelocityX(0);
        }

        // Enemy Attack
        if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 300) {
            if (!enemy.lastAttack || (this.time.now - enemy.lastAttack > 2000)) {
                shootLightning(this);
                enemy.lastAttack = this.time.now;
            }
        }
    }

    // Update Health
    p1HealthBar.width = Math.max(0, p1Health * 1.5);
    e1HealthBar.width = Math.max(0, e1Health * 1.5);
}

function shootFlare(scene) {
    let flare = scene.add.rectangle(player.x, player.y, 30, 10, 0xFFD700);
    scene.projectiles.add(flare);
    scene.physics.add.existing(flare);
    flare.body.setAllowGravity(false);
    flare.body.setVelocityX(player.flipX ? -600 : 600);
    scene.time.delayedCall(1000, () => flare.destroy());
}

function shootLightning(scene) {
    let bolt = scene.add.rectangle(enemy.x, enemy.y, 40, 5, 0x00BFFF);
    scene.enemyProjectiles.add(bolt);
    scene.physics.add.existing(bolt);
    bolt.body.setAllowGravity(false);
    bolt.body.setVelocityX(enemy.flipX ? -500 : 500);
    scene.time.delayedCall(1000, () => bolt.destroy());
}
</script>
</body>
</html>
