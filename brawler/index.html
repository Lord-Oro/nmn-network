<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NMN Brawler | Phase 1 Movement</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #070605; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
    </style>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 400,
    physics: { default: 'arcade', arcade: { gravity: { y: 1000 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player;
let cursors;

function preload() {
    // We attempt to load your emblem from the folder above
    this.load.image('hero', '../lord_oro_emblem.jpg');
}

function create() {
    // Create the Mine Floor (Obsidian Rock)
    const ground = this.add.rectangle(400, 390, 800, 20, 0x1a1510);
    this.physics.add.existing(ground, true);

    // Create the Player (Golden Box Prototype)
    // If the image loads, it will replace this. If not, the box stays.
    player = this.add.rectangle(100, 300, 40, 60, 0xFFD700);
    this.physics.add.existing(player);
    player.body.setCollideWorldBounds(true);
    this.physics.add.collider(player, ground);

    cursors = this.input.keyboard.createCursorKeys();
    
    this.add.text(10, 10, 'NMN BRAWLER: ARCHITECT TEST 0.1', { 
        font: '14px Courier', 
        fill: '#FFD700' 
    });
}

function update() {
    if (cursors.left.isDown) { player.body.setVelocityX(-200); }
    else if (cursors.right.isDown) { player.body.setVelocityX(200); }
    else { player.body.setVelocityX(0); }

    if (cursors.up.isDown && player.body.touching.down) { player.body.setVelocityY(-500); }
}
</script>
</body>
</html>
