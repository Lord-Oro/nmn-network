<!DOCTYPE html>
<html>
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-P5WL9XNDY8');</script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #FFD700; }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 400,
    physics: { default: 'arcade', arcade: { gravity: { y: 1000 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, enemy, cursors, space, keyX, keyC;

function preload() {
    this.load.image('bg', 'forest_bg.jpg');
    this.load.spritesheet('elephants', 'hero-sheet.png', { frameWidth: 28, frameHeight: 52 });
}

function create() {
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400);
    let ground = this.add.rectangle(400, 390, 800, 20, 0x000).setAlpha(0.1);
    this.physics.add.existing(ground, true);

    player = this.physics.add.sprite(100, 300, 'elephants', 0).setScale(2.5).setCollideWorldBounds(true);
    enemy = this.physics.add.sprite(700, 300, 'elephants', 20).setScale(2.5).setCollideWorldBounds(true).setFlipX(true);
    
    this.physics.add.collider(player, ground);
    this.physics.add.collider(enemy, ground);

    cursors = this.input.keyboard.createCursorKeys();
    space = this.input.keyboard.addKey('SPACE');
    keyX = this.input.keyboard.addKey('X');
    keyC = this.input.keyboard.addKey('C');
}

function update() {
    if (cursors.left.isDown) player.setVelocityX(-200);
    else if (cursors.right.isDown) player.setVelocityX(200);
    else player.setVelocityX(0);

    if (Phaser.Input.Keyboard.JustDown(space) && player.body.touching.down) player.setVelocityY(-500);

    if (Phaser.Input.Keyboard.JustDown(keyX)) {
        let b = this.add.rectangle(player.x, player.y, 20, 10, 0xFFD700);
        this.physics.add.existing(b);
        b.body.setVelocityX(player.flipX ? -600 : 600);
    }
}
</script>
</body>
</html>
