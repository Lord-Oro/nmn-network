<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS v9.1 - TEETH UPDATE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; touch-action: none; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 3px solid #FFD700; background: rgba(5,3,8,0.9);
            color: #FFD700; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            pointer-events: all; user-select: none; font-family: monospace;
        }
        #ml { left: 20px; bottom: 10px; } #mr { left: 100px; bottom: 10px; }
        #mj { left: 60px; bottom: 90px; } #ma { right: 20px; bottom: 90px; }
        #ms { right: 20px; bottom: 10px; } #mf { right: 100px; bottom: 10px; }
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div>
    <div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const SPAWN = { p1: { x: 200, y: GH - 150 }, p2: { x: 600, y: GH - 150 } };
const MP = { l: false, r: false, j: false, a: false, s: false, f: false };

(function() {
    const bind = (id, key) => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener("touchstart", e => { e.preventDefault(); MP[key] = true; });
            el.addEventListener("touchend", e => { e.preventDefault(); MP[key] = false; });
        }
    };
    bind("ml", "l"); bind("mr", "r"); bind("mj", "j"); bind("ma", "a"); bind("ms", "s"); bind("mf", "f");
})();

const Match = { p1: "Juni", p2: "Pyro", p1HP: 100, p2HP: 100, gameOver: false };

function calibrate(sp, type) {
    sp.setOrigin(0.5, 0.5);
    if (type === 'juni') { sp.body.setSize(45, 100).setOffset(41.5, 28); } 
    else { sp.body.setSize(60, 60).setOffset(34, 34); }
    sp.setCollideWorldBounds(true);
    sp.setDragX(2000);
}

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("promo", "brawler_promo.jpg");
        this.load.image("bg", "bg_deep_forest.jpg");
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
    }
    create() {
        this.add.image(GW/2, GH/2, "promo").setDisplaySize(GW, GH);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.4);
        const roster = ["Juni", "Pyro", "Wanderer", "Nela", "Orid", "Helios"];
        roster.forEach((name, i) => {
            let active = i < 2;
            let t = this.add.text(GW/2, 100 + (i * 55), active ? name.toUpperCase() : name.toUpperCase() + " (🔒)", {
                fontFamily: 'monospace', fontSize: '30px', fill: active ? '#FFD700' : '#555',
                backgroundColor: '#000000AA', padding: 10
            }).setOrigin(0.5).setInteractive();
            if (active) t.on("pointerdown", () => { 
                Match.p1 = name; Match.p2 = (name === "Juni" ? "Pyro" : "Juni"); 
                Match.p1HP = 100; Match.p2HP = 100; Match.gameOver = false;
                this.scene.start("BattleScene"); 
            });
        });
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }

    create() {
        const p1n = Match.p1.toLowerCase(), p2n = Match.p2.toLowerCase();
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.3).setDepth(0);

        // HUD: Health Bars
        this.hp1 = this.add.graphics().setDepth(5);
        this.hp2 = this.add.graphics().setDepth(5);

        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-20, 800, 20, 0x3a2a0a).setAlpha(0.5));

        // Anims (v9.0 Base)
        this.anims.create({ key: 'juni_idle', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 0, end: 3 }), frameRate: 6, repeat: -1 });
        this.anims.create({ key: 'juni_jump', frames: [{key: 'juni_sheet', frame: 4}] });
        this.anims.create({ key: 'juni_atk', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 7, end: 10 }), frameRate: 15 });
        this.anims.create({ key: 'juni_fire', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 11, end: 13 }), frameRate: 12 });
        this.anims.create({ key: 'juni_shd', frames: [{key: 'juni_sheet', frame: 19}] });

        this.anims.create({ key: 'pyro_idle', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 0, end: 4 }), frameRate: 8, repeat: -1 });
        this.anims.create({ key: 'pyro_atk', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 5, end: 9 }), frameRate: 15 });
        this.anims.create({ key: 'pyro_fire', frames: [{key: 'pyro_sheet', frame: 10}] });
        this.anims.create({ key: 'pyro_shd', frames: [{key: 'pyro_sheet', frame: 6}] });

        this.p1 = this.physics.add.sprite(SPAWN.p1.x, SPAWN.p1.y, p1n + "_sheet", 0).setDepth(2);
        this.p2 = this.physics.add.sprite(SPAWN.p2.x, SPAWN.p2.y, p2n + "_sheet", 0).setDepth(2);
        
        calibrate(this.p1, p1n);
        calibrate(this.p2, p2n);

        this.bullets = this.physics.add.group();
        this.physics.add.collider([this.p1, this.p2], this.platforms);
        
        // OVERLAP DETECTION
        this.physics.add.overlap(this.bullets, this.p2, (target, bullet) => {
            bullet.destroy();
            this.handleHit(2, 12);
        });

        this.keys = this.input.keyboard.addKeys({ left: 'A', right: 'D', jump: 'W', punch: 'J', shield: 'K', fire: 'L' });
        this.s = { p1Jumps: 0, busy: false, p2Stun: false };

        this.drawHP();
    }

    drawHP() {
        this.hp1.clear().fillStyle(0x000000, 0.5).fillRect(20, 20, 204, 24);
        this.hp1.fillStyle(Match.p1HP > 30 ? 0x00ff00 : 0xff0000).fillRect(22, 22, Match.p1HP * 2, 20);
        
        this.hp2.clear().fillStyle(0x000000, 0.5).fillRect(GW - 224, 20, 204, 24);
        this.hp2.fillStyle(Match.p2HP > 30 ? 0x00ff00 : 0xff0000).fillRect(GW - 222, 22, Match.p2HP * 2, 20);
    }

    handleHit(victimNum, damage) {
        if (Match.gameOver) return;
        const victim = (victimNum === 2) ? this.p2 : this.p1;
        const pushDir = (this.p1.x < this.p2.x) ? 1 : -1;

        if (victimNum === 2) {
            Match.p2HP -= damage;
            this.s.p2Stun = true;
            victim.setTint(0xff0000);
            victim.setVelocityX(pushDir * 420);
            victim.setVelocityY(-250);
            this.time.delayedCall(300, () => { 
                victim.clearTint(); 
                this.s.p2Stun = false; 
            });
        }

        this.drawHP();
        if (Match.p2HP <= 0) this.endGame(Match.p1);
    }

    endGame(winner) {
        Match.gameOver = true;
        this.add.text(GW/2, GH/2, winner.toUpperCase() + " WINS!", {
            fontFamily: 'monospace', fontSize: '64px', fill: '#FFD700', stroke: '#000', strokeThickness: 8
        }).setOrigin(0.5);
        this.time.delayedCall(2000, () => this.scene.start("BrawlerScene"));
    }

    update() {
        if (Match.gameOver) return;
        const p1 = this.p1, p2 = this.p2, ks = this.keys, s = this.s, name = Match.p1.toLowerCase();
        const grounded = p1.body.blocked.down;

        // MIRRORING
        p1.setFlipX(p1.x > p2.x);
        p2.setFlipX(p2.x > p1.x);

        // P2 SANDBAG AI (Recovery)
        if (!s.p2Stun) {
            const dist = Math.abs(p2.x - SPAWN.p2.x);
            if (dist > 120) {
                p2.setVelocityX(p2.x > SPAWN.p2.x ? -120 : 120);
                p2.play(Match.p2.toLowerCase() + '_idle', true);
            } else {
                p2.setVelocityX(0);
                p2.play(Match.p2.toLowerCase() + '_idle', true);
            }
        }

        if (grounded) s.p1Jumps = 0;

        if (!s.busy) {
            if (ks.shield.isDown || MP.s) { p1.setVelocityX(0); p1.play(name + '_shd', true); return; }
            
            if (ks.left.isDown || MP.l) { p1.setVelocityX(-280); if (grounded) p1.play(name + '_idle', true); }
            else if (ks.right.isDown || MP.r) { p1.setVelocityX(280); if (grounded) p1.play(name + '_idle', true); }
            else { p1.setVelocityX(0); if (grounded) p1.play(name + '_idle', true); }

            if (Phaser.Input.Keyboard.JustDown(ks.jump) || MP.j) {
                if (s.p1Jumps < 2) { p1.setVelocityY(-620); if (name === 'juni') p1.play('juni_jump'); s.p1Jumps++; }
                MP.j = false;
            }

            if (Phaser.Input.Keyboard.JustDown(ks.punch) || MP.a) {
                s.busy = true; p1.play(name + '_atk');
                if (Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y) < 100) this.handleHit(2, 8);
                this.time.delayedCall(350, () => { s.busy = false; p1.play(name + '_idle'); });
                MP.a = false;
            }

            if (Phaser.Input.Keyboard.JustDown(ks.fire) || MP.f) {
                s.busy = true; p1.play(name + '_fire');
                this.time.delayedCall(250, () => {
                    let f = (name === 'juni') ? 15 : 10;
                    let spawnY = (name === 'juni') ? p1.y - 10 : p1.y;
                    let b = this.bullets.create(p1.x, spawnY, name + '_sheet', f);
                    b.body.setAllowGravity(false);
                    b.setFlipX(p1.flipX);
                    b.setVelocityX(p1.flipX ? -750 : 750);
                    this.time.delayedCall(1000, () => b.destroy());
                });
                this.time.delayedCall(500, () => { s.busy = false; p1.play(name + '_idle'); });
                MP.f = false;
            }
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    pixelArt: true, render: { roundPixels: true },
    physics: { default: "arcade", arcade: { gravity: { y: 1600 } } },
    scene: [StartScreen, BrawlerScene, BattleScene]
});
</script>
</body>
</html>
