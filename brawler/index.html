<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-P5WL9XNDY8');</script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { border: 2px solid #FFD700; }
    </style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800, height: 400,
    parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 1200 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, enemy, cursors, space, keyX, pHealth=100, eHealth=100, pBar, eBar, jumpCount=0;
let gameState = 'TITLE', selectedFrame = 0;

function preload() {
    this.load.image('bg', 'forest_bg.jpg');
    this.load.spritesheet('elephants', 'brawler/hero-sheet.png', { frameWidth: 28, frameHeight: 52 });
    this.load.image('p_pyro', 'brawler/Pyro elephant beta.jpg');
    this.load.image('p_juni', 'brawler/Juni elephant beta.jpg');
    this.load.image('p_olydia', 'brawler/Olydia elephant beta.jpg');
    this.load.image('p_helios', 'brawler/Helios elephant beta.jpg');
    this.load.image('p_wanderer', 'brawler/Wanderer elephant beta.jpg');
    this.load.image('p_orid', 'brawler/Orid elephant beta.jpg');
}

function create() {
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400).setAlpha(0.5);
    
    // --- INFO BOX ---
    this.infoBox = this.add.rectangle(400, 50, 600, 40, 0x000).setStrokeStyle(2, 0xFFD700).setVisible(false);
    this.infoTxt = this.add.text(400, 50, '', { font: '14px Courier', fill: '#FFD700' }).setOrigin(0.5).setVisible(false);

    // --- TITLE / ROSTER ---
    this.titleTxt = this.add.text(400, 200, 'NMN: THE FORGE\n\n[ FADED START ]', { font: '24px Courier', fill: '#FFD700', align: 'center' }).setOrigin(0.5).setInteractive();
    this.titleTxt.setAlpha(0.5);

    this.roster = this.add.group();
    const rosterData = [
        { key: 'p_pyro', x: 100, frame: 0, info: 'PYRO: FREE' },
        { key: 'p_juni', x: 220, frame: 20, info: 'JUNI: FREE' },
        { key: 'p_olydia', x: 340, frame: 40, info: 'OLYDIA: $1.99 - KEY REQUIRED' },
        { key: 'p_helios', x: 460, frame: 60, info: 'HELIOS: $0.99 - KEY REQUIRED' },
        { key: 'p_wanderer', x: 580, frame: 80, info: 'WANDERER: NEWSLETTER EXCLUSIVE' },
        { key: 'p_orid', x: 700, frame: 100, info: 'ORID: PATREON EXCLUSIVE' }
    ];

    rosterData.forEach(data => {
        let p = this.add.image(data.x, 200, data.key).setDisplaySize(90, 90).setInteractive();
        p.on('pointerover', () => { this.infoBox.setVisible(true); this.infoTxt.setVisible(true).setText(data.info); });
        p.on('pointerdown', () => { if(data.frame <= 20) { selectedFrame = data.frame; startBattle(this); } });
        this.roster.add(p);
    });
    this.roster.setVisible(false);

    // --- ARENA ---
    let platforms = this.physics.add.staticGroup();
    platforms.create(400, 390, null).setDisplaySize(800, 20).refreshBody(); // Ground
    platforms.create(200, 250, null).setDisplaySize(150, 20).setTint(0x1a1510).refreshBody();
    platforms.create(600, 250, null).setDisplaySize(150, 20).setTint(0x1a1510).refreshBody();
    platforms.create(400, 150, null).setDisplaySize(150, 20).setTint(0xFFD700).refreshBody();

    player = this.physics.add.sprite(150, 300, 'elephants', 0).setScale(2.5).setVisible(false).setCollideWorldBounds(true);
    enemy = this.physics.add.sprite(650, 300, 'elephants', 20).setScale(2.5).setVisible(false).setFlipX(true).setCollideWorldBounds(true);
    
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(enemy, platforms);

    pBar = this.add.rectangle(20, 30, 200, 10, 0x00ff00).setOrigin(0).setVisible(false);
    eBar = this.add.rectangle(580, 30, 200, 10, 0x00ff00).setOrigin(0).setVisible(false);

    this.projectiles = this.physics.add.group();
    this.physics.add.overlap(this.projectiles, enemy, (en, pr) => { pr.destroy(); eHealth -= 10; en.setTint(0xff0000); this.time.delayedCall(100, ()=>en.clearTint()); });

    cursors = this.input.keyboard.createCursorKeys();
    space = this.input.keyboard.addKey('SPACE');
    keyX = this.input.keyboard.addKey('X');

    this.titleTxt.on('pointerdown', () => { this.titleTxt.setVisible(false); this.roster.setVisible(true); this.infoBox.setVisible(true); this.infoTxt.setVisible(true).setText('SELECT ARCHITECT'); });
}

function startBattle(scene) {
    gameState = 'BATTLE';
    scene.roster.setVisible(false); scene.infoBox.setVisible(false); scene.infoTxt.setVisible(false);
    player.setFrame(selectedFrame).setVisible(true); enemy.setVisible(true); pBar.setVisible(true); eBar.setVisible(true);
}

function update() {
    if (gameState !== 'BATTLE') return;
    if (cursors.left.isDown) { player.setVelocityX(-220); player.setFlipX(true); }
    else if (cursors.right.isDown) { player.setVelocityX(220); player.setFlipX(false); }
    else player.setVelocityX(0);

    if (player.body.touching.down) jumpCount = 0;
    if (Phaser.Input.Keyboard.JustDown(cursors.up) && jumpCount < 2) { player.setVelocityY(-500); jumpCount++; }

    if (Phaser.Input.Keyboard.JustDown(space)) {
        let b = this.add.rectangle(player.x, player.y, 20, 10, 0xFFD700);
        this.projectiles.add(b); this.physics.add.existing(b);
        b.body.setAllowGravity(false); b.body.setVelocityX(player.flipX ? -600 : 600);
    }
    if (Phaser.Input.Keyboard.JustDown(keyX)) {
        if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 70) { eHealth -= 15; enemy.setTint(0xffffff); this.time.delayedCall(100, () => enemy.clearTint()); }
    }

    pBar.width = Math.max(0, pHealth * 2); eBar.width = Math.max(0, eHealth * 2);
    if (eHealth <= 0 || pHealth <= 0) endGame(this);
}

function endGame(scene) {
    gameState = 'END';
    scene.physics.world.pause();
    scene.add.rectangle(400, 200, 800, 400, 0x000, 0.8);
    let msg = pHealth > 0 ? 'VICTORY' : 'DEFEAT';
    scene.add.text(400, 120, msg, { font: '40px Courier', fill: '#FFD700' }).setOrigin(0.5);
    scene.add.text(400, 220, 'STAY TUNED - EXPLORE THE LIBRARY\nUNLOCK LORE & NEW CHARACTERS', { font: '14px Courier', fill: '#FFF', align: 'center' }).setOrigin(0.5);
    let reset = scene.add.text(400, 300, '[ RE-FORGE ]', { font: '18px Courier', fill: '#FFD700' }).setOrigin(0.5).setInteractive();
    reset.on('pointerdown', () => window.location.reload());
}
</script>
</body>
</html>
