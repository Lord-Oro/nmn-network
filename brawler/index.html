    #ms { width:65px; height:65px; right:115px; bottom:28px; font-size:20px; } /* Proj */
    #mf { width:50px; height:50px; right:35px; bottom:115px; font-size:16px; } /* Shield */
    #mb { width:50px; height:50px; right:100px; bottom:105px; border-color:#00FF88; color:#00FF88; font-size:16px; } /* Burst */
    #mj { width:60px; height:60px; right:195px; bottom:30px; font-size:18px; } /* Jump */
  </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
  <div id="joy" style="position:absolute;left:20px;bottom:20px;width:110px;height:110px;
    border-radius:50%;border:3px solid #FFD700;background:rgba(0,0,0,0.5);pointer-events:all;
    display:flex;align-items:center;justify-content:center;touch-action:none;">
    <div id="stick" style="width:44px;height:44px;border-radius:50%;
      background:#FFD700;opacity:0.85;pointer-events:none;transition:transform 0.05s;"></div>
  </div>
  <div class="mb" id="mj">▲</div>
  <div class="mb" id="ma">🥊</div>
  <div class="mb" id="ms">⚡</div>
  <div class="mb" id="mf">🛡</div>
  <div class="mb" id="mb">☆</div>
</div>
<script>

const BLAST = { minX:-280, maxX:1080, minY:-280, maxY:880 };

const Match = {
  p1:"Juni", p2:"Pyro",
  p1Pct:0, p2Pct:0,
  p1Lives:3, p2Lives:3,
  map:"bg_eyes", paused:false, winner:null,
  difficulty:"NORMAL", maxHealth:250 
};

const BOOK_LINKS = {
  juni_en:     "https://books2read.com/u/4EOxZ0",
  outbreak_en: "https://books2read.com/u/31NrLw",
  tabbies_en:  "https://a.co/d/06X2Jjee",
  pyro_en:     "https://a.co/d/036X5lJP"
};
const LINKTREE = "https://linktr.ee/NMN_LordOro";
const STAGE_BG = {
  mana_forest:  { key:"deep_forest_img", tint:null, alpha:1 },
  glitch_mines: { key:"forest_edge_img", tint:null, alpha:1 },
  obsidian_pit: { key:"bg_eyes", tint:0xFFD700, alpha:0.45 }
};
const BOOK_LIST = ["juni_en","outbreak_en","tabbies_en","pyro_en"];

const FRAMES = {
  juni: { idle:[0,1,2,3], jump:5, melee:12, range:10, proj:10, burst:16, shield:18, knock:15, dmg:[19,20,21] },
  pyro: { idle:[0,1,2,3], jump:4, melee:11, range:15, proj:15, burst:6,  shield:20, knock:23, dmg:[21,22]    }
};

const MP={l:false,r:false,j:false,a:false,s:false,f:false,b:false};
const JOY={active:false,vx:0,vy:0};

(function(){
  const isTouch="ontouchstart" in window||navigator.maxTouchPoints>0;
  window.IS_TOUCH = isTouch; 
  const joy=document.getElementById("joy");
  const stick=document.getElementById("stick");
  if(joy){
    const getRC=()=>joy.getBoundingClientRect();
    const upd=e=>{
      const r=getRC();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const px=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:cx);
      const py=e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:cy);
      const dx=px-cx, dy=py-cy;
      const max=r.width/2-16;
      const dist=Math.min(Math.hypot(dx,dy),max);
      const ang=Math.atan2(dy,dx);
      JOY.vx=Math.cos(ang)*(dist/max);
      JOY.vy=Math.sin(ang)*(dist/max);
      if(stick)stick.style.transform=`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
    };
    const end=e=>{
      e.preventDefault();
      JOY.active=false;JOY.vx=0;JOY.vy=0;
      if(stick)stick.style.transform="translate(0px,0px)";
    };
    joy.onpointerdown=e=>{e.preventDefault();JOY.active=true;upd(e);};
    joy.onpointermove=e=>{if(!JOY.active)return;e.preventDefault();upd(e);};
    joy.onpointerup=end;joy.onpointercancel=end;joy.onpointerleave=end;
  }
  const bind=(id,k)=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.onpointerdown=e=>{e.preventDefault();MP[k]=true;};
    el.onpointerup  =e=>{e.preventDefault();MP[k]=false;};
  };
  bind("mj","j");bind("ma","a");bind("ms","s");bind("mf","f");bind("mb","b");
})();

function goldSpark(scene,x,y){
  const g=scene.add.graphics().setDepth(600);
  [0xFFD700,0xFF8800,0xFFFF88,0xFF5500].forEach(col=>{
    for(let i=0;i<4;i++){
      const ang=Math.random()*Math.PI*2,len=4+Math.random()*16;
      g.fillStyle(col,1);
      g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,3+Math.random()*3,3);
    }
  });
  scene.tweens.add({targets:g,alpha:0,duration:220,onComplete:()=>g.destroy()});
}

function arcSlash(scene,x,y,dir,isJuni){
  const g=scene.add.graphics().setDepth(580);
  const col =isJuni?0x00FF88:0xFF4400;
  const col2=isJuni?0xAAFFCC:0xFFAA00;
  g.lineStyle(5,col,0.9);
  
  // Logic Fix: Mirror arc geometry perfectly
  const startAngle = dir === 1 ? -70 : 110;
  const endAngle = dir === 1 ? 70 : 250;
  const inStart = dir === 1 ? -50 : 130;
  const inEnd = dir === 1 ? 50 : 230;

  g.beginPath();
  g.arc(x+dir*36,y-8,28,Phaser.Math.DegToRad(startAngle),Phaser.Math.DegToRad(endAngle),false);
  g.strokePath();
  g.lineStyle(2,col2,0.6);
  g.beginPath();
  g.arc(x+dir*36,y-8,19,Phaser.Math.DegToRad(inStart),Phaser.Math.DegToRad(inEnd),false);
  g.strokePath();
  for(let i=0;i<7;i++){
    const ang=Phaser.Math.DegToRad(Phaser.Math.Between(startAngle,endAngle));
    const r=Phaser.Math.Between(18,32);
    const px=x+dir*36+Math.cos(ang)*r,py=y-8+Math.sin(ang)*r;
    const dot=scene.add.rectangle(px,py,isJuni?5:4,isJuni?4:6,isJuni?0x00FF88:0xFF6600,0.9).setDepth(581);
    scene.tweens.add({targets:dot,x:px+dir*(Math.random()*18),y:py-Math.random()*12,alpha:0,duration:isJuni?180:120,onComplete:()=>dot.destroy()});
  }
  scene.tweens.add({targets:g,alpha:0,duration:110,onComplete:()=>g.destroy()});
}

class BrawlerScene extends Phaser.Scene{
  constructor(){super("BrawlerScene");}
  create(){
    Match.p1="Juni";Match.p2="Pyro";
    Match.p1Pct=0;Match.p2Pct=0;
    Match.p1Lives=3;Match.p2Lives=3;
    Match.paused=false;Match.winner=null;
    document.getElementById("mc").classList.remove("on");

    this.add.image(GW/2,GH/2,"bg_eyes").setDisplaySize(GW,GH).setAlpha(0.5);
    this.add.text(GW/2,30,"SELECT CHARACTER",{fontFamily:"Press Start 2P",fontSize:"14px",color:"#FFD700",stroke:"#000",strokeThickness:3}).setOrigin(0.5);

    this.scoutIdx=-1;
    this.add.rectangle(GW/2,60,GW-16,22,0x111111).setOrigin(0.5);
    this.intelTxt=this.add.text(GW/2,60,"Scout a warrior — click once to learn, again to fight.",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#888",align:"center",wordWrap:{width:GW-24}}).setOrigin(0.5);

    const roster=[
      {name:"Juni",     img:"j_sheet",     frame:0,  active:true, color:"#00FF88",url:BOOK_LINKS.juni_en},
      {name:"Pyro",     img:"p_sheet",     frame:0,  active:true, color:"#FF6600",url:BOOK_LINKS.pyro_en},
      {name:"Wanderer", img:"wanderer_beta",frame:null,active:false,color:"#336699",url:LINKTREE},
      {name:"Olydia",   img:"olydia_beta", frame:null,active:false,color:"#9933CC",url:BOOK_LINKS.outbreak_en},
      {name:"Orid",     img:"orid_beta",   frame:null,active:false,color:"#884422",url:BOOK_LINKS.juni_en},
      {name:"Helios",   img:"helios_beta", frame:null,active:false,color:"#FFD700",url:BOOK_LINKS.juni_en},
    ];

    roster.forEach((c,i)=>{
      const col=i%3,row=Math.floor(i/3);
      const x=150+col*250,y=170+row*130;
      const bc=c.active?0xFFD700:0x444444;
      const panel=this.add.rectangle(x,y,120,110,0x111111).setStrokeStyle(2,bc).setInteractive({useHandCursor:true});
      const icon=c.frame!==null
        ?this.add.image(x,y-10,c.img,c.frame).setDisplaySize(80,80)
        :this.add.image(x,y-10,c.img).setDisplaySize(80,80);
      if(!c.active)icon.setTint(0x444444);
      this.add.text(x,y+48,c.name.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"6px",color:c.active?c.color:"#555"}).setOrigin(0.5);
      if(!c.active)this.add.text(x,y+62,"LOCKED",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#FF4444"}).setOrigin(0.5);
      panel.on("pointerover",()=>panel.setStrokeStyle(2,0xFFFFFF));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,bc));
      panel.on("pointerdown",()=>{
        if(!c.active){
          if(this.scoutIdx===i)window.open(c.url,"_blank");
          else{this.scoutIdx=i;this.intelTxt.setText("🔒 "+c.name+": LOCKED — click again to unlock.").setColor("#FF8888");}
          return;
        }
        if(this.scoutIdx!==i){this.scoutIdx=i;this.intelTxt.setText(c.name.toUpperCase()+" — "+this.getLore(c.name)).setColor(c.color);return;}
        Match.p1=c.name;
        Match.p2=c.name==="Juni"?"Pyro":"Juni";
        this.scene.start("StageSelectScene");
      });
    });

    this.add.text(GW/2-130,GH-20,"📖 ORIGIN HUB",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#050308",backgroundColor:"#FFD700",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("OriginHub"));
    this.add.text(GW/2+130,GH-20,"⚙ DIFFICULTY",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FFD700",backgroundColor:"#111",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("DifficultyScene"));
  }
  getLore(name){
    const lore={
      "Juni":"Enter if you dare; face Anubis in the endless expanse of the sands of time.",
      "Pyro":"⭐ Born from the forge. He's fire undying as long as the forge deep within the mine is going as it has for eons."
    };
    return lore[name]||"A warrior from the mine.";
  }
}

    ];
    opts.forEach((o,i)=>{
      const y=180+i*80;

      this.add.text(GW/2,y-10,o.label,{fontFamily:"Press Start 2P",fontSize:"11px",color:o.color}).setOrigin(0.5);
      this.add.text(GW/2,y+12,o.desc,{fontFamily:"Press Start 2P",fontSize:"6px",color:"#888",align:"center"}).setOrigin(0.5);

    });
    this.add.text(30,30,"◀ BACK",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#AAA"}).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("BrawlerScene"));

class StageSelectScene extends Phaser.Scene{
  constructor(){super("StageSelectScene");}
  create(){
    this.add.image(GW/2,GH/2,"bg_eyes").setDisplaySize(GW,GH).setAlpha(0.45);
    this.add.text(GW/2,40,"SELECT EXTRACTION SECTOR",{fontFamily:"Press Start 2P",fontSize:"13px",color:"#FFD700",stroke:"#000",strokeThickness:3}).setOrigin(0.5);
    
    const stages=[
      { key:"mana_forest",  label:"DEEP FOREST",   sub:"Verdant / Ancient",   bgKey:"deep_forest_img" },
      { key:"glitch_mines", label:"FOREST EDGE",   sub:"Stable / Calm",       bgKey:"forest_edge_img" },
      { key:"obsidian_pit", label:"THE MINE",      sub:"Narrow / Brutal",     bgKey:"bg_eyes" },
    ];

    stages.forEach((stage,i)=>{
      const x=GW/2+(i===0?-240:i===1?0:240),y=GH/2+10;
      const bg=this.add.rectangle(x,y,210,150,0x111111).setStrokeStyle(2,0x555555);
      const preview = this.add.image(x, y, stage.bgKey).setDisplaySize(210, 150).setAlpha(0.3);
      const panel=this.add.rectangle(x,y,210,150,0x000000,0).setInteractive({useHandCursor:true});
      this.add.text(x,y-28,stage.label,{fontFamily:"Press Start 2P",fontSize:"9px",color:"#FFD700",stroke:"#000",strokeThickness:2}).setOrigin(0.5);
      this.add.text(x,y-4,stage.sub,{fontFamily:"Press Start 2P",fontSize:"6px",color:"#AAA"}).setOrigin(0.5);
      
      panel.on("pointerover",()=>{panel.setStrokeStyle(3,0xFFFFFF);bg.setStrokeStyle(3,0xFFD700); preview.setAlpha(0.6);});
      panel.on("pointerout", ()=>{panel.setStrokeStyle(0);bg.setStrokeStyle(2,0x555555); preview.setAlpha(0.3);});
      
      // Logic Fix: Pass the system key, not the image key

  create(){

    vgfx.fillGradientStyle(0xFF0000,0xFF0000,0x000000,0x000000,0.18,0.18,0,0);
    vgfx.fillRect(0,0,GW,GH);

    this.add.text(GW/2,40,"[ Transmission Recovered — Origin Unknown ]",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#FF4444"}).setOrigin(0.5);
    this.add.text(GW/2,62,"THE ARCHITECT: LORD ORO",{fontFamily:"Press Start 2P",fontSize:"11px",color:"#FFD700",stroke:"#000",strokeThickness:3}).setOrigin(0.5);

    const bio=`They say the mine was empty when he found it.\nThe shadows here have teeth.\nThe ore bleeds gold when you aren't watching.\n\nLord Oro doesn't build worlds.\nHe excavates them from a void\nthat was never meant to be opened.\n\nThe characters in his books\nknow things they shouldn't.\nThey remember you.\n\nHe calls it Nonsense Media Network.\nThe name is a misdirection.\n\nHe is watching.\nHe has always been watching.\n\nIf you are reading this —\nyou are already inside the mine.`;

    // Logic Fix: Left alignment per Lead Architect request
    const bioText=this.add.text(60, 210, bio, {fontFamily:"Press Start 2P",fontSize:"7px",color:"#E8E0D0",align:"left",lineSpacing:6,wordWrap:{width:400}}).setOrigin(0, 0.5);
    
    this.input.on("wheel",(pointer,gameObjects,deltaX,deltaY)=>{
      bioText.y-=deltaY*0.5;
      bioText.y=Phaser.Math.Clamp(bioText.y,80,280);
    });
    let touchY0=0;
    this.input.on("pointerdown",p=>{touchY0=p.y;});
    this.input.on("pointermove",p=>{
      if(p.isDown){bioText.y+=(p.y-touchY0)*0.4;bioText.y=Phaser.Math.Clamp(bioText.y,80,280);touchY0=p.y;}
    });

    const cursor=this.add.text(280,340,"█",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#FF4444"}).setOrigin(0.5);
    this.tweens.add({targets:cursor,alpha:0,duration:500,yoyo:true,repeat:-1});

    // Logic Fix: Parallel Linktree placement

    lt.on("pointerdown",()=>window.open(LINKTREE,"_blank"));

    this.add.text(30,30,"◀ BACK",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#AAA"}).setInteractive({useHandCursor:true}).on("pointerdown",()=>this.scene.start("OriginHub"));
  }
}

class BattleScene extends Phaser.Scene{
  constructor(){super("BattleScene");}

  create(){
    if(window.IS_TOUCH) document.getElementById("mc").classList.add("on");

    const stageCfg=STAGE_BG[Match.map]||STAGE_BG.mana_forest;
    const bgImg=this.add.image(GW/2,GH/2,stageCfg.key).setDisplaySize(GW,GH).setAlpha(stageCfg.alpha).setScrollFactor(0);
    if(stageCfg.tint) bgImg.setTint(stageCfg.tint);

    this.physics.world.gravity.y=1400;

    this.platforms=this.physics.add.staticGroup();
    const mkP=(px,py,pw,ph=18,col=0x3a2a0a)=>{
      const p=this.add.rectangle(px,py,pw,ph,col);
      this.add.rectangle(px,py-ph/2-1,pw,3,0xFFD700,0.35);
      this.physics.add.existing(p,true);
      p.body.checkCollision.down=false;
      this.platforms.add(p);
      return p;
    };
    mkP(GW/2,  MAIN_PLAT_Y,  520,20);
    mkP(150,   GH-180, 200);
    mkP(650,   GH-180, 200);

    const jAnims=[
      {key:"j_idle",   start:0,  end:3,  rate:6,  loop:true},
      {key:"j_jump",   start:4,  end:6,  rate:8,  loop:false},
      {key:"j_melee",  frames:[12,14,13],rate:14, loop:false},
      {key:"j_range",  start:7,  end:9,  rate:12, loop:false},
      {key:"j_burst",  start:15, end:17, rate:10, loop:false},
      {key:"j_shield", frames:[18],      rate:1,  loop:false},
      {key:"j_dmg",    start:19, end:21, rate:12, loop:false},
      {key:"j_launch", start:15, end:17, rate:10, loop:false},
    ];
    const pAnims=[
      {key:"p_idle",   start:0,  end:3,  rate:8,  loop:true},
      {key:"p_jump",   frames:[4,4,5],   rate:8,  loop:false},
      {key:"p_melee",  frames:[10,11,12],rate:14, loop:false},
      {key:"p_range",  start:7,  end:9,  rate:12, loop:false},
      {key:"p_burst",  frames:[6],       rate:1,  loop:false},
      {key:"p_shield", frames:[20],      rate:1,  loop:false},
      {key:"p_dmg",    start:21, end:22, rate:12, loop:false},
      {key:"p_launch", start:23, end:24, rate:10, loop:false},
    ];

    const makeAnim=(sheet,def)=>{
      if(this.anims.exists(def.key)) return;
      if(def.frames){
        this.anims.create({key:def.key,frames:def.frames.map(f=>({key:sheet,frame:f})),frameRate:def.rate,repeat:def.loop?-1:0});
      } else {
        this.anims.create({key:def.key,frames:this.anims.generateFrameNumbers(sheet,{start:def.start,end:def.end}),frameRate:def.rate,repeat:def.loop?-1:0});
      }
    };
    jAnims.forEach(d=>makeAnim("j_sheet",d));
    pAnims.forEach(d=>makeAnim("p_sheet",d));

    const p1Sheet=Match.p1==="Juni"?"j_sheet":"p_sheet";
    const p2Sheet=Match.p1==="Juni"?"p_sheet":"j_sheet";
    this.p1Pre=Match.p1==="Juni"?"j":"p";
    this.p2Pre=Match.p1==="Juni"?"p":"j";

    this.p1=this.physics.add.sprite(SPAWN.p1.x,SPAWN.p1.y,p1Sheet);
    this.p2=this.physics.add.sprite(SPAWN.p2.x,SPAWN.p2.y,p2Sheet).setFlipX(true);

    [this.p1,this.p2].forEach(sp=>{
      sp.setDisplaySize(80,80);
      sp.setCollideWorldBounds(false);
      sp.body.setSize(36,50).setOffset((sp.width-36)/2, sp.height-50);
      sp.setBounce(0);
      sp.setDragX(700);
      sp.body.setMaxVelocity(600,1000);
    });

    this.physics.add.collider([this.p1,this.p2],this.platforms);

    this.p1.play(this.p1Pre+"_idle");
    this.p2.play(this.p2Pre+"_idle");

    const combatSuffixes=["_melee","_range","_burst","_launch","_dmg","_jump"];
    this.anims.on("animationcomplete",(anim,sprite)=>{
      if(!sprite||!sprite.active||!sprite.body) return;
      if(!combatSuffixes.some(s=>anim.key.endsWith(s))) return;
      const pre=(sprite===this.p1)?this.p1Pre:this.p2Pre;
      if(Math.abs(sprite.body.velocity.x)<40) sprite.play(pre+"_idle",true);
    });

    this.S={
      state:"STARTING",
      p1Stun:false,p2Stun:false,
      p1AtkCD:false,p2AtkCD:false,
      p1Jumps:0,p2Jumps:0,
      gameOver:false,
      p1ShieldHp: 5, p2ShieldHp: 5,
      p1Bursts: 3, p2Bursts: 3,
      p1BurstBuff: false, p2BurstBuff: false,
      p1ProjReady: true, p2ProjReady: true
    };
    
    // CPU Data
    this.cpuAtkTimer=0;this.cpuFireTimer=0;this.cpuAtkCD=false;
    this.cpuSpeed    = Match.difficulty==="EASY"?90:Match.difficulty==="HARD"?260:170;
    this.cpuAtkFreq  = Match.difficulty==="EASY"?0.02:Match.difficulty==="HARD"?0.25:0.10;
    this.cpuFireFreq = Match.difficulty==="EASY"?0.005:Match.difficulty==="HARD"?0.10:0.03;

    this.meleeGrp=this.physics.add.group();
    this.projGrp =this.physics.add.group();

    this.physics.add.overlap(this.meleeGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,false);
    });
    this.physics.add.overlap(this.meleeGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,false);
    });
    this.physics.add.overlap(this.projGrp,this.p2,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p2")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p1","p2",hit,true);
    });
    this.physics.add.overlap(this.projGrp,this.p1,(hit,player)=>{
      if(!hit||!hit.active||hit.getData("owner")==="p1")return;
      goldSpark(this,hit.x,hit.y);
      this.resolveHit("p2","p1",hit,true);
    });

    this.buildHUD();
    this.refreshHUD();

    this.keys=this.input.keyboard.addKeys({
      W:"W",A:"A",S:"S",D:"D",DOWN:"DOWN",J:"J",K:"K",L:"L",
      SEMI:"SEMICOLON",P:"P"
    });

    this.buildPauseMenu();

    this.camX=GW/2;this.targetZoom=1.0;
    this.cameras.main.centerOn(GW/2,GH/2);

    // Logic Fix: Brawl delay timer
    const bText = this.add.text(GW/2, GH/2, "BRAWL!", {fontFamily:"Press Start 2P", fontSize:"40px", color:"#FFD700", stroke:"#000", strokeThickness:5}).setOrigin(0.5);
    this.tweens.add({targets:bText, scaleX:1.2, scaleY:1.2, yoyo:true, repeat:-1, duration:300});
    this.time.delayedCall(1500, () => {
      bText.destroy();
      this.S.state = "PLAYING";
    });
  }

  buildHUD(){
    const D=9999;

    const p2c=Match.p1==="Juni"?"#FF6600":"#00FF88";

    this.add.rectangle(0,0,230,56,0x050308,0.92).setOrigin(0).setDepth(D).setScrollFactor(0);

    this.p1ProjBar = this.add.rectangle(10+4, 28, 200, 2, 0x55AAFF).setOrigin(0).setDepth(D).setScrollFactor(0);

    this.add.rectangle(GW-214,17,200,10,0x333333).setOrigin(0).setDepth(D).setScrollFactor(0);
    this.p2Bar=this.add.rectangle(GW-214,17,200,10,parseInt(p2c.replace("#","0x"))).setOrigin(0).setDepth(D).setScrollFactor(0);
    this.p2DT=this.add.text(GW-10,34,"0%",{fontFamily:"Press Start 2P",fontSize:"11px",color:"#FFF"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.p2HT=this.add.text(GW-10,48,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FF4444"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);

    this.add.text(GW/2,6,"P = PAUSE",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#444"}).setOrigin(0.5,0).setDepth(D).setScrollFactor(0);
  }

  refreshHUD(){
    // Logic Fix: Scale relative to the difficulty Max Health parameter
    const p1pct=Math.min(Match.p1Pct,Match.maxHealth)/Match.maxHealth;
    const p2pct=Math.min(Match.p2Pct,Match.maxHealth)/Match.maxHealth;
    this.p1Bar.scaleX=Math.max(0,1-p1pct);
    this.p2Bar.scaleX=Math.max(0,1-p2pct);
    
    const clr=p=>p>(Match.maxHealth*0.8)?"#FF4444":p>(Match.maxHealth*0.4)?"#FFAA00":"#FFFFFF";
    this.p1DT.setText(Match.p1Pct+"%").setColor(clr(Match.p1Pct));
    this.p2DT.setText(Match.p2Pct+"%").setColor(clr(Match.p2Pct));
    
    const h=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,3-n));
    this.p1HT.setText(h(Match.p1Lives));
    this.p2HT.setText(h(Match.p2Lives));

    this.p1BurstsHUD.setText("☆x"+this.S.p1Bursts);
    this.p1ProjBar.scaleX = this.S.p1ProjReady ? 1 : 0;
  }

  respawnOrEnd(id){
    const S=this.S;
    if(S.gameOver)return;
    const isP1=id==="p1";
    const sp=isP1?this.p1:this.p2;
    const spX=isP1?SPAWN.p1.x:SPAWN.p2.x;
    const spY=isP1?SPAWN.p1.y:SPAWN.p2.y;
    const pre=isP1?this.p1Pre:this.p2Pre;

    if(isP1)Match.p1Lives--;else Match.p2Lives--;
    const lives=isP1?Match.p1Lives:Match.p2Lives;
    this.cameras.main.shake(240,0.014);
    this.refreshHUD();

    if(lives<=0){
      S.gameOver=true;
      Match.winner=isP1?"P2":"P1";
      this.showSignalLost();
      return;
    }

    if(isP1){Match.p1Pct=0;S.p1Stun=false;S.p1AtkCD=false;S.p1Jumps=0;S.p1Bursts=3;}
    else    {Match.p2Pct=0;S.p2Stun=false;S.p2AtkCD=false;S.p2Jumps=0;}

    this.tweens.killTweensOf(sp);
    sp.setActive(true).setVisible(true).setAlpha(1).clearTint();
    if(sp.body){ sp.body.setEnable(true); sp.body.setVelocity(0,0); sp.body.setAcceleration(0,0); }
    sp.setPosition(spX,spY);
    sp.play(pre+"_idle");

    this.tweens.add({targets:sp,alpha:0.3,duration:100,yoyo:true,repeat:7, onComplete:()=>{sp.setActive(true).setVisible(true).setAlpha(1);} });
    const lbl=this.add.text(spX,spY-44,(isP1?"P1":"CPU")+" BACK", {fontFamily:"Press Start 2P",fontSize:"7px",color:isP1?"#00FF88":"#FF5555"}).setOrigin(0.5).setDepth(500);
    this.tweens.add({targets:lbl,y:spY-84,alpha:0,duration:800,onComplete:()=>lbl.destroy()});
    this.refreshHUD();
  }

  showSignalLost(){
    document.getElementById("mc").classList.remove("on");
    const sl=this.textures.exists("signal_lost")
      ?this.add.image(GW/2,GH/2,"signal_lost").setDisplaySize(GW,GH).setAlpha(0).setDepth(8000).setScrollFactor(0)
      :this.add.rectangle(GW/2,GH/2,GW,GH,0x050308,0).setDepth(8000).setScrollFactor(0);

    this.add.text(GW/2,GH/2+10,Match.winner+" WINS — "+winner.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"10px",color:wc}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
    const url=winner==="Juni"?BOOK_LINKS.juni_en:BOOK_LINKS.pyro_en;
    const cta=this.add.text(GW/2,GH/2+50,"📖 READ THE LEGEND",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#55AAFF",backgroundColor:"#111",padding:{x:10,y:5}}).setDepth(8001).setOrigin(0.5).setScrollFactor(0).setInteractive({useHandCursor:true});
    cta.on("pointerdown",()=>window.open(url,"_blank"));
    this.tweens.add({targets:cta,alpha:0.5,duration:800,yoyo:true,repeat:-1});
    const cta2=this.add.text(GW/2,GH/2+78,winner==="Juni"?"📡 Also: Outbreak →":"📗 Also: Juni the Immortal →",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#9933CC"}).setDepth(8001).setOrigin(0.5).setScrollFactor(0).setInteractive({useHandCursor:true});
    cta2.on("pointerdown",()=>window.open(winner==="Juni"?BOOK_LINKS.outbreak_en:BOOK_LINKS.juni_en,"_blank"));
    this.time.delayedCall(2600,()=>this.scene.start("ResultsScene"));
  }

  resolveHit(atkId,tgtId,hit,isProjectile){
    const S=this.S;
    if(S.gameOver||!hit||!hit.active)return;
    
    // Logic Fix: Shield blocking calculations
    const isTgtShielding = (tgtId==="p1" && (this.keys.S.isDown || this.keys.DOWN.isDown || MP.f));
    const tgtShieldHp = tgtId==="p1" ? S.p1ShieldHp : S.p2ShieldHp;
    
    if (isProjectile){const vis=hit.getData("vis");if(vis&&vis.active)vis.destroy();}
    hit.destroy();
    
    const tgt=tgtId==="p2"?this.p2:this.p1;
    const atk=atkId==="p1"?this.p1:this.p2;
    if(!tgt.active||!tgt.body)return;

    // Shield interaction
    if(isTgtShielding && tgtShieldHp > 0){
      if(tgtId==="p1") S.p1ShieldHp--; else S.p2ShieldHp--;
      goldSpark(this, tgt.x, tgt.y);
      this.cameras.main.shake(40,0.003); // light shake for block
      return; 
    }

    // Logic Fix: Random damage pools + double burst boost
    let power = isProjectile ? Phaser.Math.Between(5,9) : Phaser.Math.Between(3,7);
    if(atkId==="p1" && S.p1BurstBuff) power *= 2; 

    if(tgtId==="p2")Match.p2Pct+=power;else Match.p1Pct+=power;
    const pct=tgtId==="p2"?Match.p2Pct:Match.p1Pct;

    const kbScale=Math.min(4,1+(pct*0.015));
    const dir=tgt.x>=atk.x?1:-1;
    tgt.body.setVelocity(dir*180*kbScale,-160*kbScale);

    const tPre=tgtId==="p2"?this.p2Pre:this.p1Pre;
    const fHit=FRAMES[tPre==="j"?"juni":"pyro"];
    
    // Knockdown threshold now scales with difficulty max health
    if(pct > (Match.maxHealth*0.35)){
      tgt.setFrame(fHit.knock);
      if(this.anims.exists(tPre+"_launch")) this.time.delayedCall(40,()=>{ if(tgt.active) tgt.play(tPre+"_launch",true); });
    } else {
      tgt.setFrame(fHit.dmg[0]);
      if(this.anims.exists(tPre+"_dmg")) this.time.delayedCall(30,()=>{ if(tgt.active) tgt.play(tPre+"_dmg",true); });
    }

    this.cameras.main.shake(isProjectile?40:65,0.007);
    if(tgtId==="p2")S.p2Stun=true;else S.p1Stun=true;
    this.time.delayedCall(150,()=>{
      if(!S.gameOver){if(tgtId==="p2")S.p2Stun=false;else S.p1Stun=false;}
    });
    this.tweens.add({targets:tgt,alpha:{from:0.5,to:1},duration:140});
    this.refreshHUD();
  }

  spawnMelee(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1;
    const isJuni=pre==="j";
    arcSlash(this,sp.x,sp.y,dir,isJuni);
    const mReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(mReg.melee);
    if(this.anims.exists(pre+"_melee")) this.time.delayedCall(30,()=>sp.play(pre+"_melee",true));
    const hit=this.add.rectangle(sp.x+dir*40,sp.y-6,34,28,0xFFD700,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false).setImmovable(true);
    hit.setData("owner",id);hit.life=0;
    this.meleeGrp.add(hit);
  }

  spawnProjectile(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1;
    const isJuni=pre==="j";
    const fReg=FRAMES[isJuni?"juni":"pyro"];

    sp.setFrame(fReg.range);
    if(this.anims.exists(pre+"_range")) this.time.delayedCall(30,()=>{ if(sp.active) sp.play(pre+"_range",true); });

    const vis=this.add.sprite(sp.x+dir*40,sp.y-8,isJuni?"j_sheet":"p_sheet",fReg.proj).setDisplaySize(38,38).setDepth(50);
    vis.setFlipX(dir===-1); // Logic Fix: Correctly flips visual depending on firing dir

    const hit=this.add.rectangle(sp.x+dir*40,sp.y-8,18,18,0xFFFFFF,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false);
    // Logic Fix: Shoots straight, homing disabled
    hit.body.setVelocityX(dir * 550);
    
    hit.setData("owner",id);
    hit.setData("vis",vis);
    hit.life=0;
    this.projGrp.add(hit);
  }

  spawnBurst(id){
    const sp=id==="p1"?this.p1:this.p2;
    const pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const fReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(fReg.burst);
    if(this.anims.exists(pre+"_burst")) this.time.delayedCall(60,()=>sp.play(pre+"_burst",true));
    const isJuni=pre==="j";
    const col=isJuni?0x00FF88:0xFF2200;
    const ring=this.add.circle(sp.x,sp.y,90,col,0.2).setDepth(49);
    const ring2=this.add.circle(sp.x,sp.y,55,col,0.35).setDepth(50);
    this.tweens.add({targets:[ring,ring2],scaleX:1.6,scaleY:1.6,alpha:0,duration:420,onComplete:()=>{ring.destroy();ring2.destroy();}});
    for(let i=0;i<14;i++){
      const ang=Math.random()*Math.PI*2,len=20+Math.random()*70;
      const dot=this.add.rectangle(sp.x+Math.cos(ang)*len,sp.y+Math.sin(ang)*len,8,8,col,0.9).setDepth(51);
      this.tweens.add({targets:dot,x:sp.x+Math.cos(ang)*(len+40),y:sp.y+Math.sin(ang)*(len+40),alpha:0,duration:380,onComplete:()=>dot.destroy()});
    }
    const tgt=id==="p1"?this.p2:this.p1;
    if(tgt.active&&Phaser.Math.Distance.Between(sp.x,sp.y,tgt.x,tgt.y)<95){
      goldSpark(this,tgt.x,tgt.y-20);
      const power=15; // Raw burst AOE damage
      const tgtId=id==="p1"?"p2":"p1";
      if(tgtId==="p2")Match.p2Pct+=power;else Match.p1Pct+=power;
      const pct=tgtId==="p2"?Match.p2Pct:Match.p1Pct;
      const tPre=tgtId==="p2"?this.p2Pre:this.p1Pre;
      const kbScale=Math.min(4,1+(pct*0.015));
      const dir=tgt.x>=sp.x?1:-1;
      tgt.body.setVelocity(dir*160*kbScale,-140*kbScale);
      const bfReg=FRAMES[tPre==="j"?"juni":"pyro"];
      tgt.setFrame(pct>(Match.maxHealth*0.35)?bfReg.knock:bfReg.dmg[0]);
      if(this.anims.exists(tPre+(pct>(Match.maxHealth*0.35)?"_launch":"_dmg"))) this.time.delayedCall(35,()=>{ if(tgt.active) tgt.play(tPre+(pct>(Match.maxHealth*0.35)?"_launch":"_dmg"),true); });
      this.cameras.main.shake(120,0.01);
      const tgtSp=tgtId==="p2"?"p2":"p1";
      if(tgtSp==="p2")this.S.p2Stun=true;else this.S.p1Stun=true;
      this.time.delayedCall(180,()=>{if(tgtSp==="p2")this.S.p2Stun=false;else this.S.p1Stun=false;});
      this.refreshHUD();
    }
  }

  runCPU(dt){
    const S=this.S,sp=this.p2;
    if(S.state!=="PLAYING" || !sp.active || S.p2Stun || !sp.body)return;
    if(sp.body.blocked.down)S.p2Jumps=0;
    const dx=this.p1.x-sp.x,absX=Math.abs(dx);
    if(absX>40){sp.body.setVelocityX(dx>0?this.cpuSpeed:-this.cpuSpeed);sp.setFlipX(dx<0);}
    else sp.body.setVelocityX(sp.body.velocity.x*0.6);
    this.cpuAtkTimer+=dt;
    if(absX>60&&S.p2Jumps<2&&Math.random()<0.022){sp.body.setVelocityY(-600);S.p2Jumps++;this.cpuAtkTimer=0;}
    if(absX<75&&Math.random()<this.cpuAtkFreq&&!this.cpuAtkCD){
      this.cpuAtkCD=true;this.spawnMelee("p2");this.time.delayedCall(Match.difficulty==="HARD"?350:480,()=>this.cpuAtkCD=false);
    }
    this.cpuFireTimer+=dt;
    if(absX>90&&absX<300&&Math.random()<this.cpuFireFreq&&!this.cpuAtkCD){
      this.cpuAtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(360,()=>this.cpuAtkCD=false);
    }
    if(Match.p2Pct>80&&Math.random()<0.005) this.spawnBurst("p2");
    
    if(!sp.anims.isPlaying||sp.anims.currentAnim?.key===this.p2Pre+"_idle"||sp.anims.currentAnim?.key===this.p2Pre+"_dmg"){
      if(!["_melee","_range","_burst","_launch","_dmg","_jump"].some(s=>sp.anims.currentAnim?.key.includes(s)))
        sp.play(this.p2Pre+"_idle",true);
    }
  }

  moveP1(){
    const S=this.S,sp=this.p1,pre=this.p1Pre,k=this.keys;
    if(S.state!=="PLAYING" || !sp.active || !sp.body) return;
    if(sp.body.blocked.down)S.p1Jumps=0;

    // Logic Fix: Shield overrides anims perfectly and holds frame
    if((k.S.isDown || k.DOWN.isDown || MP.f) && S.p1ShieldHp > 0){
      sp.body.setVelocityX(0);
      const fReg=FRAMES[pre==="j"?"juni":"pyro"];
      sp.setFrame(fReg.shield);
      return; 
    }

    if(!S.p1Stun){
      const gL=k.A.isDown||MP.l||JOY.vx<-0.25,gR=k.D.isDown||MP.r||JOY.vx>0.25;
      if(gL){sp.body.setVelocityX(-260);sp.setFlipX(true);}
      else if(gR){sp.body.setVelocityX(260);sp.setFlipX(false);}
      else sp.body.setVelocityX(sp.body.velocity.x*0.7);

      const combatAnims=["_melee","_range","_burst","_launch","_dmg","_jump"];
      const inCombat=sp.anims.currentAnim&&combatAnims.some(s=>sp.anims.currentAnim.key.includes(s));
      if(!inCombat) sp.play(pre+"_idle",true);

      if((Phaser.Input.Keyboard.JustDown(k.W)||MP.j||JOY.vy<-0.6)&&S.p1Jumps<2){
        sp.body.setVelocityY(-600);S.p1Jumps++;
        sp.play(pre+"_jump",true);MP.j=false;
      }
      if((Phaser.Input.Keyboard.JustDown(k.J)||MP.a)&&!S.p1AtkCD){
        S.p1AtkCD=true;this.spawnMelee("p1");
        this.time.delayedCall(210,()=>S.p1AtkCD=false);MP.a=false;
      }
      // Logic Fix: 1.5s projectile gauge implementation
      if((Phaser.Input.Keyboard.JustDown(k.K)||MP.s)&&!S.p1AtkCD && S.p1ProjReady){
        S.p1ProjReady=false;
        this.spawnProjectile("p1");
        this.time.delayedCall(1500, ()=>{ S.p1ProjReady=true; this.refreshHUD(); });
        MP.s=false;
      }
      // Logic Fix: Limited Burst logic
      if((Phaser.Input.Keyboard.JustDown(k.SEMI)||MP.b) && S.p1Bursts > 0){
        S.p1Bursts--;
        this.spawnBurst("p1");
        S.p1BurstBuff = true; 
        this.time.delayedCall(5000, ()=> S.p1BurstBuff = false); // Buff wears off
        this.refreshHUD();
        MP.b=false;
      }
    }
  }

  updateCamera(){
    const p1x=this.p1.active?this.p1.x:GW/2;
    const p2x=this.p2.active?this.p2.x:GW/2;
    const mx=(p1x+p2x)/2;
    this.camX+=(mx-this.camX)*0.08;
    const dist=Math.abs(p1x-p2x);
    const raw=dist<180?1.18:dist>420?0.86:1.0;
    this.targetZoom=Phaser.Math.Clamp(raw,0.82,1.22);
    this.cameras.main.zoom+=(this.targetZoom-this.cameras.main.zoom)*0.04;
    this.cameras.main.centerOn(this.camX,GH/2);
  }

  update(time,dt){
    const S=this.S;

    if(Phaser.Input.Keyboard.JustDown(this.keys.P)){
      Match.paused=!Match.paused;
      this.physics.world.isPaused=Match.paused;
      if(Match.paused){
        this.pauseContainer.removeAll(true);
        const pBg=this.add.rectangle(0,0,440,260,0x050308,0.96).setStrokeStyle(3,0xFFD700);
        const pTxt=this.add.text(0,-100,"⏸  PAUSED",{fontFamily:"Press Start 2P",fontSize:"14px",color:"#FFD700"}).setOrigin(0.5);
        const bKey=BOOK_LIST[Math.floor(Math.random()*BOOK_LIST.length)];
        const bUrl=BOOK_LINKS[bKey];
        const bookImg=this.add.image(0,-30,bKey).setDisplaySize(70,105).setInteractive({useHandCursor:true});
        bookImg.on("pointerdown",()=>window.open(bUrl,"_blank"));
        const bookHint=this.add.text(0,45,"📖 READ THE LEGEND →",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#55AAFF"}).setOrigin(0.5).setInteractive({useHandCursor:true});
        bookHint.on("pointerdown",()=>window.open(bUrl,"_blank"));
        
        const rBtn=this.add.text(-90,95,"🔄 RESTART",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#00FF88",backgroundColor:"#111",padding:{x:12,y:8}}).setOrigin(0.5).setInteractive({useHandCursor:true});
        rBtn.on("pointerdown",()=>{Match.paused=false; this.scene.restart();});
        
        const qBtn=this.add.text(90,95,"◀ QUIT",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#050308",backgroundColor:"#FFD700",padding:{x:12,y:8}}).setOrigin(0.5).setInteractive({useHandCursor:true});
        qBtn.on("pointerdown",()=>{Match.paused=false;this.physics.world.isPaused=false;this.scene.start("BrawlerScene");});
        
        this.pauseContainer.add([pBg,pTxt,bookImg,bookHint,rBtn,qBtn]);
      }
      this.pauseContainer.setVisible(Match.paused);
    }
    if(Match.paused||S.gameOver)return;

    this.meleeGrp.children.iterate(h=>{
      if(!h)return;h.life+=dt;if(h.life>200)h.destroy();
    });
    
    this.projGrp.children.iterate(h=>{
      if(!h||!h.active)return;
      h.life+=dt;
      const vis=h.getData("vis");
      if(vis&&vis.active){ vis.x=h.x; vis.y=h.y; }
      
      // Logic Fix: Destroys cleanly if it flies out of the map bounds
      if(h.life>1600||h.x<BLAST.minX||h.x>BLAST.maxX||h.y<BLAST.minY||h.y>BLAST.maxY){
        if(vis&&vis.active)vis.destroy();
        h.destroy();
      }
    });

    this.moveP1();
    this.runCPU(dt);

    [["p1",this.p1],["p2",this.p2]].forEach(([id,sp])=>{
      if(!sp.active)return;
      if(sp.x<BLAST.minX||sp.x>BLAST.maxX||sp.y<BLAST.minY||sp.y>BLAST.maxY)
        this.respawnOrEnd(id);
    });

    this.updateCamera();
    
    // Animate the projectile gauge smoothly
    if(!this.S.p1ProjReady){
        this.p1ProjBar.scaleX += (1.0 / (1500/dt)); 
    }

    if(this.p1.active&&this.p1.body&&!this.p1.anims.isPlaying&&Math.abs(this.p1.body.velocity.x)<40){
      const fSafe=FRAMES[this.p1Pre==="j"?"juni":"pyro"];
      this.p1.setFrame(fSafe.idle[0]);
    }
  }
}

class ResultsScene extends Phaser.Scene{
  constructor(){super("ResultsScene");}
  create(){
    document.getElementById("mc").classList.remove("on");
    this.add.image(GW/2,GH/2,"bg_eyes").setDisplaySize(GW,GH).setAlpha(0.35);
    const winner=Match.winner==="P1"?Match.p1:Match.p2;
    const wc=winner==="Juni"?"#00FF88":"#FF6600";
    const wSheet=winner==="Juni"?"j_sheet":"p_sheet";
    const wPre=winner==="Juni"?"j":"p";
    const portrait=this.add.sprite(GW/2,GH/2-65,wSheet).setDisplaySize(120,120);
    if(this.anims.exists(wPre+"_idle"))portrait.play(wPre+"_idle");
    this.tweens.add({targets:portrait,scaleX:1.08,scaleY:1.08,yoyo:true,repeat:-1,duration:800});
    this.add.text(GW/2,GH/2+14,"SECTOR CLEARED",{fontFamily:"Press Start 2P",fontSize:"17px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+44,Match.winner+" WINS — "+winner.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"10px",color:wc}).setOrigin(0.5);
    const url1=winner==="Juni"?BOOK_LINKS.juni_en:BOOK_LINKS.pyro_en;
    const lore1=winner==="Juni"?"Enter if you dare; face Anubis in the sands of time.":"Born from the forge. His tusks run hotter than the mine walls.";
    const cta1=this.add.text(GW/2,GH/2+68,"★ "+lore1,{fontFamily:"Press Start 2P",fontSize:"6px",color:wc,align:"center",wordWrap:{width:GW-40}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta1.on("pointerdown",()=>window.open(url1,"_blank"));
    this.tweens.add({targets:cta1,alpha:0.5,duration:900,yoyo:true,repeat:-1});
    const cta2=this.add.text(GW/2,GH/2+96,winner==="Juni"?"📡 Also: Outbreak from the Stars →":"📗 Also: Juni the Immortal →",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#555"}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta2.on("pointerover",()=>cta2.setColor("#AAA"));cta2.on("pointerout",()=>cta2.setColor("#555"));
    cta2.on("pointerdown",()=>window.open(winner==="Juni"?BOOK_LINKS.outbreak_en:BOOK_LINKS.juni_en,"_blank"));
    this.add.text(GW/2,GH-26,"Do you want to test your luck again?",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#888"}).setOrigin(0.5);
    this.add.text(GW/2,GH-13,"ANY KEY / TAP = REMATCH    ESC = MENU",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#444"}).setOrigin(0.5);
    this.input.keyboard.on("keydown",e=>{
      if(e.key==="Escape")this.scene.start("BrawlerScene");
      else this.scene.start("BattleScene");
    });
    this.input.on("pointerdown",()=>this.scene.start("BattleScene"));
  }
}
