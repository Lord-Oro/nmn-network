<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NMN: MINE WARFARE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #050308;
      color: #FFD700;
      font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1b1530 0%, #050308 60%, #000000 100%);
    }

    canvas {
      border: 2px solid #FFD700;
      image-rendering: pixelated;
      width: 100% !important;
      height: 100% !important;
      display: block;
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // -----------------------------
    // Core constants & globals
    // -----------------------------
    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 450;

    const BLAST_ZONE = {
      minX: -100,
      maxX: 900,
      minY: -100,
      maxY: 600
    };

    const FREE_FOUR = ["Juni", "Pyro", "Glitch Elephant", "Static Lion"];

    const ROSTER = [
      { name: "Juni", free: true },
      { name: "Pyro", free: true },
      { name: "Glitch Elephant", free: true },
      { name: "Static Lion", free: true },
      { name: "Olydia", free: false, url: "https://books2read.com" },
      { name: "Helios", free: false, url: "https://books2read.com" },
      { name: "Wanderer", free: false, url: "https://books2read.com" },
      { name: "Orid", free: false, url: "https://books2read.com" },
      { name: "Notty", free: false, url: "https://patreon.com" },
      { name: "???", free: false, url: "https://nonsensemedianetwork.com" }
    ];

    const STAGES = [
      {
        key: "mana_forest",
        label: "Mana Forest",
        bgKey: "forest_bg"
      },
      {
        key: "glitch_mines",
        label: "Glitch Mines",
        bgKey: "glitch_bg"
      }
    ];

    // Shared match state
    const MatchState = {
      p1Character: null,
      p2Character: null,
      stageKey: null,
      winner: null
    };

    // -----------------------------
    // Start Screen Scene
    // -----------------------------
    class StartScreen extends Phaser.Scene {
      constructor() {
        super("StartScreen");
      }

      preload() {
        // Logo + preview backgrounds
        this.load.image("title_img", "logo.jpg");
        this.load.image("forest_bg", "forest_bg.jpg");
        this.load.image("glitch_bg", "glitch_bg.jpg");
      }

      create() {
        // Background with subtle CRT feel
        const bg = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, "forest_bg");
        bg.setAlpha(0.25);
        bg.setDisplaySize(GAME_WIDTH, GAME_HEIGHT);

        const logo = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 80, "title_img");
        logo.setScale(0.5);

        const subtitle = this.add.text(
          GAME_WIDTH / 2,
          GAME_HEIGHT / 2 + 10,
          "NMN: MINE WARFARE",
          {
            fontFamily: "Press Start 2P",
            fontSize: "14px",
            color: "#FFD700"
          }
        ).setOrigin(0.5);

        const startTxt = this.add.text(
          GAME_WIDTH / 2,
          GAME_HEIGHT / 2 + 80,
          "PRESS ANY KEY TO START",
          {
            fontFamily: "Press Start 2P",
            fontSize: "12px",
            color: "#FFD700"
          }
        ).setOrigin(0.5);

        this.tweens.add({
          targets: startTxt,
          alpha: 0,
          duration: 800,
          yoyo: true,
          repeat: -1
        });

        // Input to move to roster
        this.input.keyboard.on("keydown", () => {
          this.scene.start("BrawlerScene");
        });

        this.input.on("pointerdown", () => {
          this.scene.start("BrawlerScene");
        });
      }
    }

    // -----------------------------
    // Roster / Brawler Select Scene
    // -----------------------------
    class BrawlerScene extends Phaser.Scene {
      constructor() {
        super("BrawlerScene");
      }

      create() {
        this.add.rectangle(0, 0, GAME_WIDTH * 2, GAME_HEIGHT * 2, 0x050308).setOrigin(0);

        this.add.text(20, 20, "SELECT YOUR BRAWLER", {
          fontFamily: "Press Start 2P",
          fontSize: "12px",
          color: "#FFD700"
        });

        this.add.text(20, 40, "Free Four + Locked Legends", {
          fontFamily: "Press Start 2P",
          fontSize: "8px",
          color: "#AAAAAA"
        });

        const gridStartX = 80;
        const gridStartY = 90;
        const cellW = 150;
        const cellH = 80;
        const cols = 3;

        this.selectedIndexP1 = 0;
        this.selectedIndexP2 = 1;

        ROSTER.forEach((entry, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);

          const x = gridStartX + col * cellW;
          const y = gridStartY + row * cellH;

          const isFree = entry.free;
          const borderColor = isFree ? 0x00ff88 : 0x444444;

          const panel = this.add.rectangle(x, y, 130, 60, 0x111111)
            .setStrokeStyle(2, borderColor)
            .setOrigin(0);

          const nameText = this.add.text(
            x + 8,
            y + 8,
            entry.name,
            {
              fontFamily: "Press Start 2P",
              fontSize: "8px",
              color: isFree ? "#FFD700" : "#888888"
            }
          );

          if (!isFree) {
            this.add.text(
              x + 8,
              y + 28,
              "LOCKED",
              {
                fontFamily: "Press Start 2P",
                fontSize: "8px",
                color: "#FF5555"
              }
            );
            this.add.text(
              x + 8,
              y + 42,
              "BUY",
              {
                fontFamily: "Press Start 2P",
                fontSize: "8px",
                color: "#55AAFF"
              }
            );
          } else {
            this.add.text(
              x + 8,
              y + 28,
              "FREE",
              {
                fontFamily: "Press Start 2P",
                fontSize: "8px",
                color: "#00FF88"
              }
            );
          }

          panel.setInteractive({ useHandCursor: true });

          panel.on("pointerdown", () => {
            if (!isFree && entry.url) {
              window.open(entry.url, "_blank");
              return;
            }

            // Simple: first click sets P1, second sets P2, then go to stage select
            if (!MatchState.p1Character) {
              MatchState.p1Character = entry.name;
            } else if (!MatchState.p2Character) {
              MatchState.p2Character = entry.name;
            }

            if (MatchState.p1Character && MatchState.p2Character) {
              this.scene.start("StageSelectScene");
            }
          });
        });

        this.add.text(
          20,
          GAME_HEIGHT - 60,
          "Click FREE brawlers for P1 then P2.\nClick LOCKED to open store.",
          {
            fontFamily: "Press Start 2P",
            fontSize: "8px",
            color: "#AAAAAA"
          }
        );
      }
    }

    // -----------------------------
    // Stage Select Scene
    // -----------------------------
    class StageSelectScene extends Phaser.Scene {
      constructor() {
        super("StageSelectScene");
      }

      create() {
        this.add.rectangle(0, 0, GAME_WIDTH * 2, GAME_HEIGHT * 2, 0x050308).setOrigin(0);

        this.add.text(20, 20, "SELECT STAGE", {
          fontFamily: "Press Start 2P",
          fontSize: "12px",
          color: "#FFD700"
        });

        const centerY = GAME_HEIGHT / 2;

        STAGES.forEach((stage, index) => {
          const x = GAME_WIDTH / 2 + (index === 0 ? -150 : 150);
          const y = centerY;

          const panel = this.add.rectangle(x - 80, y - 40, 160, 80, 0x111111)
            .setStrokeStyle(2, 0xFFD700)
            .setOrigin(0);

          const label = this.add.text(
            x,
            y - 10,
            stage.label,
            {
              fontFamily: "Press Start 2P",
              fontSize: "10px",
              color: "#FFD700"
            }
          ).setOrigin(0.5);

          const hint = this.add.text(
            x,
            y + 14,
            stage.key === "mana_forest" ? "GREEN/BRONZE/STABLE" : "PURPLE/BLUE/UNSTABLE",
            {
              fontFamily: "Press Start 2P",
              fontSize: "7px",
              color: "#AAAAAA"
            }
          ).setOrigin(0.5);

          panel.setInteractive({ useHandCursor: true });
          panel.on("pointerdown", () => {
            MatchState.stageKey = stage.key;
            this.scene.start("BattleScene");
          });
        });

        this.add.text(
          20,
          GAME_HEIGHT - 40,
          "Click a stage to begin the match.",
          {
            fontFamily: "Press Start 2P",
            fontSize: "8px",
            color: "#AAAAAA"
          }
        );
      }
    }

    // -----------------------------
    // Battle Scene (Core Brawler)
    // -----------------------------
    class BattleScene extends Phaser.Scene {
      constructor() {
        super("BattleScene");
      }

      preload() {
        // Backgrounds already loaded in StartScreen, but safe to ensure
        this.load.image("forest_bg", "forest_bg.jpg");
        this.load.image("glitch_bg", "glitch_bg.jpg");

        // TODO: hook to your sprite sheet:
        // this.load.spritesheet("brawlers_master", "NMN_War_Beta_V1.png", {
        //   frameWidth: 128,
        //   frameHeight: 128
        // });
      }

      create() {
        // Background based on stage
        const stage = STAGES.find(s => s.key === MatchState.stageKey) || STAGES[0];
        const bgKey = stage.bgKey;

        const bg = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, bgKey);
        bg.setDisplaySize(GAME_WIDTH * 1.2, GAME_HEIGHT * 1.2);
        bg.setAlpha(0.9);

        // Simple parallax overlay
        const overlay = this.add.rectangle(0, 0, GAME_WIDTH * 2, GAME_HEIGHT * 2, 0x000000)
          .setOrigin(0)
          .setAlpha(0.25);

        // HUD
        this.createHUD();

        // Physics world
        this.physics.world.setBounds(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Ground
        const ground = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - 30, GAME_WIDTH, 40, 0x111111);
        this.physics.add.existing(ground, true);

        // Players (placeholder rectangles; later swap to sprites)
        this.p1 = this.add.rectangle(250, GAME_HEIGHT - 80, 32, 48, 0x00ff88);
        this.p2 = this.add.rectangle(550, GAME_HEIGHT - 80, 32, 48, 0xff5555);

        this.physics.add.existing(this.p1);
        this.physics.add.existing(this.p2);

        this.p1.body.setCollideWorldBounds(true);
        this.p2.body.setCollideWorldBounds(true);

        this.physics.add.collider(this.p1, ground);
        this.physics.add.collider(this.p2, ground);

        // Damage percents
        this.p1Damage = 0;
        this.p2Damage = 0;

        // Controls
        this.cursors = this.input.keyboard.createCursorKeys();

        this.keysP1 = this.input.keyboard.addKeys({
          up: Phaser.Input.Keyboard.KeyCodes.W,
          left: Phaser.Input.Keyboard.KeyCodes.A,
          down: Phaser.Input.Keyboard.KeyCodes.S,
          right: Phaser.Input.Keyboard.KeyCodes.D,
          attack: Phaser.Input.Keyboard.KeyCodes.J,
          special: Phaser.Input.Keyboard.KeyCodes.K
        });

        this.keysP2 = this.input.keyboard.addKeys({
          attack: Phaser.Input.Keyboard.KeyCodes.NUMPAD_ONE,
          special: Phaser.Input.Keyboard.KeyCodes.NUMPAD_TWO
        });

        // Gamepad support
        this.gamepad = null;
        this.input.gamepad.once("connected", pad => {
          this.gamepad = pad;
        });

        // Simple overlap to simulate attacks (in a real build, use hitboxes)
        this.physics.add.overlap(this.p1, this.p2, () => {
          // handled via attack buttons
        });

        // Attack cooldowns
        this.p1CanAttack = true;
        this.p2CanAttack = true;

        // Camera slight zoom
        this.cameras.main.setBounds(0, 0, GAME_WIDTH, GAME_HEIGHT);
        this.cameras.main.setZoom(1.05);
      }

      createHUD() {
        this.hudP1 = this.add.text(
          20,
          10,
          "P1: 0%",
          {
            fontFamily: "Press Start 2P",
            fontSize: "10px",
            color: "#00FF88"
          }
        );

        this.hudP2 = this.add.text(
          GAME_WIDTH - 20,
          10,
          "P2: 0%",
          {
            fontFamily: "Press Start 2P",
            fontSize: "10px",
            color: "#FF5555",
            align: "right"
          }
        ).setOrigin(1, 0);

        this.stageLabel = this.add.text(
          GAME_WIDTH / 2,
          10,
          (MatchState.stageKey || "STAGE").toUpperCase(),
          {
            fontFamily: "Press Start 2P",
            fontSize: "8px",
            color: "#FFD700"
          }
        ).setOrigin(0.5, 0);
      }

      update() {
        this.handleMovement();
        this.handleAttacks();
        this.checkBlastZones();
        this.updateHUD();
      }

      handleMovement() {
        // P1 movement (WASD)
        const p1Body = this.p1.body;

        const speed = 180;
        const jumpSpeed = -320;

        // Horizontal
        if (this.keysP1.left.isDown) {
          p1Body.setVelocityX(-speed);
        } else if (this.keysP1.right.isDown) {
          p1Body.setVelocityX(speed);
        } else {
          p1Body.setVelocityX(0);
        }

        // Jump
        if (this.keysP1.up.isDown && p1Body.blocked.down) {
          p1Body.setVelocityY(jumpSpeed);
        }

        // P2 movement (Arrow keys)
        const p2Body = this.p2.body;

        if (this.cursors.left.isDown) {
          p2Body.setVelocityX(-speed);
        } else if (this.cursors.right.isDown) {
          p2Body.setVelocityX(speed);
        } else {
          p2Body.setVelocityX(0);
        }

        if (this.cursors.up.isDown && p2Body.blocked.down) {
          p2Body.setVelocityY(jumpSpeed);
        }

        // Gamepad (optional override for P2)
        if (this.gamepad) {
          const axisH = this.gamepad.axes.length > 0 ? this.gamepad.axes[0].getValue() : 0;
          if (Math.abs(axisH) > 0.2) {
            p2Body.setVelocityX(axisH * speed * 1.2);
          }

          if (this.gamepad.buttons[0].pressed && p2Body.blocked.down) {
            p2Body.setVelocityY(jumpSpeed);
          }
        }
      }

      handleAttacks() {
        // P1 attack (J)
        if (this.keysP1.attack.isDown && this.p1CanAttack) {
          this.p1CanAttack = false;
          this.time.delayedCall(250, () => (this.p1CanAttack = true));

          if (Phaser.Math.Distance.Between(this.p1.x, this.p1.y, this.p2.x, this.p2.y) < 60) {
            this.applyHit("P1", this.p2, "P2");
          }
        }

        // P2 attack (Num1 or gamepad button)
        const p2AttackPressed =
          this.keysP2.attack.isDown ||
          (this.gamepad && this.gamepad.buttons[1] && this.gamepad.buttons[1].pressed);

        if (p2AttackPressed && this.p2CanAttack) {
          this.p2CanAttack = false;
          this.time.delayedCall(250, () => (this.p2CanAttack = true));

          if (Phaser.Math.Distance.Between(this.p2.x, this.p2.y, this.p1.x, this.p1.y) < 60) {
            this.applyHit("P2", this.p1, "P1");
          }
        }
      }

      applyHit(attackerId, targetSprite, targetId) {
        // Increase damage
        if (targetId === "P1") {
          this.p1Damage += 10;
        } else {
          this.p2Damage += 10;
        }

        const damagePercent = targetId === "P1" ? this.p1Damage : this.p2Damage;

        // Knockback calculation
        const knockback = this.calculateKnockback(damagePercent);

        const directionX = targetSprite.x < (attackerId === "P1" ? this.p1.x : this.p2.x) ? -1 : 1;

        targetSprite.body.setVelocity(
          knockback.x * directionX,
          knockback.y
        );
      }

      calculateKnockback(damagePercent) {
        // Simple percent-based knockback
        const baseX = 180;
        const baseY = -220;
        const scale = 1 + damagePercent * 0.03;

        return {
          x: baseX * scale,
          y: baseY * scale
        };
      }

      checkBlastZones() {
        // P1
        if (
          this.p1.x < BLAST_ZONE.minX ||
          this.p1.x > BLAST_ZONE.maxX ||
          this.p1.y < BLAST_ZONE.minY ||
          this.p1.y > BLAST_ZONE.maxY
        ) {
          MatchState.winner = "P2";
          this.signalLost("P1");
        }

        // P2
        if (
          this.p2.x < BLAST_ZONE.minX ||
          this.p2.x > BLAST_ZONE.maxX ||
          this.p2.y < BLAST_ZONE.minY ||
          this.p2.y > BLAST_ZONE.maxY
        ) {
          MatchState.winner = "P1";
          this.signalLost("P2");
        }
      }

      signalLost(loserId) {
        // Quick flash + transition
        this.cameras.main.flash(400, 255, 255, 255);
        this.time.delayedCall(600, () => {
          this.scene.start("ResultsScene");
        });
      }

      updateHUD() {
        this.hudP1.setText(`P1: ${this.p1Damage}%`);
        this.hudP2.setText(`P2: ${this.p2Damage}%`);
      }
    }

    // -----------------------------
    // Results Scene
    // -----------------------------
    class ResultsScene extends Phaser.Scene {
      constructor() {
        super("ResultsScene");
      }

      create() {
        this.add.rectangle(0, 0, GAME_WIDTH * 2, GAME_HEIGHT * 2, 0x050308).setOrigin(0);

        const winner = MatchState.winner || "P1";

        this.add.text(
          GAME_WIDTH / 2,
          GAME_HEIGHT / 2 - 40,
          "SECTOR CLEARED",
          {
            fontFamily: "Press Start 2P",
            fontSize: "16px",
            color: "#FFD700"
          }
        ).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          GAME_HEIGHT / 2,
          `${winner} WINS`,
          {
            fontFamily: "Press Start 2P",
            fontSize: "12px",
            color: "#FFFFFF"
          }
        ).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          GAME_HEIGHT / 2 + 60,
          "PRESS ANY KEY TO REMATCH\nPRESS ESC FOR TITLE",
          {
            fontFamily: "Press Start 2P",
            fontSize: "8px",
            color: "#AAAAAA",
            align: "center"
          }
        ).setOrigin(0.5);

        this.input.keyboard.on("keydown", (event) => {
          if (event.key === "Escape") {
            // Reset match state
            MatchState.p1Character = null;
            MatchState.p2Character = null;
            MatchState.stageKey = null;
            MatchState.winner = null;
            this.scene.start("StartScreen");
          } else {
            // Rematch same characters & stage
            this.scene.start("BattleScene");
          }
        });

        this.input.on("pointerdown", () => {
          this.scene.start("BattleScene");
        });
      }
    }

    // -----------------------------
    // Game config & boot
    // -----------------------------
    const config = {
      type: Phaser.AUTO,
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      parent: "game-container",
      backgroundColor: "#000000",
      physics: {
        default: "arcade",
        arcade: {
          gravity: { y: 600 },
          debug: false
        }
      },
      scene: [
        StartScreen,
        BrawlerScene,
        StageSelectScene,
        BattleScene,
        ResultsScene
      ]
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
