<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-P5WL9XNDY8');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMN Brawler | The Forge Beta</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #070605; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        #game-container { width: 100%; max-width: 800px; aspect-ratio: 2 / 1; }
        canvas { border: 2px solid #FFD700; width: 100% !important; height: auto !important; }
    </style>
</head>
<body>
    <div id="game-container"></div>
<script>
let player, enemy, cursors, keyX, keyC, keySpace;
let pHealth = 100, eHealth = 100, canDoubleJump = false;
let gameState = 'TITLE', selectedChar = 'PYRO';

const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 800,
    height: 400,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 1400 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {
    this.load.image('background', 'forest_bg.jpg'); // Ensure you upload a bg image
    this.load.spritesheet('elephants', 'hero-sheet.png', { frameWidth: 28, frameHeight: 52, margin: 1, spacing: 2 });
}

function create() {
    this.add.image(400, 200, 'background').setDisplaySize(800, 400);
    
    const platforms = this.physics.add.staticGroup();
    platforms.create(400, 390, 'ground').setDisplaySize(800, 20).refreshBody(); // Ground
    platforms.create(200, 250, 'ground').setDisplaySize(150, 20).refreshBody(); // Left Platform
    platforms.create(600, 250, 'ground').setDisplaySize(150, 20).refreshBody(); // Right Platform
    platforms.create(400, 150, 'ground').setDisplaySize(150, 20).refreshBody(); // Top Platform

    player = this.physics.add.sprite(100, 300, 'elephants', 0).setScale(2.5).setCollideWorldBounds(true);
    enemy = this.physics.add.sprite(700, 300, 'elephants', 20).setScale(2.5).setCollideWorldBounds(true);
    enemy.flipX = true;

    this.physics.add.collider(player, platforms);
    this.physics.add.collider(enemy, platforms);

    this.projectiles = this.physics.add.group();
    this.physics.add.overlap(this.projectiles, enemy, (en, proj) => { proj.destroy(); eHealth -= 10; });

    cursors = this.input.keyboard.createCursorKeys();
    keyX = this.input.keyboard.addKey('X');
    keyC = this.input.keyboard.addKey('C');
    keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
}

function update() {
    // Movement logic
    if (cursors.left.isDown) { player.setVelocityX(-200); player.flipX = true; }
    else if (cursors.right.isDown) { player.setVelocityX(200); player.flipX = false; }
    else { player.setVelocityX(0); }

    // Double Jump Logic
    if (Phaser.Input.Keyboard.JustDown(keySpace)) {
        if (player.body.touching.down) {
            player.setVelocityY(-500);
            canDoubleJump = true;
        } else if (canDoubleJump) {
            player.setVelocityY(-450);
            canDoubleJump = false;
        }
    }

    // Attack Logic
    if (Phaser.Input.Keyboard.JustDown(keyX)) shootLongRange(this);
    if (Phaser.Input.Keyboard.JustDown(keyC)) meleeAttack(this);
}

function shootLongRange(scene) {
    let p = scene.add.rectangle(player.x, player.y, 20, 5, 0xFFD700);
    scene.projectiles.add(p);
    scene.physics.add.existing(p);
    p.body.setAllowGravity(false);
    p.body.setVelocityX(player.flipX ? -600 : 600);
}

function meleeAttack(scene) {
    if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 60) {
        eHealth -= 15;
        enemy.setTint(0xff0000);
        scene.time.delayedCall(100, () => enemy.clearTint());
    }
}
</script>
</body>
</html>
