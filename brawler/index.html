<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>NMN Presents: Nonsensical Brawlers v1.8</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; touch-action: none; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 140px; pointer-events: none; z-index: 999; }
        .mb {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 3px solid #FFD700; background: rgba(5,3,8,0.9);
            color: #FFD700; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            pointer-events: all; user-select: none; font-family: monospace;
        }
        #ml { left: 30px; bottom: 10px; } #mr { left: 110px; bottom: 10px; }
        #mj { left: 70px; bottom: 85px; } #ma { right: 30px; bottom: 85px; } #mf { right: 100px; bottom: 10px; }
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const SPAWN = { p1: { x: 200, y: GH - 150 }, p2: { x: 600, y: GH - 150 } };
const MP = { l: false, r: false, j: false, a: false, f: false };

// Touch Input Binding
(function() {
    const bind = (id, key) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("touchstart", e => { e.preventDefault(); MP[key] = true; });
        el.addEventListener("touchend", e => { e.preventDefault(); MP[key] = false; });
    };
    bind("ml", "l"); bind("mr", "r"); bind("mj", "j"); bind("ma", "a"); bind("mf", "f");
})();

const Match = { p1: "Juni", p2: "Pyro" };

function mkSp(scene, x, y, name) {
    let key = name.toLowerCase() + "_sheet";
    let sp = scene.physics.add.sprite(x, y, key);
    
    // CALIBRATION: Bottom-aligned 128px math
    // size (45, 100) + offset (42, 28) = feet at exactly pixel 128
    sp.body.setSize(45, 100).setOffset(42, 28);
    
    sp.setCollideWorldBounds(true);
    sp.setDragX(1200);
    sp.play(name.toLowerCase() + "_idle");
    return sp;
}

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("bg", "bg_deep_forest.jpg");
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
    }
    create() {
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.5);
        this.add.text(GW/2, GH/2, "NMN PRESENTS:\nBRAWLERS v1.8", {
            align: 'center', fontFamily: 'monospace', fontSize: '40px', fill: '#FFD700'
        }).setOrigin(0.5);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.2);
        const roster = ["Juni", "Pyro", "Elephant_1", "Elephant_2"];
        roster.forEach((name, i) => {
            // FIXED TYPO: (i * 50)
            let t = this.add.text(GW/2, 150 + (i * 50), name, {
                fontFamily: 'monospace', fontSize: '28px', fill: i < 2 ? '#00FF88' : '#555'
            }).setOrigin(0.5).setInteractive();
            
            if (i < 2) {
                t.on("pointerdown", () => { Match.p1 = name; this.scene.start("BattleScene"); });
            }
        });
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }
    create() {
        const p1Key = Match.p1.toLowerCase();
        
        // Animations
        this.anims.create({ key: 'juni_idle', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 0, end: 2 }), frameRate: 6, repeat: -1 });
        this.anims.create({ key: 'pyro_idle', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 0, end: 2 }), frameRate: 8, repeat: -1 });
        this.anims.create({ key: 'juni_atk', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 7, end: 11 }), frameRate: 15, repeat: 0 });
        this.anims.create({ key: 'juni_fire', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 12, end: 14 }), frameRate: 12, repeat: 0 });
        this.anims.create({ key: 'pyro_fire', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 12, end: 16 }), frameRate: 12, repeat: 0 });

        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-20, 650, 20, 0xffffff, 0.1));

        this.p1 = mkSp(this, SPAWN.p1.x, SPAWN.p1.y, Match.p1);
        this.physics.add.collider(this.p1, this.platforms);

        this.keys = this.input.keyboard.addKeys({ left: 'A', right: 'D', up: 'W', atk: 'J', fire: 'L' });
        this.state = { jumps: 0, busy: false };
    }

    update() {
        const sp = this.p1;
        const ks = this.keys;

        if (sp.body.blocked.down) this.state.jumps = 0;

        // Additive Movement (Non-blocking)
        if (ks.left.isDown || MP.l) {
            sp.setVelocityX(-250);
            sp.setFlipX(true);
        } else if (ks.right.isDown || MP.r) {
            sp.setVelocityX(250);
            sp.setFlipX(false);
        }

        // Jump Logic (Double Jump)
        if ((Phaser.Input.Keyboard.JustDown(ks.up) || MP.j) && this.state.jumps < 2) {
            sp.setVelocityY(-500);
            this.state.jumps++;
            MP.j = false;
        }

        // Action Logic
        if ((Phaser.Input.Keyboard.JustDown(ks.atk) || MP.a) && !this.state.busy) {
            this.state.busy = true;
            sp.play(Match.p1.toLowerCase() + "_atk");
            this.time.delayedCall(300, () => { this.state.busy = false; sp.play(Match.p1.toLowerCase() + "_idle"); });
            MP.a = false;
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    physics: { default: "arcade", arcade: { gravity: { y: 1200 }, debug: false } },
    scene: [StartScreen, BrawlerScene, BattleScene]
});
</script>
</body>
</html>
