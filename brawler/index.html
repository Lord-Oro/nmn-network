<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NMN Presents: Nonsensical Brawlers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:#050308;width:100%;height:100%;overflow:hidden;touch-action:none;}
    #gc{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
    #mc{display:none;position:fixed;bottom:20px;left:0;right:0;height:140px;pointer-events:none;z-index:999;}
    #mc.on{display:block;}
    .mb{
      position:absolute;width:64px;height:64px;border-radius:50%;
      border:3px solid #FFD700;background:rgba(5,3,8,0.9);
      color:#FFD700;font-size:18px;font-weight:bold;
      display:flex;align-items:center;justify-content:center;
      pointer-events:all;user-select:none;
      font-family:monospace;box-shadow:0 0 15px rgba(255,215,0,0.3);
    }
    /* Mobile Layout Fixes */
    #ml{left:20px;bottom:10px;} #mr{left:100px;bottom:10px;}
    #mj{left:60px;bottom:80px;} #ma{right:20px;bottom:80px;} #mf{right:80px;bottom:10px;}
  </style>
</head>
<body>
<div id="gc"></div>
<div id="mc"><div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div><div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div><div class="mb" id="mf">⚡</div></div>
<script>
const GW=800, GH=450;
const BLAST={minX:-300,maxX:1100,minY:-300,maxY:900};
const SPAWN={p1:{x:220,y:GH-160},p2:{x:580,y:GH-160}};
const MP={l:false,r:false,j:false,a:false,f:false};

// Mobile Input
(function(){
  const isTouch="ontouchstart" in window||navigator.maxTouchPoints>0;
  if(isTouch) document.getElementById("mc").classList.add("on");
  const bind=(id,key)=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener("touchstart",e=>{e.preventDefault();MP[key]=true;});
    el.addEventListener("touchend",  e=>{e.preventDefault();MP[key]=false;});
  };
  bind("ml","l");bind("mr","r");bind("mj","j");bind("ma","a");bind("mf","f");
})();

const Match={p1:null,p2:null,winner:null};

function mkSp(scene, x, y, name) {
  let sp = scene.physics.add.sprite(x, y, name + "_sheet");
  sp.play(name + "_idle");
  // The 128px Calibration
  sp.body.setSize(45, 95).setOffset(42, 33);
  sp.setCollideWorldBounds(false);
  sp.setDragX(name === "pyro" ? 500 : 1000);
  return sp;
}

class StartScreen extends Phaser.Scene {
  constructor(){super("StartScreen");}
  preload(){
    this.load.image("logo", "logo.jpg");
    this.load.image("bg", "bg_deep_forest.jpg");
    this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
  }
  create(){
    this.add.image(GW/2,GH/2,"bg").setDisplaySize(GW,GH).setAlpha(0.4);
    if(this.textures.exists("logo")) this.add.image(GW/2, GH/2-80, "logo").setScale(0.5);
    this.add.text(GW/2,GH/2+20,"NMN Presents:\nNONSENSICAL BRAWLERS",{align:'center',fontFamily:'monospace',fontSize:'26px',fill:'#FFD700',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+100,"[ CLICK OR TAP TO START ]",{fontFamily:'monospace',fontSize:'14px',fill:'#FFF'}).setOrigin(0.5);
    this.input.once("pointerdown",()=>this.scene.start("BattleScene"));
  }
}

class BattleScene extends Phaser.Scene {
  constructor(){super("BattleScene");}
  create(){
    // Setup Animations
    this.anims.create({ key:'juni_idle', frames:this.anims.generateFrameNumbers('juni_sheet',{start:0,end:2}), frameRate:6, repeat:-1 });
    this.anims.create({ key:'pyro_idle', frames:this.anims.generateFrameNumbers('pyro_sheet',{start:0,end:2}), frameRate:8, repeat:-1 });
    this.anims.create({ key:'juni_fire', frames:this.anims.generateFrameNumbers('juni_sheet',{start:12,end:14}), frameRate:12, repeat:0 });
    this.anims.create({ key:'pyro_fire', frames:this.anims.generateFrameNumbers('pyro_sheet',{start:12,end:16}), frameRate:12, repeat:0 });

    this.add.image(GW/2,GH/2,"bg").setDisplaySize(GW,GH).setAlpha(0.2);
    this.platforms=this.physics.add.staticGroup();
    this.platforms.add(this.add.rectangle(GW/2,GH-20,600,20,0x3a2a0a));
    this.physics.add.existing(this.platforms.children.entries[0],true);

    this.p1=mkSp(this,SPAWN.p1.x,SPAWN.p1.y,"juni");
    this.p2=mkSp(this,SPAWN.p2.x,SPAWN.p2.y,"pyro");
    this.p2.setFlipX(true);

    this.physics.add.collider([this.p1,this.p2],this.platforms);
    this.k1=this.input.keyboard.addKeys({left:'A',right:'D',up:'W',fire:'L',atk:'J'});
    this.S={p1Jumps:0,p1AtkCD:false};
  }

  update(){
    const sp=this.p1, S=this.S;
    const name="juni";
    if(sp.body.blocked.down) S.p1Jumps=0;

    const gL=this.k1.left.isDown||MP.l, gR=this.k1.right.isDown||MP.r;
    if(gL){sp.body.setVelocityX(-220);sp.setFlipX(true);}
    else if(gR){sp.body.setVelocityX(220);sp.setFlipX(false);}
    else sp.body.setVelocityX(sp.body.velocity.x*0.7);

    if((Phaser.Input.Keyboard.JustDown(this.k1.up)||MP.j)&&S.p1Jumps<2){sp.body.setVelocityY(-400);S.p1Jumps++;MP.j=false;}
    
    if((Phaser.Input.Keyboard.JustDown(this.k1.fire)||MP.f)&&!S.p1AtkCD){
        S.p1AtkCD=true; sp.play(name+"_fire");
        this.time.delayedCall(400, ()=>{ S.p1AtkCD=false; sp.play(name+"_idle"); });
        MP.f=false;
    }
  }
}

new Phaser.Game({
  type:Phaser.AUTO, width:GW, height:GH, parent:"gc", backgroundColor:"#050308",
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  physics:{default:"arcade",arcade:{gravity:{y:900}}},
  scene:[StartScreen,BattleScene]
});
</script>
</body>
</html>
