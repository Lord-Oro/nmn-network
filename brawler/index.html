const MP={l:false,r:false,j:false,a:false,s:false,f:false,b:false};
const JOY={active:false,vx:0,vy:0};

(function(){
  window.IS_TOUCH="ontouchstart" in window||navigator.maxTouchPoints>0;
  const joy=document.getElementById("joy"),stick=document.getElementById("stick");
  if(joy){
    const upd=e=>{
      const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const px=e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:cx);
      const py=e.clientY!=null?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:cy);
      const dx=px-cx,dy=py-cy,max=r.width/2-18,dist=Math.min(Math.hypot(dx,dy),max),ang=Math.atan2(dy,dx);
      JOY.vx=Math.cos(ang)*(dist/max);JOY.vy=Math.sin(ang)*(dist/max);
      if(stick)stick.style.transform=`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
    };
    const end=e=>{e.preventDefault();JOY.active=false;JOY.vx=0;JOY.vy=0;if(stick)stick.style.transform="translate(0px,0px)";};
    joy.onpointerdown=e=>{e.preventDefault();JOY.active=true;upd(e);};
    joy.onpointermove=e=>{if(!JOY.active)return;e.preventDefault();upd(e);};
    joy.onpointerup=end;joy.onpointercancel=end;joy.onpointerleave=end;
  }
  const bind=(id,k)=>{const el=document.getElementById(id);if(!el)return;el.onpointerdown=e=>{e.preventDefault();MP[k]=true;};el.onpointerup=e=>{e.preventDefault();MP[k]=false;};};
  bind("ma","a");bind("ms","s");bind("mf","f");bind("mb","b");
})();

function goldSpark(scene,x,y){
  const g=scene.add.graphics().setDepth(600);
  [0xFFD700,0xFF8800,0xFFFF88,0xFF5500].forEach(col=>{for(let i=0;i<4;i++){const ang=Math.random()*Math.PI*2,len=4+Math.random()*16;g.fillStyle(col,1);g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,3+Math.random()*3,3);}});
  scene.tweens.add({targets:g,alpha:0,duration:220,onComplete:()=>g.destroy()});
}

function arcSlash(scene,x,y,dir,isJuni){
  const g=scene.add.graphics().setDepth(580);
  const col=isJuni?0x00FF88:0xFF4400,col2=isJuni?0xAAFFCC:0xFFAA00;
  const sa=dir===1?-70:110,ea=dir===1?70:250,si=dir===1?-50:130,ei=dir===1?50:230;
  g.lineStyle(5,col,0.9);g.beginPath();g.arc(x+dir*36,y-8,28,Phaser.Math.DegToRad(sa),Phaser.Math.DegToRad(ea),false);g.strokePath();
  g.lineStyle(2,col2,0.6);g.beginPath();g.arc(x+dir*36,y-8,19,Phaser.Math.DegToRad(si),Phaser.Math.DegToRad(ei),false);g.strokePath();
  for(let i=0;i<7;i++){const ang=Phaser.Math.DegToRad(Phaser.Math.Between(sa,ea)),r=Phaser.Math.Between(18,32),px=x+dir*36+Math.cos(ang)*r,py=y-8+Math.sin(ang)*r;const dot=scene.add.rectangle(px,py,isJuni?5:4,isJuni?4:6,isJuni?0x00FF88:0xFF6600,0.9).setDepth(581);scene.tweens.add({targets:dot,x:px+dir*(Math.random()*18),y:py-Math.random()*12,alpha:0,duration:isJuni?180:120,onComplete:()=>dot.destroy()});}
  scene.tweens.add({targets:g,alpha:0,duration:110,onComplete:()=>g.destroy()});
}

class BattleScene extends Phaser.Scene{

      this.add.rectangle(px,py-ph/2-1,pw,3,0xFFD700,0.35);
      this.physics.add.existing(p,true);p.body.checkCollision.down=false;

    };
    mkP(GW/2,MAIN_PLAT_Y,700,20);
    mkP(150,GH-180,200);mkP(650,GH-180,200);
    const jAnims=[{key:"j_idle",start:0,end:3,rate:6,loop:true},{key:"j_jump",start:4,end:6,rate:8,loop:false},{key:"j_melee",frames:[12,14,13],rate:14,loop:false},{key:"j_range",start:7,end:9,rate:12,loop:false},{key:"j_burst",start:15,end:17,rate:10,loop:false},{key:"j_shield",frames:[18],rate:1,loop:false},{key:"j_dmg",start:19,end:21,rate:12,loop:false},{key:"j_launch",start:15,end:17,rate:10,loop:false}];
    const pAnims=[{key:"p_idle",start:0,end:3,rate:8,loop:true},{key:"p_jump",frames:[4,4,5],rate:8,loop:false},{key:"p_melee",frames:[10,11,12],rate:14,loop:false},{key:"p_range",start:7,end:9,rate:12,loop:false},{key:"p_burst",frames:[6],rate:1,loop:false},{key:"p_shield",frames:[20],rate:1,loop:false},{key:"p_dmg",start:21,end:22,rate:12,loop:false},{key:"p_launch",start:23,end:24,rate:10,loop:false}];
    const makeAnim=(sheet,def)=>{if(this.anims.exists(def.key))return;if(def.frames)this.anims.create({key:def.key,frames:def.frames.map(f=>({key:sheet,frame:f})),frameRate:def.rate,repeat:def.loop?-1:0});else this.anims.create({key:def.key,frames:this.anims.generateFrameNumbers(sheet,{start:def.start,end:def.end}),frameRate:def.rate,repeat:def.loop?-1:0});};
    jAnims.forEach(d=>makeAnim("j_sheet",d));pAnims.forEach(d=>makeAnim("p_sheet",d));
    const p1Sheet=Match.p1==="Juni"?"j_sheet":"p_sheet",p2Sheet=Match.p1==="Juni"?"p_sheet":"j_sheet";
    this.p1Pre=Match.p1==="Juni"?"j":"p";this.p2Pre=Match.p1==="Juni"?"p":"j";
    this.p1=this.physics.add.sprite(SPAWN.p1.x,SPAWN.p1.y,p1Sheet);
    this.p2=this.physics.add.sprite(SPAWN.p2.x,SPAWN.p2.y,p2Sheet).setFlipX(true);
    [this.p1,this.p2].forEach(sp=>{sp.setDisplaySize(80,80).setCollideWorldBounds(false).setBounce(0).setDragX(700);sp.body.setSize(24,46).setOffset((sp.width-24)/2,sp.height-46);sp.body.setMaxVelocity(600,1000);});
    this.physics.add.collider([this.p1,this.p2],this.platforms);
    this.p1.play(this.p1Pre+"_idle");this.p2.play(this.p2Pre+"_idle");
    
    // LOG 004 FIX: Return to Idle explicitly after animations finish
    this.anims.on("animationcomplete", (anim, sprite) => {
        if(!sprite||!sprite.active||!sprite.body) return;
        if(["_melee","_range","_burst","_launch","_dmg","_jump"].some(s=>anim.key.includes(s))){
            const pre = sprite === this.p1 ? this.p1Pre : this.p2Pre;
            sprite.play(pre+"_idle", true);
        }
    });

    this.S={state:"STARTING",p1Stun:false,p2Stun:false,p1AtkCD:false,p2AtkCD:false,p1Jumps:0,p2Jumps:0,gameOver:false,p1ShieldHp:5,p2ShieldHp:5,p1Bursts:3,p2Bursts:3,p1BurstBuff:false,p1ProjReady:true,p1ProjCharge:1.0};
    this.cpuSpeed=Match.difficulty==="EASY"?90:Match.difficulty==="HARD"?260:170;
    this.cpuAtkFreq=Match.difficulty==="EASY"?0.02:Match.difficulty==="HARD"?0.25:0.10;
    this.cpuFireFreq=Match.difficulty==="EASY"?0.005:Match.difficulty==="HARD"?0.10:0.03;
    this.meleeGrp=this.physics.add.group();this.projGrp=this.physics.add.group();
    this.physics.add.overlap(this.meleeGrp,this.p2,(hit,player)=>{if(!hit||!hit.active||hit.getData("owner")!=="p1")return;goldSpark(this,hit.x,hit.y);this.resolveHit("p1","p2",hit,false);});
    this.physics.add.overlap(this.meleeGrp,this.p1,(hit,player)=>{if(!hit||!hit.active||hit.getData("owner")!=="p2")return;goldSpark(this,hit.x,hit.y);this.resolveHit("p2","p1",hit,false);});
    this.physics.add.overlap(this.projGrp,this.p2,(hit,player)=>{if(!hit||!hit.active||hit.getData("owner")!=="p1")return;goldSpark(this,hit.x,hit.y);this.resolveHit("p1","p2",hit,true);});
    this.physics.add.overlap(this.projGrp,this.p1,(hit,player)=>{if(!hit||!hit.active||hit.getData("owner")!=="p2")return;goldSpark(this,hit.x,hit.y);this.resolveHit("p2","p1",hit,true);});
    this.buildHUD();this.refreshHUD();
    this.keys=this.input.keyboard.addKeys({W:"W",A:"A",S:"S",D:"D",DOWN:"DOWN",J:"J",K:"K",L:"L",SEMI:"SEMICOLON",P:"P"});
    this.buildPauseMenu();
    this.camX=GW/2;this.targetZoom=1.0;this.cameras.main.centerOn(GW/2,GH/2);
    const bText=this.add.text(GW/2,GH/2,"BRAWL!",{fontFamily:"Press Start 2P",fontSize:"42px",color:"#FFD700",stroke:"#000",strokeThickness:6}).setOrigin(0.5).setDepth(20000).setScrollFactor(0);
    this.tweens.add({targets:bText,scaleX:1.25,scaleY:1.25,yoyo:true,repeat:-1,duration:280});
    this.time.delayedCall(1500,()=>{bText.destroy();this.S.state="PLAYING";});
  }

  buildHUD(){
    this.hudContainer=this.add.container(0,0).setDepth(10000).setScrollFactor(0);
    const p1c=Match.p1==="Juni"?"#00FF88":"#FF6600",p2c=Match.p1==="Juni"?"#FF6600":"#00FF88";

    const p1pb=this.add.rectangle(14,30,200,4,0x222244).setOrigin(0);
    this.p1ProjBar=this.add.rectangle(14,30,200,4,0x55AAFF).setOrigin(0);

    this.p1BurstsHUD=this.add.text(68,51,"☆x3",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#00FF88"});
    const bg2=this.add.rectangle(GW,0,240,64,0x050308,0.92).setOrigin(1,0);
    const t2=this.add.text(GW-10,5,"CPU: "+Match.p2.toUpperCase(),{fontFamily:"Press Start 2P",fontSize:"7px",color:p2c}).setOrigin(1,0);
    const h2b=this.add.rectangle(GW-214,18,200,10,0x333333).setOrigin(0);
    this.p2Bar=this.add.rectangle(GW-214,18,200,10,parseInt(p2c.replace("#","0x"))).setOrigin(0);
    this.p2DT=this.add.text(GW-10,37,"0%",{fontFamily:"Press Start 2P",fontSize:"11px",color:"#FFF"}).setOrigin(1,0);
    this.p2HT=this.add.text(GW-10,51,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FF4444"}).setOrigin(1,0);
    const hP=this.add.text(GW/2,6,"P = PAUSE",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#444"}).setOrigin(0.5,0);
    this.hudContainer.add([bg1,t1,h1b,this.p1Bar,p1pb,this.p1ProjBar,this.p1DT,this.p1HT,this.p1BurstsHUD,bg2,t2,h2b,this.p2Bar,this.p2DT,this.p2HT,hP]);
  }

  refreshHUD(){
    const mh=Match.maxHealth;
    this.p1Bar.scaleX=Math.max(0,1-Math.min(Match.p1Pct,mh)/mh);
    this.p2Bar.scaleX=Math.max(0,1-Math.min(Match.p2Pct,mh)/mh);
    const clr=p=>p>(mh*0.8)?"#FF4444":p>(mh*0.4)?"#FFAA00":"#FFFFFF";
    this.p1DT.setText(Match.p1Pct+"%").setColor(clr(Match.p1Pct));
    this.p2DT.setText(Match.p2Pct+"%").setColor(clr(Match.p2Pct));
    const h=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,3-n));
    this.p1HT.setText(h(Match.p1Lives));this.p2HT.setText(h(Match.p2Lives));
    this.p1BurstsHUD.setText("☆x"+this.S.p1Bursts);
  }

  buildPauseMenu(){
    this.pauseContainer=this.add.container(GW/2,GH/2).setDepth(25000).setVisible(false).setScrollFactor(0); // LOG 004 FIX: Anchor
    const pBg=this.add.rectangle(0,0,440,270,0x050308,0.97).setStrokeStyle(3,0xFFD700);
    const pTxt=this.add.text(0,-108,"⏸  PAUSED",{fontFamily:"Press Start 2P",fontSize:"15px",color:"#FFD700"}).setOrigin(0.5);
    const bKey=BOOK_LIST[Math.floor(Math.random()*BOOK_LIST.length)],bUrl=BOOK_LINKS[bKey];
    const bookImg=this.add.image(0,-32,bKey).setDisplaySize(72,108).setInteractive({useHandCursor:true});
    bookImg.on("pointerdown",()=>window.open(bUrl,"_blank"));
    const rBtn=this.add.text(-96,100,"🔄 RESTART",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#00FF88",backgroundColor:"#111",padding:{x:12,y:8}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    rBtn.on("pointerdown",()=>{Match.paused=false;this.physics.world.isPaused=false;this.scene.restart();});
    const qBtn=this.add.text(96,100,"◀ QUIT",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#050308",backgroundColor:"#FFD700",padding:{x:12,y:8}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    qBtn.on("pointerdown",()=>{Match.paused=false;this.physics.world.isPaused=false;this.scene.start("BrawlerScene");});
    this.pauseContainer.add([pBg,pTxt,bookImg,rBtn,qBtn]);
  }

  resolveHit(atkId,tgtId,hit,isProjectile){
    const S=this.S;if(S.gameOver||!hit||!hit.active||atkId===tgtId)return; 
    const isP1Tgt=tgtId==="p1";
    const shielding=isP1Tgt?(this.keys.S.isDown||this.keys.DOWN.isDown||this.keys.L.isDown||MP.f||JOY.vy>0.6):false;
    const shieldHp=isP1Tgt?S.p1ShieldHp:S.p2ShieldHp;
    if(isProjectile){const vis=hit.getData("vis");if(vis&&vis.active)vis.destroy();}
    hit.destroy();
    const tgt=tgtId==="p2"?this.p2:this.p1,atk=atkId==="p1"?this.p1:this.p2;
    if(!tgt.active||!tgt.body)return;
    if(shielding&&shieldHp>0){if(isP1Tgt)S.p1ShieldHp--;else S.p2ShieldHp--;goldSpark(this,tgt.x,tgt.y);return;}
    let power=isProjectile?Phaser.Math.Between(5,9):Phaser.Math.Between(3,7);
    if(atkId==="p1"&&S.p1BurstBuff)power*=2;
    if(tgtId==="p2")Match.p2Pct+=power;else Match.p1Pct+=power;
    const pct=tgtId==="p2"?Match.p2Pct:Match.p1Pct,tPre=tgtId==="p2"?this.p2Pre:this.p1Pre;
    const kbScale=Math.min(4,1+(pct*0.015)),dir=tgt.x>=atk.x?1:-1;
    tgt.body.setVelocity(dir*170*kbScale,-210*kbScale);
    const fHit=FRAMES[tPre==="j"?"juni":"pyro"],lt=pct>(Match.maxHealth*0.35);
    tgt.setFrame(lt?fHit.knock:fHit.dmg[0]);
    if(this.anims.exists(tPre+(lt?"_launch":"_dmg")))this.time.delayedCall(30,()=>{if(tgt.active)tgt.play(tPre+(lt?"_launch":"_dmg"),true);});
    if(tgtId==="p2")S.p2Stun=true;else S.p1Stun=true;
    this.time.delayedCall(150,()=>{if(!S.gameOver){if(tgtId==="p2")S.p2Stun=false;else S.p1Stun=false;}});
    this.refreshHUD();
  }

  spawnMelee(id){
    const sp=id==="p1"?this.p1:this.p2,pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1;
    arcSlash(this,sp.x,sp.y,dir,pre==="j");
    sp.setFrame(FRAMES[pre==="j"?"juni":"pyro"].melee);
    if(this.anims.exists(pre+"_melee"))this.time.delayedCall(30,()=>sp.play(pre+"_melee",true));
    
    // LOG 004 FIX: Huge, generous Coyote Hitbox for melee
    const hit=this.add.rectangle(sp.x+dir*45,sp.y-6,60,40,0xFFD700,0);
    this.physics.add.existing(hit);hit.body.setAllowGravity(false);hit.body.setImmovable(true);
    hit.setData("owner",id);hit.life=0;this.meleeGrp.add(hit);
  }

  spawnProjectile(id){
    const sp=id==="p1"?this.p1:this.p2,pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const dir=sp.flipX?-1:1,isJuni=pre==="j",fReg=FRAMES[isJuni?"juni":"pyro"];
    sp.setFrame(fReg.range);
    if(this.anims.exists(pre+"_range"))this.time.delayedCall(30,()=>{if(sp.active)sp.play(pre+"_range",true);});
    const vis=this.add.sprite(sp.x+dir*45,sp.y-8,isJuni?"j_sheet":"p_sheet",fReg.proj).setDisplaySize(38,38).setDepth(50).setFlipX(dir===-1);
    const hit=this.add.rectangle(sp.x+dir*45,sp.y-8,14,14,0xFFFFFF,0);
    this.physics.add.existing(hit);
    hit.body.setAllowGravity(false); 
    hit.body.setAcceleration(0,0);
    hit.body.setVelocity(dir*550,0);
    hit.setData("owner",id);
    hit.setData("vis",vis);
    
    // LOG 004 FIX: Assign Target for Homing
    hit.setData("target", id==="p1" ? this.p2 : this.p1);
    hit.life=0;
    this.projGrp.add(hit);
  }

  spawnBurst(id){
    const sp=id==="p1"?this.p1:this.p2,pre=id==="p1"?this.p1Pre:this.p2Pre;
    if(!sp.active||!sp.body)return;
    const fReg=FRAMES[pre==="j"?"juni":"pyro"];
    sp.setFrame(fReg.burst);if(this.anims.exists(pre+"_burst"))this.time.delayedCall(60,()=>sp.play(pre+"_burst",true));
    const isJuni=pre==="j",col=isJuni?0x00FF88:0xFF2200;
    const ring=this.add.circle(sp.x,sp.y,90,col,0.2).setDepth(49);
    this.tweens.add({targets:ring,scaleX:1.6,scaleY:1.6,alpha:0,duration:420,onComplete:()=>ring.destroy()});
    const tgt=id==="p1"?this.p2:this.p1;
    if(tgt.active&&Phaser.Math.Distance.Between(sp.x,sp.y,tgt.x,tgt.y)<95){
      this.resolveHit(id,id==="p1"?"p2":"p1",this.add.rectangle(tgt.x,tgt.y,1,1),false);
    }
  }

  runCPU(dt){
    const S=this.S,sp=this.p2;
    if(S.state!=="PLAYING"||!sp.active||S.p2Stun||!sp.body)return;
    if(sp.body.blocked.down)S.p2Jumps=0;
    const dx=this.p1.x-sp.x,absX=Math.abs(dx);
    if(absX>40){sp.body.setVelocityX(dx>0?this.cpuSpeed:-this.cpuSpeed);sp.setFlipX(dx<0);}
    else sp.body.setVelocityX(sp.body.velocity.x*0.6);
    if(absX>60&&S.p2Jumps<2&&Math.random()<0.022){sp.body.setVelocityY(-600);S.p2Jumps++;}
    if(absX<75&&Math.random()<this.cpuAtkFreq&&!this.cpuAtkCD){this.cpuAtkCD=true;this.spawnMelee("p2");this.time.delayedCall(480,()=>this.cpuAtkCD=false);}
    if(absX>90&&absX<300&&Math.random()<this.cpuFireFreq&&!this.cpuAtkCD){this.cpuAtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(360,()=>this.cpuAtkCD=false);}
  }

  moveP1(){
    const S=this.S,sp=this.p1,pre=this.p1Pre,k=this.keys;
    if(S.state!=="PLAYING"||!sp.active||!sp.body)return;
    if(sp.body.blocked.down)S.p1Jumps=0;
    const isShielding=(k.S.isDown||k.DOWN.isDown||k.L.isDown||MP.f||JOY.vy>0.6)&&S.p1ShieldHp>0;
    if(isShielding){sp.body.setVelocityX(0);sp.setFrame(FRAMES[pre==="j"?"juni":"pyro"].shield);return;}
    if(!S.p1Stun){
      const gL=k.A.isDown||MP.l||JOY.vx<-0.25,gR=k.D.isDown||MP.r||JOY.vx>0.25;
      if(gL){sp.body.setVelocityX(-260);sp.setFlipX(true);}else if(gR){sp.body.setVelocityX(260);sp.setFlipX(false);}else sp.body.setVelocityX(sp.body.velocity.x*0.7);
      if(Phaser.Input.Keyboard.JustDown(k.W)||MP.j||JOY.vy<-0.6){if(S.p1Jumps<2){sp.body.setVelocityY(-600);S.p1Jumps++;sp.play(pre+"_jump",true);}MP.j=false;}
      if((Phaser.Input.Keyboard.JustDown(k.J)||MP.a)&&!S.p1AtkCD){S.p1AtkCD=true;this.spawnMelee("p1");this.time.delayedCall(210,()=>S.p1AtkCD=false);MP.a=false;}
      if((Phaser.Input.Keyboard.JustDown(k.K)||MP.s)&&S.p1ProjReady&&!S.p1AtkCD){
        S.p1ProjReady=false;S.p1ProjCharge=0;this.spawnProjectile("p1");
        this.time.delayedCall(1500,()=>{S.p1ProjReady=true;S.p1ProjCharge=1.0;});MP.s=false;
      }
      if((Phaser.Input.Keyboard.JustDown(k.SEMI)||MP.b)&&S.p1Bursts>0){S.p1Bursts--;this.spawnBurst("p1");S.p1BurstBuff=true;this.time.delayedCall(5000,()=>S.p1BurstBuff=false);this.refreshHUD();MP.b=false;}
    }
  }

  updateCamera(){
    const p1x=this.p1.active?this.p1.x:GW/2,p2x=this.p2.active?this.p2.x:GW/2;
    this.camX+=(((p1x+p2x)/2)-this.camX)*0.08;
    this.targetZoom=Phaser.Math.Clamp(Math.abs(p1x-p2x)<180?1.18:Math.abs(p1x-p2x)>420?0.86:1.0,0.82,1.22);
    this.cameras.main.zoom+=(this.targetZoom-this.cameras.main.zoom)*0.04;
    this.cameras.main.centerOn(this.camX,GH/2);
  }

  respawnOrEnd(id){
    const S=this.S;if(S.gameOver)return;
    const isP1=id==="p1",sp=isP1?this.p1:this.p2,spX=isP1?SPAWN.p1.x:SPAWN.p2.x,spY=isP1?SPAWN.p1.y:SPAWN.p2.y;
    if(isP1)Match.p1Lives--;else Match.p2Lives--;
    if((isP1?Match.p1Lives:Match.p2Lives)<=0){S.gameOver=true;Match.winner=isP1?"P2":"P1";this.showSignalLost();return;}
    if(isP1)Match.p1Pct=0;else Match.p2Pct=0;
    sp.setPosition(spX,spY);this.refreshHUD();
  }

  showSignalLost(){
    document.getElementById("mc").classList.remove("on");
    const sl=this.add.rectangle(GW/2,GH/2,GW,GH,0x050308,0.9).setDepth(30000).setScrollFactor(0);
    this.add.text(GW/2,GH/2-30,"SIGNAL LOST",{fontFamily:"Press Start 2P",fontSize:"22px",color:"#FF2222"}).setDepth(30001).setOrigin(0.5).setScrollFactor(0);
    this.time.delayedCall(2000,()=>this.scene.start("ResultsScene"));
  }

  update(time,dt){
    const S=this.S;
    if(Phaser.Input.Keyboard.JustDown(this.keys.P)){
      Match.paused=!Match.paused;this.physics.world.isPaused=Match.paused;
      this.pauseContainer.setVisible(Match.paused);
      if(Match.paused)this.pauseContainer.setDepth(25000);
    }
    if(Match.paused||S.gameOver)return;
    this.meleeGrp.children.iterate(h=>{if(!h)return;h.life+=dt;if(h.life>200)h.destroy();});
    
    this.projGrp.children.iterate(h=>{
      if(!h||!h.active)return;h.life+=dt;
      const vis=h.getData("vis");if(vis&&vis.active){vis.x=h.x;vis.y=h.y;}
      
      // LOG 004 FIX: Homing Logic for Projectiles
      const tgt = h.getData("target");
      if(tgt && tgt.active && h.life < 700) { 
          const dx = tgt.x - h.x;
          if(Math.sign(h.body.velocity.x) === Math.sign(dx)) {
              const dy = (tgt.y - 15) - h.y;
              h.body.velocity.y += Math.sign(dy) * 12; // Seeker adjustment
          }
      }

      if(h.life>1600||h.x<BLAST.minX||h.x>BLAST.maxX){ if(vis&&vis.active)vis.destroy(); h.destroy(); }
    });

    this.moveP1();this.runCPU(dt);
    if(this.p1.y>GH+100)this.respawnOrEnd("p1");if(this.p2.y>GH+100)this.respawnOrEnd("p2");
    this.updateCamera();
    if(!S.p1ProjReady&&this.p1ProjBar.active){S.p1ProjCharge=Math.min(1,S.p1ProjCharge+dt/1500);this.p1ProjBar.scaleX=S.p1ProjCharge;}
    
    // LOG 004 FIX: Inverse Zoom anchoring for UI Elements
    this.hudContainer.setScale(1 / this.cameras.main.zoom);
    this.pauseContainer.setScale(1 / this.cameras.main.zoom);
  }
}

class ResultsScene extends Phaser.Scene{
  constructor(){super("ResultsScene");}
  create(){
    this.add.image(GW/2,GH/2,"bg_eyes").setDisplaySize(GW,GH).setAlpha(0.35);
    this.add.text(GW/2,GH/2,"SECTOR CLEARED",{fontFamily:"Press Start 2P",fontSize:"17px",color:"#FFD700"}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+40,"ANY KEY TO REMATCH",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#888"}).setOrigin(0.5);
    this.input.keyboard.on("keydown",()=>this.scene.start("BattleScene"));
    this.input.on("pointerdown",()=>this.scene.start("BattleScene"));
  }
}

new Phaser.Game({
  type:Phaser.AUTO,width:GW,height:GH,parent:"gc",backgroundColor:"#050308",
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},
  scene:[StartScreen,InstructionsScene,BrawlerScene,DifficultyScene,StageSelectScene,OriginHub,CreatorBio,BattleScene,ResultsScene]
});

</script>
