<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS v6.5 - MANUAL GRID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; touch-action: none; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 3px solid #FFD700; background: rgba(5,3,8,0.9);
            color: #FFD700; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            pointer-events: all; user-select: none; font-family: monospace;
        }
        #ml { left: 20px; bottom: 10px; } #mr { left: 100px; bottom: 10px; }
        #mj { left: 60px; bottom: 90px; } #ma { right: 20px; bottom: 90px; } #ms { right: 20px; bottom: 10px; } #mf { right: 100px; bottom: 10px; }
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div><div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const SPAWN = { p1: { x: 200, y: GH - 150 }, p2: { x: 600, y: GH - 150 } };
const MP = { l: false, r: false, j: false, a: false, s: false, f: false };

(function() {
    const bind = (id, key) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("touchstart", e => { e.preventDefault(); MP[key] = true; });
        el.addEventListener("touchend", e => { e.preventDefault(); MP[key] = false; });
    };
    bind("ml", "l"); bind("mr", "r"); bind("mj", "j"); bind("ma", "a"); bind("ms", "s"); bind("mf", "f");
})();

const Match = { p1: "Juni", p2: "Pyro" };

function lockBody(sp) {
    sp.setOrigin(0.5, 0.5); 
    sp.body.setSize(45, 100).setOffset(41.5, 28); 
    sp.setCollideWorldBounds(true);
}

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("promo", "brawler_promo.jpg");
        this.load.image("bg_forest", "bg_deep_forest.jpg");
        // LOADING AS SPRITESHEET WITH STRICT DIMENSIONS
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128, margin: 0, spacing: 0 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128, margin: 0, spacing: 0 });
    }
    create() {
        this.add.image(GW/2, GH/2, "promo").setDisplaySize(GW, GH);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg_forest").setDisplaySize(GW, GH).setAlpha(0.4);
        ["Juni", "Pyro"].forEach((name, i) => {
            let t = this.add.text(GW/2, 200 + (i * 80), name.toUpperCase(), {
                fontFamily: 'monospace', fontSize: '42px', fill: '#00FF88', backgroundColor: '#000000AA', padding: 10
            }).setOrigin(0.5).setInteractive();
            t.on("pointerdown", () => { Match.p1 = name; Match.p2 = (name === "Juni" ? "Pyro" : "Juni"); this.scene.start("BattleScene"); });
        });
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }

    create() {
        const p1n = Match.p1.toLowerCase();
        const p2n = Match.p2.toLowerCase();

        this.add.image(GW/2, GH/2, "bg_forest").setDisplaySize(GW, GH).setAlpha(0.3).setDepth(0);

        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-20, 800, 20, 0x3a2a0a).setAlpha(0.5));

        this.p1 = this.physics.add.sprite(SPAWN.p1.x, SPAWN.p1.y, p1n + "_sheet", 0).setDepth(1);
        this.p2 = this.physics.add.sprite(SPAWN.p2.x, SPAWN.p2.y, p2n + "_sheet", 0).setDepth(1);

        lockBody(this.p1);
        lockBody(this.p2);

        this.physics.add.collider([this.p1, this.p2], this.platforms);
        this.keys = this.input.keyboard.addKeys({ left: 'A', right: 'D', jump: 'W', punch: 'J', shield: 'K', fire: 'L' });
        this.s = { jumps: 0, locked: false, lastAnim: "" };

        // ANIMATIONS: Using generateFrameNumbers ensures the engine slices the sheet
        [p1n, p2n].forEach(n => {
            this.anims.create({ key: n+'_idle', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 0, end: 2 }), frameRate: 6, repeat: -1 });
            this.anims.create({ key: n+'_jump', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 3, end: 5 }), frameRate: 10 });
            this.anims.create({ key: n+'_shd', frames: [{key: n+'_sheet', frame: 6}] });
            this.anims.create({ key: n+'_atk', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 7, end: 11 }), frameRate: 15 });
            this.anims.create({ key: n+'_fire', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 12, end: 14 }), frameRate: 12 });
        });

        this.p1.play(p1n + "_idle");
        this.p2.play(p2n + "_idle");
    }

    update() {
        const p1 = this.p1, p2 = this.p2, ks = this.keys, s = this.s;
        const name = Match.p1.toLowerCase();
        const grounded = p1.body.blocked.down;

        p1.setFlipX(p1.x > p2.x);
        p2.setFlipX(p2.x > p1.x);

        if (grounded) s.jumps = 0;
        if (s.locked) return;

        if (ks.shield.isDown || MP.s) {
            p1.setVelocityX(0);
            this.playAnim(p1, name + "_shd");
            return;
        }

        if (ks.left.isDown || MP.l) {
            p1.setVelocityX(-260);
            if (grounded) this.playAnim(p1, name + "_idle");
        }
        else if (ks.right.isDown || MP.r) {
            p1.setVelocityX(260);
            if (grounded) this.playAnim(p1, name + "_idle");
        }
        else {
            p1.setVelocityX(0);
            if (grounded) this.playAnim(p1, name + "_idle");
        }

        if ((Phaser.Input.Keyboard.JustDown(ks.jump) || MP.j) && s.jumps < 2) {
            p1.setVelocityY(-600);
            this.playAnim(p1, name + "_jump");
            s.jumps++;
        }

        if (Phaser.Input.Keyboard.JustDown(ks.punch) || MP.a) {
            s.locked = true;
            this.playAnim(p1, name + "_atk");
            this.time.delayedCall(300, () => { s.locked = false; lockBody(p1); });
        }

        if (Phaser.Input.Keyboard.JustDown(ks.fire) || MP.f) {
            s.locked = true;
            this.playAnim(p1, name + "_fire");
            this.time.delayedCall(200, () => {
                // SPAWNING PROJECTILE: This line forces index 13
                let proj = this.physics.add.sprite(p1.x, p1.y, name + "_sheet", 13);
                proj.body.setAllowGravity(false);
                proj.setFlipX(p1.flipX);
                // Force a small 32x32 hitzone so even if the sheet renders, it behaves correctly
                proj.body.setSize(32, 32).setOffset(48, 48);
                proj.setVelocityX(p1.flipX ? -750 : 750);
                this.time.delayedCall(1000, () => proj.destroy());
            });
            this.time.delayedCall(500, () => { s.locked = false; lockBody(p1); });
        }
    }

    playAnim(sp, key) {
        if (this.s.lastAnim !== key) {
            sp.play(key, true);
            this.s.lastAnim = key;
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    pixelArt: true, render: { roundPixels: true },
    physics: { default: "arcade", arcade: { gravity: { y: 1600 } } },
    scene: [StartScreen, BrawlerScene, BattleScene]
});
</script>
</body>
</html>
