<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NMN: MINE WARFARE — Beta v1.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:#050308;width:100%;height:100%;overflow:hidden;}
    #gc{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
    #mc{display:none;position:fixed;bottom:0;left:0;right:0;height:170px;pointer-events:none;z-index:999;}
    #mc.on{display:block;}
    .mb{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid #FFD700;
        background:rgba(255,215,0,0.13);color:#FFD700;font-size:9px;display:flex;
        align-items:center;justify-content:center;pointer-events:all;
        user-select:none;-webkit-user-select:none;font-family:"Press Start 2P",monospace;}
    #ml {left:18px; bottom:58px;}
    #mr {left:90px; bottom:58px;}
    #mj {left:54px; bottom:112px;}
    #ma {right:18px;bottom:112px;}  /* melee */
    #mf {right:80px;bottom:80px;}  /* fire */
  </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
  <div class="mb" id="ml">◀</div>
  <div class="mb" id="mr">▶</div>
  <div class="mb" id="mj">▲</div>
  <div class="mb" id="ma">HIT</div>
  <div class="mb" id="mf">🔥</div>
</div>
<script>
// ═══════════════════════════════════════════════════════
//  GLOBALS
// ═══════════════════════════════════════════════════════
const GW=800,GH=450;
const BLAST={minX:-180,maxX:980,minY:-200,maxY:750};

// Mobile input state
const MP={l:false,r:false,j:false,a:false,f:false};

const ROSTER=[
  {name:"Juni",           free:true, frame:0,color:"#00FF88",
   lore:"Enter if you dare; face Anubis in the endless expanse of the sands of time.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Pyro",           free:true, frame:1,color:"#FF6600",
   lore:"Born from the forge. His tusks run hotter than the mine walls.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Glitch Elephant",free:true, frame:2,color:"#AA55FF",
   lore:"A signal corrupted mid-transmission. Exists in two places at once.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Static Lion",    free:true, frame:3,color:"#55AAFF",
   lore:"The roar that breaks frequencies. His mane is pure interference.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Olydia",         free:false,frame:4,color:"#9933CC",
   lore:"Transmission incoming; signal from the stars above: Respond Now.",
   url:"https://books2read.com/u/31NrLw"},
  {name:"Helios",         free:false,frame:5,color:"#FFD700",
   lore:"UNLOCK: Read the Legend.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Wanderer",       free:false,frame:6,color:"#336699",
   lore:"UNLOCK: Become a Patron.",
   url:"https://patreon.com/Lordminadeoro"},
  {name:"Orid",           free:false,frame:7,color:"#884422",
   lore:"UNLOCK: Read the Legend.",
   url:"https://books2read.com/u/4EOxZ0"},
  {name:"Notty",          free:false,frame:8,color:"#FF55AA",
   lore:"UNLOCK: Become a Patron.",
   url:"https://patreon.com/Lordminadeoro"},
  {name:"???",            free:false,frame:9,color:"#444444",
   lore:"UNLOCK: Enter the Mine.",
   url:"https://nonsensemedianetwork.com"}
];

const FREE_FOUR=ROSTER.filter(r=>r.free);

const STAGES=[
  {key:"mana_forest", label:"MANA FOREST", bgKey:"bg_deep_forest"},
  {key:"glitch_mines",label:"GLITCH MINES",bgKey:"forest_bg"}
];

const Match={p1:null,p2:null,stage:null,winner:null,mode:"solo"};

// ═══════════════════════════════════════════════════════
//  SAFE TEXTURE FACTORY
// ═══════════════════════════════════════════════════════
function ensureTex(scene){
  const mkBG=(key,c1,c2)=>{
    if(scene.textures.exists(key))return;
    const c=scene.textures.createCanvas(key,GW,GH);
    const ctx=c.getContext();
    const g=ctx.createLinearGradient(0,0,0,GH);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fillRect(0,0,GW,GH);c.refresh();
  };
  mkBG("bg_deep_forest","#0a1a0a","#050308");
  mkBG("forest_bg","#0d0a1a","#050308");

  if(!scene.textures.exists("brawlers_master")){
    const cols=["#00FF88","#FF6600","#AA55FF","#55AAFF","#9933CC","#FFD700","#336699","#884422","#FF55AA","#222222"];
    const c=scene.textures.createCanvas("brawlers_master",128*10,128);
    const ctx=c.getContext();
    cols.forEach((col,i)=>{
      ctx.fillStyle=col;ctx.fillRect(i*128+4,4,120,120);
      ctx.strokeStyle="#FFD700";ctx.lineWidth=2;ctx.strokeRect(i*128+4,4,120,120);
    });
    c.refresh();
    const tex=scene.textures.get("brawlers_master");
    for(let i=0;i<10;i++)tex.add(i,0,i*128,0,128,128);
  }

  if(!scene.textures.exists("signal_lost")){
    const c=scene.textures.createCanvas("signal_lost",GW,GH);
    const ctx=c.getContext();
    ctx.fillStyle="#050308";ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle="#FF2222";ctx.font="bold 52px monospace";
    ctx.textAlign="center";ctx.fillText("SIGNAL LOST",GW/2,GH/2);
    c.refresh();
  }
}

function addCRT(scene){
  const g=scene.add.graphics().setDepth(9000).setScrollFactor(0).setAlpha(0.055);
  for(let y=0;y<GH;y+=3){g.lineStyle(1,0x000000,1);g.beginPath();g.moveTo(0,y);g.lineTo(GW,y);g.strokePath();}
}

// Gold spark — NO full-screen flash ever
function goldSpark(scene,x,y){
  const g=scene.add.graphics().setDepth(500);
  g.fillStyle(0xFFD700,1);
  for(let i=0;i<8;i++){
    const ang=Math.random()*Math.PI*2;
    const len=8+Math.random()*14;
    g.fillRect(x+Math.cos(ang)*len,y+Math.sin(ang)*len,4,4);
  }
  scene.tweens.add({targets:g,alpha:0,duration:180,onComplete:()=>g.destroy()});
}

// ═══════════════════════════════════════════════════════
//  START SCREEN
// ═══════════════════════════════════════════════════════
class StartScreen extends Phaser.Scene{
  constructor(){super("StartScreen");}
  preload(){
    this.load.image("title_img","logo.jpg");
    this.load.image("bg_deep_forest","bg_deep_forest.jpg");
    this.load.image("forest_bg","forest_bg.jpg");
    this.load.image("signal_lost","signal_lost.jpg");
    this.load.spritesheet("brawlers_master","brawlers_master.jpg",{frameWidth:128,frameHeight:128});
    ["juni","pyro","olydia","helios","wanderer","orid"].forEach(n=>{
      this.load.image(n+"_beta",n+"_beta.jpg");
    });
    this.load.on("loaderror",f=>console.warn("Fallback active:",f.key));
  }
  create(){
    ensureTex(this);addCRT(this);
    this.add.image(GW/2,GH/2,"bg_deep_forest").setDisplaySize(GW,GH).setAlpha(0.35);
    const scan=this.add.rectangle(GW/2,0,GW,2,0xFFD700,0.2).setDepth(1).setScrollFactor(0);
    this.tweens.add({targets:scan,y:GH,duration:2800,repeat:-1});
    if(this.textures.exists("title_img")&&this.textures.get("title_img").source[0].width>1)
      this.add.image(GW/2,GH/2-90,"title_img").setScale(0.42).setDepth(2);
    this.add.text(GW/2,GH/2-18,"NMN: MINE WARFARE",{fontFamily:"Press Start 2P",fontSize:"18px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5).setDepth(2);
    this.add.text(GW/2,GH/2+16,"BETA v1.2",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#555"}).setOrigin(0.5).setDepth(2);
    const b=this.add.text(GW/2,GH/2+68,"PRESS ANY KEY / TAP TO START",{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700"}).setOrigin(0.5).setDepth(2);
    this.tweens.add({targets:b,alpha:0,duration:700,yoyo:true,repeat:-1});
    this.add.text(GW/2,GH-14,"nonsensemedianetwork.com  |  @LordOroNMN",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#333"}).setOrigin(0.5).setDepth(2);
    const go=()=>this.scene.start("BrawlerScene");
    this.input.keyboard.on("keydown",go);
    this.input.on("pointerdown",go);
  }
}

// ═══════════════════════════════════════════════════════
//  ROSTER SCENE
// ═══════════════════════════════════════════════════════
class BrawlerScene extends Phaser.Scene{
  constructor(){super("BrawlerScene");}
  create(){
    ensureTex(this);addCRT(this);
    Match.p1=null;Match.p2=null;Match.stage=null;Match.winner=null;Match.mode="solo";
    this.scoutIdx=-1;this.p1Done=false;this.p2Done=false;

    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    this.add.rectangle(0,0,GW,38,0x0a0a0a,0.92).setOrigin(0);
    this.add.text(GW/2,10,"SELECT BRAWLERS",{fontFamily:"Press Start 2P",fontSize:"11px",color:"#FFD700"}).setOrigin(0.5,0);

    // Mode toggle
    const soloBtn=this.add.text(GW/2-80,GH-56,"SOLO MISSION",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#050308",backgroundColor:"#FFD700",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true});
    const coopBtn=this.add.text(GW/2+80,GH-56,"LOCAL CO-OP",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FFD700",backgroundColor:"#111",padding:{x:8,y:4}}).setOrigin(0.5).setInteractive({useHandCursor:true});

    const setMode=(m)=>{
      Match.mode=m;
      soloBtn.setStyle({color:m==="solo"?"#050308":"#FFD700",backgroundColor:m==="solo"?"#FFD700":"#111"});
      coopBtn.setStyle({color:m==="coop"?"#050308":"#FFD700",backgroundColor:m==="coop"?"#FFD700":"#111"});
      if(m==="solo"){
        this.intelTxt.setText("SOLO: Pick P1 — CPU will fight you.").setColor("#FFD700");
      } else {
        this.intelTxt.setText("CO-OP: Click once to scout, again to select P1, then P2.").setColor("#888");
      }
    };
    soloBtn.on("pointerdown",()=>setMode("solo"));
    coopBtn.on("pointerdown",()=>setMode("coop"));

    // Intel bar
    this.add.rectangle(GW/2,56,GW-16,26,0x111).setOrigin(0.5);
    this.intelTxt=this.add.text(GW/2,56,"SOLO: Pick P1 — CPU will fight you.",{fontFamily:"Press Start 2P",fontSize:"6px",color:"#FFD700",align:"center",wordWrap:{width:GW-28}}).setOrigin(0.5);

    this.p1Lbl=this.add.text(16,GH-36,"P1: ---",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#00FF88"});
    this.p2Lbl=this.add.text(GW-16,GH-36,"P2: ---",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FF5555"}).setOrigin(1,0);

    this.startBtn=this.add.text(GW/2,GH-18,"▶ START FORGE ◀",{fontFamily:"Press Start 2P",fontSize:"9px",color:"#050308",backgroundColor:"#FFD700",padding:{x:10,y:4}}).setOrigin(0.5).setVisible(false).setInteractive({useHandCursor:true});
    this.startBtn.on("pointerdown",()=>this.scene.start("StageSelectScene"));

    // Grid
    const cols=5,cellW=150,cellH=82;
    const sx=GW/2-(cols*cellW)/2+cellW/2,sy=80;

    ROSTER.forEach((entry,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const x=sx+col*cellW,y=sy+row*cellH+cellH/2;
      const bc=entry.free?0x00ff88:0x444444;
      const panel=this.add.rectangle(x,y,cellW-10,cellH-8,0x0d0d0d).setStrokeStyle(2,bc).setInteractive({useHandCursor:true});

      const pk=entry.name.toLowerCase().replace(/ /g,"_")+"_beta";
      const uk=this.textures.exists(pk)?pk:"brawlers_master";
      const fr=this.textures.exists(pk)?null:entry.frame;
      (fr!==null?this.add.image(x,y-14,uk,fr):this.add.image(x,y-14,uk)).setDisplaySize(36,36);

      this.add.text(x,y+18,entry.name,{fontFamily:"Press Start 2P",fontSize:"5px",color:entry.free?entry.color:"#555",align:"center",wordWrap:{width:cellW-14}}).setOrigin(0.5);
      if(!entry.free) this.add.text(x,y+30,"LOCKED",{fontFamily:"Press Start 2P",fontSize:"5px",color:"#FF4444"}).setOrigin(0.5);

      panel.on("pointerover",()=>panel.setStrokeStyle(2,0xFFD700));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,this.p1Done&&Match.p1===entry?0x00ff88:this.p2Done&&Match.p2===entry?0xFF5555:bc));

      panel.on("pointerdown",()=>{
        // Locked: scout then open URL
        if(!entry.free){
          if(this.scoutIdx===i){if(entry.url)window.open(entry.url,"_blank");}
          else{this.scoutIdx=i;this.intelTxt.setText("🔒 "+entry.name.toUpperCase()+": "+entry.lore).setColor("#FF8888");}
          return;
        }
        // Scout first
        if(this.scoutIdx!==i){
          this.scoutIdx=i;
          this.intelTxt.setText("★ "+entry.name.toUpperCase()+"  "+entry.lore).setColor(entry.color);
          return;
        }
        // Assign
        if(!this.p1Done){
          Match.p1=entry;this.p1Done=true;
          this.p1Lbl.setText("P1: "+entry.name).setColor(entry.color);
          panel.setStrokeStyle(3,0x00ff88);this.scoutIdx=-1;
          if(Match.mode==="solo"){
            // Auto-assign random free CPU as P2
            const cpu=Phaser.Utils.Array.GetRandom(FREE_FOUR.filter(r=>r!==entry));
            Match.p2=cpu;this.p2Done=true;
            this.p2Lbl.setText("CPU: "+cpu.name).setColor(cpu.color);
            this.intelTxt.setText("CPU OPPONENT: "+cpu.name+" — HIT START FORGE").setColor("#FF5555");
            this.startBtn.setVisible(true);
          } else {
            this.intelTxt.setText("P1 LOCKED — SCOUT P2 NOW").setColor("#00FF88");
          }
        } else if(!this.p2Done&&entry!==Match.p1){
          Match.p2=entry;this.p2Done=true;
          this.p2Lbl.setText("P2: "+entry.name).setColor(entry.color);
          panel.setStrokeStyle(3,0xFF5555);this.scoutIdx=-1;
          this.intelTxt.setText("BOTH WARRIORS READY — HIT START FORGE").setColor("#FFD700");
          this.startBtn.setVisible(true);
        }
      });
    });
  }
}

// ═══════════════════════════════════════════════════════
//  STAGE SELECT
// ═══════════════════════════════════════════════════════
class StageSelectScene extends Phaser.Scene{
  constructor(){super("StageSelectScene");}
  create(){
    ensureTex(this);addCRT(this);
    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    this.add.text(GW/2,20,"SELECT STAGE",{fontFamily:"Press Start 2P",fontSize:"12px",color:"#FFD700"}).setOrigin(0.5);
    STAGES.forEach((stage,i)=>{
      const x=GW/2+(i===0?-190:190),y=GH/2;
      this.add.image(x,y,stage.bgKey).setDisplaySize(320,160).setAlpha(0.55);
      const panel=this.add.rectangle(x,y,320,160,0x000000,0).setStrokeStyle(2,0xFFD700).setInteractive({useHandCursor:true});
      this.add.text(x,y-14,stage.label,{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700",stroke:"#000",strokeThickness:3}).setOrigin(0.5);
      this.add.text(x,y+12,i===0?"STABLE / VERDANT":"UNSTABLE / CORRUPTED",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#AAAAAA"}).setOrigin(0.5);
      panel.on("pointerover",()=>panel.setStrokeStyle(3,0xFFFFFF));
      panel.on("pointerout", ()=>panel.setStrokeStyle(2,0xFFD700));
      panel.on("pointerdown",()=>{Match.stage=stage.key;this.scene.start("BattleScene");});
    });
    this.add.text(GW/2,GH-18,"Click a stage to enter the mine.",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#444"}).setOrigin(0.5);
  }
}

// ═══════════════════════════════════════════════════════
//  BATTLE SCENE
// ═══════════════════════════════════════════════════════
class BattleScene extends Phaser.Scene{
  constructor(){super("BattleScene");}

  create(){
    ensureTex(this);
    const stage=STAGES.find(s=>s.key===Match.stage)||STAGES[0];

    // BG
    this.add.image(GW/2,GH/2,stage.bgKey).setDisplaySize(GW*1.3,GH*1.3).setAlpha(0.55).setScrollFactor(0);
    this.add.image(GW/2,GH/2,stage.bgKey).setDisplaySize(GW*1.05,GH*1.05).setAlpha(0.2).setScrollFactor(0).setTint(0x8899ff);
    addCRT(this);

    // Particles
    if(Match.stage==="mana_forest"){
      try{this.add.particles(0,0,"brawlers_master",{frame:0,x:{min:0,max:GW},y:GH,lifespan:3500,speedY:{min:-30,max:-80},scale:{start:0.06,end:0},alpha:{start:0.4,end:0},quantity:1,frequency:350,tint:0x88FFaa});}catch(e){}
    }

    // Physics
    this.physics.world.gravity.y=700;
    this.physics.world.setBounds(BLAST.minX,BLAST.minY,BLAST.maxX-BLAST.minX,BLAST.maxY-BLAST.minY);

    // ── PLATFORMS (floating, not edge-to-edge) ──
    this.platforms=this.physics.add.staticGroup();

    // Main stage — floating center
    const main=this.add.rectangle(GW/2,GH-60,540,18,0x3a2a0a);
    this.add.rectangle(GW/2,GH-70,540,4,0xFFD700,0.35);
    this.physics.add.existing(main,true);
    this.platforms.add(main);

    // Side platforms
    [[170,GH-160,160],[630,GH-160,160],[GW/2,GH-240,180]].forEach(([px,py,pw])=>{
      const p=this.add.rectangle(px,py,pw,14,0x2a1a08);
      this.add.rectangle(px,py-6,pw,3,0xFFD700,0.25);
      this.physics.add.existing(p,true);
      this.platforms.add(p);
    });

    // ── DEEP PIT SHADOW PLATFORM ──
    // When touched: triggers reinforcement AI drop
    this.shadowPlat=this.add.rectangle(GW/2,GH+90,160,14,0x220000);
    this.shadowPlat.setAlpha(0.6);
    this.add.rectangle(GW/2,GH+84,160,3,0xFF2222,0.5);
    this.physics.add.existing(this.shadowPlat,true);
    this.platforms.add(this.shadowPlat);
    this.reinforcementTriggered=false;

    // ── PLAYERS ──
    const p1cfg=Match.p1||ROSTER[0];
    const p2cfg=Match.p2||ROSTER[1];

    this.p1=this.makePlayer(180,GH-120,p1cfg);
    this.p2=this.makePlayer(620,GH-120,p2cfg);
    this.p2.setFlipX(true);

    this.physics.add.collider(this.p1,this.platforms);
    this.physics.add.collider(this.p2,this.platforms);

    // State
    this.p1Dmg=0;this.p2Dmg=0;
    this.p1Lives=3;this.p2Lives=3;
    this.p1Stun=false;this.p2Stun=false;
    this.p1AtkCD=false;this.p2AtkCD=false;
    this.p1Jumps=0;this.p2Jumps=0;
    this.hitStop=false;this.gameOver=false;
    this.aiActive=Match.mode==="solo";
    this.reinforcementAI=null;

    // Deep pit overlap — check p1 & p2 landing on shadow plat
    this.physics.add.overlap(this.p1,this.shadowPlat,()=>this.triggerReinforcement("p1"));
    this.physics.add.overlap(this.p2,this.shadowPlat,()=>this.triggerReinforcement("p2"));

    // Projectile groups
    this.proj1=this.physics.add.group();
    this.proj2=this.physics.add.group();
    this.projR=this.physics.add.group(); // reinforcement

    // Hitbox groups (melee)
    this.hb1=this.physics.add.group();
    this.hb2=this.physics.add.group();
    this.hbR=this.physics.add.group();

    // P1 melee hits P2
    this.physics.add.overlap(this.hb1,this.p2,(hb)=>{if(!hb.active)return;const pos={x:hb.x,y:hb.y};hb.destroy();this.applyHit("p1","p2",hb.getData("pow"),pos);});
    // P2 melee hits P1
    this.physics.add.overlap(this.hb2,this.p1,(hb)=>{if(!hb.active)return;const pos={x:hb.x,y:hb.y};hb.destroy();this.applyHit("p2","p1",hb.getData("pow"),pos);});
    // P1 proj hits P2
    this.physics.add.overlap(this.proj1,this.p2,(pr)=>{if(!pr.active)return;const pos={x:pr.x,y:pr.y};pr.destroy();this.applyHit("p1","p2",10,pos);});
    // P2/AI proj hits P1
    this.physics.add.overlap(this.proj2,this.p1,(pr)=>{if(!pr.active)return;const pos={x:pr.x,y:pr.y};pr.destroy();this.applyHit("p2","p1",10,pos);});

    // HUD
    this.createHUD(p1cfg,p2cfg);

    // Keys
    this.k1=this.input.keyboard.addKeys({
      left:Phaser.Input.Keyboard.KeyCodes.A,
      right:Phaser.Input.Keyboard.KeyCodes.D,
      up:Phaser.Input.Keyboard.KeyCodes.W,
      atk:Phaser.Input.Keyboard.KeyCodes.J,
      fire:Phaser.Input.Keyboard.KeyCodes.L
    });
    this.k2=this.input.keyboard.addKeys({
      left:Phaser.Input.Keyboard.KeyCodes.LEFT,
      right:Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:Phaser.Input.Keyboard.KeyCodes.UP,
      atk:Phaser.Input.Keyboard.KeyCodes.NUMPAD_ONE,
      fire:Phaser.Input.Keyboard.KeyCodes.NUMPAD_THREE
    });

    // Gamepad
    this.pad=null;
    this.input.gamepad.once("connected",pad=>{this.pad=pad;});

    // Mobile
    if(this.sys.game.device.input.touch){
      document.getElementById("mc").classList.add("on");
      this.bindMobile();
    }

    // AI timer
    this.aiTimer=0;
    this.aiFireTimer=0;
  }

  makePlayer(x,y,cfg){
    const pk=cfg.name.toLowerCase().replace(/ /g,"_")+"_beta";
    const uk=this.textures.exists(pk)?pk:"brawlers_master";
    const fr=this.textures.exists(pk)?null:cfg.frame;
    const sp=fr!==null?this.physics.add.sprite(x,y,uk,fr):this.physics.add.sprite(x,y,uk);
    sp.setDisplaySize(52,52).setCollideWorldBounds(false);
    sp.body.setMaxVelocityY(1000);
    sp.setData("cfg",cfg);
    return sp;
  }

  createHUD(p1cfg,p2cfg){
    const D=9999;
    this.add.rectangle(0,0,210,42,0x050308,0.9).setOrigin(0).setDepth(D).setScrollFactor(0);
    this.add.rectangle(GW,0,210,42,0x050308,0.9).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.p1NT=this.add.text(10,6,p1cfg.name,{fontFamily:"Press Start 2P",fontSize:"7px",color:p1cfg.color||"#00FF88"}).setDepth(D).setScrollFactor(0);
    this.p1DT=this.add.text(10,18,"0%",{fontFamily:"Press Start 2P",fontSize:"13px",color:"#FFF"}).setDepth(D).setScrollFactor(0);
    this.p1LT=this.add.text(10,36);//lives below
    this.p2NT=this.add.text(GW-10,6,p2cfg.name,{fontFamily:"Press Start 2P",fontSize:"7px",color:p2cfg.color||"#FF5555"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.p2DT=this.add.text(GW-10,18,"0%",{fontFamily:"Press Start 2P",fontSize:"13px",color:"#FFF"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    this.add.text(GW/2,6,(Match.stage||"STAGE").toUpperCase().replace("_"," "),{fontFamily:"Press Start 2P",fontSize:"7px",color:"#FFD700"}).setOrigin(0.5,0).setDepth(D).setScrollFactor(0);
    this.p1Hearts=this.add.text(12,36,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FF4444"}).setDepth(D).setScrollFactor(0);
    this.p2Hearts=this.add.text(GW-12,36,"♥♥♥",{fontFamily:"Press Start 2P",fontSize:"8px",color:"#FF4444"}).setOrigin(1,0).setDepth(D).setScrollFactor(0);
    if(Match.mode==="solo") this.p2NT.setText("CPU: "+Match.p2.name);
  }

  bindMobile(){
    const b=(id,prop)=>{
      const el=document.getElementById(id);
      el.addEventListener("touchstart",e=>{e.preventDefault();MP[prop]=true;},{passive:false});
      el.addEventListener("touchend",  e=>{e.preventDefault();MP[prop]=false;},{passive:false});
    };
    b("ml","l");b("mr","r");b("mj","j");b("ma","a");b("mf","f");
  }

  spawnMelee(owner){
    const sp=owner==="p1"?this.p1:owner==="p2"?this.p2:this.reinforcementAI;
    const grp=owner==="p1"?this.hb1:owner==="p2"?this.hb2:this.hbR;
    if(!sp||!sp.active) return;
    const dir=sp.flipX?-1:1;
    const hb=this.add.rectangle(sp.x+dir*40,sp.y,48,28,0xFFD700,0.4);
    this.physics.add.existing(hb);
    hb.body.setAllowGravity(false).setImmovable(true);
    hb.setData("pow",18);
    grp.add(hb);
    this.tweens.add({targets:hb,alpha:0,duration:100,onComplete:()=>hb.active&&hb.destroy()});
    this.cameras.main.shake(70,0.004);
  }

  spawnProjectile(owner){
    const sp=owner==="p1"?this.p1:owner==="p2"?this.p2:this.reinforcementAI;
    const grp=owner==="p1"?this.proj1:owner==="p2"?this.proj2:this.projR;
    if(!sp||!sp.active) return;
    const dir=sp.flipX?-1:1;
    const pr=this.add.rectangle(sp.x+dir*36,sp.y-4,18,9,0xFFD700,0.9);
    this.physics.add.existing(pr);
    pr.body.setAllowGravity(false);
    pr.body.setVelocityX(dir*580);
    grp.add(pr);
    this.tweens.add({targets:pr,alpha:0.5,duration:600,onComplete:()=>pr.active&&pr.destroy()});
  }

  applyHit(atkId,tgtId,power,pos){
    if(this.gameOver) return;
    if(tgtId==="p2") this.p2Dmg+=power; else this.p1Dmg+=power;
    const dmg=tgtId==="p2"?this.p2Dmg:this.p1Dmg;
    const tgt=tgtId==="p2"?this.p2:this.p1;
    const atk=atkId==="p1"?this.p1:atkId==="p2"?this.p2:this.reinforcementAI;

    // Gold spark at impact point — NO screen flash
    if(pos) goldSpark(this,pos.x,pos.y);

    // NMN Smash formula
    const scale=1+(dmg*0.03);
    const dirX=tgt.x>=(atk?atk.x:GW/2)?1:-1;
    const vx=300*scale*dirX;
    const vy=-280*scale;

    // Hit-stop 60ms — stun locks INPUT not velocity
    this.hitStop=true;
    this.physics.world.pause();
    this.time.delayedCall(60,()=>{
      this.physics.world.resume();
      this.hitStop=false;
      // Apply knockback AFTER physics resumes so sprite flies
      tgt.body.setVelocity(vx,vy);
      if(tgtId==="p1") this.p1Stun=true; else this.p2Stun=true;
      this.time.delayedCall(300,()=>{if(tgtId==="p1")this.p1Stun=false;else this.p2Stun=false;});
    });

    // Red tint on target (no flash)
    this.tweens.add({targets:tgt,tint:{from:0xFF2222,to:0xFFFFFF},duration:200});
    this.updateHUD();
  }

  triggerReinforcement(who){
    if(this.reinforcementTriggered||this.gameOver) return;
    this.reinforcementTriggered=true;

    // Dramatic drop-in text
    const txt=this.add.text(GW/2,GH/2-60,"⚡ REINFORCEMENT INCOMING ⚡",{
      fontFamily:"Press Start 2P",fontSize:"12px",color:"#FF2222",stroke:"#000",strokeThickness:3
    }).setOrigin(0.5).setDepth(500);
    this.tweens.add({targets:txt,alpha:0,delay:1500,duration:600,onComplete:()=>txt.destroy()});
    this.cameras.main.shake(300,0.015);

    // Spawn aggressive AI from above
    const rCfg=FREE_FOUR.find(r=>r!==Match.p1&&r!==Match.p2)||FREE_FOUR[0];
    const pk=rCfg.name.toLowerCase().replace(/ /g,"_")+"_beta";
    const uk=this.textures.exists(pk)?pk:"brawlers_master";
    const fr=this.textures.exists(pk)?null:rCfg.frame;
    const ra=fr!==null?this.physics.add.sprite(GW/2,-60,uk,fr):this.physics.add.sprite(GW/2,-60,uk);
    ra.setDisplaySize(52,52).setCollideWorldBounds(false);
    ra.body.setMaxVelocityY(1000);
    ra.setTint(0xFF4444); // red tint = hostile
    this.reinforcementAI=ra;
    this.physics.add.collider(ra,this.platforms);

    // Reinforcement attacks both players
    this.physics.add.overlap(this.hbR,this.p1,(hb)=>{if(!hb.active)return;const pos={x:hb.x,y:hb.y};hb.destroy();this.applyHit("reinforcement","p1",14,pos);});
    this.physics.add.overlap(this.hbR,this.p2,(hb)=>{if(!hb.active)return;const pos={x:hb.x,y:hb.y};hb.destroy();this.applyHit("reinforcement","p2",14,pos);});
    this.physics.add.overlap(this.projR,this.p1,(pr)=>{if(!pr.active)return;const pos={x:pr.x,y:pr.y};pr.destroy();this.applyHit("reinforcement","p1",8,pos);});
    this.physics.add.overlap(this.projR,this.p2,(pr)=>{if(!pr.active)return;const pos={x:pr.x,y:pr.y};pr.destroy();this.applyHit("reinforcement","p2",8,pos);});

    this.rAtkTimer=0;
    this.rJumps=0;
  }

  runAI(sprite,targetSprite,atkRef,jumpRef,timerRef,fireRef,grpAtk,grpFire,dt){
    if(!sprite||!sprite.active||!sprite.body) return;
    if(!targetSprite||!targetSprite.active) return;
    const body=sprite.body;
    const dx=targetSprite.x-sprite.x;
    const dy=targetSprite.y-sprite.y;
    const dist=Math.abs(dx);

    // Move toward target
    if(dist>40)  body.setVelocityX(dx>0?200:-200);
    else         body.setVelocityX(0);
    sprite.setFlipX(dx<0);

    // Jump if target is above or to close-over
    if(body.blocked.down) this[jumpRef]=0;
    this[timerRef]=(this[timerRef]||0)+dt;
    if(this[timerRef]>1200&&this[jumpRef]<2){
      if(dy<-60||Math.random()<0.3){body.setVelocityY(-370);this[jumpRef]++;this[timerRef]=0;}
    }

    // Melee if close
    this[atkRef]=(this[atkRef]||false);
    if(dist<70&&!this[atkRef]){
      this[atkRef]=true;
      this.spawnMelee(sprite===this.p2?"p2":"reinforcement");
      this.time.delayedCall(600,()=>{this[atkRef]=false;});
    }

    // Projectile if mid range
    this[fireRef]=(this[fireRef]||0)+dt;
    if(dist>80&&dist<380&&this[fireRef]>1800){
      this[fireRef]=0;
      this.spawnProjectile(sprite===this.p2?"p2":"reinforcement");
    }
  }

  checkBlast(){
    [[this.p1,"p1"],[this.p2,"p2"]].forEach(([sp,id])=>{
      if(!sp.active) return;
      if(sp.x<BLAST.minX||sp.x>BLAST.maxX||sp.y<BLAST.minY||sp.y>BLAST.maxY) this.signalLost(id);
    });
    // Reinforcement blasts out — just destroy it
    if(this.reinforcementAI&&this.reinforcementAI.active){
      const r=this.reinforcementAI;
      if(r.x<BLAST.minX||r.x>BLAST.maxX||r.y<BLAST.minY||r.y>BLAST.maxY) r.destroy();
    }
    // Clean projectiles
    [this.proj1,this.proj2,this.projR].forEach(grp=>{
      grp.getChildren().forEach(pr=>{if(pr.x<BLAST.minX||pr.x>BLAST.maxX||pr.y>BLAST.maxY)pr.destroy();});
    });
  }

  signalLost(loserId){
    if(this.gameOver) return;
    this.gameOver=true;
    Match.winner=loserId==="p1"?"P2":"P1";
    const loser=loserId==="p1"?this.p1:this.p2;
    loser.setActive(false).setVisible(false);
    if(loserId==="p1") this.p1Lives--; else this.p2Lives--;
    this.updateHUD();
    this.cameras.main.shake(500,0.022);
    // Signal Lost static image overlay
    const slImg=this.textures.exists("signal_lost")?
      this.add.image(GW/2,GH/2,"signal_lost").setDisplaySize(GW,GH).setAlpha(0).setDepth(8000).setScrollFactor(0):
      this.add.rectangle(GW/2,GH/2,GW,GH,0x050308,0).setDepth(8000).setScrollFactor(0);
    this.tweens.add({targets:slImg,alpha:0.88,duration:400});
    this.add.text(GW/2,GH/2-22,"SIGNAL LOST",{fontFamily:"Press Start 2P",fontSize:"22px",color:"#FF2222",stroke:"#000",strokeThickness:4}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
    this.add.text(GW/2,GH/2+14,Match.winner+" WINS THE SECTOR",{fontFamily:"Press Start 2P",fontSize:"10px",color:"#FFD700"}).setDepth(8001).setOrigin(0.5).setScrollFactor(0);
    this.time.delayedCall(1800,()=>{
      document.getElementById("mc").classList.remove("on");
      this.scene.start("ResultsScene");
    });
  }

  updateHUD(){
    this.p1DT.setText(this.p1Dmg+"%");
    this.p2DT.setText(this.p2Dmg+"%");
    if(this.p1Dmg>80) this.p1DT.setColor("#FF4444");
    if(this.p2Dmg>80) this.p2DT.setColor("#FF4444");
    const h=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,3-n));
    this.p1Hearts.setText(h(this.p1Lives));
    this.p2Hearts.setText(h(this.p2Lives));
  }

  update(time,dt){
    if(this.gameOver||this.hitStop) return;
    this.moveP1(dt);
    if(Match.mode==="solo"){ this.runAI(this.p2,this.p1,"p2AtkCD","p2Jumps","aiTimer","aiFireTimer",this.hb2,this.proj2,dt); }
    else { this.moveP2(dt); }
    if(this.reinforcementAI&&this.reinforcementAI.active){
      const tgt=Math.random()<0.5?this.p1:this.p2;
      this.runAI(this.reinforcementAI,tgt,"rAtkCD","rJumps","rAtkTimer","rFireTimer",this.hbR,this.projR,dt);
    }
    this.checkBlast();
  }

  moveP1(dt){
    const sp=this.p1; if(!sp.active||!sp.body) return;
    const body=sp.body; const k=this.k1;
    if(body.blocked.down) this.p1Jumps=0;
    if(!this.p1Stun){
      const gL=k.left.isDown||MP.l;
      const gR=k.right.isDown||MP.r;
      const gJ=Phaser.Input.Keyboard.JustDown(k.up)||MP.j;
      const gA=Phaser.Input.Keyboard.JustDown(k.atk)||MP.a;
      const gF=Phaser.Input.Keyboard.JustDown(k.fire)||MP.f;
      if(gL){body.setVelocityX(-210);sp.setFlipX(true);}
      else if(gR){body.setVelocityX(210);sp.setFlipX(false);}
      else body.setVelocityX(body.velocity.x*0.72);
      if(gJ&&this.p1Jumps<2){body.setVelocityY(-385);this.p1Jumps++;MP.j=false;}
      if(gA&&!this.p1AtkCD){this.p1AtkCD=true;this.spawnMelee("p1");this.time.delayedCall(220,()=>this.p1AtkCD=false);MP.a=false;}
      if(gF&&!this.p1AtkCD){this.p1AtkCD=true;this.spawnProjectile("p1");this.time.delayedCall(300,()=>this.p1AtkCD=false);MP.f=false;}
    }
  }

  moveP2(dt){
    const sp=this.p2; if(!sp.active||!sp.body) return;
    const body=sp.body; const k=this.k2;
    if(body.blocked.down) this.p2Jumps=0;
    if(!this.p2Stun){
      if(k.left.isDown){body.setVelocityX(-210);sp.setFlipX(true);}
      else if(k.right.isDown){body.setVelocityX(210);sp.setFlipX(false);}
      else body.setVelocityX(body.velocity.x*0.72);
      if(Phaser.Input.Keyboard.JustDown(k.up)&&this.p2Jumps<2){body.setVelocityY(-385);this.p2Jumps++;}
      if(Phaser.Input.Keyboard.JustDown(k.atk)&&!this.p2AtkCD){this.p2AtkCD=true;this.spawnMelee("p2");this.time.delayedCall(220,()=>this.p2AtkCD=false);}
      if(Phaser.Input.Keyboard.JustDown(k.fire)&&!this.p2AtkCD){this.p2AtkCD=true;this.spawnProjectile("p2");this.time.delayedCall(300,()=>this.p2AtkCD=false);}
      // Gamepad P2
      if(this.pad){
        const ax=this.pad.axes.length>0?this.pad.axes[0].getValue():0;
        if(Math.abs(ax)>0.2) body.setVelocityX(ax*210*1.2);
        if(this.pad.buttons[0]&&this.pad.buttons[0].pressed&&this.p2Jumps<2){body.setVelocityY(-385);this.p2Jumps++;}
        if(this.pad.buttons[1]&&this.pad.buttons[1].pressed&&!this.p2AtkCD){this.p2AtkCD=true;this.spawnMelee("p2");this.time.delayedCall(220,()=>this.p2AtkCD=false);}
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
//  RESULTS SCENE
// ═══════════════════════════════════════════════════════
class ResultsScene extends Phaser.Scene{
  constructor(){super("ResultsScene");}
  create(){
    ensureTex(this);addCRT(this);
    this.add.rectangle(0,0,GW,GH,0x050308).setOrigin(0);
    const winner=Match.winner||"P1";
    const wcfg=winner==="P1"?Match.p1:Match.p2;
    if(wcfg){
      const pk=wcfg.name.toLowerCase().replace(/ /g,"_")+"_beta";
      const uk=this.textures.exists(pk)?pk:"brawlers_master";
      const fr=this.textures.exists(pk)?null:wcfg.frame;
      const img=fr!==null?this.add.image(GW/2,GH/2-65,uk,fr):this.add.image(GW/2,GH/2-65,uk);
      img.setDisplaySize(110,110).setAlpha(0.9);
      this.tweens.add({targets:img,scaleX:1.07,scaleY:1.07,yoyo:true,repeat:-1,duration:900});
    }
    this.add.text(GW/2,GH/2+8,"SECTOR CLEARED",{fontFamily:"Press Start 2P",fontSize:"18px",color:"#FFD700",stroke:"#000",strokeThickness:4}).setOrigin(0.5);
    this.add.text(GW/2,GH/2+40,winner+" WINS",{fontFamily:"Press Start 2P",fontSize:"12px",color:wcfg?.color||"#FFF"}).setOrigin(0.5);

    // Lore CTA using winner's url
    const ctaUrl=wcfg?.url||"https://books2read.com/u/4EOxZ0";
    const ctaTxt=wcfg?.lore?.startsWith("UNLOCK")||!wcfg?.lore
      ?"📖 READ THE LEGEND → books2read.com"
      :"📖 READ THE LEGEND → books2read.com";
    const cta=this.add.text(GW/2,GH/2+70,ctaTxt,{fontFamily:"Press Start 2P",fontSize:"7px",color:"#55AAFF"}).setOrigin(0.5).setInteractive({useHandCursor:true});
    cta.on("pointerdown",()=>window.open(ctaUrl,"_blank"));
    this.tweens.add({targets:cta,alpha:0.5,duration:900,yoyo:true,repeat:-1});

    this.add.text(GW/2,GH-28,"Do you want to test your luck again?",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#888"}).setOrigin(0.5);
    this.add.text(GW/2,GH-14,"ANY KEY / TAP = REMATCH    ESC = TITLE",{fontFamily:"Press Start 2P",fontSize:"7px",color:"#444"}).setOrigin(0.5);

    this.input.keyboard.on("keydown",e=>{
      if(e.key==="Escape"){Match.p1=null;Match.p2=null;Match.stage=null;Match.winner=null;this.scene.start("StartScreen");}
      else this.scene.start("BattleScene");
    });
    this.input.on("pointerdown",()=>this.scene.start("BattleScene"));
  }
}
