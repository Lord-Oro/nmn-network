<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-P5WL9XNDY8');</script>
    <style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:monospace;color:#FFD700;}</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800, height: 400,
    parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 1200 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, enemy, cursors, space, pHealth=100, eHealth=100, pBar, eBar, jumpCount=0;
let gameState = 'TITLE', selectedFrame = 0;

function preload() {
    // FORCE PATHS TO YOUR GITHUB REPO
    this.load.setBaseURL('https://Lord-Oro.github.io/nmn-network/');
    
    this.load.image('bg', 'brawler/forest_bg.jpg'); 
    this.load.spritesheet('elephants', 'brawler/hero-sheet.png', { frameWidth: 28, frameHeight: 52 });
    
    // Character Portraits
    const scouts = ['pyro', 'juni', 'olydia', 'helios', 'wanderer', 'orid'];
    scouts.forEach(s => this.load.image(`p_${s}`, `brawler/${s}_beta.jpg`));
}

function create() {
    // Background with more intensity
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400).setAlpha(0.6);
    
    // Branding & Title
    this.titleTxt = this.add.text(400, 180, 'NONSENSICAL BRAWLER\n[SECTOR 1: THE FORGE]\n\nCLICK TO ENGAGE', { 
        font: '24px Courier', fill: '#FFD700', align: 'center', stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setInteractive();

    // Universal Book Link Button
    let loreLink = this.add.text(400, 340, '📖 READ JUNI THE IMMORTAL (GLOBAL)', { 
        font: '16px Courier', fill: '#000', backgroundColor: '#FFD700', padding: {x:10, y:5} 
    }).setOrigin(0.5).setInteractive();
    loreLink.on('pointerdown', () => window.open('https://books2read.com/u/4EOxZ0', '_blank'));

    // Donor Ticker
    this.donorTxt = this.add.text(800, 380, "LATEST EXCAVATORS: THANK YOU FOR JOINING THE MADNESS! | SECTOR 1 ALPHA LIVE | JUNI THE IMMORTAL PUBLISHED WORLDWIDE!", {
        font: '14px Courier', fill: '#FFD700'
    });

    this.roster = this.add.group();
    const rosterData = [
        { key: 'p_pyro', x: 100, f: 0, label: 'PYRO' },
        { key: 'p_juni', x: 220, f: 20, label: 'JUNI' },
        { key: 'p_olydia', x: 340, f: 40, label: 'OLYDIA' },
        { key: 'p_helios', x: 460, f: 60, label: 'HELIOS' },
        { key: 'p_wanderer', x: 580, f: 80, label: 'WANDERER' },
        { key: 'p_orid', x: 700, f: 100, label: 'ORID' }
    ];

    rosterData.forEach(data => {
        let box = this.add.rectangle(data.x, 200, 80, 80, 0x1a1510).setStrokeStyle(2, 0xFFD700).setInteractive();
        let img = this.add.image(data.x, 200, data.key).setDisplaySize(75, 75);
        this.add.text(data.x, 260, data.label, {font:'10px Courier'}).setOrigin(0.5);
        
        box.on('pointerdown', () => { 
            if(data.f <= 20) { 
                selectedFrame = data.f; 
                startBattle(this); 
            } 
        });
        this.roster.addMultiple([box, img]);
    });
    this.roster.setVisible(false);

    let ground = this.add.rectangle(400, 390, 800, 20, 0x000).setAlpha(0);
    this.physics.add.existing(ground, true);
    player = this.physics.add.sprite(150, 300, 'elephants', 0).setScale(2.5).setVisible(false).setCollideWorldBounds(true);
    enemy = this.physics.add.sprite(650, 300, 'elephants', 20).setScale(2.5).setVisible(false).setFlipX(true);
    this.physics.add.collider(player, ground);
    this.physics.add.collider(enemy, ground);

    pBar = this.add.rectangle(20, 30, 200, 10, 0x00ff00).setOrigin(0).setVisible(false);
    eBar = this.add.rectangle(580, 30, 200, 10, 0x00ff00).setOrigin(0).setVisible(false);

    this.projectiles = this.physics.add.group();
    this.physics.add.overlap(this.projectiles, enemy, (en, pr) => { 
        pr.destroy(); 
        eHealth -= 10; 
        en.setTint(0xff0000); 
        this.cameras.main.shake(100, 0.005); // SCREEN SHAKE ON HIT
        this.time.delayedCall(100, ()=>en.clearTint()); 
    });

    cursors = this.input.keyboard.createCursorKeys();
    space = this.input.keyboard.addKey('SPACE');
    this.titleTxt.on('pointerdown', () => { 
        this.titleTxt.setVisible(false); 
        loreLink.setVisible(false);
        this.roster.setVisible(true); 
    });
}

function startBattle(scene) {
    gameState = 'BATTLE';
    scene.roster.setVisible(false);
    player.setFrame(selectedFrame).setVisible(true);
    enemy.setVisible(true); pBar.setVisible(true); eBar.setVisible(true);
}

function update() {
    this.donorTxt.x -= 2;
    if (this.donorTxt.x < -1500) this.donorTxt.x = 800;

    if (gameState !== 'BATTLE') return;
    if (cursors.left.isDown) { player.setVelocityX(-220); player.setFlipX(true); }
    else if (cursors.right.isDown) { player.setVelocityX(220); player.setFlipX(false); }
    else player.setVelocityX(0);

    if (player.body.touching.down) jumpCount = 0;
    if (Phaser.Input.Keyboard.JustDown(cursors.up) && jumpCount < 2) { 
        player.setVelocityY(-520); 
        jumpCount++; 
    }

    if (Phaser.Input.Keyboard.JustDown(space)) {
        let b = this.add.rectangle(player.x, player.y, 20, 10, 0xFFD700);
        this.projectiles.add(b); this.physics.add.existing(b);
        b.body.setAllowGravity(false); b.body.setVelocityX(player.flipX ? -600 : 600);
    }
}
</script>
</body>
</html>
