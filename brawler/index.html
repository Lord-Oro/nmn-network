<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS v5.4 - DEEP SLICE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; touch-action: none; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            border: 3px solid #FFD700; background: rgba(5,3,8,0.9);
            color: #FFD700; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            pointer-events: all; user-select: none; font-family: monospace;
        }
        #ml { left: 20px; bottom: 10px; } #mr { left: 95px; bottom: 10px; }
        #mj { left: 57px; bottom: 85px; } 
        #ma { right: 20px; bottom: 85px; } 
        #ms { right: 20px; bottom: 10px; } 
        #mf { right: 95px; bottom: 10px; }
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div><div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const SPAWN = { p1: { x: 200, y: GH - 150 }, p2: { x: 600, y: GH - 150 } };
const MP = { l: false, r: false, j: false, a: false, s: false, f: false };

(function() {
    const bind = (id, key) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("touchstart", e => { e.preventDefault(); MP[key] = true; });
        el.addEventListener("touchend", e => { e.preventDefault(); MP[key] = false; });
    };
    bind("ml", "l"); bind("mr", "r"); bind("mj", "j"); bind("ma", "a"); bind("ms", "s"); bind("mf", "f");
})();

const Match = { p1: "Juni", p2: "Pyro" };

// PHYSICS LOCKDOWN
function lockHitbox(sp) {
    sp.setOrigin(0.5, 0.5);
    // Hard-coded to fit the bottom of your 128x128 Piskel export
    sp.body.setSize(44, 96).setOffset(42, 32);
    sp.setCollideWorldBounds(true);
    sp.setDragX(2500);
}

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("promo", "brawler_promo.jpg");
        this.load.image("bg", "bg_deep_forest.jpg");
        // Ensure frameWidth/Height is strictly 128
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
    }
    create() {
        this.add.image(GW/2, GH/2, "promo").setDisplaySize(GW, GH);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.3);
        const roster = [{name:"Juni", color:"#00FF88"}, {name:"Pyro", color:"#FF4400"}];
        roster.forEach((b, i) => {
            let t = this.add.text(GW/2, 180 + (i * 80), b.name.toUpperCase(), {
                fontFamily: 'monospace', fontSize: '40px', fill: b.color, backgroundColor: '#000000AA', padding: 10
            }).setOrigin(0.5).setInteractive();
            t.on("pointerdown", () => { Match.p1 = b.name; Match.p2 = (b.name === "Juni" ? "Pyro" : "Juni"); this.scene.start("BattleScene"); });
        });
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }
    create() {
        const p1n = Match.p1.toLowerCase(), p2n = Match.p2.toLowerCase();

        [p1n, p2n].forEach(n => {
            this.anims.create({ key: n+'_idle', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 0, end: 2 }), frameRate: 6, repeat: -1 });
            this.anims.create({ key: n+'_jump', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 3, end: 5 }), frameRate: 10, repeat: 0 });
            this.anims.create({ key: n+'_atk', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 7, end: 11 }), frameRate: 15, repeat: 0 });
            this.anims.create({ key: n+'_fire', frames: this.anims.generateFrameNumbers(n+'_sheet', { start: 12, end: 14 }), frameRate: 12, repeat: 0 });
            this.anims.create({ key: n+'_shd', frames: [{key: n+'_sheet', frame: 6}], frameRate: 1 });
        });

        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-20, 700, 20, 0x3a2a0a).setAlpha(0.2));

        this.p1 = this.physics.add.sprite(SPAWN.p1.x, SPAWN.p1.y, p1n + "_sheet");
        this.p2 = this.physics.add.sprite(SPAWN.p2.x, SPAWN.p2.y, p2n + "_sheet");
        
        lockHitbox(this.p1);
        lockHitbox(this.p2);

        this.physics.add.collider([this.p1, this.p2], this.platforms);
        this.keys = this.input.keyboard.addKeys({ left: 'A', right: 'D', jump: 'W', punch: 'J', shield: 'K', fire: 'L' });
        this.s = { jumps: 0, busy: false };
    }

    update() {
        const p1 = this.p1, p2 = this.p2, ks = this.keys, s = this.s, name = Match.p1.toLowerCase();
        const grounded = p1.body.blocked.down;

        p1.setFlipX(p1.x > p2.x);
        p2.setFlipX(p2.x > p1.x);

        if (grounded) s.jumps = 0;

        if (!s.busy) {
            if (ks.shield.isDown || MP.s) { p1.setVelocityX(0); p1.play(name + '_shd', true); }
            else {
                if (ks.left.isDown || MP.l) { p1.setVelocityX(-260); if (grounded) p1.play(name + '_idle', true); }
                else if (ks.right.isDown || MP.r) { p1.setVelocityX(260); if (grounded) p1.play(name + '_idle', true); }
                else { p1.setVelocityX(0); if (grounded) p1.play(name + '_idle', true); }

                if ((Phaser.Input.Keyboard.JustDown(ks.jump) || MP.j) && s.jumps < 2) {
                    p1.setVelocityY(-580); p1.play(name + '_jump', true); s.jumps++;
                }
                if (!grounded && p1.anims.currentAnim && p1.anims.currentAnim.key !== name + '_jump') p1.play(name + '_jump', true);

                if (Phaser.Input.Keyboard.JustDown(ks.punch) || MP.a) {
                    s.busy = true; p1.play(name + '_atk');
                    this.time.delayedCall(300, () => { s.busy = false; lockHitbox(p1); });
                }
                
                // FIXED FIRE: Force Frame 13 only
                if (Phaser.Input.Keyboard.JustDown(ks.fire) || MP.f) {
                    s.busy = true; p1.play(name + '_fire');
                    this.time.delayedCall(200, () => {
                        // We use the specific key and index 13
                        let b = this.physics.add.sprite(p1.x, p1.y, name + '_sheet', 13);
                        b.body.setAllowGravity(false);
                        b.setFlipX(p1.flipX);
                        // Make the projectile hitbox tiny so it doesn't carry the "whole body" physics
                        b.body.setSize(32, 32).setOffset(48, 48); 
                        b.setVelocityX(p1.flipX ? -650 : 650);
                        this.time.delayedCall(800, () => b.destroy());
                    });
                    this.time.delayedCall(500, () => { s.busy = false; lockHitbox(p1); });
                }
            }
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    pixelArt: true, render: { roundPixels: true },
    physics: { default: "arcade", arcade: { gravity: { y: 1600 } } },
    scene: [StartScreen, BrawlerScene, BattleScene]
});
</script>
</body>
</html>
