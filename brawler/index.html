<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-P5WL9XNDY8');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMN Brawler | The Forge Beta</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #070605; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        #game-container { width: 100%; max-width: 800px; aspect-ratio: 2 / 1; border: 2px solid #FFD700; }
        canvas { width: 100% !important; height: auto !important; image-rendering: pixelated; }
        #ui-overlay { position: absolute; font-size: 10px; color: rgba(255,215,0,0.5); bottom: 5px; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-overlay">BETA 0.4 | ASSETS: PLACEHOLDER | HINT: PROJECT KART</div>

<script>
let player, enemy, platforms, cursors, keyX, keyC, keyEsc;
let pHealth = 100, eHealth = 100, pBar, eBar;
let gameState = 'TITLE', selectedChar = 'PYRO', jumpCount = 0;

const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 800,
    height: 400,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 1400 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {
    this.load.image('bg', 'forest_bg.jpg');
    this.load.spritesheet('hero', 'hero-sheet.png', { frameWidth: 28, frameHeight: 52 });
    // Roster Images
    this.load.image('port_pyro', 'Pyro elephant beta.jpg');
    this.load.image('port_juni', 'Juni elephant beta.jpg');
    this.load.image('port_olydia', 'Olydia elephant beta.jpg');
    this.load.image('port_helios', 'Helios elephant beta.jpg');
    this.load.image('port_wanderer', 'Wanderer elephant beta.jpg');
    this.load.image('port_orid', 'Orid elephant beta.jpg');
}

function create() {
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400);
    
    platforms = this.physics.add.staticGroup();
    platforms.create(400, 390, null).setDisplaySize(800, 20).setVisible(false).refreshBody(); // Floor
    platforms.create(200, 260, null).setDisplaySize(160, 10).setVisible(false).refreshBody(); // Platforms
    platforms.create(600, 260, null).setDisplaySize(160, 10).setVisible(false).refreshBody();
    platforms.create(400, 160, null).setDisplaySize(200, 10).setVisible(false).refreshBody();

    this.projectiles = this.physics.add.group();

    // TITLE UI
    this.txtTitle = this.add.text(400, 120, 'NONSENSE BRAWLER', { font: 'bold 42px Courier', fill: '#FFD700' }).setOrigin(0.5);
    this.txtSub = this.add.text(400, 170, '[ EXPERIMENTAL ELEPHANT BUILD ]', { font: '14px Courier', fill: '#666' }).setOrigin(0.5);
    this.txtStart = this.add.text(400, 280, 'PRESS SPACE TO FORGE', { font: '18px Courier', fill: '#FFF' }).setOrigin(0.5);

    // SPRITES (Hidden)
    player = this.physics.add.sprite(150, 300, 'hero', 0).setScale(2.5).setVisible(false);
    enemy = this.physics.add.sprite(650, 300, 'hero', 20).setScale(2.5).setVisible(false).setFlipX(true);
    
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(enemy, platforms);

    pBar = this.add.rectangle(20, 30, 200, 15, 0x00ff00).setOrigin(0).setVisible(false);
    eBar = this.add.rectangle(580, 30, 200, 15, 0x00ff00).setOrigin(0).setVisible(false);

    cursors = this.input.keyboard.createCursorKeys();
    keyX = this.input.keyboard.addKey('X');
    keyC = this.input.keyboard.addKey('C');
    keyEsc = this.input.keyboard.addKey('ESC');
    keySpace = this.input.keyboard.addKey('SPACE');

    this.physics.add.overlap(this.projectiles, enemy, (en, pr) => { pr.destroy(); eHealth -= 8; en.setTint(0xff0000); this.time.delayedCall(100,()=>en.clearTint()); });
}

function update() {
    if (gameState === 'TITLE' && Phaser.Input.Keyboard.JustDown(keySpace)) startBattle(this);
    if (gameState === 'PAUSE' && Phaser.Input.Keyboard.JustDown(keyEsc)) resumeGame(this);
    if (gameState !== 'BATTLE') return;

    if (Phaser.Input.Keyboard.JustDown(keyEsc)) pauseGame(this);

    // Movement & Double Jump
    if (cursors.left.isDown) { player.setVelocityX(-220); player.setFlipX(true); }
    else if (cursors.right.isDown) { player.setVelocityX(220); player.setFlipX(false); }
    else { player.setVelocityX(0); }

    if (player.body.touching.down) jumpCount = 0;
    if (Phaser.Input.Keyboard.JustDown(keySpace) && jumpCount < 2) {
        player.setVelocityY(-520);
        jumpCount++;
    }

    // Attacks
    if (Phaser.Input.Keyboard.JustDown(keyX)) shootBolt(this);
    if (Phaser.Input.Keyboard.JustDown(keyC)) meleeSlash(this);

    // AI Basic Movement
    if (enemy.x > player.x + 80) enemy.setVelocityX(-100);
    else if (enemy.x < player.x - 80) enemy.setVelocityX(100);
    if (Math.random() > 0.985 && enemy.body.touching.down) enemy.setVelocityY(-500);

    // Health UI
    pBar.width = pHealth * 2;
    eBar.width = eHealth * 2;
    if (eHealth <= 0 || pHealth <= 0) victory(this);
}

function shootBolt(scene) {
    let bolt = scene.add.rectangle(player.x, player.y, 25, 8, 0xFFD700);
    scene.projectiles.add(bolt);
    scene.physics.add.existing(bolt);
    bolt.body.setAllowGravity(false);
    bolt.body.setVelocityX(player.flipX ? -650 : 650);
    scene.time.delayedCall(800, () => bolt.destroy());
}

function meleeSlash(scene) {
    if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 70) {
        eHealth -= 12;
        enemy.setTint(0xffffff);
        scene.time.delayedCall(100, () => enemy.clearTint());
    }
}

function startBattle(scene) {
    gameState = 'BATTLE';
    scene.txtTitle.setVisible(false); scene.txtSub.setVisible(false); scene.txtStart.setVisible(false);
    player.setVisible(true); enemy.setVisible(true); pBar.setVisible(true); eBar.setVisible(true);
}

function pauseGame(scene) {
    gameState = 'PAUSE'; scene.physics.world.pause();
    scene.pauseTxt = scene.add.text(400, 200, 'PAUSED\n[ESC] TO RESUME', { font: '24px Courier', fill: '#FFF', align: 'center' }).setOrigin(0.5);
}

function resumeGame(scene) {
    gameState = 'BATTLE'; scene.physics.world.resume();
    scene.pauseTxt.destroy();
}

function victory(scene) {
    gameState = 'WIN'; scene.physics.world.pause();
    let winMsg = pHealth > 0 ? 'FORGE SUCCESSION' : 'FORGE COLLAPSED';
    scene.add.text(400, 180, winMsg, { font: '42px Courier', fill: '#FFD700' }).setOrigin(0.5);
    let btn = scene.add.text(400, 250, 'CLICK TO RE-FORGE', { font: '18px Courier', fill: '#FFF' }).setOrigin(0.5).setInteractive();
    btn.on('pointerdown', () => window.location.reload());
}
</script>
</body>
</html>
