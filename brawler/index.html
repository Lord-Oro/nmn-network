<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS v9.3 - SACRED MINE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; touch-action: none; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb { position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 3px solid #FFD700; background: rgba(5,3,8,0.9); color: #FFD700; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: all; user-select: none; font-family: monospace; }
        #ml { left: 20px; bottom: 10px; } #mr { left: 100px; bottom: 10px; } #mj { left: 60px; bottom: 90px; }
        #ma { right: 20px; bottom: 90px; } #ms { right: 20px; bottom: 10px; } #mf { right: 100px; bottom: 10px; }
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div>
    <div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const SPAWN = { p1: { x: 200, y: GH - 150 }, p2: { x: 600, y: GH - 150 } };
const MP = { l: false, r: false, j: false, a: false, s: false, f: false };

(function() {
    const bind = (id, key) => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener("touchstart", e => { e.preventDefault(); MP[key] = true; });
            el.addEventListener("touchend", e => { e.preventDefault(); MP[key] = false; });
        }
    };
    bind("ml", "l"); bind("mr", "r"); bind("mj", "j"); bind("ma", "a"); bind("ms", "s"); bind("mf", "f");
})();

const Match = { 
    p1: "Juni", p2: "Pyro", 
    p1Pct: 0, p2Pct: 0, 
    p1Lives: 3, p2Lives: 3, 
    p1Burst: 3, p2Burst: 3,
    gameOver: false 
};

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }

    preload() {
        this.load.image("bg", "bg_deep_forest.jpg");
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
    }

    create() {
        this.add.image(GW/2, GH/2, "bg").setDisplaySize(GW, GH).setAlpha(0.3);
        
        // HUD - Lives and Percentage
        this.txt1 = this.add.text(20, 20, `JUNI: 0% | ORE: 3`, { fontSize: '20px', fill: '#FFD700', fontFamily: 'monospace' });
        this.txt2 = this.add.text(GW-280, 20, `PYRO: 0% | ORE: 3`, { fontSize: '20px', fill: '#FFD700', fontFamily: 'monospace' });

        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-20, 800, 20, 0x3a2a0a).setAlpha(0.5));

        this.setupAnims();

        this.p1 = this.physics.add.sprite(SPAWN.p1.x, SPAWN.p1.y, "juni_sheet");
        this.p2 = this.physics.add.sprite(SPAWN.p2.x, SPAWN.p2.y, "pyro_sheet");
        
        this.p1.setOrigin(0.5, 0.5).body.setSize(45, 100).setOffset(41.5, 28);
        this.p2.setOrigin(0.5, 0.5).body.setSize(60, 60).setOffset(34, 34);

        this.bullets = this.physics.add.group();
        this.physics.add.collider([this.p1, this.p2], this.platforms);
        
        // Projectile Hit
        this.physics.add.overlap(this.bullets, this.p2, (target, bullet) => {
            bullet.destroy();
            this.handleHit(2, Phaser.Math.Between(5, 15)); // Projectile 5-15%
        });

        this.keys = this.input.keyboard.addKeys({ 
            left: 'A', right: 'D', jump: 'W', 
            melee: 'J', fire: 'K', shield: 'L', burst: 'SEMICOLON' 
        });

        this.s = { p1Jumps: 0, busy: false, stun: false, combo: 0 };
    }

    setupAnims() {
        // JUNI
        this.anims.create({ key: 'j_idle', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 0, end: 3 }), frameRate: 6, repeat: -1 });
        this.anims.create({ key: 'j_jump', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 4, end: 6 }), frameRate: 10 });
        this.anims.create({ key: 'j_fire', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 7, end: 9 }), frameRate: 12 });
        this.anims.create({ key: 'j_melee', frames: [{key:'juni_sheet', frame:12}, {key:'juni_sheet', frame:14}, {key:'juni_sheet', frame:13}], frameRate: 10 });
        this.anims.create({ key: 'j_shd', frames: [{key: 'juni_sheet', frame: 18}] });
        this.anims.create({ key: 'j_burst', frames: this.anims.generateFrameNumbers('juni_sheet', { start: 15, end: 17 }), frameRate: 10 });

        // PYRO
        this.anims.create({ key: 'p_idle', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 0, end: 3 }), frameRate: 8, repeat: -1 });
        this.anims.create({ key: 'p_jump', frames: [{key:'pyro_sheet', frame:4}, {key:'pyro_sheet', frame:5}], frameRate: 10 });
        this.anims.create({ key: 'p_fire', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 7, end: 9 }), frameRate: 12 });
        this.anims.create({ key: 'p_melee', frames: this.anims.generateFrameNumbers('pyro_sheet', { start: 10, end: 12 }), frameRate: 10 });
        this.anims.create({ key: 'p_shd', frames: [{key: 'pyro_sheet', frame: 20}] });
    }

    handleHit(victimNum, damage) {
        if (Match.gameOver) return;
        const victim = (victimNum === 2) ? this.p2 : this.p1;
        const pctKey = (victimNum === 2) ? 'p2Pct' : 'p1Pct';
        
        Match[pctKey] += damage;
        
        // Knockback scaling
        const pushDir = (this.p1.x < this.p2.x) ? 1 : -1;
        const multiplier = (Match[pctKey] / 100) + 1;
        
        this.s.stun = true;
        victim.setTint(0xff0000);
        victim.setVelocityX(pushDir * (200 * multiplier));
        victim.setVelocityY(-150 * multiplier);
        
        this.time.delayedCall(300, () => { victim.clearTint(); this.s.stun = false; });
        this.updateHUD();

        // Check Out of Bounds / 500%
        if (Match[pctKey] >= 500 || victim.x < 0 || victim.x > GW) {
            this.respawn(victimNum);
        }
    }

    respawn(num) {
        const key = (num === 2) ? 'p2Lives' : 'p1Lives';
        const pct = (num === 2) ? 'p2Pct' : 'p1Pct';
        const v = (num === 2) ? this.p2 : this.p1;

        Match[key]--;
        Match[pct] = 0;
        v.setPosition(num === 2 ? 600 : 200, GH - 200);
        v.setVelocity(0, 0);
        
        this.updateHUD();
        if (Match[key] <= 0) this.endGame(num === 2 ? "Juni" : "Pyro");
    }

    updateHUD() {
        this.txt1.setText(`JUNI: ${Match.p1Pct}% | ORE: ${Match.p1Lives}`);
        this.txt2.setText(`PYRO: ${Match.p2Pct}% | ORE: ${Match.p2Lives}`);
    }

    endGame(winner) {
        Match.gameOver = true;
        this.add.text(GW/2, GH/2, winner + " WINS!", { fontSize: '48px', fill: '#FFD700' }).setOrigin(0.5);
    }

    update() {
        if (Match.gameOver) return;
        const p1 = this.p1, p2 = this.p2, ks = this.keys, s = this.s;

        p1.setFlipX(p1.x > p2.x);
        p2.setFlipX(p2.x > p1.x);

        if (!s.busy) {
            // MOVEMENT
            if (ks.left.isDown) p1.setVelocityX(-260);
            else if (ks.right.isDown) p1.setVelocityX(260);
            else { p1.setVelocityX(0); p1.play('j_idle', true); }

            // JUMP
            if (Phaser.Input.Keyboard.JustDown(ks.jump)) {
                p1.setVelocityY(-600);
                p1.play('j_jump');
            }

            // MELEE (J)
            if (Phaser.Input.Keyboard.JustDown(ks.melee)) {
                s.busy = true;
                p1.play('j_melee');
                if (Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y) < 100) this.handleHit(2, Phaser.Math.Between(3, 7));
                this.time.delayedCall(400, () => s.busy = false);
            }

            // RANGE (K)
            if (Phaser.Input.Keyboard.JustDown(ks.fire)) {
                s.busy = true;
                p1.play('j_fire');
                this.time.delayedCall(250, () => {
                    let b = this.bullets.create(p1.x, p1.y, 'juni_sheet', 10);
                    b.body.setAllowGravity(false);
                    b.setVelocityX(p1.flipX ? -750 : 750);
                });
                this.time.delayedCall(500, () => s.busy = false);
            }

            // BURST (;)
            if (Phaser.Input.Keyboard.JustDown(ks.burst) && Match.p1Burst > 0) {
                Match.p1Burst--;
                s.busy = true;
                p1.play('j_burst');
                if (Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y) < 150) this.handleHit(2, 20);
                this.time.delayedCall(600, () => s.busy = false);
            }
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    pixelArt: true, physics: { default: "arcade", arcade: { gravity: { y: 1600 } } },
    scene: [BattleScene]
});
</script>
</body>
</html>
