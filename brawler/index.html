<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NMN Brawler | The Elephant Forge</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #070605; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { border: 3px solid #FFD700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
    </style>
</head>
<body>
<script>
// --- GAME STATE VARIABLES ---
let player, enemy, cursors, spaceKey, pauseKey;
let p1Health = 100, e1Health = 100;
let p1HealthBar, e1HealthBar;
let gameStarted = false;
let isPaused = false;
let gameOver = false;

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 400,
    physics: { default: 'arcade', arcade: { gravity: { y: 1200 } } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {
    this.load.spritesheet('elephant', 'hero-sheet.png', { 
        frameWidth: 28, 
        frameHeight: 52, 
        margin: 1, 
        spacing: 2 
    });
}

function create() {
    // 1. BACKGROUND & GROUND
    this.add.rectangle(400, 200, 800, 400, 0x0a0806);
    const ground = this.add.rectangle(400, 390, 800, 20, 0x1a1510);
    this.physics.add.existing(ground, true);

    // 2. GROUPS
    this.projectiles = this.physics.add.group();
    this.enemyProjectiles = this.physics.add.group();

    // 3. CHARACTERS (Hidden until start)
    player = this.physics.add.sprite(100, 300, 'elephant', 0).setScale(2.5).setVisible(false);
    player.setCollideWorldBounds(true);
    this.physics.add.collider(player, ground);

    enemy = this.physics.add.sprite(700, 300, 'elephant', 20).setScale(2.5).setVisible(false);
    enemy.setCollideWorldBounds(true);
    this.physics.add.collider(enemy, ground);
    enemy.flipX = true;

    // 4. UI / HUD
    p1HealthBar = this.add.rectangle(10, 35, 150, 10, 0x00FF00).setOrigin(0).setVisible(false);
    e1HealthBar = this.add.rectangle(640, 35, 150, 10, 0x00FF00).setOrigin(0).setVisible(false);
    this.p1Text = this.add.text(10, 15, 'PYRO (P1)', { font: '14px Courier', fill: '#FFD700' }).setVisible(false);
    this.e1Text = this.add.text(640, 15, 'JUNI (AI)', { font: '14px Courier', fill: '#c084fc' }).setVisible(false);

    // 5. START SCREEN
    this.titleText = this.add.text(400, 150, 'NONSENSE BRAWLER', { font: '40px Courier', fill: '#FFD700', fontWeight: 'bold' }).setOrigin(0.5);
    this.subText = this.add.text(400, 220, 'PRESS SPACE TO COMMENCE FORGE', { font: '16px Courier', fill: '#ffffff' }).setOrigin(0.5);

    // 6. ANIMATIONS
    this.anims.create({ key: 'p1_walk', frames: this.anims.generateFrameNumbers('elephant', { start: 1, end: 4 }), frameRate: 8, repeat: -1 });
    this.anims.create({ key: 'e1_walk', frames: this.anims.generateFrameNumbers('elephant', { start: 21, end: 24 }), frameRate: 8, repeat: -1 });

    // 7. COLLISION
    this.physics.add.overlap(this.projectiles, enemy, (en, flare) => {
        flare.destroy();
        e1Health -= 10;
        en.setTint(0xff0000);
        this.time.delayedCall(100, () => en.clearTint());
    });

    this.physics.add.overlap(this.enemyProjectiles, player, (pl, bolt) => {
        bolt.destroy();
        p1Health -= 5;
        pl.setTint(0xff0000);
        this.time.delayedCall(100, () => pl.clearTint());
    });

    // 8. CONTROLS
    cursors = this.input.keyboard.createCursorKeys();
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    pauseKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.P);
}

function update() {
    if (gameOver) return;

    // START GAME LOGIC
    if (!gameStarted && Phaser.Input.Keyboard.JustDown(spaceKey)) {
        startGame(this);
    }

    // PAUSE LOGIC
    if (gameStarted && Phaser.Input.Keyboard.JustDown(pauseKey)) {
        isPaused = !isPaused;
        if (isPaused) {
            this.physics.world.pause();
            this.pauseText = this.add.text(400, 200, 'PAUSED', { font: '40px Courier', fill: '#ffffff' }).setOrigin(0.5);
        } else {
            this.physics.world.resume();
            if (this.pauseText) this.pauseText.destroy();
        }
    }

    if (!gameStarted || isPaused) return;

    // PLAYER MOVEMENT
    if (cursors.left.isDown) {
        player.setVelocityX(-180);
        player.flipX = true;
        player.anims.play('p1_walk', true);
    } else if (cursors.right.isDown) {
        player.setVelocityX(180);
        player.flipX = false;
        player.anims.play('p1_walk', true);
    } else {
        player.setVelocityX(0);
        player.anims.stop();
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.setVelocityY(-550);
    }

    if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
        shootFlare(this);
    }

    // AI MOVEMENT
    if (enemy.active) {
        if (enemy.x > player.x + 60) {
            enemy.setVelocityX(-80);
            enemy.flipX = true;
            enemy.anims.play('e1_walk', true);
        } else if (enemy.x < player.x - 60) {
            enemy.setVelocityX(80);
            enemy.flipX = false;
            enemy.anims.play('e1_walk', true);
        } else {
            enemy.setVelocityX(0);
        }

        if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 300) {
            if (!enemy.lastAttack || (this.time.now - enemy.lastAttack > 2000)) {
                shootLightning(this);
                enemy.lastAttack = this.time.now;
            }
        }
    }

    // HEALTH CHECK
    p1HealthBar.width = Math.max(0, p1Health * 1.5);
    e1HealthBar.width = Math.max(0, e1Health * 1.5);

    if (e1Health <= 0 && !gameOver) endGame(this, "PYRO VICTORIOUS");
    if (p1Health <= 0 && !gameOver) endGame(this, "JUNI VICTORIOUS");
}

function startGame(scene) {
    gameStarted = true;
    scene.titleText.destroy();
    scene.subText.destroy();
    player.setVisible(true);
    enemy.setVisible(true);
    p1HealthBar.setVisible(true);
    e1HealthBar.setVisible(true);
    scene.p1Text.setVisible(true);
    scene.e1Text.setVisible(true);
}

function endGame(scene, message) {
    gameOver = true;
    scene.physics.world.pause();
    scene.add.text(400, 200, message, { font: '40px Courier', fill: '#FFD700' }).setOrigin(0.5);
    scene.add.text(400, 250, 'REFRESH TO RESTART', { font: '16px Courier', fill: '#ffffff' }).setOrigin(0.5);
}

function shootFlare(scene) {
    let flare = scene.add.rectangle(player.x, player.y, 30, 10, 0xFFD700);
    scene.projectiles.add(flare);
    scene.physics.add.existing(flare);
    flare.body.setAllowGravity(false);
    flare.body.setVelocityX(player.flipX ? -600 : 600);
    scene.time.delayedCall(1000, () => flare.destroy());
}

function shootLightning(scene) {
    let bolt = scene.add.rectangle(enemy.x, enemy.y, 40, 5, 0x00BFFF);
    scene.enemyProjectiles.add(bolt);
    scene.physics.add.existing(bolt);
    bolt.body.setAllowGravity(false);
    bolt.body.setVelocityX(enemy.flipX ? -500 : 500);
    scene.time.delayedCall(1000, () => bolt.destroy());
}
</script>
</body>
</html>
