<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NMN: THE FORGE</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P5WL9XNDY8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-P5WL9XNDY8');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
    #game-wrapper { position: relative; width: 800px; height: 400px; }
    canvas { border: 2px solid #FFD700; image-rendering: pixelated; max-width: 100%; height: auto; }
    #victory-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    #victory-overlay.active { display: flex; }
    .btn { font-family: 'Press Start 2P', cursive; padding: 15px; border: none; cursor: pointer; margin-top: 10px; width: 280px; font-size: 10px; }
  </style>
</head>
<body>
<div id="game-wrapper">
  <div id="phaser-game">
    <div id="victory-overlay">
      <h2 style="font-family:'Press Start 2P'; color:#FFD700; font-size: 16px; text-align:center;">SECTOR CLEARED</h2>
      <button class="btn" style="background:#FFD700;" onclick="window.open('https://books2read.com/u/4EOxZ0', '_blank')">📖 READ THE LEGEND</button>
      <button class="btn" style="background:#333; color:#FFD700;" onclick="location.reload()">↺ RESTART</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
const CHARACTERS = [
  { key: 'pyro',     file: 'pyro_beta.jpg',     price: 'FREE', tier: 'Starter', desc: 'Fast Ember Scout.' },
  { key: 'juni',     file: 'juni_beta.jpg',     price: 'FREE', tier: 'Starter', desc: 'Balanced Immortal.' },
  { key: 'wanderer', file: 'wanderer_beta.jpg', price: '0.99$', tier: 'Copper', desc: 'Shadow Stalker.' },
  { key: 'helios',   file: 'helios_beta.jpg',   price: '2.99$', tier: 'Archive', desc: 'The Sun King.' },
  { key: 'olydia',   file: 'olydia_beta.jpg',   price: '5.00$', tier: 'Patreon', desc: 'Elite Blade.' },
  { key: 'orid',     file: 'orid_beta.jpg',     price: '10.00$', tier: 'Silver', desc: 'The Oathbreaker.' }
];

class BrawlerScene extends Phaser.Scene {
  constructor() { super('BrawlerScene'); }
  preload() {
    this.load.image('bg', 'forest_bg.jpg');
    CHARACTERS.forEach(c => this.load.image(c.key, c.file));
  }

  create() {
    this.add.image(400, 200, 'bg').setDisplaySize(800, 400).setAlpha(0.3);
    this.state = 'ROSTER';
    this.pHealth = 100; this.eHealth = 100;
    this.lastSelectedIdx = -1;
    this.aiAggro = 1.0; // Multiplier for difficulty

    this.infoBox = this.add.rectangle(400, 55, 750, 70, 0x0a0a0a).setAlpha(0.9).setStrokeStyle(2, 0xFFD700);
    this.infoTxt = this.add.text(400, 55, 'TAP SCOUT TO VIEW INTEL\nTAP AGAIN TO ENTER THE FORGE', { 
        font: '12px "Press Start 2P"', fill: '#FFD700', align: 'center' 
    }).setOrigin(0.5);

    this.rosterGroup = this.add.group();
    CHARACTERS.forEach((c, i) => {
      let x = 100 + (i * 120);
      let box = this.add.rectangle(x, 230, 105, 160, 0x1a1510).setStrokeStyle(1, 0xFFD700).setInteractive();
      let img = this.add.image(x, 210, c.key).setDisplaySize(90, 90);
      let name = this.add.text(x, 280, c.key.toUpperCase(), { font: '10px Courier', fill: '#FFD700' }).setOrigin(0.5);
      let cost = this.add.text(x, 295, c.price, { font: '9px Courier', fill: '#FFF' }).setOrigin(0.5);
      
      box.on('pointerdown', () => {
        if (this.lastSelectedIdx === i) {
          if(c.price === 'FREE') this.startBattle(i);
          else window.open('https://books2read.com/u/4EOxZ0', '_blank');
        } else {
          this.lastSelectedIdx = i;
          this.rosterGroup.getChildren().forEach(child => { if(child.type === 'Rectangle') child.setStrokeStyle(1, 0xFFD700); });
          box.setStrokeStyle(4, 0xFFFFFF);
          this.infoTxt.setText(`${c.key.toUpperCase()}: ${c.tier}\n${c.desc}`);
        }
      });
      this.rosterGroup.addMultiple([box, img, name, cost]);
    });

    this.projectiles = this.physics.add.group();
    this.enemyProjectiles = this.physics.add.group();
    this.cursors = this.input.keyboard.createCursorKeys();
    this.space = this.input.keyboard.addKey('SPACE');
  }

  startBattle(idx) {
    this.state = 'BATTLE';
    this.rosterGroup.clear(true, true);
    this.infoBox.destroy(); this.infoTxt.destroy();

    this.platforms = this.physics.add.staticGroup();
    this.platforms.add(this.add.rectangle(400, 395, 800, 10, 0x000).setAlpha(0));
    this.platforms.add(this.add.rectangle(150, 280, 120, 10, 0xFFD700));
    this.platforms.add(this.add.rectangle(650, 280, 120, 10, 0xFFD700));

    this.player = this.physics.add.sprite(150, 200, CHARACTERS[idx].key).setDisplaySize(60, 60).setCollideWorldBounds(true);
    this.enemy = this.physics.add.sprite(650, 200, CHARACTERS[Phaser.Math.Between(0, 5)].key).setDisplaySize(60, 60).setCollideWorldBounds(true);
    this.enemy.setTint(0xffaaaa);

    this.physics.add.collider([this.player, this.enemy], this.platforms);

    this.pBar = this.add.rectangle(20, 40, 200, 15, 0x00ff00).setOrigin(0);
    this.eBar = this.add.rectangle(580, 40, 200, 15, 0xff0000).setOrigin(0);

    this.physics.add.overlap(this.projectiles, this.enemy, (en, pr) => {
        pr.destroy(); this.eHealth -= 10;
        this.aiAggro += 0.15; // BECOMES MORE AGGRESSIVE
        this.cameras.main.shake(150, 0.01);
        if(this.eHealth <= 0) this.triggerWin();
    });

    this.physics.add.overlap(this.enemyProjectiles, this.player, (pl, pr) => {
        pr.destroy(); this.pHealth -= 5;
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.clearTint());
    });

    this.enemyEvent = this.time.addEvent({ delay: 1500, callback: this.enemyAttack, callbackScope: this, loop: true });
    if (this.sys.game.device.input.touch) this.createMobileControls();
  }

  createMobileControls() {
    this.joyStick = this.add.circle(100, 300, 25, 0xFFD700, 0.3);
    let jBtn = this.add.circle(620, 320, 40, 0xFFD700, 0.3).setInteractive();
    this.add.text(620, 320, 'UP', { font: 'bold 12px Arial', fill: '#FFF' }).setOrigin(0.5);
    let fBtn = this.add.circle(720, 280, 45, 0xFF0000, 0.4).setInteractive();
    this.add.text(720, 280, 'FIRE', { font: 'bold 12px Arial', fill: '#FFF' }).setOrigin(0.5);

    jBtn.on('pointerdown', () => { if(this.player.body.blocked.down) this.player.setVelocityY(-650); });
    fBtn.on('pointerdown', () => this.shoot(this.player, this.enemy, this.projectiles, 0xFFD700));
  }

  shoot(origin, target, group, color) {
    let b = this.add.rectangle(origin.x, origin.y, 20, 10, color);
    group.add(b); this.physics.add.existing(b);
    b.body.setAllowGravity(false);
    this.physics.moveToObject(b, target, 550 * this.aiAggro);
  }

  enemyAttack() {
    if (this.state !== 'BATTLE' || !this.enemy) return;
    this.shoot(this.enemy, this.player, this.enemyProjectiles, 0xFF0000);
    this.enemyEvent.delay = Math.max(500, 1500 / this.aiAggro); // SPEED UP ATTACKS
    if (Phaser.Math.Between(0, 10) > 4 && this.enemy.body.blocked.down) this.enemy.setVelocityY(-600);
  }

  triggerWin() {
    this.state = 'WIN';
    document.getElementById('victory-overlay').classList.add('active');
  }

  update() {
    if (this.state !== 'BATTLE') return;
    this.pBar.width = Math.max(0, this.pHealth * 2);
    this.eBar.width = Math.max(0, this.eHealth * 2);

    // AI MOVEMENT LOGIC (Aggressive Hunter)
    const dist = this.player.x - this.enemy.x;
    if (Math.abs(dist) > 50) this.enemy.setVelocityX(dist > 0 ? 150 * this.aiAggro : -150 * this.aiAggro);

    let pointer = this.input.activePointer;
    if (pointer.isDown && pointer.x < 300) {
        if(this.joyStick) this.joyStick.setPosition(pointer.x, pointer.y);
        this.player.setVelocityX(pointer.x < 100 ? -250 : 250);
    } else {
        if(this.joyStick) this.joyStick.setPosition(100, 300);
        if (!this.cursors.left.isDown && !this.cursors.right.isDown) this.player.setVelocityX(0);
    }

    if (this.cursors.left.isDown) this.player.setVelocityX(-250);
    if (this.cursors.right.isDown) this.player.setVelocityX(250);
    if (Phaser.Input.Keyboard.JustDown(this.cursors.up) && this.player.body.blocked.down) this.player.setVelocityY(-650);
    if (Phaser.Input.Keyboard.JustDown(this.space)) this.shoot(this.player, this.enemy, this.projectiles, 0xFFD700);
  }
}

const config = { type: Phaser.AUTO, width: 800, height: 400, parent: 'phaser-game', scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, physics: { default: 'arcade', arcade: { gravity: { y: 1500 } } }, scene: BrawlerScene };
new Phaser.Game(config);
</script>
</body>
</html>
