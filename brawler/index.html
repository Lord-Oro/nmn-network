<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS V10.2 - MASTER DEPLOY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; font-family: monospace; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mc { position: fixed; bottom: 20px; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 999; }
        .mb { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #FFD700; background: rgba(0,0,0,0.8); color: #FFD700; display: flex; align-items: center; justify-content: center; pointer-events: all; font-weight: bold; }
        #ml{left:20px;bottom:10px;} #mr{left:90px;bottom:10px;} #mj{left:55px;bottom:80px;}
        #ma{right:20px;bottom:80px;} #ms{right:20px;bottom:10px;} #mf{right:90px;bottom:10px;}
    </style>
</head>
<body>
<div id="gc"></div>
<div id="mc">
    <div class="mb" id="ml">◀</div><div class="mb" id="mr">▶</div>
    <div class="mb" id="mj">▲</div><div class="mb" id="ma">🥊</div>
    <div class="mb" id="ms">🛡️</div><div class="mb" id="mf">⚡</div>
</div>

<script>
const GW = 800, GH = 450;
const Match = { p1: "Juni", p2: "Pyro", p1Pct: 0, p2Pct: 0, map: "bg_eyes", paused: false };
const MP = { l:false, r:false, j:false, a:false, s:false, f:false };

// --- TOUCH BINDING ---
(function(){
    const bind = (id, k) => { 
        const el = document.getElementById(id); 
        if(el){ 
            el.onpointerdown = (e) => { e.preventDefault(); MP[k]=true; }; 
            el.onpointerup = (e) => { e.preventDefault(); MP[k]=false; }; 
        } 
    };
    bind("ml","l"); bind("mr","r"); bind("mj","j"); bind("ma","a"); bind("ms","s"); bind("mf","f");
})();

class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("promo", "brawler_promo.jpg");
        this.load.image("bg_eyes", "oros_game_eyes.jpg");
        this.load.image("forest1", "bg_deep_forest.jpg");
        this.load.image("forest2", "forest_bg.jpg");
        this.load.image("hub_bg", "logo.jpg");
        this.load.image("link_tree", "link_tree.jpg");
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
        ["juni_en","outbreak_en","tabbies_en","pyro_en"].forEach(b => this.load.image(b, b+".jpeg"));
        ["wanderer","nela","orid","helios"].forEach(n => this.load.image(n+"_beta", n+"_beta.jpg"));
    }
    create() {
        this.add.image(GW/2, GH/2, "promo").setDisplaySize(GW, GH);
        this.add.text(GW/2, GH-50, "CLICK TO START", { fontSize:'24px', fill:'#FFD700' }).setOrigin(0.5);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg_eyes").setDisplaySize(GW, GH).setAlpha(0.5);
        const roster = [
            { name: "Juni", img: "juni_sheet", active: true },
            { name: "Pyro", img: "pyro_sheet", active: true },
            { name: "Wanderer", img: "wanderer_beta", active: false }
            // ... truncated for brevity, same logic as v10.1
        ];
        roster.forEach((c, i) => {
            let x = 150 + (i%3)*250, y = 160 + Math.floor(i/3)*150;
            let btn = this.add.image(x, y, c.img, 0).setDisplaySize(100, 100).setInteractive();
            if(!c.active) btn.setTint(0x444444);
            else btn.on("pointerdown", () => { Match.p1 = c.name; this.scene.start("MapSelectScene"); });
            this.add.text(x, y+60, c.name, { fill:'#FFD700' }).setOrigin(0.5);
        });
        this.add.text(GW/2, GH-30, "THE ARCHIVES", { backgroundColor:'#000', padding:5 }).setOrigin(0.5).setInteractive().on("pointerdown", () => this.scene.start("StoryHub"));
    }
}

class MapSelectScene extends Phaser.Scene {
    constructor() { super("MapSelectScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg_eyes").setAlpha(0.4);
        const maps = [{id:"bg_eyes", n:"THE MINE"}, {id:"forest1", n:"DEEP FOREST"}, {id:"forest2", n:"FOREST EDGE"}];
        maps.forEach((m, i) => {
            let t = this.add.text(GW/2, 150 + (i*60), m.n, { fontSize:'30px', fill:'#FFF' }).setOrigin(0.5).setInteractive();
            t.on("pointerdown", () => { Match.map = m.id; this.scene.start("BattleScene"); });
        });
    }
}

class StoryHub extends Phaser.Scene {
    constructor() { super("StoryHub"); }
    create() {
        this.add.image(GW/2, GH/2, "hub_bg").setDisplaySize(GW, GH).setAlpha(0.3);
        const bks = ["juni_en", "outbreak_en", "tabbies_en", "pyro_en"];
        bks.forEach((b, i) => { this.add.image(120 + (i*180), 220, b).setDisplaySize(140, 220); });
        this.add.text(40, 40, "BACK").setInteractive().on("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }
    create() {
        this.add.image(GW/2, GH/2, Match.map).setDisplaySize(GW, GH).setAlpha(0.4);
        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-50, 600, 20, 0x000, 0));
        
        this.p1 = this.physics.add.sprite(200, 100, Match.p1.toLowerCase() + "_sheet").setFlipX(false);
        this.p2 = this.physics.add.sprite(600, 100, "pyro_sheet").setFlipX(true);
        this.physics.add.collider([this.p1, this.p2], this.platforms);
        
        this.keys = this.input.keyboard.addKeys({ W:'W', A:'A', D:'D', J:'J', K:'K', L:'L', P:'P' });
        
        // Pause Menu
        this.pauseMenu = this.add.container(GW/2, GH/2).setVisible(false).setDepth(1000);
        this.pauseMenu.add(this.add.rectangle(0, 0, 300, 200, 0x000, 0.9));
        let exit = this.add.text(0, 0, "MAIN MENU", { fontSize:'32px', fill:'#F00' }).setOrigin(0.5).setInteractive();
        exit.on("pointerdown", () => { location.reload(); });
        this.pauseMenu.add(exit);
    }

    update() {
        if (Phaser.Input.Keyboard.JustDown(this.keys.P)) { 
            Match.paused = !Match.paused; 
            this.pauseMenu.setVisible(Match.paused);
            this.physics.world.paused = Match.paused;
        }
        if (Match.paused) return;

        const p = this.p1, ks = this.keys;
        if (ks.A.isDown || MP.l) { p.setVelocityX(-260).setFlipX(true); }
        else if (ks.D.isDown || MP.r) { p.setVelocityX(260).setFlipX(false); }
        else { p.setVelocityX(0); }
        
        if ((Phaser.Input.Keyboard.JustDown(ks.W) || MP.j) && p.body.blocked.down) p.setVelocityY(-600);
        
        // Combat Visuals
        if (ks.J.isDown || MP.a) { p.setFrame(12); } // Melee Frame
        if (ks.L.isDown || MP.s) { p.setFrame(18); p.setVelocityX(0); } // Shield
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    physics: { default: "arcade", arcade: { gravity: { y: 1400 } } },
    scene: [StartScreen, BrawlerScene, MapSelectScene, StoryHub, BattleScene]
});
</script>
</body>
</html>
