<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>NMN: BRAWLERS v9.9.9 - THE ARCHIVES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050308; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #gc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div id="gc"></div>
<script>
const GW = 800, GH = 450;
const Match = { p1: "Juni", p2: "Pyro", map: "bg" };

// --- SCENE 1: START SCREEN ---
class StartScreen extends Phaser.Scene {
    constructor() { super("StartScreen"); }
    preload() {
        this.load.image("bg", "bg_deep_forest.jpg");
        this.load.image("logo", "logo.jpg");
        this.load.image("juni_cov", "juni_en.jpeg");
        this.load.image("pyro_cov", "pyro_en.jpeg");
        this.load.image("tabbies_cov", "tabbies_en.jpeg");
        this.load.image("outbreak_cov", "outbreak_en.jpeg");
        this.load.spritesheet("juni_sheet", "juni_sheet.png", { frameWidth: 128, frameHeight: 128 });
        this.load.spritesheet("pyro_sheet", "pyro_sheet.png", { frameWidth: 128, frameHeight: 128 });
    }
    create() {
        this.add.image(GW/2, GH/2, "bg").setAlpha(0.3);
        this.add.text(GW/2, GH/2 - 40, "NONSENSE MEDIA NETWORK\nBRAWLERS BETA V1.0", { align:'center', fontSize:'32px', fill:'#FFD700' }).setOrigin(0.5);
        this.add.text(GW/2, GH/2 + 60, "CLICK TO ENTER THE MINE", { fontSize:'18px', fill:'#FFF' }).setOrigin(0.5);
        this.input.once("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

// --- SCENE 2: THE ARCHIVES (STORY HUB) ---
class StoryHub extends Phaser.Scene {
    constructor() { super("StoryHub"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setAlpha(0.2);
        this.add.text(GW/2, 40, "THE ARCHIVES: CHOOSE YOUR EXTRACTION", { fontSize:'24px', fill:'#FFD700' }).setOrigin(0.5);

        const books = [
            { id: "juni_cov", link: "https://books2read.com/u/4EOxZ0", x: 120 },
            { id: "outbreak_cov", link: "https://books2read.com/u/31NrLw", x: 300 },
            { id: "tabbies_cov", link: "https://a.co/d/06X2Jjee", x: 480 },
            { id: "pyro_cov", link: "https://a.co/d/036X5lJP", x: 660 }
        ];

        books.forEach(b => {
            let container = this.add.container(b.x, 200);
            let cov = this.add.image(0, 0, b.id).setDisplaySize(140, 220).setInteractive({useHandCursor: true});
            let btn = this.add.text(0, 130, "BUY NOW", { fontSize:'14px', backgroundColor:'#FFD700', fill:'#000', padding:5 }).setOrigin(0.5).setInteractive({useHandCursor: true});
            
            const openLink = () => window.open(b.link, "_blank");
            cov.on("pointerdown", openLink);
            btn.on("pointerdown", openLink);
            container.add([cov, btn]);
        });

        // LORD ORO BRANDING
        let footer = this.add.container(GW/2, GH - 50);
        let logo = this.add.image(-160, 0, "logo").setDisplaySize(40, 40).setInteractive({useHandCursor: true});
        let label = this.add.text(-130, 0, "GET TO KNOW THE CREATOR: LORD ORO", { fontSize:'16px', fill:'#FFD700' }).setOrigin(0, 0.5).setInteractive({useHandCursor: true});
        
        const openBio = () => window.open("https://linktr.ee/NMN_LordOro", "_blank");
        logo.on("pointerdown", openBio);
        label.on("pointerdown", openBio);
        footer.add([logo, label]);

        let back = this.add.text(50, 40, "◀ BACK", { fontSize:'18px', fill:'#FFF' }).setInteractive({useHandCursor: true});
        back.on("pointerdown", () => this.scene.start("BrawlerScene"));
    }
}

// --- SCENE 3: SELECT SCREEN ---
class BrawlerScene extends Phaser.Scene {
    constructor() { super("BrawlerScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setAlpha(0.3);
        this.add.text(GW/2, 60, "SELECT CHARACTER", { fontSize:'28px', fill:'#FFD700' }).setOrigin(0.5);
        
        ["Juni", "Pyro"].forEach((name, i) => {
            let x = 300 + (i * 200);
            let txt = this.add.text(x, 200, name.toUpperCase(), { fontSize:'32px', fill:'#FFF', backgroundColor:'#000', padding:10 }).setOrigin(0.5).setInteractive({useHandCursor: true});
            txt.on("pointerdown", () => { 
                Match.p1 = name; 
                Match.p2 = (name === "Juni" ? "Pyro" : "Juni");
                this.scene.start("BattleScene"); 
            });
        });

        let hubBtn = this.add.rectangle(GW/2, GH-100, 450, 50, 0x000, 0.8).setStrokeStyle(2, 0xFFD700).setInteractive({useHandCursor: true});
        this.add.text(GW/2, GH-100, "VIEW HERO'S STORY & ARCHIVES", { fontSize:'18px', fill:'#FFD700' }).setOrigin(0.5);
        hubBtn.on("pointerdown", () => this.scene.start("StoryHub"));
    }
}

// --- SCENE 4: BATTLE ---
class BattleScene extends Phaser.Scene {
    constructor() { super("BattleScene"); }
    create() {
        this.add.image(GW/2, GH/2, "bg").setAlpha(0.2);
        this.platforms = this.physics.add.staticGroup();
        this.platforms.add(this.add.rectangle(GW/2, GH-50, 600, 20, 0x3a2a0a));
        
        this.p1 = this.physics.add.sprite(200, 0, Match.p1.toLowerCase() + "_sheet");
        this.p2 = this.physics.add.sprite(600, 0, Match.p2.toLowerCase() + "_sheet");
        this.physics.add.collider([this.p1, this.p2], this.platforms);
        
        // Non-blocking countdown text
        let ct = this.add.text(GW/2, GH/2, '3, 2, 1, BRAWL!', { fontSize: '64px', fill: '#FFD700', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
        this.time.delayedCall(2000, () => {
            this.tweens.add({ targets: ct, alpha: 0, duration: 500, onComplete: () => ct.destroy() });
        });

        this.keys = this.input.keyboard.addKeys({ W:'W', A:'A', D:'D' });
    }

    update() {
        const p1 = this.p1, ks = this.keys;
        if (ks.A.isDown) p1.setVelocityX(-260).setFlipX(true);
        else if (ks.D.isDown) p1.setVelocityX(260).setFlipX(false);
        else p1.setVelocityX(0);
        if (Phaser.Input.Keyboard.JustDown(ks.W) && p1.body.blocked.down) p1.setVelocityY(-600);
    }
}

new Phaser.Game({
    type: Phaser.AUTO, width: GW, height: GH, parent: "gc", backgroundColor: "#050308",
    pixelArt: true, physics: { default: "arcade", arcade: { gravity: { y: 1400 } } },
    scene: [StartScreen, BrawlerScene, StoryHub, BattleScene]
});
</script>
</body>
</html>
