<style>
:root {
  --gold: #FFD700;
  --gb: #e8b84b;
  --gd: #AA7700;
  --bg-color: #000000;
  --panel-bg: #111111;
  --cream: #f0e6cc;
  --muted: #aaaaaa;
  --lg: #55FF55; 
  --pu: #AA55FF; /* Tora Purple */
  --dp: #440066; /* Deep Purple */
  --font-pixel: 'Press Start 2P', monospace;
  --font-text: 'VT323', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100vh; background: var(--bg-color); display: flex; flex-direction: column; }

body {
  font-family: var(--font-text);
  color: var(--cream);
  background-image: repeating-linear-gradient(0deg, #000 0px, #000 2px, #0a0a0a 2px, #0a0a0a 4px);
  padding-bottom: 60px;
  font-size: 1.2rem;
}

/* 16-BIT UI BORDER HELPER */
.retro-box {
  background: var(--panel-bg);
  border: 4px solid #FFF;
  box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), 4px 4px 0px 0px #000;
}

/* HEADER */
header {
  padding: 1rem 2rem; border-bottom: 4px solid var(--pu);
  display: flex; justify-content: space-between; align-items: center;
  background: #000; z-index: 1000; position: sticky; top: 0;
}
.logo { font-family: var(--font-pixel); color: var(--pu); font-size: 0.8rem; text-decoration: none; text-shadow: 2px 2px 0 #000; }
.back { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--muted); text-decoration: none; text-transform: uppercase; }
.back:hover { color: var(--gold); }

/* TORA STAGE */
.pixel-stage { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; position: relative; background: #000; border-bottom: 4px dashed #333; margin-bottom: 2rem;}
canvas#toraCanvas { image-rendering: pixelated; display: block; margin: 0 auto 1.5rem; border: 4px solid var(--pu); box-shadow: inset 0 0 0 4px #000, 4px 4px 0 #000; background: #0f0a1e; }
.tora-pixel-name { font-family: var(--font-pixel); font-size: 1.4rem; color: var(--gold); text-align: center; margin-bottom: 0.5rem; text-shadow: 3px 3px 0 var(--dp); }
.tora-pixel-sub { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--pu); text-align: center; margin-bottom: 1rem; }
.tora-rune-line { font-family: var(--font-pixel); font-size: 0.8rem; color: var(--pu); opacity: 0.5; text-align: center; letter-spacing: 0.5em; margin-bottom: 1.5rem; }

/* NPC DIALOGUE BOX */
.pixel-dialog { border: 4px solid var(--gold); background: #000; padding: 1.5rem; max-width: 640px; width: 100%; margin: 0 auto; position: relative; box-shadow: 4px 4px 0 #553300; }
.dialog-name { font-family: var(--font-pixel); font-size: 0.6rem; color: var(--pu); margin-bottom: 1rem; }
.dialog-text { font-size: 1.4rem; color: var(--cream); line-height: 1.5; min-height: 60px;}
.dialog-text::after { content: '▼'; display: inline-block; animation: blink 1s infinite; margin-left: 10px; font-size: 1rem; color: var(--gold);}
@keyframes blink { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }

main { max-width: 800px; margin: 0 auto; padding: 0 1rem 4rem; width: 100%;}

/* READING FORM */
.reading-form { background: #000; border: 4px solid var(--gd); padding: 2rem; margin-bottom: 2rem; box-shadow: 4px 4px 0 #000; }
.form-title { font-family: var(--font-pixel); font-size: 0.8rem; color: var(--gold); margin-bottom: 1.5rem; border-bottom: 4px dashed #333; padding-bottom: 0.8rem; text-shadow: 2px 2px 0 #000;}
.form-row { margin-bottom: 1.5rem; }
.form-label { font-family: var(--font-pixel); font-size: 0.5rem; color: var(--gd); display: block; margin-bottom: 0.8rem; }
.form-input { width: 100%; padding: 1rem; background: #111; border: 4px solid #444; color: var(--cream); font-family: var(--font-pixel); font-size: 0.8rem; outline: none; transition: border-color 0.1s; text-transform: uppercase;}
.form-input:focus { border-color: var(--pu); }
.form-note { font-size: 1rem; color: var(--muted); margin-top: 0.5rem; }

.btn-reveal { width: 100%; padding: 1.2rem; background: var(--pu); color: #000; font-family: var(--font-pixel); font-size: 0.8rem; border: 4px solid #FFF; cursor: pointer; transition: transform 0.1s; box-shadow: 4px 4px 0 #000; margin-top: 1rem; }
.btn-reveal:hover { background: var(--gold); transform: translateY(-4px); }

.reading-result { display: none; }
.reading-result.active { display: block; animation: flashIn 0.2s steps(2); }

.card-pixel-meaning { font-size: 1.4rem; color: var(--cream); line-height: 1.6; }

.life-path-pixel { display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center;}
.life-number-pixel { font-family: var(--font-pixel); font-size: 4rem; color: var(--gold); line-height: 1; text-shadow: 4px 4px 0 #553300; }
.life-info h3 { font-family: var(--font-pixel); font-size: 0.8rem; color: var(--cream); margin-bottom: 0.8rem; }
.life-info p { font-size: 1.3rem; color: var(--muted); line-height: 1.5; }
.life-message { font-size: 1.4rem; color: var(--gold); line-height: 1.6; padding-top: 1.5rem; border-top: 4px dashed #333; font-style: italic;}

/* PERSONAL READING */
.personal-reading-pixel { border: 4px solid var(--pu); background: rgba(106, 58, 138, 0.1); padding: 2rem; margin-bottom: 2rem; box-shadow: 6px 6px 0 var(--dp); }
.reading-text-pixel { font-size: 1.5rem; color: var(--cream); line-height: 1.6; }
.reading-sig { font-family: var(--font-pixel); font-size: 0.5rem; color: var(--pu); margin-top: 1.5rem; text-align: right; }

.btn-again { display: block; width: 100%; padding: 1.2rem; margin-top: 2rem; background: #000; color: var(--cream); border: 4px solid var(--pu); font-family: var(--font-pixel); font-size: 0.8rem; cursor: pointer; box-shadow: 4px 4px 0 #000; transition: transform 0.1s;}
.btn-again:hover { background: var(--pu); color: #000; transform: translateY(-4px); border-color: var(--cream);}

/* HUD (BOTTOM) */
.hud { display: flex; justify-content: center; align-items: center; padding: 1rem 2rem; background: #000; border-top: 4px solid #333; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; flex-wrap: wrap; gap: 20px; }

// ── PROCEDURAL SPRITE GENERATOR ──
function drawSprite(canvasId, seedStr, colorHex) {
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 16, 16);
  
  let seed = 0;
  for(let i=0; i<seedStr.length; i++) { seed = seed * 31 + seedStr.charCodeAt(i); }
  const random = () => { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); };

  ctx.fillStyle = colorHex;
  ctx.shadowColor = colorHex;
  ctx.shadowBlur = 5;
  
  for(let x=0; x<8; x++) {
    for(let y=0; y<16; y++) {
      if(random() > 0.4) {
        ctx.fillRect(x, y, 1, 1); 
        ctx.fillRect(16 - x - 1, y, 1, 1); 
      }
    }
  }
  ctx.shadowBlur = 0;
}

// ── TYPEWRITER TEXT ──
let typeTimer = null;
function typeText(text, speed=25) {
  const el = document.getElementById('toraDialog');
  el.textContent = "";
  if(typeTimer) clearInterval(typeTimer);
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent += text.charAt(i++);
    if (i >= text.length) clearInterval(typeTimer);
  }, speed);
}

function calcLP(dob) {
  let d = dob.replace(/-/g, '').split('').map(Number);
  let s = d.reduce((a, b) => a + b, 0);
  while(s > 9 && s !== 11 && s !== 22 && s !== 33) {
    s = s.toString().split('').map(Number).reduce((a, b) => a + b, 0);
  }
  return s;
}

function getDailyCard() {
  const t = new Date();
  const dy = Math.floor((t - new Date(t.getFullYear(), 0, 0)) / 86400000);
  return TAROT[dy % TAROT.length];
}

function revealReading() {
  const name = document.getElementById('userName').value.trim().toUpperCase();
  const dob = document.getElementById('userDob').value;
  
  if(!name || !dob) {
    typeText('"Tora needs your name and the date you were born. Without these, the stones are silent."');
    return;
  }
  
  const lp = calcLP(dob);
  const ld = LP[lp] || LP[1];
  const card = getDailyCard();
  const fn = name.split(' ')[0];
  const mo = new Date(dob + 'T12:00:00').toLocaleString('default', { month: 'long' });
  
  document.getElementById('cardName').textContent = card.name;
  document.getElementById('cardPosition').textContent = card.position;
  document.getElementById('cardMeaning').textContent = card.meaning;
  
  document.getElementById('lifeNumber').textContent = lp;
  document.getElementById('lifeTitle').textContent = ld.title;
  document.getElementById('lifeDesc').textContent = ld.desc;
  document.getElementById('lifeMessage').textContent = ld.message;
  
  document.getElementById('readingText').innerHTML = `${fn}, the mine has been watching you. Today's card — <strong style="color:${card.color}">${card.name}</strong> — arrives with a message for a Life Path ${lp}.<br><br>${card.meaning}<br><br>This combines with your nature as ${ld.title} to reveal something important. ${ld.desc}<br><br>The energy of ${mo.toUpperCase()} amplifies everything. Tora sees a moment approaching where what you have been building quietly becomes visible. Do not shrink from it. The goldmine reveals its richest veins to those who keep digging even when they cannot yet see the gold.<br><br>You are close. Freyja's wisdom: the völva does not create fate. She reads what is already written in the stone. This is yours.`;
  
  typeText(DIALOGS[Math.floor(Math.random() * DIALOGS.length)]);
  
  // Procedural Card Icon
  drawSprite('cardCanvas', card.name, card.color);
  
  document.getElementById('readingForm').style.display = 'none';
  document.getElementById('readingResult').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // Save Lore Fragment
  try {
    const vault = JSON.parse(localStorage.getItem('nmn_lore_vault') || '[]');
    vault.push({ text: `Tora read my life path: ${lp} - ${ld.title}. Today's card was ${card.name}.`, source: "Tora the Reader", date: new Date().toLocaleDateString() });
    localStorage.setItem('nmn_lore_vault', JSON.stringify(vault));
    document.getElementById('dgLore').textContent = vault.length;
  } catch(e) {}
}

function resetReading() {
  document.getElementById('readingResult').classList.remove('active');
  document.getElementById('readingForm').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
