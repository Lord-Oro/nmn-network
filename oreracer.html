<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore Cart Racer — NMN</title>
<link rel="stylesheet" href="nmn-theme.css">
<style>
body{padding-top:56px;background:var(--coal);display:flex;flex-direction:column;align-items:center;min-height:100vh}
.game-header{text-align:center;padding:2rem 1rem 1rem}
.game-header h1{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,3rem);color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,.4);margin-bottom:.5rem}
.game-header p{font-family:var(--font-pixel);font-size:.38rem;color:var(--muted);letter-spacing:.15em}
#gameCanvas{
  border:2px solid rgba(255,215,0,.4);
  box-shadow:0 0 30px rgba(255,215,0,.1),0 0 60px rgba(0,0,0,.8);
  display:block;
  image-rendering:pixelated;
  max-width:95vw;
}
.hud{
  display:flex;gap:2rem;padding:.75rem 1.5rem;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,215,0,.2);
  border-top:none;
  font-family:var(--font-pixel);font-size:.42rem;
  color:var(--gold);margin-bottom:1rem;
  flex-wrap:wrap;justify-content:center;gap:1.5rem;
}
.hud span{display:flex;flex-direction:column;align-items:center;gap:3px}
.hud .label{font-size:.3rem;color:var(--muted);letter-spacing:.15em}
.controls{font-family:var(--font-pixel);font-size:.35rem;color:var(--faint);text-align:center;margin-bottom:1rem;letter-spacing:.1em;line-height:2.2}
.btn-row{display:flex;gap:.75rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center}
.g-btn{font-family:var(--font-pixel);font-size:.42rem;padding:.6rem 1.5rem;letter-spacing:.1em;cursor:pointer;border:none;transition:all .2s}
.g-btn.start{background:var(--gold);color:var(--coal)}
.g-btn.start:hover{background:#fff;box-shadow:0 0 20px rgba(255,215,0,.6)}
.g-btn.back{background:transparent;color:var(--muted);border:1px solid rgba(255,215,0,.2)}
.g-btn.back:hover{border-color:var(--gold);color:var(--gold)}
#secretMsg{
  display:none;
  font-family:var(--font-pixel);
  font-size:.38rem;
  color:var(--gold);
  text-align:center;
  padding:1.5rem;
  border:2px solid rgba(255,215,0,.5);
  background:rgba(0,0,0,.85);
  margin-bottom:1rem;
  max-width:460px;
  line-height:2.4;
  letter-spacing:.06em;
  box-shadow:0 0 30px rgba(255,215,0,.2),inset 0 0 20px rgba(0,0,0,.5);
  position:relative;
}
#secretMsg::before{
  content:'⬡ CLASSIFIED TRANSMISSION ⬡';
  display:block;
  font-size:.3rem;
  color:rgba(255,215,0,.5);
  letter-spacing:.3em;
  margin-bottom:.75rem;
  border-bottom:1px solid rgba(255,215,0,.2);
  padding-bottom:.5rem;
}
#secretMsg::after{
  content:'⬡ END TRANSMISSION ⬡';
  display:block;
  font-size:.3rem;
  color:rgba(255,215,0,.5);
  letter-spacing:.3em;
  margin-top:.75rem;
  border-top:1px solid rgba(255,215,0,.2);
  padding-top:.5rem;
}
#secretText{min-height:3rem}
#secretCursor{display:inline-block;animation:blink .7s step-end infinite;color:var(--gold)}
</style>
</head>
<body>
<script src="nmn-wallet.js"></script>
<script src="nmn-nav.js"></script>

<div class="game-header">
  <h1>Ore Cart Racer</h1>
  <p>⛏ DODGE THE STATIC · COLLECT GOLD BITS · HIT 5000 TO UNLOCK A SECRET</p>
</div>

<canvas id="gameCanvas" width="480" height="320"></canvas>

<div class="hud">
  <span><span class="label">GOLD</span><span id="hudGold">0</span></span>
  <span><span class="label">DEPTH</span><span id="hudDepth">0m</span></span>
  <span><span class="label">SPEED</span><span id="hudSpeed">1x</span></span>
  <span><span class="label">BEST</span><span id="hudBest">0</span></span>
</div>

<div class="controls">
  ← → ARROW KEYS or A / D · MOBILE: TAP LEFT / RIGHT SIDE OF SCREEN
</div>

<div class="btn-row">
  <button class="g-btn start" onclick="startGame()">⛏ START DESCENT</button>
  <a href="games.html" class="g-btn back">← BACK TO HALL</a>
</div>

<div id="secretMsg">
  <span id="secretText"></span><span id="secretCursor">|</span>
</div>

<script>
const C = document.getElementById('gameCanvas');
const ctx = C.getContext('2d');

const W = 480, H = 320;
const LANE_W = 60;
const LANES = 6;
const LANE_START = (W - LANES * LANE_W) / 2;
const CART_W = 44, CART_H = 32;
const GOLD_SIZE = 14;
const STATIC_W = 50, STATIC_H = 30;

let state = 'idle';
let score = 0, depth = 0, frame = 0;
let gameSpeed = 3;
let spawnRate = 0.02;
let bestScore = parseInt(localStorage.getItem('nmn_racer_best') || '0');
let secretUnlocked = false;
let cartX = W/2 - CART_W/2;
let cartLane = Math.floor(LANES/2);
let keys = {};
let laneMoveCooldown = 0;
let speedLevel = 1;

let goldBits = [], statics = [], particles = [];
let tunnelOffset = 0;

// ── INPUT ──
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'dead' && (e.key === 'Enter' || e.key === ' ')) startGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
C.addEventListener('touchstart', e => {
  e.preventDefault();
  const x = e.touches[0].clientX;
  const mid = C.getBoundingClientRect().left + C.offsetWidth / 2;
  if (x < mid) keys['ArrowLeft'] = true;
  else keys['ArrowRight'] = true;
});
C.addEventListener('touchend', () => { keys['ArrowLeft'] = false; keys['ArrowRight'] = false; });

// ── TYPEWRITER SECRET ──
function typewriterSecret(msg, el, speed=40) {
  el.textContent = '';
  let i = 0;
  const iv = setInterval(() => {
    el.textContent += msg[i];
    i++;
    if(i >= msg.length) clearInterval(iv);
  }, speed);
}

function triggerSecret() {
  secretUnlocked = true;
  const box = document.getElementById('secretMsg');
  const txt = document.getElementById('secretText');
  box.style.display = 'block';
  const msg = 'ACCESS GRANTED.\n\nCODE: OBSERVER_5K\n\nUSE AT PATREON.COM/LORDMINADEORO\nFOR ONE FREE WEEK\nON THE COPPER ORE TIER.\n\nTHE ARCHIVE REMEMBERS.';
  typewriterSecret(msg, txt, 35);
  // Award gold to NMNWallet
  if(window.NMNWallet) NMNWallet.addGold(500);
  addParticles(cartX+CART_W/2, H-CART_H-20, '#FFD700', 25);
}

// ── GAME FUNCTIONS ──
function startGame() {
  state = 'playing';
  score = 0; depth = 0; frame = 0;
  gameSpeed = 3; spawnRate = 0.02; speedLevel = 1;
  cartLane = Math.floor(LANES/2);
  cartX = LANE_START + cartLane * LANE_W + LANE_W/2 - CART_W/2;
  goldBits = []; statics = []; particles = [];
  secretUnlocked = false;
  document.getElementById('secretMsg').style.display = 'none';
  document.getElementById('secretText').textContent = '';
  requestAnimationFrame(loop);
}

function addParticles(x, y, color, count=8) {
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2/count)*i + Math.random()*.5;
    const spd = 1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:1,color});
  }
}

function drawTunnel() {
  ctx.fillStyle = '#070605';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#0f0c07';
  ctx.fillRect(0,0,LANE_START,H);
  ctx.fillRect(LANE_START+LANES*LANE_W,0,W-(LANE_START+LANES*LANE_W),H);

  const tieSpacing = 40;
  const tieOffset = tunnelOffset % tieSpacing;
  ctx.strokeStyle = 'rgba(139,105,20,0.2)';
  ctx.lineWidth = 1;
  for(let lane=1;lane<LANES;lane++){
    const lx = LANE_START + lane*LANE_W;
    ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
  }
  for(let i=0;i<10;i++){
    const y = (i*tieSpacing - tieOffset + H) % H;
    ctx.fillStyle = 'rgba(139,105,20,0.18)';
    ctx.fillRect(LANE_START, y, LANES*LANE_W, 3);
  }
  const shimmer = Math.sin(frame*0.05)*0.5+0.5;
  ctx.fillStyle = `rgba(255,215,0,${0.04*shimmer})`;
  ctx.fillRect(LANE_START-8,0,8,H);
  ctx.fillRect(LANE_START+LANES*LANE_W,0,8,H);

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle = grad;
  ctx.fillRect(LANE_START,0,LANES*LANE_W,H);
}

function drawCart(x, y) {
  ctx.fillStyle = '#1a1208';
  ctx.strokeStyle = speedLevel >= 4 ? '#ff8800' : '#c9962a';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, CART_W, CART_H-8, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(x-2, y-4, CART_W+4, 5);
  ctx.fillStyle = '#c9962a';
  ctx.fillRect(x, y-3, CART_W, 3);
  const grd = ctx.createLinearGradient(x,y,x,y+CART_H-8);
  grd.addColorStop(0,'rgba(255,215,0,0.15)');
  grd.addColorStop(1,'rgba(255,140,0,0.05)');
  ctx.fillStyle = grd;
  ctx.fillRect(x+2, y+2, CART_W-4, CART_H-12);
  ctx.fillStyle = '#5a4a20';
  ctx.fillRect(x+2, y+CART_H-9, CART_W-4, 3);
  const wheelY = y+CART_H-6;
  [x+6, x+CART_W-10].forEach(wx => {
    ctx.beginPath(); ctx.arc(wx+4, wheelY, 5, 0, Math.PI*2);
    ctx.fillStyle = '#2a1a08'; ctx.fill();
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(wx+4, wheelY, 2, 0, Math.PI*2);
    ctx.fillStyle = '#c9962a'; ctx.fill();
  });
  if(speedLevel >= 3){
    ctx.shadowColor = 'rgba(255,215,0,0.5)'; ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(255,215,0,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, CART_W, CART_H-8, 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawGoldBit(g) {
  g.pulse = (g.pulse||0) + 0.1;
  const scale = 1 + Math.sin(g.pulse)*0.15;
  const cx = g.x + GOLD_SIZE/2, cy = g.y + GOLD_SIZE/2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.fillStyle = '#FFD700'; ctx.shadowColor = 'rgba(255,215,0,0.8)'; ctx.shadowBlur = 8;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/3)*i - Math.PI/6, r = GOLD_SIZE/2;
    i===0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.restore();
}

function drawStatic(s) {
  s.frame = (s.frame||0)+1;
  const flicker = Math.sin(s.frame*0.8)*0.3+0.7;
  ctx.fillStyle = `rgba(60,20,20,${flicker})`;
  ctx.fillRect(s.x, s.y, STATIC_W, STATIC_H);
  ctx.strokeStyle = `rgba(255,60,60,${flicker*0.8})`;
  ctx.lineWidth = 1; ctx.strokeRect(s.x, s.y, STATIC_W, STATIC_H);
  ctx.fillStyle = `rgba(255,100,100,${flicker})`;
  ctx.font = '14px serif'; ctx.textAlign = 'center';
  ctx.fillText('⚡', s.x+STATIC_W/2, s.y+STATIC_H/2+5);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2+p.life*2, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(255,215,0,0.9)';
  ctx.font = '9px "Press Start 2P", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`⬡ ${score}`, LANE_START+6, 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = speedLevel >= 4 ? '#ff4400' : speedLevel >= 3 ? '#ff8800' : 'rgba(255,215,0,0.7)';
  ctx.fillText(`${speedLevel}x`, LANE_START+LANES*LANE_W-6, 18);
  // Speed warning
  if(speedLevel >= 4){
    ctx.fillStyle = `rgba(255,68,0,${0.5+Math.sin(frame*0.2)*0.5})`;
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DEEP MINE', W/2, 14);
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#FFD700'; ctx.font = '16px "Press Start 2P", monospace'; ctx.textAlign = 'center';
  ctx.fillText('CART DERAILED', W/2, H/2-40);
  ctx.fillStyle = '#c9962a'; ctx.font = '9px "Press Start 2P", monospace';
  ctx.fillText(`GOLD: ${score}`, W/2, H/2-10);
  ctx.fillText(`DEPTH: ${depth}m`, W/2, H/2+10);
  if(score > bestScore){ ctx.fillStyle = '#fff'; ctx.fillText('NEW BEST!', W/2, H/2+30); }
  ctx.fillStyle = 'rgba(255,215,0,0.5)'; ctx.font = '7px "Press Start 2P", monospace';
  ctx.fillText('PRESS ENTER OR CLICK START', W/2, H/2+55);
}

function drawIdle() {
  drawTunnel();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#FFD700'; ctx.font = '14px "Press Start 2P", monospace'; ctx.textAlign = 'center';
  ctx.fillText('ORE CART RACER', W/2, H/2-30);
  ctx.fillStyle = '#c9962a'; ctx.font = '7px "Press Start 2P", monospace';
  ctx.fillText('DODGE THE STATIC', W/2, H/2);
  ctx.fillText('COLLECT GOLD BITS', W/2, H/2+18);
  ctx.fillText('HIT 5000 TO UNLOCK SECRET', W/2, H/2+34);
  ctx.fillStyle = 'rgba(255,215,0,0.5)';
  ctx.fillText('PRESS START', W/2, H/2+52);
}

// ── MAIN LOOP ──
function loop() {
  if(state !== 'playing') return;
  frame++;
  tunnelOffset += gameSpeed * 0.8;
  depth = Math.floor(frame * gameSpeed * 0.05);

  // DYNAMIC DIFFICULTY — Gemini's scaling logic
  gameSpeed = 3 + Math.floor(score / 500) * 0.8;
  spawnRate = 0.02 + (score / 10000);
  speedLevel = Math.max(1, Math.floor(score / 500) + 1);

  document.getElementById('hudSpeed').textContent = speedLevel+'x';
  document.getElementById('hudDepth').textContent = depth+'m';

  // Lane movement
  if(laneMoveCooldown > 0) laneMoveCooldown--;
  if((keys['ArrowLeft']||keys['a']||keys['A']) && cartLane > 0 && laneMoveCooldown===0){
    cartLane--; laneMoveCooldown = 10;
  }
  if((keys['ArrowRight']||keys['d']||keys['D']) && cartLane < LANES-1 && laneMoveCooldown===0){
    cartLane++; laneMoveCooldown = 10;
  }
  const targetX = LANE_START + cartLane*LANE_W + LANE_W/2 - CART_W/2;
  cartX += (targetX - cartX) * 0.25;

  // Spawn using dynamic rates
  if(Math.random() < spawnRate) {
    const lane = Math.floor(Math.random() * LANES);
    statics.push({ x: LANE_START + lane*LANE_W + LANE_W/2 - STATIC_W/2, y: -STATIC_H, lane, frame:0 });
  }
  if(Math.random() < 0.015) {
    const lane = Math.floor(Math.random() * LANES);
    goldBits.push({ x: LANE_START + lane*LANE_W + LANE_W/2 - GOLD_SIZE/2, y: -GOLD_SIZE, pulse:0 });
  }

  // Move using gameSpeed
  goldBits.forEach(g => g.y += gameSpeed * 1.2);
  statics.forEach(s => s.y += gameSpeed * 1.1);
  goldBits = goldBits.filter(g => g.y < H+20);
  statics = statics.filter(s => s.y < H+20);

  // Collision — gold
  const cartY = H - CART_H - 20;
  goldBits = goldBits.filter(g => {
    const hit = g.x < cartX+CART_W-4 && g.x+GOLD_SIZE > cartX+4 &&
                g.y < cartY+CART_H-10 && g.y+GOLD_SIZE > cartY+4;
    if(hit){
      score += 10;
      addParticles(g.x+GOLD_SIZE/2, g.y+GOLD_SIZE/2, '#FFD700', 6);
      document.getElementById('hudGold').textContent = score;
      if(window.NMNWallet) NMNWallet.addGold(2);
      if(score >= 5000 && !secretUnlocked) triggerSecret();
    }
    return !hit;
  });

  // Collision — static
  for(const s of statics){
    const hit = s.x < cartX+CART_W-4 && s.x+STATIC_W > cartX+4 &&
                s.y < cartY+CART_H-10 && s.y+STATIC_H > cartY+4;
    if(hit){
      addParticles(cartX+CART_W/2, cartY+CART_H/2, '#ff4444', 12);
      state = 'dead';
      if(score > bestScore){
        bestScore = score;
        localStorage.setItem('nmn_racer_best', bestScore);
        document.getElementById('hudBest').textContent = bestScore;
      }
      break;
    }
  }

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.04; });
  particles = particles.filter(p => p.life > 0);

  drawTunnel();
  goldBits.forEach(drawGoldBit);
  statics.forEach(drawStatic);
  drawParticles();
  drawCart(cartX, cartY);
  drawHUD();

  if(state === 'dead'){ drawDead(); return; }
  requestAnimationFrame(loop);
}

document.getElementById('hudBest').textContent = bestScore;
drawIdle();
</script>

</body>
</html>
