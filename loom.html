<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Weaver's Loom — NMN Retro</title>

<link rel="icon" href="lord_oro_emblem.jpg" type="image/jpeg">
<link rel="shortcut icon" href="lord_oro_emblem.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="lord_oro_emblem.jpg">

<link rel="stylesheet" href="nmn-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #FFD700; --gb: #e8b84b; --gd: #8B6914;
  --coal: #050308; --shaft: #08060A; --rock: #0A080C;
  --cream: #E8E0D0; --neon-green: #00FF88;
  --font-pixel: 'Press Start 2P', cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--coal); }

body {
  font-family: var(--font-pixel);
  color: var(--cream);
  display: flex; flex-direction: column;
  background-image: 
    linear-gradient(rgba(20, 15, 25, 0.8) 2px, transparent 2px),
    linear-gradient(90deg, rgba(20, 15, 25, 0.8) 2px, transparent 2px);
  background-size: 32px 32px;
  padding-bottom: 65px !important;
}

header {
  padding: 1rem 2rem; border-bottom: 2px solid var(--gd);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(5,3,14,.95); z-index: 1000; flex-shrink: 0;
}
.logo { color: var(--gold); font-size: .65rem; text-decoration: none; text-shadow: 0 0 10px rgba(255,215,0,.4); }
.back-btn { font-size: .45rem; color: var(--gd); text-decoration: none; text-transform: uppercase; transition: color 0.3s; }
.back-btn:hover { color: var(--gold); }

.game-wrap { max-width: 820px; margin: 0 auto; padding: .75rem 1rem; flex: 1; display: flex; flex-direction: column; }

.hud {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem; background: rgba(5,3,8,0.9);
  border: 1px solid rgba(255,215,0,0.15); margin-bottom: 10px; z-index: 50;
}
.hud-stat { font-size: .45rem; color: var(--gd); display: flex; flex-direction: column; align-items: center; gap: 5px; }
.hud-val { color: var(--gold); font-size: 0.8rem; text-shadow: 0 0 10px rgba(255,215,0,0.3); }

.canvas-wrap {
  position: relative; flex: 1; background: #000; border: 2px solid var(--gd);
  box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 0 30px rgba(255,215,0,0.1);
  min-height: 300px;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

.overlay {
  position: absolute; inset: 0; background: rgba(5,3,8,.95); 
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 10;
}
.overlay.hidden { display: none; }
.ov-title { font-size: 1.5rem; color: var(--gold); text-shadow: 0 0 20px rgba(255,215,0,.5); text-align: center; }
.ov-sub { font-size: .45rem; color: var(--cream); text-align: center; line-height: 2; max-width: 400px; }

.btn {
  padding: 0.8rem 1.5rem; font-size: 0.5rem; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer; border: none; transition: 0.3s;
}
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: #fff; box-shadow: 0 0 20px rgba(255,215,0,.6); transform: scale(1.05); }

.controls { display: flex; gap: 10px; padding: 1rem; background: rgba(5,3,8,0.9); border-top: 1px solid var(--gd); }
.ctrl-btn { background: #111; border: 1px solid var(--gd); color: var(--gd); padding: 8px 15px; font-size: 0.4rem; cursor: pointer; transition: 0.2s; }
.ctrl-btn:hover { color: var(--gold); border-color: var(--gold); }

.depth-gauge {
  position:fixed!important; bottom:12px!important; left:50%!important; transform:translateX(-50%)!important;
  width:auto!important; max-width:92%!important; height:42px!important; background:rgba(12,10,7,.88)!important;
  border:1px solid rgba(255,215,0,.4)!important; border-radius:22px!important; padding:0 18px!important;
  z-index:9999!important; backdrop-filter:blur(4px)!important; display:flex!important; align-items:center!important;
  justify-content:center!important; gap:1.2rem!important; box-shadow:0 0 20px rgba(255,215,0,.08)!important;
}
</style>

</head>
<body>

<script src="nmn-wallet.js"></script>
<script src="nmn-nav.js"></script>

<header>
  <a href="index.html" class="logo">NMN — LORD ORO</a>
  <a href="games.html" class="back-btn">← RETURN TO FORGE</a>
</header>

<div class="game-wrap">
  <div class="hud">
    <div class="hud-stat">SCORE <span class="hud-val" id="h-score">0</span></div>
    <div class="hud-stat">DEPTH <span class="hud-val" id="h-level">1</span></div>
    <div class="hud-stat">MOVES <span class="hud-val" id="h-moves">20</span></div>
    <div class="hud-stat">COMBO <span class="hud-val" id="h-combo">x1</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    
    <div class="overlay" id="ov-start">
      <p class="ov-title">WEAVER'S LOOM</p>
      <p class="ov-sub">Align the elemental ore. Match 3 or more to extract gold. Chain reactions stabilize the mine walls.</p>
      <button class="btn btn-gold" onclick="startGame()">⛏ START LOOM</button>
    </div>

    <div class="overlay hidden" id="ov-over">
      <p class="ov-title">LOOM HALTED</p>
      <div style="text-align: center; margin: 1rem 0;">
          <div class="hud-stat" style="margin-bottom:10px;">FINAL SCORE <strong class="hud-val" id="final-score">0</strong></div>
          <div class="hud-stat">GOLD EARNED <strong class="hud-val" id="final-gold">0</strong></div>
      </div>
      <button class="btn btn-gold" onclick="startGame()">⛏ REWEAVE</button>
      <a href="gemshop.html" class="btn" style="color:var(--gd); border:1px solid var(--gd); margin-top:10px; text-decoration:none; display:inline-block; font-size:0.4rem;">💎 GEM SHOP →</a>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="startGame()">▶ RESET</button>
    <button class="ctrl-btn" onclick="if(window.NMNWallet) NMNWallet.convertGems()">⚗ CONVERT</button>
    <span style="font-size:.32rem; color:var(--muted); margin-left:auto; align-self:center;">CLICK GEMS TO SWAP</span>
  </div>
</div>

<div class="depth-gauge" id="depthGauge">
  <div class="dg-stat" style="font-size:0.4rem; color:var(--gd); text-transform:uppercase;">
      <span style="color:var(--gold); font-size:0.6rem; margin-right:5px;" id="dgGold">0</span> Gold Collected
  </div>
  <span style="color:rgba(255,215,0,0.2);">⬡</span>
  <a href="lorevault.html" style="font-size:0.4rem; color:var(--gd); text-decoration:none; text-transform:uppercase;">📜 Vault</a>
  <a href="lantern.html" style="font-size:0.4rem; color:var(--gd); text-decoration:none; text-transform:uppercase; margin-left:15px;">🕯️ Lantern</a>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const bgMine = new Image(); bgMine.src = 'goldmine_stable.jpg';
const bgGlitch = new Image(); bgGlitch.src = 'obsidian_glitched.jpg';

function resize(){
  const wrap = cv.parentElement;
  cv.width = wrap.clientWidth; 
  cv.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

const COLORS = ['#FF2020', '#1E90FF', '#FFD700', '#20D050', '#CC22FF', '#FF8C00'];
const ROWS = 8, COLS = 10;
const TILE = () => Math.floor(Math.min(cv.width/COLS, cv.height/ROWS));

let G = null;

function makeGrid(){
  const g = Array(ROWS).fill(0).map(() =>
    Array(COLS).fill(0).map(() => ({c: COLORS[Math.floor(Math.random()*COLORS.length)], scale: 1, flash: 0}))
  );
  for(let r=0; r<ROWS; r++) {
      for(let c=0; c<COLS; c++){
        while(hasMatchAt(g, r, c)){
          g[r][c].c = COLORS[Math.floor(Math.random()*COLORS.length)];
        }
      }
  }
  return g;
}

function hasMatchAt(g, r, c){
  const col = g[r][c].c;
  if(c >= 2 && g[r][c-1].c === col && g[r][c-2].c === col) return true;
  if(r >= 2 && g[r-1][c].c === col && g[r-2][c].c === col) return true;
  return false;
}

function startGame(){
  G = {
    score: 0, level: 1, moves: 20, combo: 1,
    grid: makeGrid(), sel: null,
    running: true, sessionGold: 0
  };
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-over').classList.add('hidden');
  updateHUD();
}

function handleClick(e){
  if(!G || !G.running) return;
  const rect = cv.getBoundingClientRect();
  const T = TILE();
  const mx = (e.clientX || e.touches[0].clientX) - rect.left;
  const my = (e.clientY || e.touches[0].clientY) - rect.top;
  
  const col = Math.floor(mx / T);
  const row = Math.floor(my / T);
  if(col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  if(!G.sel){
    G.sel = {row, col};
  } else {
    const r2 = G.sel.row, c2 = G.sel.col;
    if(Math.abs(row-r2) + Math.abs(col-c2) === 1){
      const t1 = G.grid[row][col], t2 = G.grid[r2][c2];
      G.grid[row][col] = t2; G.grid[r2][c2] = t1;
      
      const cleared = processBoard();
      if(cleared === 0) { // swap back
        G.grid[row][col] = t1; G.grid[r2][c2] = t2;
      } else {
        G.moves--;
        if(G.moves <= 0) endGame();
      }
    }
    G.sel = null;
  }
  updateHUD();
}

cv.addEventListener('mousedown', handleClick);
cv.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); });

function processBoard(){
  let totalCleared = 0;
  const g = G.grid;
  const toRemove = new Set();

  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS-2; c++){
      if(g[r][c].c === g[r][c+1].c && g[r][c].c === g[r][c+2].c){
        toRemove.add(`${r},${c}`); toRemove.add(`${r},${c+1}`); toRemove.add(`${r},${c+2}`);
      }
    }
  }
  for(let r=0; r<ROWS-2; r++) {
    for(let c=0; c<COLS; c++){
      if(g[r][c].c === g[r+1][c].c && g[r][c].c === g[r+2][c].c){
        toRemove.add(`${r},${c}`); toRemove.add(`${r+1},${c}`); toRemove.add(`${r+2},${c}`);
      }
    }
  }

  if(toRemove.size > 0){
    totalCleared = toRemove.size;
    toRemove.forEach(k => {
      const [r,c] = k.split(',').map(Number);
      g[r][c].c = null;
    });
    
    // Gravity & Refill
    for(let c=0; c<COLS; c++){
      let empty = ROWS-1;
      for(let r=ROWS-1; r>=0; r--){
        if(g[r][c].c){
          g[empty][c].c = g[r][c].c;
          if(empty !== r) g[r][c].c = null;
          empty--;
        }
      }
      for(let r=empty; r>=0; r--) g[r][c] = {c: COLORS[Math.floor(Math.random()*COLORS.length)], scale: 1};
    }

    const goldVal = totalCleared * 2 * G.level;
    G.score += totalCleared * 10;
    G.sessionGold += goldVal;
    if(window.NMNWallet) NMNWallet.addGold(goldVal);
    
    // Deeper progression logic
    if(G.score > G.level * 500) G.level++;

    processBoard(); // Recursive check for cascades
  }
  return totalCleared;
}

function endGame(){
  G.running = false;
  document.getElementById('final-score').textContent = G.score;
  document.getElementById('final-gold').textContent = G.sessionGold;
  document.getElementById('ov-over').classList.remove('hidden');
}

function draw(){
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

  if(G){
    let glitchFactor = (G.level - 1) / 7;
    ctx.save();
    ctx.globalAlpha = (1 - glitchFactor) * 0.4;
    if(bgMine.complete) ctx.drawImage(bgMine, 0, 0, W, H);
    ctx.globalAlpha = glitchFactor * 0.4;
    if(bgGlitch.complete) ctx.drawImage(bgGlitch, 0, 0, W, H);
    ctx.restore();

    const T = TILE();
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const tile = G.grid[r][c];
        if(!tile.c) continue;
        ctx.fillStyle = tile.c;
        ctx.fillRect(c*T+2, r*T+2, T-4, T-4);
        if(G.sel && G.sel.row === r && G.sel.col === c){
          ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
          ctx.strokeRect(c*T+2, r*T+2, T-4, T-4);
        }
      }
    }
  }
  requestAnimationFrame(draw);
}

function updateHUD(){
  if(!G) return;
  document.getElementById('h-score').textContent = G.score;
  document.getElementById('h-level').textContent = G.level;
  document.getElementById('h-moves').textContent = G.moves;
  if(window.NMNWallet) document.getElementById('dgGold').textContent = NMNWallet.get().gold;
}

draw();
</script>
</body>
</html>
