<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Deciphered Tablet — NMN</title>

<link rel="icon" href="lord_oro_emblem.jpg" type="image/jpeg">
<link rel="shortcut icon" href="lord_oro_emblem.jpg" type="image/jpeg">

<link rel="stylesheet" href="nmn-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=VT323&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #FFD700; --gb: #e8b84b; --gd: #8B6914;
  --coal: #050302; --panel-bg: #0a0806; --cream: #f0e6cc;
  --muted: #8a7654; --faint: #4a3c28;
  --font-pixel: 'Press Start 2P', monospace;
  --font-ancient: 'Cormorant Garamond', serif;
}

body {
  font-family: var(--font-ancient);
  background: var(--coal);
  color: var(--cream);
  min-height: 100vh;
  padding-top: 80px;
  background-image: radial-gradient(circle at 50% 30%, rgba(139, 105, 20, 0.05) 0%, transparent 70%);
}

header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
  padding: 1rem 2rem; border-bottom: 1px solid rgba(255,215,0,.15);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(5,3,2,0.95); backdrop-filter: blur(8px);
}
.logo { font-family: var(--font-pixel); color: var(--gold); font-size: .6rem; text-decoration: none; }
.back { font-family: var(--font-pixel); font-size: .45rem; color: var(--muted); text-decoration: none; text-transform: uppercase; }

main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; }

.game-header { text-align: center; margin-bottom: 3rem; }
.eyebrow { font-family: var(--font-pixel); font-size: 0.4rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gd); margin-bottom: 1rem; }
.game-title { font-family: var(--font-ancient); font-size: clamp(2.5rem, 6vw, 4rem); color: var(--cream); font-weight: 600; line-height: 1; margin-bottom: 0.5rem; }
.game-title em { color: var(--gold); font-style: italic; }

/* STATS TABLET */
.stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  background: linear-gradient(180deg, #0a0806, #050403);
  border: 1px solid #222; padding: 1.5rem; margin-bottom: 2rem;
  box-shadow: inset 0 0 20px #000; text-align: center;
}
.stat-val { font-family: var(--font-ancient); font-size: 2rem; color: var(--gold); font-weight: 700; }
.stat-lab { font-family: var(--font-pixel); font-size: 0.35rem; color: var(--faint); text-transform: uppercase; margin-top: 5px; }

/* TILES */
.match-area { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
.column { display: flex; flex-direction: column; gap: 0.8rem; }
.col-label { font-family: var(--font-pixel); font-size: 0.4rem; color: var(--gd); margin-bottom: 1rem; text-align: center; border-bottom: 1px solid #222; padding-bottom: 10px; }

.tile {
  padding: 1.2rem; background: #080605; border: 1px solid #1a1a1a;
  cursor: pointer; transition: all 0.3s; font-family: var(--font-ancient);
  font-size: 1.4rem; color: var(--muted); text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.tile:hover { border-color: var(--gd); color: var(--cream); transform: translateY(-2px); }
.tile.selected { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.05); box-shadow: 0 0 15px rgba(255,215,0,0.1); }
.tile.matched { border-color: var(--neon-green, #00FF88); color: #00FF88; opacity: 0.4; cursor: default; }

/* TABS */
.lang-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 2rem; }
.lang-tab {
  background: #000; border: 1px solid #222; color: var(--faint);
  padding: 8px 15px; font-family: var(--font-pixel); font-size: 0.35rem; cursor: pointer;
}
.lang-tab.active { border-color: var(--gold); color: var(--gold); }

/* FLOATING GAUGE */
.depth-gauge {
  position:fixed!important; bottom:12px!important; left:50%!important; transform:translateX(-50%)!important;
  width:auto!important; max-width:95%!important; height:46px!important; background:rgba(5,4,3,.95)!important;
  border:1px solid rgba(255,215,0,.3)!important; border-radius:2px!important; padding:0 20px!important;
  z-index:9999!important; display:flex!important; align-items:center!important; justify-content:center!important;
  gap:1.5rem!important; flex-wrap:nowrap!important; box-shadow: 0 5px 20px rgba(0,0,0,0.9)!important;
}
</style>
</head>
<body>

<script src="nmn-wallet.js"></script>
<script src="nmn-nav.js"></script>

<header>
  <a href="index.html" class="logo">DECIPHERED TABLET</a>
  <a href="games.html" class="back">← RETURN TO FORGE</a>
</header>

<main>
  <div class="game-header">
    <div class="eyebrow">THE EXCAVATION COMMITTEE</div>
    <h1 class="game-title">The Deciphered <em>Tablet</em></h1>
    <p style="font-size: 1.2rem; font-style: italic; color: var(--muted);">Align the ancient tongues to reveal the veins of gold.</p>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="scoreVal">0</div><div class="stat-lab">SCORE</div></div>
    <div class="stat"><div class="stat-val" id="timeVal">60</div><div class="stat-lab">TIME</div></div>
    <div class="stat"><div class="stat-val" id="streakVal">0</div><div class="stat-lab">STREAK</div></div>
  </div>

  <div class="lang-tabs">
    <div class="lang-tab active" onclick="setMode('kr-es')">🇰🇷 ↔ 🇵🇷</div>
    <div class="lang-tab" onclick="setMode('kr-no')">🇰🇷 ↔ 🇳🇴</div>
    <div class="lang-tab" onclick="setMode('kr-jp')">🇰🇷 ↔ 🇯🇵</div>
  </div>

  <div class="match-area">
    <div class="column">
      <div class="col-label" id="leftLabel">Korean</div>
      <div id="leftCol"></div>
    </div>
    <div class="column">
      <div class="col-label" id="rightLabel">Spanish</div>
      <div id="rightCol"></div>
    </div>
  </div>

  <div id="feedback" style="text-align:center; font-style:italic; color:var(--gold); min-height:30px; margin-bottom:2rem;">Select fragments to match...</div>

  <div id="roundComplete" style="display:none; text-align:center; background:rgba(255,215,0,0.05); padding:2rem; border:1px solid var(--gd);">
      <h2 style="font-family:var(--font-ancient); font-size:2rem; color:var(--gold);">TABLET DECODED</h2>
      <p id="roundGold" style="font-family:var(--font-pixel); font-size:0.5rem; margin:1rem 0;"></p>
      <button class="nmn-btn" onclick="nextRound()">EXCAVATE NEXT TABLET</button>
  </div>

</main>

<div class="depth-gauge" id="depthGauge">
  <div class="dg-stat" style="font-family:var(--font-pixel); font-size:0.4rem; color:var(--muted); text-transform:uppercase;">
      <span style="color:var(--gold); font-size:0.7rem; margin-right:5px;" id="dgGold">0</span> Gold
  </div>
  <span style="color:rgba(255,215,0,0.2);">⬡</span>
  <div class="dg-stat" style="font-family:var(--font-pixel); font-size:0.4rem; color:var(--muted); text-transform:uppercase;">
      <span style="color:var(--gold); font-size:0.7rem; margin-right:5px;" id="dgLore">0</span> Lore
  </div>
</div>

<script>
const wordSets = {
  'kr-es': { left: 'Korean', right: 'Spanish', pairs: [
      { left: '금 (geum)', right: 'Oro', meaning: 'Gold' },
      { left: '산 (san)', right: 'Montaña', meaning: 'Mountain' },
      { left: '불 (bul)', right: 'Fuego', meaning: 'Fire' },
      { left: '물 (mul)', right: 'Agua', meaning: 'Water' },
      { left: '별 (byeol)', right: 'Estrella', meaning: 'Star' }
  ]},
  'kr-no': { left: 'Korean', right: 'Norwegian', pairs: [
      { left: '금 (geum)', right: 'Gull', meaning: 'Gold' },
      { left: '길 (gil)', right: 'Vei', meaning: 'Path' },
      { left: '꿈 (kkum)', right: 'Drøm', meaning: 'Dream' },
      { left: '빛 (bit)', right: 'Lys', meaning: 'Light' },
      { left: '산 (san)', right: 'Fjell', meaning: 'Mountain' }
  ]},
  'kr-jp': { left: 'Korean', right: 'Japanese', pairs: [
      { left: '금 (geum)', right: '金 (kin)', meaning: 'Gold' },
      { left: '산 (san)', right: '山 (yama)', meaning: 'Mountain' },
      { left: '불 (bul)', right: '火 (hi)', meaning: 'Fire' },
      { left: '물 (mul)', right: '水 (mizu)', meaning: 'Water' },
      { left: '별 (byeol)', right: '星 (hoshi)', meaning: 'Star' }
  ]}
};

const state = { mode: 'kr-es', score: 0, round: 1, streak: 0, matches: 0, selectedL: null, selectedR: null, timeLeft: 60, pairs: [] };

function setMode(m) {
    state.mode = m;
    document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    resetRound();
}

function resetRound() {
    state.matches = 0; state.selectedL = null; state.selectedR = null;
    state.timeLeft = 60; state.pairs = [...wordSets[state.mode].pairs].sort(() => Math.random() - 0.5);
    document.getElementById('leftLabel').textContent = wordSets[state.mode].left;
    document.getElementById('rightLabel').textContent = wordSets[state.mode].right;
    document.getElementById('roundComplete').style.display = 'none';
    renderBoard();
}

function renderBoard() {
    const leftCol = document.getElementById('leftCol');
    const rightCol = document.getElementById('rightCol');
    const leftWords = [...state.pairs].sort(() => Math.random() - 0.5);
    const rightWords = [...state.pairs].sort(() => Math.random() - 0.5);

    leftCol.innerHTML = leftWords.map(w => `<div class="tile" onclick="selectTile(this, 'L')">${w.left}</div>`).join('');
    rightCol.innerHTML = rightWords.map(w => `<div class="tile" onclick="selectTile(this, 'R')">${w.right}</div>`).join('');
}

function selectTile(el, side) {
    if(el.classList.contains('matched')) return;
    document.querySelectorAll(`.column:nth-child(${side === 'L' ? 1 : 2}) .tile`).forEach(t => t.classList.remove('selected'));
    el.classList.add('selected');
    if(side === 'L') state.selectedL = el; else state.selectedR = el;
    if(state.selectedL && state.selectedR) checkMatch();
}

function checkMatch() {
    const pair = state.pairs.find(p => p.left === state.selectedL.textContent && p.right === state.selectedR.textContent);
    if(pair) {
        state.selectedL.classList.add('matched'); state.selectedR.classList.add('matched');
        state.matches++; state.streak++; state.score += 50 * state.streak;
        if(state.matches === state.pairs.length) roundComplete();
    } else {
        state.streak = 0;
        state.selectedL.classList.remove('selected'); state.selectedR.classList.remove('selected');
    }
    state.selectedL = null; state.selectedR = null;
    updateHUD();
}

function roundComplete() {
    const gold = 50 + (state.timeLeft);
    if(window.NMNWallet) {
        NMNWallet.addGold(gold);
        NMNWallet.addXP(20);
    }
    document.getElementById('roundGold').textContent = `+${gold} GOLD EXTRACTED`;
    document.getElementById('roundComplete').style.display = 'block';
    if(Math.random() < 0.1) triggerLore();
}

function triggerLore() {
    try {
        const vault = JSON.parse(localStorage.getItem('nmn_lore_vault') || '[]');
        const entry = { text: `Linguistic Discovery: Ancient roots link the word for 'Gold' across the four tongues.`, source: 'Deciphered Tablet', date: new Date().toLocaleDateString() };
        vault.push(entry);
        localStorage.setItem('nmn_lore_vault', JSON.stringify(vault));
    } catch(e) {}
}

function nextRound() { state.round++; resetRound(); }

function updateHUD() {
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('timeVal').textContent = state.timeLeft;
    document.getElementById('streakVal').textContent = state.streak;
    if(window.NMNWallet) {
        document.getElementById('dgGold').textContent = NMNWallet.get().gold.toLocaleString();
        document.getElementById('dgLore').textContent = JSON.parse(localStorage.getItem('nmn_lore_vault') || '[]').length;
    }
}

setInterval(() => { if(state.timeLeft > 0 && document.getElementById('roundComplete').style.display === 'none') { state.timeLeft--; updateHUD(); } }, 1000);

window.onload = resetRound;
</script>

</body>
</html>
